<script>
/* おぼえるドリル 共通コード（学生アプリ・先生アプリ共通） */
var K = { GROW: 0.45, LOSS: 0.5, DECAY: 3, WEAK: 40, GOOD: 75 };
var DAY = 86400000;
var SECTIONS = {
  gengo: { name: '言語知識（文字・語彙・文法）', subj: ['kanji', 'goi', 'bunpo'] },
  dokkai: { name: '読解', subj: ['dokkai'] },
  choukai: { name: '聴解', subj: ['choukai'] }
};
var SUBJ_NAME = { kanji: '漢字', goi: '語彙', bunpo: '文法', dokkai: '読解', choukai: '聴解' };
var QTYPE_NAME = {
  'kanji-read': '漢字の読み', 'kanji-write': '漢字の表記', 'goi-form': '語形成', 'goi-context': '文脈規定',
  'goi-synonym': '言い換え類義', 'goi-usage': '用法', 'bunpo-form': '文法形式の判断',
  'bunpo-compose': '文の組み立て', 'bunpo-text': '文章の文法', 'dokkai-short': '短文読解', 'dokkai-mid': '中文読解', 'dokkai-compare': '統合理解（AとB）', 'dokkai-long': '長文読解', 'dokkai-info': '情報検索（チラシ）', 'choukai': '聴解'
};
function sectionOf(subject) {
  for (var k in SECTIONS) if (SECTIONS[k].subj.indexOf(subject) >= 0) return k;
  return 'gengo';
}
/* 今の記憶度（0〜100）。it = {s, streak, last(ms)} */
function curMem(it, now) {
  if (!it) return 0;
  var d = Math.max(0, (now - it.last) / DAY);
  return it.s * Math.exp(-d / (K.DECAY * (1 + it.streak)));
}
function updItem(it, correct, now) {
  var m = curMem(it, now);
  var streak = it ? it.streak : 0;
  if (correct) return { s: m + (100 - m) * K.GROW, streak: streak + 1, last: now };
  return { s: m * K.LOSS, streak: 0, last: now };
}
function memLabel(m, seen) {
  if (!seen) return '未学習';
  return m < K.WEAK ? 'よわい' : (m < K.GOOD ? 'もうすこし' : 'おぼえた');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
/* {漢字|よみ} → ruby、[[語]] → 下線 */
function rb(s) {
  s = esc(s);
  s = s.replace(/\{([^|{}]+)\|([^{}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
  s = s.replace(/\[\[(.+?)\]\]/g, '<u>$1</u>');

function head() {
  var h = '<h1>おぼえるドリル 先生（スマホ）</h1>' +
    '<div class="card"><input type="file" id="fi" accept=".xlsx,.csv" style="display:none"><input type="file" id="fr" accept=".xlsx,.csv" style="display:none">' +
    '<button class="btn pri" id="pick">① 記録ファイルを選ぶ</button><button class="btn sm" id="pickr">名簿を選ぶ（名前を見たいとき）</button>' +
    '<div class="sub" style="margin-top:6px">' + (SRC.name ? '記録：' + esc(SRC.name) + '（' + SRC.nrec + ' 件）　読みこみ ' + fmtTime(SRC.at) + (SRC.bad ? '<br><span class="err">壊れた記録が ' + SRC.bad + ' 件あります</span>' : '') : 'OneDriveの「学生の記録.xlsx」を選びます。') +
    (ROSTER_N ? '<br>名簿：' + ROSTER_N + ' 人（このスマホの画面の中だけで表示）' : '') + '</div>' +
    '<div class="sub" style="margin-top:6px">ファイルは、このスマホの中だけで読みます。どこにも送りません。保存もしません（ページを閉じると消えます）。</div></div>';
  return h;
}
function bindHead() {
  var pk = document.getElementById('pick'), pr = document.getElementById('pickr'), fi = document.getElementById('fi'), fr = document.getElementById('fr');
  pk.onclick = function () { fi.click(); }; pr.onclick = function () { fr.click(); };
  fi.onchange = function (e) { var f = e.target.files[0]; if (f) fileRows(f).then(function (r) { ingest(r, f.name); render(); }).catch(fail); };
  fr.onchange = function (e) { var f = e.target.files[0]; if (f) fileRows(f).then(function (r) { ingestRoster(r, f.name); render(); }).catch(fail); };
}
function fail(e) { alert('読みこめません: ' + (e && e.message ? e.message : e) + '\nExcelで開いたままだと読めないことがあります。'); }
function render() { if (SEL) viewStudent(); else viewList(); }

function viewList() {
  var list = visibleStu(), t = Date.now(), d0 = new Date(); d0.setHours(0, 0, 0, 0);
  var h = head();
  if (!STU.length) { $app.innerHTML = h; bindHead(); return; }
  var tc = list.filter(function (s) { return s.tmin > 0; }).length, w = list.reduce(function (a, s) { return a + s.wmin; }, 0), idle = list.filter(function (s) { return (t - s.last) / DAY >= (CFG.teacher && CFG.teacher.idleDays || 3); }).length;
  h += '<div class="kpis"><div class="kpi"><b>' + tc + '</b><span>今日 学習した人</span></div><div class="kpi"><b>' + Math.round(w) + '</b><span>7日の合計（分）</span></div><div class="kpi"><b style="color:var(--red)">' + idle + '</b><span>3日以上 学習なし</span></div></div>';
  var classes = {}; list.forEach(function (s) { classes[s.cls] = 1; });
  h += '<div class="card"><div class="row"><select id="cls"><option value="">すべてのクラス</option>' + Object.keys(classes).sort().map(function (c) { return '<option' + (c === CLS ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
    '<select id="sort">' + [['last', 'ログインが新しい順'], ['tmin', '今日の学習が長い順'], ['wmin', '7日の学習が長い順'], ['wn', 'ログイン回数の多い順'], ['cleared', '合格レッスンの多い順'], ['idle', 'ログインが古い順'], ['s4', '学籍番号順']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === SORT ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
    '<div style="margin-top:8px"><input type="text" id="q" placeholder="学籍番号や名前でさがす" value="' + esc(Q) + '" style="width:100%"></div>' +
    (STU.some(function (s) { return isTestId(s.s4); }) ? '<label class="sub" style="display:block;margin-top:6px"><input type="checkbox" id="ti"' + (TESTINC ? ' checked' : '') + '> テストの学生も含める</label>' : '') + '</div>';
  var rows = list.filter(function (s) { return (!CLS || s.cls === CLS) && (!Q || s.s4.indexOf(Q) >= 0 || nameOf(s).indexOf(Q) >= 0); });
  var cmp = { last: function (a, b) { return b.lastLogin - a.lastLogin; }, idle: function (a, b) { return a.lastLogin - b.lastLogin; }, tmin: function (a, b) { return b.tmin - a.tmin; }, wmin: function (a, b) { return b.wmin - a.wmin; }, wn: function (a, b) { return b.wn - a.wn; }, cleared: function (a, b) { return b.cleared - a.cleared; }, s4: function (a, b) { return a.s4 < b.s4 ? -1 : 1; } }[SORT];
  rows.sort(cmp);
  h += '<div class="sub">' + rows.length + ' 人</div>' + rows.map(function (s) {
    var nm = nameOf(s);
    return '<div class="stu" data-k="' + esc(s.key) + '"><div class="row"><span class="nm">' + esc(s.cls) + '　' + (nm ? esc(nm) + '<span class="sub">　' + esc(s.s4) + '</span>' : esc(s.s4)) + '</span>' +
      '<span class="chip ' + PACE_CLS[s.pace.st] + '">' + PACE_TXT[s.pace.st] + '</span></div>' +
      '<div class="sub">最後のログイン：' + esc(ago(s.lastLogin)) + '</div>' +
      '<div class="nums"><span>今日 <b>' + fmin(s.tmin) + '</b></span><span>7日 <b>' + fmin(s.wmin) + '</b></span><span>ログイン <b>' + s.wn + '</b>回</span><span>合格 <b>' + s.cleared + '</b></span></div></div>';
  }).join('');
  $app.innerHTML = h; bindHead();
  document.getElementById('cls').onchange = function (e) { CLS = e.target.value; viewList(); };
  document.getElementById('sort').onchange = function (e) { SORT = e.target.value; viewList(); };
  document.getElementById('q').onchange = function (e) { Q = e.target.value.trim(); viewList(); };
  var ti = document.getElementById('ti'); if (ti) ti.onchange = function (e) { TESTINC = e.target.checked; viewList(); };
  Array.prototype.forEach.call($app.querySelectorAll('.stu'), function (e) { e.onclick = function () { SEL = e.getAttribute('data-k'); viewStudent(); window.scrollTo(0, 0); }; });
}

function viewStudent() {
  var s = STU.filter(function (x) { return x.key === SEL; })[0];
  if (!s) { SEL = null; return viewList(); }
  var nm = nameOf(s), mx = Math.max.apply(null, s.days.map(function (d) { return d.m; }).concat([10]));
  var h = '<button class="btn sm" id="back">← 一覧にもどる</button><h1>' + esc(s.cls) + '　' + (nm ? esc(nm) + '<span class="sub">　' + esc(s.s4) + '</span>' : esc(s.s4)) + '</h1>' +
    '<div class="kpis"><div class="kpi"><b>' + Math.round(s.tmin) + '</b><span>今日（分）</span></div><div class="kpi"><b>' + Math.round(s.wmin) + '</b><span>7日（分）</span></div><div class="kpi"><b>' + s.wn + '</b><span>7日のログイン</span></div></div>' +
    '<div class="card"><div class="row"><span>ペース</span><span class="chip ' + PACE_CLS[s.pace.st] + '">' + PACE_TXT[s.pace.st] + '</span></div>' +
    '<div class="sub">合格レッスン ' + s.cleared + '　／　目標 ' + Math.round(s.pace.tg * 100) + '%（' + s.pace.need + 'レッスン）　最近7日の合格 ' + s.pace.rec7 + '</div>' +
    '<div class="bar" style="margin-top:6px"><i style="width:' + Math.min(100, 100 * s.cleared / Math.max(1, s.pace.need)) + '%"></i></div>' +
    '<div class="sub" style="margin-top:6px">答えた問題 ' + s.nq + ' 問　／　最後の学習 ' + esc(ago(s.last)) + '</div></div>' +
    '<div class="card"><h2>この14日の学習時間（分）</h2><div class="chart">' + s.days.map(function (d) { return '<div style="height:' + Math.max(2, 70 * d.m / mx) + 'px"><span>' + (d.m ? Math.round(d.m) : '') + '</span></div>'; }).join('') + '</div>' +
    '<div class="lbl">' + s.days.map(function (d) { var x = new Date(d.t); return '<div>' + (x.getMonth() + 1) + '/' + x.getDate() + '</div>'; }).join('') + '</div></div>' +
    '<div class="card"><h2>ログインの記録（新しい順）</h2><table><tr><th>ログイン</th><th>終了</th><th>分</th></tr>' +
    s.ses.slice(0, 30).map(function (x) { return '<tr><td>' + fmtTime(x.login) + '</td><td>' + fmtTime(x.end) + '</td><td>' + Math.max(1, Math.round((x.end - x.login) / 60000)) + '</td></tr>'; }).join('') + '</table></div>';
  $app.innerHTML = h;
  document.getElementById('back').onclick = function () { SEL = null; viewList(); window.scrollTo(0, 0); };
}
render();
</script>
</body>
</html>
