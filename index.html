en": "「礼儀」 is read れいぎ (manners). 敬語 (けいご) means polite language, a different word.", "ne": "「礼儀」 लाई れいぎ पढिन्छ (शिष्टाचार)। 敬語 (けいご) विनम्र भाषा हो, फरक शब्द।", "vi": "「礼儀」 đọc là れいぎ (lễ nghi). 敬語 (けいご) là kính ngữ, từ khác.", "zh": "「礼儀」读作れいぎ(礼仪)。「敬語」(けいご)是敬语,是另一个词。"}}];

var MOCK = {"minutes": 105, "exams": {"1": [{"no": 1, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "台風で校舎の窓が割れ、学校は大きな[[損害]]を受けた。", "o": ["そんかい", "そんがい", "そうがい", "そうかい"], "a": 2, "x": "「損害」は「そんがい」と読む。「損」は「そん」、「害」は「がい」と濁る。「そうがい」のように長音にしない。"}, {"no": 2, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "先輩の発表は、後輩たちにとって大きな[[刺激]]になった。", "o": ["しげき", "しけき", "じげき", "しげぎ"], "a": 1, "x": "「刺激」は「しげき」と読む。「刺」は「し」、「激」は「げき」。「しけき」「しげぎ」のような清濁のずれに注意。"}, {"no": 3, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "けがの[[治療]]のため、彼は一週間部活を休んだ。", "o": ["じりょう", "ちりゅう", "ちりょ", "ちりょう"], "a": 4, "x": "「治療」は「ちりょう」と読む。「治」は「ち」、「療」は「りょう」。「じりょう」「ちりゅう」は誤り。"}, {"no": 4, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "実験中に割れたビーカーの[[破片]]を、慎重に片づけた。", "o": ["はべん", "ばへん", "はへん", "はへい"], "a": 3, "x": "「破片」は「はへん」と読む。「片」をここでは「へん」と読み、「べん」とは読まない。"}, {"no": 5, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "この分野は日本語で書かれた資料が[[乏しい]]ので、英語の論文を読むしかない。", "o": ["とほしい", "とぼしい", "どぼしい", "とぼうしい"], "a": 2, "x": "「乏しい」は「とぼしい」と読む。「少ない、足りない」という意味の形容詞。"}, {"no": 6, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "入学してから半年、日本語の勉強は[[じゅんちょう]]に進んでいる。", "o": ["準調", "順調", "純調", "順長"], "a": 2, "x": "「じゅんちょう」は「順調」と書く。「順」は物事が思ったとおりに進む意味を表す。「準」「純」と書かないように注意。"}, {"no": 7, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "卒業式の日、桜の花が[[あざやか]]な色で咲いていた。", "o": ["鮮やか", "明やか", "彩やか", "新やか"], "a": 1, "x": "「あざやか」は「鮮やか」と書く。「鮮」は「新鮮」の「鮮」で、色や印象がはっきりしている様子を表す。"}, {"no": 8, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "図書館の壁には、卒業生の名前が[[えいきゅう]]に残されている。", "o": ["氷久", "英久", "永久", "永休"], "a": 3, "x": "「えいきゅう」は「永久」と書く。「永」は「永い」、「久」は「久しい」で、どちらも長く続く意味を持つ。「氷」と形が似ているので注意。"}, {"no": 9, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "試験中にスマートフォンを見るのは、規則[[いはん]]になる。", "o": ["偉判", "違判", "偉反", "違反"], "a": 4, "x": "「いはん」は「違反」と書く。「違」は「ちがう」、「反」は「そむく」の意味。「偉」「判」とは書かない。"}, {"no": 10, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "将来は[[かいご]]の仕事に就きたいと考えて、専門学校に進学した。", "o": ["介穫", "介護", "看穫", "看護"], "a": 2, "x": "「かいご」は「介護」と書く。「看護」は「かんご」と読み、別の語なので混同しないこと。"}, {"no": 11, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "この薬には眠くなるという（　　）作用があるので、試験の前には飲まないほうがいい。", "o": ["準", "副", "助", "補"], "a": 2, "x": "「副作用」で、主な働きのほかに現れる作用を表す。「副〜」は「副社長」「副大臣」のように、主なものに次ぐという意味を作る。"}, {"no": 12, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "先生から、卒業パーティーの招待（　　）が届いた。", "o": ["票", "書", "状", "札"], "a": 3, "x": "「招待状」で、招待の手紙を表す。「〜状」は「案内状」「年賀状」のように、用件を伝える書面を作る。"}, {"no": 13, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "あと一点足りず、（　　）合格になってしまった。", "o": ["不", "未", "無", "非"], "a": 1, "x": "「不合格」で、合格しなかったことを表す。「不〜」は「不必要」「不便」のように、そうでないという意味を作る。"}, {"no": 14, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "提出した書類に間違いがあったので、来週（　　）提出することになった。", "o": ["復", "初", "新", "再"], "a": 4, "x": "「再提出」で、もう一度提出することを表す。「再〜」は「再調査」「再利用」のように、繰り返す意味を作る。"}, {"no": 15, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "この高校は大学への進学（　　）が高いことで知られている。", "o": ["額", "率", "度", "比"], "a": 2, "x": "「進学率」で、進学した人の割合を表す。「〜率」は「合格率」「成功率」のように、割合を表す語を作る。"}, {"no": 16, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "あの先生の授業は（　　）の進め方をするので、最初は戸惑ったが、今はおもしろいと感じている。", "o": ["専属", "限定", "独特", "孤立"], "a": 3, "x": "「独特」は、そのものだけが持っている特別な様子を表す。「専属」は所属、「限定」は数や範囲を限ること、「孤立」は一人で離れていることで、いずれも合わない。"}, {"no": 17, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "彼女は本番で実力を（　　）して、スピーチコンテストで優勝した。", "o": ["発揮", "表現", "明示", "公開"], "a": 1, "x": "「実力を発揮する」で、持っている力を十分に出すという意味になる。「表現」は気持ちや考えを表すこと、「明示」ははっきり示すこと、「公開」は広く見せることで、実力とは結びつかない。"}, {"no": 18, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "面接の日にその（　　）で行くのは、少し失礼ではないだろうか。", "o": ["容姿", "様子", "姿勢", "格好"], "a": 4, "x": "「格好」は服装を含めた見た目を表し、「その格好で行く」という形でよく使う。「容姿」は生まれつきの顔かたち、「姿勢」は体の構えや心構えで、服装は表さない。"}, {"no": 19, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "夜遅くまで騒いでいたため、近所の人から寮に（　　）が来た。", "o": ["悪口", "苦情", "皮肉", "反論"], "a": 2, "x": "「苦情」は、迷惑だという不満を相手に伝えるもの。「悪口」は本人のいない所で言う悪い評価、「皮肉」は遠回しないやみ、「反論」は意見に対する言い返しで、ここには合わない。"}, {"no": 20, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "理科の実験では、水の温度が一分ごとに（　　）していく様子を記録した。", "o": ["増加", "向上", "上昇", "上達"], "a": 3, "x": "温度が高くなることは「上昇」と言う。「増加」は数や量が増えること、「向上」は質がよくなること、「上達」は技術がうまくなることで、温度には使わない。"}, {"no": 21, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "（　　）していて、レポートの締め切りを一日間違えてしまった。", "o": ["うっかり", "すっきり", "ぎっしり", "ぐっすり"], "a": 1, "x": "「うっかり」は、注意が足りずに失敗する様子を表す。「すっきり」は気分がよい様子、「ぎっしり」は詰まっている様子、「ぐっすり」はよく眠る様子。"}, {"no": 22, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "彼のノートは、細かい字で（　　）と書き込まれていて、すきまがない。", "o": ["うっかり", "さっぱり", "ぼんやり", "ぎっしり"], "a": 4, "x": "「ぎっしり」は、すきまなく詰まっている様子を表す。「さっぱり」は気分や味が軽い様子、「ぼんやり」ははっきりしない様子、「うっかり」は不注意な様子。"}, {"no": 23, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "作文の[[テクニック]]を、先生に一から教わった。", "o": ["知識", "技術", "工夫", "訓練"], "a": 2, "x": "「テクニック」は「技術」に置き換えられる。物事をうまく行うためのやり方や腕前のこと。"}, {"no": 24, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "先生の一言で、クラスの雰囲気が[[一転した]]。", "o": ["すっかり変わった", "少し変わった", "やっと決まった", "急に止まった"], "a": 1, "x": "「一転した」は「すっかり変わった」という意味。それまでとまったく違う状態になることを表す。"}, {"no": 25, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "彼は[[勝手な]]理由をつけて、掃除当番を代わってもらおうとした。", "o": ["いじわるな", "なさけない", "だらしない", "わがままな"], "a": 4, "x": "「勝手な」は「わがままな」という意味。周りのことを考えず、自分の都合だけで行動する様子を表す。"}, {"no": 26, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "先生に注意されると、その学生は[[うつむいて]]黙ってしまった。", "o": ["遠くを見て", "目を閉じて", "下を向いて", "腕を組んで"], "a": 3, "x": "「うつむいて」は「下を向いて」という意味。顔を下に向ける動作を表す。"}, {"no": 27, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "教室で風邪がはやっているので、[[用心して]]早めに帰ることにした。", "o": ["落ち着いて", "気をつけて", "がんばって", "よく考えて"], "a": 2, "x": "「用心して」は「気をつけて」という意味。悪いことが起こらないように注意することを表す。"}, {"no": 28, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "きっかけ", "o": ["先生の話は長く、話のきっかけがなかなか見えてこなかった。", "この問題は難しいので、解くきっかけだけでも教えてください。", "友人にすすめられたことがきっかけで、日本語の勉強を始めた。", "彼は毎朝六時に起きることをきっかけにして、三年間続けている。"], "a": 3, "x": "「きっかけ」は、あることが始まる原因や機会のこと。1は「結論」、2は「こつ」、4は「習慣」が正しい。"}, {"no": 29, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "廃止", "o": ["学生の意見をもとに、この制度は来年度から廃止されることになった。", "大雨のため、体育祭は当日の朝に廃止された。", "古くなった教室の机は、まとめて廃止された。", "工事のため、この階段は今日から通行が廃止されている。"], "a": 1, "x": "「廃止」は、制度や決まりをやめてなくすこと。2は「中止」、3は「処分」、4は「禁止」が正しい。"}, {"no": 30, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "中断", "o": ["彼は三年生の春に、続けてきた部活動を中断した。", "電池が切れて、教室の時計が中断してしまった。", "この道路は工事のため、今週いっぱい中断されている。", "停電のため、理科の実験は途中で中断された。"], "a": 4, "x": "「中断」は、続いていたことが途中で止まること。1は「やめた」、2は「止まって」、3は「通行止めになって」が正しい。"}, {"no": 31, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "妥当", "o": ["彼の日本語の発音は妥当で、先生にほめられた。", "この結論は、集めたデータから見て妥当だと言える。", "駅前の食堂は妥当な値段で、学生に人気がある。", "彼女は妥当な性格で、だれとでもすぐ仲良くなる。"], "a": 2, "x": "「妥当」は、判断や結論に無理がなく、ちょうどよいと認められること。1は「正確」、3は「手ごろ」、4は「素直」が正しい。"}, {"no": 32, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "頑固", "o": ["担任の先生は頑固なところがあり、一度決めた方針を変えようとしない。", "彼は頑固に勉強を続け、ついに志望校に合格した。", "この机は頑固に作られているので、長く使える。", "昨日から頑固な雨が降り続いていて、外に出られない。"], "a": 1, "x": "「頑固」は、自分の考えを変えようとしない性格を表す。2は「地道に」、3は「丈夫に」、4は「激しい」が正しい。"}, {"no": 33, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "日本に来たばかりのころは、自分の名前（　　）漢字で書けなかった。", "o": ["だけ", "すら", "ばかり", "しか"], "a": 2, "x": "「〜すら」は「〜さえ」と同じく、極端な例を挙げて「ほかは言うまでもない」ことを表す。名前という最も基本的なものを例に挙げている。"}, {"no": 34, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "二回失敗したが、今年（　　）第一志望の大学に合格したい。", "o": ["こそ", "さえ", "しか", "だけ"], "a": 1, "x": "「〜こそ」は、ほかではなくそれを特に強く取り立てる。「今年こそ」で、これまでとは違って今年は必ず、という強い気持ちを表す。"}, {"no": 35, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "あと五点（　　）取れていれば、合格していたのに。", "o": ["こそ", "のみ", "さえ", "しか"], "a": 3, "x": "「〜さえ〜ば」で、それだけが満たされれば十分だという条件を表す。「五点さえ取れていれば」で、必要な条件がそれだけだったことを示す。"}, {"no": 36, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "毎日夜遅くまで勉強を続けていては、体を壊し（　　）。", "o": ["かねる", "きれない", "かねない", "ようがない"], "a": 3, "x": "「〜かねない」は、よくないことが起こる可能性があることを表す。「壊しかねる」は「壊すことができない」という反対の意味になる。"}, {"no": 37, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "彼は日本に来て半年（　　）、ずいぶん難しい漢字まで知っている。", "o": ["につれて", "にとって", "によって", "にしては"], "a": 4, "x": "「〜にしては」は、そこから予想されることと実際が違うときに使う。半年から予想される以上に漢字を知っている、という意味になる。"}, {"no": 38, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "（　　）自分がクラスの代表に選ばれるとは思っていなかった。", "o": ["どうせ", "まさか", "たとえ", "せめて"], "a": 2, "x": "「まさか〜ない」で、まったく予想していなかったことを表す。文末の「思っていなかった」と呼応している。"}, {"no": 39, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "大学院に進むと決めた（　　）、最後まで研究をやりぬきたい。", "o": ["ばかりに", "わりに", "からには", "うちに"], "a": 3, "x": "「〜からには」は、そう決めた以上は当然そうすべきだ、という気持ちを表す。後ろには決意や義務を表す表現が来る。"}, {"no": 40, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "今回の合格は、たまたま運がよかった（　　）。", "o": ["ものだ", "一方だ", "ままだ", "にすぎない"], "a": 4, "x": "「〜にすぎない」は、それ以上のものではないと低く評価する言い方。「運がよかっただけだ」という意味になる。"}, {"no": 41, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "先生にそこまで言われたら、レポートの書き方を変え（　　）。", "o": ["ざるを得ない", "かねない", "きれない", "ようがない"], "a": 1, "x": "「〜ざるを得ない」は、本当はしたくないが、そうするしかないという意味。「変えざるを得ない」で、変えるしかないことを表す。"}, {"no": 42, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "近くの子どもの数が減り続けており、この学校の生徒数は減る（　　）。", "o": ["ものだ", "一方だ", "次第だ", "最中だ"], "a": 2, "x": "「〜一方だ」は、ある変化がずっと同じ方向に進み続けることを表す。ここでは減り続けている状態を言っている。"}, {"no": 43, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "先輩がノートを貸してくれた（　　）、なんとか試験に合格することができた。", "o": ["せいで", "くせに", "おかげで", "わりに"], "a": 3, "x": "「〜おかげで」は、よい結果の原因を表し、感謝の気持ちを含む。悪い結果には「せいで」を使う。"}, {"no": 44, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "新入生のみなさんを、私たち二年生が駅までバスで（　　）。", "o": ["迎えられました", "お迎えになりました", "迎えてくださいました", "お迎えしました"], "a": 4, "x": "自分側の動作なので謙譲語「お〜する」を使い、「お迎えしました」となる。「お迎えになる」「迎えられる」は尊敬語で、相手の動作に使う。"}, {"no": 45, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "私は＿＿＿　＿＿＿　★　＿＿＿　強くなってきた。", "o": ["という", "建築を学びたい", "気持ちが", "日本の大学で"], "a": 1, "x": "正しい語順：日本の大学で→建築を学びたい→という→気持ちが。★は3番目＝「という」。"}, {"no": 46, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "この学校では＿＿＿　＿＿＿　＿＿＿　★　決められる。", "o": ["よって", "希望に", "クラスが", "学生の"], "a": 3, "x": "正しい語順：学生の→希望に→よって→クラスが。★は4番目＝「クラスが」。"}, {"no": 47, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "たとえ＿＿＿　＿＿＿　★　＿＿＿　つもりはない。", "o": ["失敗した", "としても", "今回の試験に", "あきらめる"], "a": 2, "x": "正しい語順：今回の試験に→失敗した→としても→あきらめる。★は3番目＝「としても」。"}, {"no": 48, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "日本の学校生活＿＿＿　★　＿＿＿　＿＿＿　多いだろう。", "o": ["思い出す", "といえば", "人が", "文化祭を"], "a": 4, "x": "正しい語順：といえば→文化祭を→思い出す→人が。★は2番目＝「文化祭を」。"}, {"no": 49, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "彼は＿＿＿　★　＿＿＿　＿＿＿　ことになった。", "o": ["スピーチを", "代表として", "する", "留学生の"], "a": 2, "x": "正しい語順：留学生の→代表として→スピーチを→する。★は2番目＝「代表として」。"}, {"no": 50, "sec": "言語知識", "qt": "bunpo-text", "pid": "E1-P1", "q": "（50）", "o": ["ところが", "そのうえ", "したがって", "つまり"], "a": 1, "x": "前の「毎晩書き続けていた」と、後の「上達しなかった」は予想と反対の関係なので、逆接の「ところが」が入る。"}, {"no": 51, "sec": "言語知識", "qt": "bunpo-text", "pid": "E1-P1", "q": "（51）", "o": ["ただし", "しかも", "または", "なぜなら"], "a": 2, "x": "「上達しなかった」に加えて「点も下がった」と、悪いことを付け加えているので、添加の「しかも」が入る。"}, {"no": 52, "sec": "言語知識", "qt": "bunpo-text", "pid": "E1-P1", "q": "（52）", "o": ["それでも", "たとえば", "そこで", "ところが"], "a": 3, "x": "うまくいかないという問題を受けて、その対策として勉強法を変えたのだから、「そこで」が入る。"}, {"no": 53, "sec": "言語知識", "qt": "bunpo-text", "pid": "E1-P1", "q": "（53）", "o": ["わけがない", "はずはない", "ものではない", "わけではない"], "a": 4, "x": "「話すだけですべてができるとは限らない」という部分否定なので「わけではない」。「わけがない」「はずはない」は全面的な否定になり、後の「しかし」とつながらない。"}, {"no": 54, "sec": "言語知識", "qt": "bunpo-text", "pid": "E1-P1", "q": "（54）", "o": ["ものだ", "ことだ", "ばかりだ", "ところだ"], "a": 1, "x": "「〜ものだ」は、一般的にそういう性質があるという話し手の実感を表す。ここでは言葉の本質について述べている。"}, {"no": 55, "sec": "読解", "qt": "dokkai-short", "pid": "E1-P2", "q": "四月以降の図書館について、この文章から分かることは何か。", "o": ["本を借りる手続きは、機械を使って自分で行う。", "辞書も雑誌も借りられるようになる。", "借りられる本の数が五冊に増える。", "本を返せるのはカウンターだけになる。"], "a": 1, "x": "「四月からは入り口の機械でご自分で手続きをしてください」とある。辞書と雑誌は今までどおり館内のみ、冊数も変わらず、返却ポストも使えるので、他は合わない。"}, {"no": 56, "sec": "読解", "qt": "dokkai-short", "pid": "E1-P3", "q": "筆者の考えに合うのはどれか。", "o": ["ノートは何色ものペンを使って整理したほうがよい。", "大事だと感じたことをその場で書き取るのがよいノートだ。", "字が汚い学生のほうが試験の点がよい。", "ノートはあとで読み返す必要がない。"], "a": 2, "x": "「大事だと感じた瞬間に手が動いている学生」の成績が伸びると述べ、ノートは自分の頭が動いた記録だとしている。"}, {"no": 57, "sec": "読解", "qt": "dokkai-short", "pid": "E1-P4", "q": "山田さんが発表会の前にしなければならないことは何か。", "o": ["発表の順番を先生に知らせる。", "資料を自分で印刷して持っていく。", "資料を先生にメールで送る。", "自分のパソコンを準備して持っていく。"], "a": 3, "x": "「当日使う資料は、前日の夜までに私にメールで送ってください」とある。印刷もパソコンも学校側が用意する。"}, {"no": 58, "sec": "読解", "qt": "dokkai-short", "pid": "E1-P5", "q": "筆者が質問の前に自分で考えることをすすめるのはなぜか。", "o": ["質問をしなくても答えが分かるようになるから", "相手に迷惑をかけずにすむから", "五分あれば、たいていの問題は解けるから", "分からない点がはっきりし、答えが身につきやすくなるから"], "a": 4, "x": "「どこから分からないのかがはっきりする」「そのうえで聞けば、相手の答えは自分の中にすっと入ってくる」とある。"}, {"no": 59, "sec": "読解", "qt": "dokkai-short", "pid": "E1-P6", "q": "新入部員が必ずしなければならないことは何か。", "o": ["ラケットを自分で買うこと", "雨の日も外で練習すること", "シューズを自分で用意すること", "一年間、毎回出席カードを出すこと"], "a": 3, "x": "「シューズは各自で用意してください」とある。ラケットは貸してもらえ、雨の日は体育館、出席カードは最初の一か月だけである。"}, {"no": 60, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P7", "q": "オンライン授業について、筆者はどのように述べているか。", "o": ["学生の成績が下がってしまった。", "学生の評判はよく、成績も悪くなっていない。", "学生の通学時間が長くなった。", "録画を見る学生はほとんどいない。"], "a": 2, "x": "「学生には好評である」「平均点はむしろ少し上がった」とある。"}, {"no": 61, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P7", "q": "この合図とあるが、何を指しているか。", "o": ["学生が質問のために手を挙げること", "学生が画面の前で静かにうなずくこと", "説明が分からないときに学生の様子に表れる変化", "授業を早く終わらせてほしいという学生の希望"], "a": 3, "x": "直前に「前の席の学生が急にペンを止め、後ろの学生が隣の人の手元をのぞく」とあり、これが分かっていないことを示す様子である。"}, {"no": 62, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P7", "q": "筆者が教室での授業を続けたいと考える理由は何か。", "o": ["学生の反応が見え、授業後の会話も生まれるから", "オンラインでは成績をつけることができないから", "教室のほうが多くの学生を集められるから", "録画の準備に手間がかかるから"], "a": 1, "x": "理由として、学生の様子から分かる合図と、授業後の十分間に出る質問の二つを挙げている。"}, {"no": 63, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P8", "q": "筆者が学生と話していて感じていることは何か。", "o": ["高校のときに決めた進路を変えない学生が多い。", "高校のときに決めた進路をそのまま続ける学生は多くない。", "専攻を変えた学生は卒業できないことが多い。", "休学する学生が年々増えている。"], "a": 2, "x": "「十七、八歳で決めた進路をそのまま歩き続けている学生は、実はそれほど多くない」とある。"}, {"no": 64, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P8", "q": "筆者は、何が問題だと考えているか。", "o": ["進路を決める時期が早すぎること", "学生が目標を持とうとしないこと", "進路を変えたり迷ったりするための時間が用意されていないこと", "進路相談の担当者が足りないこと"], "a": 3, "x": "「日本の学校が『変える』ための時間をあまり用意していないことだろう」と述べている。決めるのが早いことが原因ではないとも書かれている。"}, {"no": 65, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P8", "q": "筆者がゼミの学生に毎年同じ質問をするのはなぜか。", "o": ["学生の成績を確かめるため", "進路を変えるようにすすめるため", "ゼミの人数を減らすため", "迷いを抱えている学生に気づき、話を始めるため"], "a": 4, "x": "「困った顔をして黙る学生とは、そこから長い話が始まる」とあり、迷いを抱えた学生を見つけて話をするための質問だと分かる。"}, {"no": 66, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P9", "q": "筆者が新しい図書館に入って驚いたのはどんなことか。", "o": ["本の数が以前よりずっと増えていたこと", "勉強のための席が多く用意されていたこと", "静かに本を読む人が一人もいなかったこと", "二階が使えなくなっていたこと"], "a": 2, "x": "「驚いたのは、本の量ではなく、机の多さである」とあり、一人用の席や電源について説明されている。"}, {"no": 67, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P9", "q": "図書館について、筆者はどのように考えているか。", "o": ["本を借りない人は利用するべきではない。", "高校生のための席はもっと減らすべきだ。", "誰でもお金を払わずにいられる場所であることに意味がある。", "家で勉強できる子どもは来ないほうがよい。"], "a": 3, "x": "「お金を払わなくても誰でもそこにいていい場所」を図書館が守ってきたものとして挙げている。"}, {"no": 68, "sec": "読解", "qt": "dokkai-mid", "pid": "E1-P9", "q": "最後の一文で、筆者が言いたいことは何か。", "o": ["図書館は、今は読まない人がいつか本を手に取るのを待つ場所でもある。", "入り口の言葉は間違っているので、すぐに書き直すべきだ。", "本を読まない人は図書館に来るべきではない。", "図書館はもっと多くの本を買うべきだ。"], "a": 1, "x": "「人は、そこにいる時間が長いほど、周りのものに手を伸ばす。図書館はそれを待てばいい」という考えを、最後の一文で言い換えている。"}, {"no": 69, "sec": "読解", "qt": "dokkai-compare", "pid": "E1-P10", "q": "宿題について、AとBが共通して述べていることは何か。", "o": ["宿題の量はできるだけ減らすべきだ。", "今の宿題のやり方を続けていけばよい。", "今の宿題の出し方には、見直すべき点がある。", "家庭学習そのものが必要ない。"], "a": 3, "x": "Aは課題の中身を変えるべきだと述べ、Bは全員に同じ量を出すのをやめるべきだと述べており、どちらも今のままではよくないと考えている。"}, {"no": 70, "sec": "読解", "qt": "dokkai-compare", "pid": "E1-P10", "q": "家庭学習を支える方法について、AとBはどのように述べているか。", "o": ["Aは課題の中身を変えるべきだと述べ、Bは質問できる時間と場所を作るべきだと述べている。", "AもBも、宿題の量を増やすべきだと述べている。", "Aは宿題をやめるべきだと述べ、Bは量を増やすべきだと述べている。", "AもBも、家庭学習は生徒の意志に任せるべきだと述べている。"], "a": 1, "x": "Aは「授業を思い出さなければ書けない課題に変える」、Bは「放課後に残って質問できる時間と場所を用意する」と述べている。"}, {"no": 71, "sec": "読解", "qt": "dokkai-long", "pid": "E1-P11", "q": "筆者が期待された答えを返さないのはなぜか。", "o": ["学生の質問が失礼だと感じているから", "将来の仕事を理由にすると、その仕事に就かない人には無駄だということになるから", "学生には理解できない話だと思っているから", "筆者自身にも答えが分からないから"], "a": 2, "x": "「その仕事に就かない人にとって、その勉強は無駄だったということになってしまう」と述べている。"}, {"no": 72, "sec": "読解", "qt": "dokkai-long", "pid": "E1-P11", "q": "学ぶという経験について、筆者はどのように述べているか。", "o": ["学んだ内容は、そのままの形で仕事に使われる。", "必要になってから学び始めるほうが効率がよい。", "内容よりも、どのように学んだかという経験が長く残る。", "若いうちに学んだことは、大人になると消えてしまう。"], "a": 3, "x": "「何を学んだかは忘れても、どう学んだかは残る」とあり、粘る、方法を変える、考え直すといった経験が消えないと述べている。"}, {"no": 73, "sec": "読解", "qt": "dokkai-long", "pid": "E1-P11", "q": "この文章で筆者が最も言いたいことは何か。", "o": ["すぐに役に立つ知識だけを教えるべきだ。", "学生の質問には必ず具体的に答えるべきだ。", "統計のような科目は全員が学ぶべきだ。", "すぐには役に立たないことを学ぶ時間にも意味がある。"], "a": 4, "x": "最後の段落で「答えの出ない時間に耐える練習の時間」であり「決して無駄ではない」とまとめている。"}, {"no": 74, "sec": "読解", "qt": "dokkai-info", "pid": "E1-P12", "q": "高校2年生のリンさんは、平日は毎日19時までアルバイトがあり、土曜日は午前中しか時間がない。費用は3,000円までなら出せる。リンさんが申し込める講座はどれか。", "o": ["A", "B", "C", "D"], "a": 1, "x": "Aは土曜日の10:00〜11:30で午前中、費用も2,000円、対象も高校生なので条件に合う。Bは土曜の午後、Cは平日の18時からで費用も4,000円、Dは土曜の午後で対象が高校3年生である。"}, {"no": 75, "sec": "読解", "qt": "dokkai-info", "pid": "E1-P12", "q": "申し込みについて、この案内の内容と合っているものはどれか。", "o": ["Aは電話で申し込むことができる。", "Bは申し込みをしなくても参加できる。", "Cはセンターの窓口でも申し込める。", "Dは11月8日までに申し込めばよい。"], "a": 2, "x": "Bの申込方法は「申込不要（当日、直接会場へ）」である。Aは窓口かホームページ、Cはホームページのみ、Dは10月20日までの申し込みである。"}], "2": [{"no": 1, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "台風で工場が止まり、会社は大きな[[損害]]を受けた。", "o": ["そんかい", "そんがい", "そうがい", "そうかい"], "a": 2, "x": "「損害」は「そんがい」と読む。「害」は「がい」と濁る。「そんかい」「そうがい」「そうかい」という読み方はない。"}, {"no": 2, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "新しい社長の話は、若い社員にとってよい[[刺激]]になった。", "o": ["しけき", "じげき", "しげぎ", "しげき"], "a": 4, "x": "「刺激」は「しげき」と読む。「刺」は「し」、「激」は「げき」。清濁のずれた「しけき」「じげき」「しげぎ」は誤り。"}, {"no": 3, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "けがの[[治療]]のため、田中さんは一週間ほど会社を休むそうだ。", "o": ["ちりょう", "ちりょ", "じりょう", "ちりゅう"], "a": 1, "x": "「治療」は「ちりょう」と読む。「療」は長音の「りょう」で、「りょ」「りゅう」ではない。"}, {"no": 4, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "倉庫で割れたガラスの[[破片]]を、手袋をして片づけた。", "o": ["はべん", "ばへん", "はへん", "ばべん"], "a": 3, "x": "「破片」は「はへん」と読む。「破」は「は」、「片」は「へん」で、どちらも濁らない。"}, {"no": 5, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "経験の[[乏しい]]社員でも使えるように、機械を改良した。", "o": ["とほしい", "とぼしい", "どぼしい", "とぼうしい"], "a": 2, "x": "「乏しい」は「とぼしい」と読む。「少ない、足りない」という意味の形容詞である。"}, {"no": 6, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "新しい工場の建設は、今のところ[[じゅんちょう]]に進んでいる。", "o": ["準調", "純調", "順調", "順長"], "a": 3, "x": "「じゅんちょう」は「順調」と書く。「順」は順番の「順」、「調」は調子の「調」である。「準」「純」「長」は使わない。"}, {"no": 7, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "展示会の会場には、[[あざやか]]な色のポスターが並んでいた。", "o": ["鮮やか", "明やか", "彩やか", "新やか"], "a": 1, "x": "「あざやか」は「鮮やか」と書く。「鮮」は「新鮮」の「鮮」である。「明」「彩」「新」は「あざ」とは読まない。"}, {"no": 8, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "この契約は[[えいきゅう]]に続くものではなく、三年ごとに見直される。", "o": ["氷久", "英久", "水久", "永久"], "a": 4, "x": "「えいきゅう」は「永久」と書く。「永」は「永い」の「永」で、形の似た「氷」「水」や、音の同じ「英」とは書かない。"}, {"no": 9, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "会社の規則に[[いはん]]した社員には、注意が与えられる。", "o": ["偉判", "違反", "偉反", "違判"], "a": 2, "x": "「いはん」は「違反」と書く。「違」は「違う」、「反」は「反対」の「反」である。「偉」「判」は使わない。"}, {"no": 10, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "家族の[[かいご]]を理由に、勤務時間を短くできる制度ができた。", "o": ["看穫", "介穫", "介護", "看護"], "a": 3, "x": "「かいご」は「介護」と書く。「介」は「かい」、「護」は「まもる」の意味である。「看護」は「かんご」と読む別の語。"}, {"no": 11, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "会議には社長のほか、（　　）社長も出席することになった。", "o": ["副", "準", "助", "次"], "a": 1, "x": "「副社長」で、その役職の次の位を表す。「副〜」は「副大臣」「副作用」のように使う。"}, {"no": 12, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "来月の展示会について、取引先に招待（　　）を送った。", "o": ["書", "状", "票", "文"], "a": 2, "x": "「招待状」で、相手を招くための手紙のこと。「〜状」は「案内状」「年賀状」のように使う。"}, {"no": 13, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "この説明では（　　）十分だと、部長に書き直しを命じられた。", "o": ["未", "無", "不", "非"], "a": 3, "x": "「不十分」で、足りないことを表す。「不〜」は「不必要」「不合格」のように使う。"}, {"no": 14, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "事故の原因を調べるため、（　　）調査を行うことになった。", "o": ["復", "重", "続", "再"], "a": 4, "x": "「再調査」で、もう一度調べること。「再〜」は「再放送」「再利用」のように使う。"}, {"no": 15, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "今年の新入社員の定着（　　）は、例年より高かった。", "o": ["率", "度", "力", "性"], "a": 1, "x": "「定着率」で、辞めずに残る人の割合のこと。「〜率」は「合格率」「成功率」のように使う。"}, {"no": 16, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "あの会社には（　　）の社風があり、新人でも会議で自由に発言できる。", "o": ["限定", "独特", "専属", "孤立"], "a": 2, "x": "「独特」は、そこにしかない特別な様子。「限定」は数や範囲を限ること、「専属」はその組織だけに属すること、「孤立」は一人だけ離れること。"}, {"no": 17, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "新しい部署に移ってから、彼は語学力を十分に（　　）している。", "o": ["表現", "公開", "発揮", "明示"], "a": 3, "x": "「発揮する」は、持っている力を実際に出すこと。「表現」は考えを形にすること、「公開」は広く見せること、「明示」ははっきり示すこと。"}, {"no": 18, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "面接には、きちんとした（　　）で行ったほうがいい。", "o": ["姿勢", "容姿", "様子", "格好"], "a": 4, "x": "「格好」は服装を含めた外から見た形のこと。「姿勢」は体の構え方や心構え、「容姿」は顔立ちや体つき、「様子」はそのときの状態を表す。"}, {"no": 19, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "配達が遅れていることについて、お客様から（　　）の電話が続いている。", "o": ["苦情", "悪口", "皮肉", "反論"], "a": 1, "x": "「苦情」は、迷惑を受けた側が不満を伝えること。「悪口」は人を悪く言うこと、「皮肉」は遠回しにいやみを言うこと、「反論」は相手の意見に言い返すこと。"}, {"no": 20, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "原材料の価格が（　　）し、製品の値上げを検討している。", "o": ["向上", "上達", "上昇", "増加"], "a": 3, "x": "「上昇」は数値や温度などが上がること。「向上」は質がよくなること、「上達」は技術がうまくなること、「増加」は数や量が増えることで、価格には使わない。"}, {"no": 21, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "（　　）して、会議で配る資料を家に忘れてきてしまった。", "o": ["ぐっすり", "すっきり", "ぎっしり", "うっかり"], "a": 4, "x": "「うっかり」は、気をつけていなくて失敗する様子。「ぐっすり」はよく眠る様子、「すっきり」は気分が晴れる様子、「ぎっしり」はすきまなく詰まっている様子。"}, {"no": 22, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "今週の手帳は、打ち合わせの予定で（　　）埋まっている。", "o": ["うっかり", "ぎっしり", "さっぱり", "ぼんやり"], "a": 2, "x": "「ぎっしり」は、すきまなく詰まっている様子。「うっかり」は不注意な様子、「さっぱり」は少しも〜ない、または気分がよい様子、「ぼんやり」ははっきりしない様子。"}, {"no": 23, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "先輩から、電話で相手の話を引き出す[[テクニック]]を教わった。", "o": ["知識", "技術", "工夫", "訓練"], "a": 2, "x": "「テクニック」は「技術」に置き換えられる。物事をうまく行うためのやり方や腕前のこと。"}, {"no": 24, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "社長のひと言で、会議の空気が[[一転した]]。", "o": ["急に止まった", "少し変わった", "すっかり変わった", "やっと決まった"], "a": 3, "x": "「一転した」は「すっかり変わった」に置き換えられる。それまでとまったく違う状態になることを表す。"}, {"no": 25, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "[[勝手な]]行動は、チーム全体に迷惑をかけることになる。", "o": ["いじわるな", "なさけない", "だらしない", "わがままな"], "a": 4, "x": "「勝手な」は「わがままな」に置き換えられる。周りのことを考えず、自分の思いどおりにする様子を表す。"}, {"no": 26, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "ミスを注意された新人は、[[うつむいて]]何も言わなかった。", "o": ["下を向いて", "遠くを見て", "目を閉じて", "腕を組んで"], "a": 1, "x": "「うつむいて」は「下を向いて」に置き換えられる。顔を下に向けることを表す。"}, {"no": 27, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "取引の条件があまりにも良かったので、[[用心した]]。", "o": ["落ち着いた", "気をつけた", "がんばった", "よく考えた"], "a": 2, "x": "「用心した」は「気をつけた」に置き換えられる。悪いことが起きないように注意することを表す。"}, {"no": 28, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "きっかけ", "o": ["工場の見学は、午後二時をきっかけに始まった。", "彼は仕事のきっかけが早く、いつも定時に退社している。", "先輩のひと言がきっかけで、営業の仕事に興味を持つようになった。", "今日の会議のきっかけは、来年度の予算についてだ。"], "a": 3, "x": "「きっかけ」は、物事が始まる原因や機会のこと。1は「午後二時に」、2は「仕事が速く」、4は「議題は」が正しい。"}, {"no": 29, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "廃止", "o": ["経費削減のため、社内の売店は今月で廃止されることになった。", "古くなった機械を廃止して、新しいものを買い入れた。", "会議の途中で、彼は自分の意見を廃止した。", "台風のため、明日の出張は廃止になった。"], "a": 1, "x": "「廃止」は、続いていた制度や仕組みをやめること。2は「処分して」、3は「取り消した」、4は「中止に」が正しい。"}, {"no": 30, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "中断", "o": ["不景気で、その工場は三年前に中断してしまった。", "彼は約束を中断して、集合場所に来なかった。", "二人の意見が中断したまま、結論が出なかった。", "システムの不具合で、会議は一時中断した。"], "a": 4, "x": "「中断」は、続いていたことが途中で止まること。1は「閉鎖して」、2は「破って」、3は「対立した」が正しい。"}, {"no": 31, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "妥当", "o": ["この書類には、妥当な印が押されている。", "今回の見積もりの金額は妥当だと、上司も認めた。", "部長は、誰に対しても妥当な態度で接する。", "妥当な時間に駅に着いたので、余裕を持って準備できた。"], "a": 2, "x": "「妥当」は、判断や内容がちょうどよく、無理がないこと。1は「正式な」、3は「丁寧な」、4は「早めの」が正しい。"}, {"no": 32, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "頑固", "o": ["部長は頑固で、一度決めたことは決して変えようとしない。", "この机は頑固で、重い荷物をのせても壊れない。", "彼は仕事に頑固で、毎晩遅くまで残っている。", "頑固な雨が続いて、屋外の工事が進まない。"], "a": 1, "x": "「頑固」は、自分の考えを変えようとしない性格のこと。2は「丈夫で」、3は「熱心で」、4は「激しい」が正しい。"}, {"no": 33, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "今日は仕事に追われて、昼食をとる時間（　　）なかった。", "o": ["すら", "こそ", "より", "ほど"], "a": 1, "x": "「〜すら」は「〜さえ」と同じで、極端な例を挙げて強調する。「昼食の時間さえない」ほど忙しかったという意味。"}, {"no": 34, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "去年は目標を達成できなかったが、今年（　　）必ず達成したい。", "o": ["など", "こそ", "さえ", "まで"], "a": 2, "x": "「〜こそ」は、ほかでもなくそれを、と強く取り立てる。前の年と対比して「今年こそ」と言う形はよく使われる。"}, {"no": 35, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "この書類にサイン（　　）していただければ、手続きは終わります。", "o": ["ばかり", "ほど", "さえ", "きり"], "a": 3, "x": "「〜さえ〜ば」は、その一つだけで条件が満たされることを表す。「サインだけで済む」という意味。"}, {"no": 36, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "そういう言い方では、お客様に誤解を与え（　　）。", "o": ["かねる", "かねない", "きれない", "がたい"], "a": 2, "x": "「〜かねない」は、よくないことが起こる可能性があるという意味。「〜かねる」は「〜できない」で意味が反対になる。"}, {"no": 37, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "入社一年目（　　）、彼のプレゼンは落ち着いていて分かりやすかった。", "o": ["にとって", "につれて", "において", "にしては"], "a": 4, "x": "「〜にしては」は、そこから予想されることと実際が違う場合に使う。「一年目なのに上手だ」という意味。"}, {"no": 38, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "（　　）自分が海外勤務に選ばれるとは思ってもみなかった。", "o": ["まさか", "さすが", "どうせ", "せめて"], "a": 1, "x": "「まさか〜ない」は、そんなことはあり得ないと思っていた気持ちを表す。文末の否定と呼応する。"}, {"no": 39, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "一度引き受けた（　　）、最後まで責任を持ってやり遂げます。", "o": ["わりに", "からには", "ながらも", "とたんに"], "a": 2, "x": "「〜からには」は、そうした以上は当然こうすべきだという強い気持ちを表す。後ろには決意や義務の表現が来る。"}, {"no": 40, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "私が知っているのは、社内でうわさに聞いた話（　　）。確かなことは何も言えません。", "o": ["に違いない", "に限る", "にすぎない", "ばかりだ"], "a": 3, "x": "「〜にすぎない」は「ただの〜でしかない」と、程度が低いことを表す。後ろの文と合うのは「にすぎない」だけである。"}, {"no": 41, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "部長にここまで言われた以上、やり方を変え（　　）。", "o": ["てはならない", "ようがない", "かねない", "ざるを得ない"], "a": 4, "x": "「〜ざるを得ない」は、したくないが、そうするしかないという意味。動詞のナイ形から「ない」を取って付ける。"}, {"no": 42, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "値上げの影響で、来店するお客様の数は減る（　　）。", "o": ["一方だ", "ものだ", "ことだ", "しだいだ"], "a": 1, "x": "「〜一方だ」は、その方向へ変化が進み続けることを表す。「減り続けている」という意味になる。"}, {"no": 43, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "先輩が手伝ってくれた（　　）、締め切りに間に合いました。", "o": ["せいで", "おかげで", "くせに", "ばかりに"], "a": 2, "x": "「〜おかげで」は、よい結果の原因を表して感謝の気持ちを込める。「せいで」「ばかりに」は悪い結果に使う。"}, {"no": 44, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "先ほど、空港で海外からのお客様を（　　）。", "o": ["お迎えになりました", "迎えられました", "お迎えしました", "迎えてくださいました"], "a": 3, "x": "自分の動作をへりくだって言うので、謙譲語の「お〜する」を使う。「お迎えになる」「迎えられる」「迎えてくださる」は相手の動作に使う尊敬語である。"}, {"no": 45, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "取引先から＿＿＿　＿＿＿　★　＿＿＿　連絡があった。", "o": ["一週間", "早めてほしい", "という", "納期を"], "a": 2, "x": "正しい語順：納期を→一週間→早めてほしい→という。★は3番目＝「早めてほしい」。"}, {"no": 46, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "今回の事故は＿＿＿　＿＿＿　＿＿＿　★　起きたと考えられる。", "o": ["よって", "確認を", "ことに", "怠った"], "a": 1, "x": "正しい語順：確認を→怠った→ことに→よって。★は4番目＝「よって」。"}, {"no": 47, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "今から＿＿＿　＿＿＿　★　＿＿＿　間に合わないだろう。", "o": ["会議には", "出発した", "としても", "急いで"], "a": 3, "x": "正しい語順：急いで→出発した→としても→会議には。★は3番目＝「としても」。"}, {"no": 48, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "うちの会社の＿＿＿　＿＿＿　＿＿＿　★　仲の良さだ。", "o": ["何と言っても", "といえば", "自慢", "社員の"], "a": 4, "x": "正しい語順：自慢→といえば→何と言っても→社員の。★は4番目＝「社員の」。"}, {"no": 49, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "田中さんは＿＿＿　★　＿＿＿　＿＿＿　大阪で働くことになった。", "o": ["責任者", "来月から", "として", "新しい支店の"], "a": 1, "x": "正しい語順：新しい支店の→責任者→として→来月から。★は2番目＝「責任者」。"}, {"no": 50, "sec": "言語知識", "qt": "bunpo-text", "pid": "E2-P1", "q": "（50）", "o": ["しかも", "しかし", "つまり", "たとえば"], "a": 1, "x": "前の文の「聞き取れない」に、さらに悪い事実を付け加えているので、添加の「しかも」が入る。"}, {"no": 51, "sec": "言語知識", "qt": "bunpo-text", "pid": "E2-P1", "q": "（51）", "o": ["それでも", "そこで", "ところが", "または"], "a": 2, "x": "困った状況を受けて、その対策を取ったという流れなので、「そこで」が入る。"}, {"no": 52, "sec": "言語知識", "qt": "bunpo-text", "pid": "E2-P1", "q": "（52）", "o": ["そのうえ", "したがって", "ところが", "なぜなら"], "a": 3, "x": "うまくいくようになったという話の後に、しかし完全ではないと続くので、逆接の「ところが」が入る。"}, {"no": 53, "sec": "言語知識", "qt": "bunpo-text", "pid": "E2-P1", "q": "（53）", "o": ["わけがない", "にすぎない", "ものではない", "わけではない"], "a": 4, "x": "「〜わけではない」は部分的に否定する言い方。すべてが解決したのではない、という意味になる。"}, {"no": 54, "sec": "言語知識", "qt": "bunpo-text", "pid": "E2-P1", "q": "（54）", "o": ["ものだ", "ことだ", "ばかりだ", "ところだ"], "a": 1, "x": "「〜ものだ」は、一般的にそういうものだという性質や道理を述べる言い方である。"}, {"no": 55, "sec": "読解", "qt": "dokkai-short", "pid": "E2-P2", "q": "会議について、出席者は何をするように言われているか。", "o": ["会議の回数を増やすこと", "会議では質問をしないこと", "出席する人数を減らすこと", "会議の前に資料を読んでおくこと"], "a": 4, "x": "「資料は前日の十七時までに共有フォルダに入れ、出席者は必ず目を通してから会議に出てください」とある。"}, {"no": 56, "sec": "読解", "qt": "dokkai-short", "pid": "E2-P3", "q": "筆者は名刺についてどう考えているか。", "o": ["名刺はできるだけ多くの人に配ったほうがよい", "名刺を渡すときに添える言葉が大切だ", "名刺には仕事の内容を書いておくべきだ", "名刺は初めて会う相手にだけ渡すものだ"], "a": 2, "x": "「大切なのは、渡すときにどんな言葉を添えるかだ」と述べている。"}, {"no": 57, "sec": "読解", "qt": "dokkai-short", "pid": "E2-P4", "q": "筆者は、在宅勤務について何が必要だと述べているか。", "o": ["通勤の負担をさらに減らすこと", "若い社員の人数を増やすこと", "相談しやすくする工夫をすること", "画面を通した会議を減らすこと"], "a": 3, "x": "「相談してよい時間をあらかじめ決めておくなど、声を出しやすくする工夫が必要だろう」とある。"}, {"no": 58, "sec": "読解", "qt": "dokkai-short", "pid": "E2-P5", "q": "このお知らせの内容と合っているものはどれか。", "o": ["弁当を持ってきた人は四階の休憩室を使える", "営業部の社員は十二時十五分から食堂に入る", "決められた時間を過ぎると食堂には入れない", "七月から食堂の料理の種類が増える"], "a": 1, "x": "「弁当を持参する方は、これまでどおり四階の休憩室をご利用いただけます」とある。"}, {"no": 59, "sec": "読解", "qt": "dokkai-short", "pid": "E2-P6", "q": "筆者が上司にしかられたのはなぜか。", "o": ["大きな失敗をしたから", "失敗を伝えるのが遅かったから", "部下に注意をしなかったから", "上司の指示を聞かなかったから"], "a": 2, "x": "「しかられたのは、失敗そのものではなく、報告が遅れたことだった」とある。"}, {"no": 60, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P7", "q": "筆者が困っているのはどんなことか。", "o": ["マニュアルを読まない新人が増えたこと", "マニュアルにない場面で新人が動けなくなること", "マニュアルの内容が古くなっていること", "新人教育を任せられる人がいないこと"], "a": 2, "x": "「そこに書かれていない場面になると、急に手が止まってしまう」と述べている。"}, {"no": 61, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P7", "q": "私は考え込んでしまったとあるが、なぜか。", "o": ["新人の答え方がお客様に失礼だったから", "お客様の質問が難しすぎたから", "自分たちの教え方に問題があったと思ったから", "マニュアルに書き足す項目が多すぎたから"], "a": 3, "x": "次の段落で「悪いのは本人ではない。私たちがマニュアルを、ただ守るものとしてだけ渡してきたからだろう」と述べている。"}, {"no": 62, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P7", "q": "筆者は、マニュアルはどうあるべきだと考えているか。", "o": ["手順だけを短くまとめたものにする", "新人が自分で書くようにする", "守らなくてよいものとして扱う", "自分で考えるための土台として使う"], "a": 4, "x": "最後に「考えるための土台にするためにあるのだと思う」と述べている。"}, {"no": 63, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P8", "q": "以前の筆者は、会議についてどう思っていたか。", "o": ["予定どおりに終われば、うまく進行できたと思っていた", "若い社員の意見を聞くことが最も大切だと思っていた", "結論が出ない会議には意味がないと思っていた", "発言しない人を指名すべきだと思っていた"], "a": 1, "x": "第一段落に「会議は予定どおりに終わり、結論も出る。それで、うまく進行できたつもりでいた」とある。"}, {"no": 64, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P8", "q": "私は自分が何をしていたのかに気づいたとあるが、筆者は何をしていたのか。", "o": ["若い社員の意見を否定していた", "参加者が考える時間をなくしていた", "会議の時間を必要以上に長くしていた", "自分の意見を言わずに黙っていた"], "a": 2, "x": "「私は毎回、その時間をつぶしていたことになる」とあり、その時間とは参加者が言葉を探している時間である。"}, {"no": 65, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P8", "q": "筆者は、会議の質は何で決まると考えているか。", "o": ["参加する人の数", "進行役が話す量", "進行役が待つことのできる長さ", "会議の前に配る資料の質"], "a": 3, "x": "最後に「進行役がどれだけ話すかではなく、どれだけ待てるかで決まる」と述べている。"}, {"no": 66, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P9", "q": "筆者が驚いたのはどんなことか。", "o": ["引き継ぎに一か月以上かかったこと", "自分が多くのことを覚えていたこと", "後任が引き継ぎ書を何度も読んだこと", "取引先の担当者が変わっていたこと"], "a": 2, "x": "「書き出してみて、自分がこれほど多くのことを覚えていたのかと驚いた」とある。"}, {"no": 67, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P9", "q": "引き継ぎ書について、筆者は何が意外だったと言っているか。", "o": ["書けないことのほうが多かったこと", "後任が読んでくれなかったこと", "取引先の情報が古くなっていたこと", "五年分をすぐに書き終えられたこと"], "a": 1, "x": "第二段落に「意外だったのは、書けなかったことのほうが多かったという事実である」とある。"}, {"no": 68, "sec": "読解", "qt": "dokkai-mid", "pid": "E2-P9", "q": "筆者は、引き継ぎとはどういうことだと考えているか。", "o": ["自分の知識をすべて文章にして渡すこと", "後任が困ったときにすぐ答えを教えること", "後任が自分で判断できるまで見守ること", "後任が慣れるまで同じ仕事を続けること"], "a": 3, "x": "最後の段落に「後任が自分で判断できるようになるまで見守ることなのだろう」とある。"}, {"no": 69, "sec": "読解", "qt": "dokkai-compare", "pid": "E2-P10", "q": "服装の自由化について、AとBはどのように述べているか。", "o": ["AもBも、会社が服装を細かく決めるべきだと述べている", "AもBも、若い社員に自由化はまだ早いと述べている", "Aは社員が自分で選べると述べ、Bは選び方の考え方を会社が示すべきだと述べている", "Aは集中力が下がると述べ、Bは社員が不安になると述べている"], "a": 3, "x": "Aは「社員は相手や場面に合わせて選べるはずである」とし、Bは「考え方を、会社が示すことだ」としている。"}, {"no": 70, "sec": "読解", "qt": "dokkai-compare", "pid": "E2-P10", "q": "AとBに共通している考えはどれか。", "o": ["服装が自由になると仕事の質が下がる", "服装は相手や場面に合わせて選ぶ必要がある", "服装の決まりは会社ごとに違っていてよい", "服装より仕事の内容のほうがずっと大切だ"], "a": 2, "x": "Aは「相手や場面に合わせて選べるはずだ」、Bは「お客様の前に出る日はどうするか」と述べており、どちらも場面に応じた選択を前提にしている。"}, {"no": 71, "sec": "読解", "qt": "dokkai-long", "pid": "E2-P11", "q": "ほとんど同じ資料を二人の担当者が別々に作っていたとあるが、筆者はその原因をどう考えているか。", "o": ["互いの仕事を知る機会がなくなっていたから", "資料の書式が決まっていなかったから", "二人の席が離れた場所にあったから", "会議の回数が減らされたから"], "a": 1, "x": "「以前なら、今、何やってるの、というひと言で気づいたはずのことだ」と述べ、そうしたやりとりが削られたことを原因としている。"}, {"no": 72, "sec": "読解", "qt": "dokkai-long", "pid": "E2-P11", "q": "筆者によると、雑談が真っ先に削られるのはなぜか。", "o": ["話が長くなり、時間がかかりすぎるから", "目的がなく、なくしても何が失われたか分かりにくいから", "話した内容が報告書に書かれてしまうから", "若い社員が参加したがらないから"], "a": 2, "x": "「雑談には目的がない」「削っても、何が失われたのかがすぐには見えない」と述べている。"}, {"no": 73, "sec": "読解", "qt": "dokkai-long", "pid": "E2-P11", "q": "この文章で筆者が最も言いたいことは何か。", "o": ["効率化をやめて、以前のやり方に戻すべきだ", "会議の時間は長いほうが情報が集まりやすい", "何を無駄と考えるかを、その都度考え直す必要がある", "雑談の時間は社員が自由に取れるようにすべきだ"], "a": 3, "x": "最後の段落に「何を無駄と呼ぶかを、その都度考え直すことだ」とあり、これが筆者の主張である。"}, {"no": 74, "sec": "読解", "qt": "dokkai-info", "pid": "E2-P12", "q": "会社員のリンさんは、平日は毎日20:00まで残業がある。土曜日は午前中に用事があり、午後なら参加できる。費用は3,000円までにしたいと考えている。リンさんが申し込める講座はどれか。", "o": ["A", "B", "C", "D"], "a": 4, "x": "平日の夜は残業があるのでAとCは参加できない。Bは土曜日の午前なので用事と重なる。土曜日の午後で費用も2,000円のDだけが条件に合う。"}, {"no": 75, "sec": "読解", "qt": "dokkai-info", "pid": "E2-P12", "q": "申し込みの方法について、正しいものはどれか。", "o": ["どの講座も窓口で申し込むことができる", "Aの講座は電子メールでしか申し込めない", "Cの講座は窓口でも申し込むことができる", "Bの講座はホームページからは申し込めない"], "a": 2, "x": "Aの申込欄には「電子メールのみ」とある。Cは「ホームページのみ」、Bは「窓口またはホームページ」なので他の選択肢は誤り。"}], "3": [{"no": 1, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "台風で屋根に[[損害]]を受けたので、修理を業者に頼んだ。", "o": ["そんかい", "そうがい", "そんがい", "そうかい"], "a": 3, "x": "「損害」は「そんがい」と読む。事故や災害で受ける損失のこと。"}, {"no": 2, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "このシャンプーは[[刺激]]が少なく、子どもにも使える。", "o": ["しげき", "じげき", "しけき", "しげぎ"], "a": 1, "x": "「刺激」は「しげき」と読む。「激」は「げき」と濁って読む。"}, {"no": 3, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "母は毎週、腰の[[治療]]のために病院へ通っている。", "o": ["ちりゅう", "ちりょう", "じりょう", "ちりょ"], "a": 2, "x": "「治療」は「ちりょう」と読む。「療」は拗音で長音の「りょう」。"}, {"no": 4, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "割れたコップの[[破片]]が台所の床に散らばっていた。", "o": ["ばへん", "はべん", "はぺん", "はへん"], "a": 4, "x": "「破片」は「はへん」と読む。「破」も「片」も濁らない。"}, {"no": 5, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "近所に店が少なく、買い物の選択肢が[[乏しい]]。", "o": ["とほしい", "とぼしい", "どぼしい", "とうぼしい"], "a": 2, "x": "「乏しい」は「とぼしい」と読む。数や量が足りないという意味。"}, {"no": 6, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "新しい炊飯器の調子は、今のところ[[じゅんちょう]]だ。", "o": ["準調", "順調", "純調", "順長"], "a": 2, "x": "「じゅんちょう」は「順調」と書く。物事が調子よく運ぶことなので「順」と「調」を使う。"}, {"no": 7, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "母が庭で育てたトマトは、[[あざやか]]な赤色をしている。", "o": ["明やか", "彩やか", "新やか", "鮮やか"], "a": 4, "x": "「あざやか」は「鮮やか」と書く。色や動きがはっきりしていて美しいようすを表す。"}, {"no": 8, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "この指輪は祖母からもらった物なので、[[えいきゅう]]に大切にしたい。", "o": ["永久", "氷久", "英久", "永休"], "a": 1, "x": "「えいきゅう」は「永久」と書く。「永」は長く続く、「久」は久しいという意味。"}, {"no": 9, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "決められた日以外にごみを出すのは、マンションの規則[[いはん]]だ。", "o": ["偉判", "偉反", "違反", "違判"], "a": 3, "x": "「いはん」は「違反」と書く。決まりに違い、それに反するという意味。"}, {"no": 10, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "祖父の[[かいご]]のために、父は仕事の時間を減らした。", "o": ["看穫", "介護", "介穫", "看護"], "a": 2, "x": "「かいご」は「介護」と書く。「看護」は「かんご」と読む別の語である。"}, {"no": 11, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "この風邪薬は（　　）作用が出にくいと薬局で説明された。", "o": ["準", "副", "助", "補"], "a": 2, "x": "「副作用」で、本来の働きのほかに出る好ましくない働きを表す。「副〜」は「副社長」「副大臣」のように使う。"}, {"no": 12, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "ホットケーキの粉は、牛乳を加えるとクリーム（　　）になる。", "o": ["風", "型", "形", "状"], "a": 4, "x": "「クリーム状」で、クリームのような形や様子であることを表す。「〜状」は「粉状」「らせん状」のように使う。"}, {"no": 13, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "必要な物と（　　）必要な物を分けて、押し入れを片づけた。", "o": ["不", "無", "非", "未"], "a": 1, "x": "「不必要」で、必要でないという意味になる。「不〜」は「不合格」「不便」のように使う。"}, {"no": 14, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "一度読んだ雑誌は資源ごみに出して、（　　）利用してもらっている。", "o": ["復", "新", "再", "改"], "a": 3, "x": "「再利用」で、もう一度使うという意味になる。「再〜」は「再調査」「再放送」のように使う。"}, {"no": 15, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "母が好きな料理番組は、去年から視聴（　　）が上がっているそうだ。", "o": ["数", "率", "量", "度"], "a": 2, "x": "「視聴率」で、どのくらいの割合の人が見たかを表す。「〜率」は「合格率」「成功率」のように使う。"}, {"no": 16, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "この漬物は（　　）のにおいがあるが、慣れるととてもおいしい。", "o": ["専属", "独特", "限定", "孤立"], "a": 2, "x": "「独特」は、そのものだけが持っていて他にはないようすを表す。"}, {"no": 17, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "新しい掃除機は、家具の間のような狭い場所でこそ力を（　　）する。", "o": ["表現", "明示", "発揮", "公開"], "a": 3, "x": "「発揮」は、持っている力や能力を実際に表し出すこと。"}, {"no": 18, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "近所へ買い物に行くだけなので、楽な（　　）で出かけた。", "o": ["容姿", "姿勢", "様子", "格好"], "a": 4, "x": "「格好」は、服装を含めた外から見えるすがたを表す。「楽な格好」で動きやすい服装のこと。"}, {"no": 19, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "夜中に洗濯機を回していたら、となりの部屋から（　　）が来た。", "o": ["苦情", "悪口", "皮肉", "反論"], "a": 1, "x": "「苦情」は、迷惑を受けた人が相手に伝える不平や不満のこと。"}, {"no": 20, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "今年は野菜の値段が（　　）を続けていて、家計が苦しい。", "o": ["増加", "上昇", "向上", "上達"], "a": 2, "x": "「上昇」は、値段や温度などの数値が上がること。「増加」は数や量が増えることで、値段には使わない。"}, {"no": 21, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "（　　）して、冷凍庫に入れるはずのアイスを台所に置いたままにした。", "o": ["ぐっすり", "すっきり", "うっかり", "ぎっしり"], "a": 3, "x": "「うっかり」は、注意が足りずに失敗してしまうようすを表す。"}, {"no": 22, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "母が送ってくれた箱には、畑でとれた野菜が（　　）詰まっていた。", "o": ["ぎっしり", "さっぱり", "ぼんやり", "うっかり"], "a": 1, "x": "「ぎっしり」は、すき間がないほどいっぱいに入っているようすを表す。"}, {"no": 23, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "父はシャツにアイロンをきれいにかける[[テクニック]]を教えてくれた。", "o": ["知識", "技術", "工夫", "訓練"], "a": 2, "x": "「テクニック」は「技術」に置き換えられる。物事を上手に行うための腕前をいう。"}, {"no": 24, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "引っ越してから、休日の過ごし方が[[一転した]]。", "o": ["少し変わった", "急に止まった", "すっかり変わった", "やっと決まった"], "a": 3, "x": "「一転した」は「すっかり変わった」に置き換えられる。それまでとまったく違う状態になることをいう。"}, {"no": 25, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "弟は家族の予定を考えずに[[勝手な]]ことばかり言う。", "o": ["わがままな", "いじわるな", "なさけない", "だらしない"], "a": 1, "x": "「勝手な」は「わがままな」に置き換えられる。他人のことを考えず、自分の思うとおりにするようすをいう。"}, {"no": 26, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "妹は母にしかられて、[[うつむいて]]黙っていた。", "o": ["目を閉じて", "遠くを見て", "腕を組んで", "下を向いて"], "a": 4, "x": "「うつむいて」は「下を向いて」に置き換えられる。顔を下に向けることをいう。"}, {"no": 27, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "値段が安すぎる中古品には[[用心した]]ほうがいい。", "o": ["落ち着いた", "気をつけた", "がんばった", "よく考えた"], "a": 2, "x": "「用心した」は「気をつけた」に置き換えられる。悪いことが起こらないように注意することをいう。"}, {"no": 28, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "きっかけ", "o": ["引っ越しのきっかけとして、となりの家にタオルを配った。", "毎朝六時に起きることを、去年からきっかけにしている。", "子どもが生まれたことがきっかけで、料理を作るようになった。", "この商店街のきっかけは、五十年ほど前だそうだ。"], "a": 3, "x": "「きっかけ」は、物事が始まる原因や機会のこと。1は「あいさつ」、2は「習慣」、4は「始まり」が正しい。"}, {"no": 29, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "廃止", "o": ["家の前を通るバスの路線が、来月で廃止されることになった。", "古くなった炊飯器を廃止して、新しい物を買った。", "熱が下がらないので、旅行の予定を廃止した。", "値上がりしたので、その飲み物を買うのを廃止した。"], "a": 1, "x": "「廃止」は、続いてきた制度や仕組みをやめること。2は「処分」、3は「中止」、4は「やめた」が正しい。"}, {"no": 30, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "中断", "o": ["古い洗濯機を新しい物に中断した。", "この商店街は、日曜日は多くの店が中断している。", "値段が高かったので、そのコートを買うのを中断した。", "宅配便が来たので、掃除を中断して玄関へ出た。"], "a": 4, "x": "「中断」は、続けていたことを途中でやめること。1は「取りかえた」、2は「休んで」、3は「あきらめた」が正しい。"}, {"no": 31, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "妥当", "o": ["この味付けは妥当で、家族みんなが気に入っている。", "この中古の自転車の値段は、状態から考えて妥当だと思う。", "姉は妥当な性格で、だれとでもすぐに仲よくなる。", "新しい炊飯器は使い方が妥当で、祖母もすぐに覚えた。"], "a": 2, "x": "「妥当」は、判断や条件がその場に合っていて無理がないこと。1は「ちょうどよく」、3は「おだやか」、4は「簡単」が正しい。"}, {"no": 32, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "頑固", "o": ["母は頑固に部屋を片づけて、夕方には全部終わらせた。", "この鍋は頑固に作られていて、十年使っても壊れない。", "父は頑固で、一度こうと決めたら人の話を聞かない。", "今週は雨の日が頑固に続いて、洗濯物が乾かない。"], "a": 3, "x": "「頑固」は、自分の考えを変えようとしない性質のこと。1は「熱心に」、2は「丈夫」、4は「ずっと」が正しい。"}, {"no": 33, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "毎日忙しくて、家族とゆっくり食事をする時間（　　）ない。", "o": ["ほど", "だけ", "すら", "ばかり"], "a": 3, "x": "「〜すら」は、当然あるはずのものさえないことを強調して表す。"}, {"no": 34, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "今年（　　）、押し入れの中をきちんと片づけたい。", "o": ["こそ", "だけ", "さえ", "ほど"], "a": 1, "x": "「〜こそ」は、他ではなくそれを特に取り立てて強調するときに使う。"}, {"no": 35, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "材料（　　）そろえば、この料理は十五分でできる。", "o": ["こそ", "まで", "ほど", "さえ"], "a": 4, "x": "「〜さえ〜ば」は、それだけが条件として満たされればよいことを表す。"}, {"no": 36, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "なべを火にかけたまま出かけると、火事になり（　　）。", "o": ["かねない", "きれない", "ようがない", "がたい"], "a": 1, "x": "「〜かねない」は、悪いことが起こる可能性があることを表す。"}, {"no": 37, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "この鍋は、値段が安い（　　）よくできていて、長く使えそうだ。", "o": ["だけに", "として", "にしては", "ばかりに"], "a": 3, "x": "「〜にしては」は、その条件から予想されることと実際が違うときに使う。"}, {"no": 38, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "（　　）近所のあのスーパーが閉店するとは思わなかった。", "o": ["まさか", "まるで", "もしも", "まさに"], "a": 1, "x": "「まさか〜ない」は、そんなことは起こらないだろうという強い意外さを表す。"}, {"no": 39, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "自分で夕飯を作ると言った（　　）、最後まで責任を持ってやろう。", "o": ["ところで", "ものなら", "かぎりで", "からには"], "a": 4, "x": "「〜からには」は、そうした以上は当然こうするべきだという気持ちを表す。"}, {"no": 40, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "私が家でしているのは、ごみを出すことくらい（　　）。", "o": ["にきまっている", "にすぎない", "にちがいない", "によるものだ"], "a": 2, "x": "「〜にすぎない」は、それだけのことで、大したことではないという意味を表す。"}, {"no": 41, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "近くの店が閉まってしまったので、遠くのスーパーまで行か（　　）。", "o": ["ずにはいられない", "ないほうがましだ", "ざるを得ない", "ないことはない"], "a": 3, "x": "「〜ざるを得ない」は、したくないが、そうするしかないという意味を表す。"}, {"no": 42, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "子どもが大きくなるにつれて、わが家の食費は増える（　　）だ。", "o": ["一方", "最中", "気味", "次第"], "a": 1, "x": "「〜一方だ」は、ある変化が止まらずに進んでいくことを表す。"}, {"no": 43, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "近所の人が手伝ってくれた（　　）、引っ越しが半日で終わった。", "o": ["せいで", "くせに", "わりに", "おかげで"], "a": 4, "x": "「〜おかげで」は、よい結果をもたらした原因や助けを表す。"}, {"no": 44, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "祖母が久しぶりに家に来るので、私が駅まで車で（　　）。", "o": ["お迎えになりました", "お迎えしました", "迎えられました", "お迎えくださいました"], "a": 2, "x": "自分の動作をへりくだって言う謙譲語は「お〜する」の形で、「お迎えしました」となる。"}, {"no": 45, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "うちの近所には、＿＿＿　＿＿＿　★　＿＿＿　残っている。", "o": ["大きな市場が", "あったという", "昔ここに", "話が"], "a": 2, "x": "正しい語順：昔ここに→大きな市場が→あったという→話が。★は3番目＝「あったという」。"}, {"no": 46, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "同じ野菜でも、＿＿＿　★　＿＿＿　＿＿＿　かなり違う。", "o": ["値段が", "買う", "よって", "店に"], "a": 4, "x": "正しい語順：買う→店に→よって→値段が。★は2番目＝「店に」。"}, {"no": 47, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "たとえ＿＿＿　＿＿＿　★　＿＿＿　買わないようにしている。", "o": ["としても", "必要のない物は", "値段が", "安かった"], "a": 1, "x": "正しい語順：値段が→安かった→としても→必要のない物は。★は3番目＝「としても」。"}, {"no": 48, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "わが家の日曜日の＿＿＿　＿＿＿　＿＿＿　★　と決まっている。", "o": ["母が焼く", "朝食", "パンだ", "といえば"], "a": 3, "x": "正しい語順：朝食→といえば→母が焼く→パンだ。★は4番目＝「パンだ」。"}, {"no": 49, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "祖母は、＿＿＿　＿＿＿　＿＿＿　★　台所に立ち続けてきた。", "o": ["健康を守る人", "として", "長年", "家族の"], "a": 2, "x": "正しい語順：長年→家族の→健康を守る人→として。★は4番目＝「として」。"}, {"no": 50, "sec": "言語知識", "qt": "bunpo-text", "pid": "E3-P1", "q": "（50）", "o": ["ところが", "そのうえ", "つまり", "したがって"], "a": 1, "x": "前の文の予想と反対の結果が続くので、逆接の「ところが」が入る。"}, {"no": 51, "sec": "言語知識", "qt": "bunpo-text", "pid": "E3-P1", "q": "（51）", "o": ["つまり", "しかも", "たとえば", "ところが"], "a": 2, "x": "前の文と同じ方向の不都合をもう一つ付け加えているので、「しかも」が入る。"}, {"no": 52, "sec": "言語知識", "qt": "bunpo-text", "pid": "E3-P1", "q": "（52）", "o": ["それでも", "または", "そこで", "ところが"], "a": 3, "x": "前で述べた問題を受けて対策を取ったという流れなので、「そこで」が入る。"}, {"no": 53, "sec": "言語知識", "qt": "bunpo-text", "pid": "E3-P1", "q": "（53）", "o": ["わけがない", "はずがない", "ことはない", "わけではない"], "a": 4, "x": "「〜からといって、〜わけではない」の形で、必ずしもそうとは限らないという意味になる。"}, {"no": 54, "sec": "言語知識", "qt": "bunpo-text", "pid": "E3-P1", "q": "（54）", "o": ["ところだ", "ものだ", "ばかりだ", "最中だ"], "a": 2, "x": "一般的にそういうものだという筆者の感想をまとめる文末なので、「ものだ」が入る。"}, {"no": 55, "sec": "読解", "qt": "dokkai-short", "pid": "E3-P2", "q": "筆者は冷蔵庫の使い方についてどう考えているか。", "o": ["たくさん入るように、奥まで使ったほうがよい。", "食品を見えるところに置き、早めに使ったほうがよい。", "食材を買う量そのものを減らしたほうがよい。", "大きい冷蔵庫に買い替えたほうがよい。"], "a": 2, "x": "見えない物は忘れるので、目に入る場所に置けば使い切れると述べている。"}, {"no": 56, "sec": "読解", "qt": "dokkai-short", "pid": "E3-P3", "q": "テーブルが届くのを待つ場合、客はどうすればよいか。", "o": ["金曜日までに電話で連絡する。", "金曜日までにメールで返事を出す。", "何も連絡しなくてよい。", "商品が届いてから会社に連絡する。"], "a": 3, "x": "待てる場合は連絡不要で、電話が必要なのは取り消しを希望する場合だけである。"}, {"no": 57, "sec": "読解", "qt": "dokkai-short", "pid": "E3-P4", "q": "筆者が当番表をやめた理由は何か。", "o": ["家事の量が家族によって違っていたから", "表を作る時間がもったいなかったから", "担当かどうかを気にして、進んで動かなくなったから", "一週間分をまとめて数えるのが難しかったから"], "a": 3, "x": "表があると担当かどうかばかり気にして、気づいた人が動かなくなったと述べている。"}, {"no": 58, "sec": "読解", "qt": "dokkai-short", "pid": "E3-P5", "q": "筆者は物を買うとき、何を大切にしているか。", "o": ["これからの暮らしの変化に合っているかどうか", "できるだけ質のよい物を選ぶこと", "安い物をこまめに買い直すこと", "家族全員の意見を聞いて決めること"], "a": 1, "x": "長く使えるかは暮らしが変わらないかにもよるとして、暮らしの変化を基準にしている。"}, {"no": 59, "sec": "読解", "qt": "dokkai-short", "pid": "E3-P6", "q": "筆者は、あいさつにどのような意味があると考えているか。", "o": ["近所の人とすぐに親しい関係になれること", "物音などで迷惑をかけずにすむこと", "引っ越しの手伝いを頼みやすくなること", "相手を知ることで、小さな安心が生まれること"], "a": 4, "x": "最後の文で、近所づきあいは小さな安心の積み重ねだと述べている。"}, {"no": 60, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P7", "q": "筆者によると、物が捨てられないのはなぜか。", "o": ["まだ十分に使える状態だから", "その物と結びついた時間を手放せないから", "買うときに高いお金を払ったから", "家族が捨てることに反対するから"], "a": 2, "x": "第二段落に、物にくっついている時間を手放せずにいると述べられている。"}, {"no": 61, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P7", "q": "箱に入れて半年置くという方法のよい点は何か。", "o": ["半年の間に家族に相談できること", "捨てた物の数を記録できること", "捨てるかどうかをその場で決めなくてよいこと", "半年後には必ず気持ちが変わること"], "a": 3, "x": "第三段落に、この方法のいいところはその場で決めなくてよいことだとある。"}, {"no": 62, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P7", "q": "筆者が物を減らしているのは何のためか。", "o": ["家の中の物の数をできるだけ少なくするため", "押し入れに新しい物を入れる場所を作るため", "高い買い物をして後悔しないようにするため", "今の暮らしに合った物だけを手元に置くため"], "a": 4, "x": "最終段落で、物が今の暮らしと合っているかを確かめたいのだと述べている。"}, {"no": 63, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P8", "q": "筆者が金物屋でふたを買ってよかったと感じたのはなぜか。", "o": ["その場で手に取って確かめて選べたから", "インターネットより早く手に入ったから", "主人が古いなべを直してくれたから", "家から歩いて行ける距離にあったから"], "a": 1, "x": "第一段落の最後に、その場で手に取って確かめられたのはありがたかったとある。"}, {"no": 64, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P8", "q": "金物屋の主人が客の相談に応じ続けているのはなぜか。", "o": ["相談に来た客がいつか買ってくれると思っているから", "インターネットの店に負けたくないから", "ふたの選び方のような知識が残らなくなるから", "客と話すことが何よりも好きだから"], "a": 3, "x": "第三段落に、店を開けておかなければ知識がどこにも残らなくなるからだとある。"}, {"no": 65, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P8", "q": "この文章で筆者が最も言いたいことは何か。", "o": ["日用品はすべて近所の店で買ったほうがよい。", "安さだけで買う場所を選び続けると、いずれ自分が困る。", "インターネットの買い物は返品ができるので安心だ。", "古い道具は思い切って買い替えたほうが結局は安い。"], "a": 2, "x": "最終段落で、選び方を教えてくれる場所が消え、困るのは自分だと述べている。"}, {"no": 66, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P9", "q": "筆者が記録をして驚いたのはどんなことか。", "o": ["夕食の支度に四十分もかかっていたこと", "何を作るかを決める時間が長かったこと", "毎日同じような料理を作っていたこと", "使わずに余る材料が多かったこと"], "a": 2, "x": "第一段落に、十分近くが何を作るかを決める時間だったことに驚いたとある。"}, {"no": 67, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P9", "q": "献立表を作ったことで起きた問題は何か。", "o": ["支度の時間がかえって長くなったこと", "家族から食事の内容に不満が出たこと", "その日の気分で作る物を変えられなくなったこと", "材料を買いすぎるようになったこと"], "a": 3, "x": "第三段落に、迷わなくなった代わりに気分で変えられなくなったとある。"}, {"no": 68, "sec": "読解", "qt": "dokkai-mid", "pid": "E3-P9", "q": "この文章で筆者が最も言いたいことは何か。", "o": ["家事にかかる時間は記録して減らすべきだ。", "献立は前もってすべて決めておいたほうがよい。", "料理はその日の気分に合わせて自由に作るのがよい。", "決めておく部分と決めない部分の割合を自分で調整すればよい。"], "a": 4, "x": "最終段落で、両者の割合を自分に合うように調整すればよいと述べている。"}, {"no": 69, "sec": "読解", "qt": "dokkai-compare", "pid": "E3-P10", "q": "おこづかいの渡し方について、AとBはどのように述べているか。", "o": ["AもBも、毎月決まった額を渡すべきだと述べている。", "AもBも、必要なときにだけ渡すべきだと述べている。", "Aは毎月決まった額を渡すべきだと述べ、Bは必要なときに説明を聞いて渡すべきだと述べている。", "Aは手伝いの報酬として渡すべきだと述べ、Bは毎月決まった額を渡すべきだと述べている。"], "a": 3, "x": "Aは毎月決まった日に決まった額を渡すことをすすめ、Bは必要なときに使い道を説明させて渡している。"}, {"no": 70, "sec": "読解", "qt": "dokkai-compare", "pid": "E3-P10", "q": "子どものおこづかいについて、AとBに共通している考えはどれか。", "o": ["渡す金額はできるだけ少ないほうがよい。", "お金の使い方は子ども自身に考えさせるべきだ。", "家の手伝いに対してお金を払うべきではない。", "お金がなくなっても親が足してやるべきではない。"], "a": 2, "x": "Aは自分で使い方を決める経験を、Bは使い道を自分の言葉で説明することを重視しており、この点で共通する。3はBだけ、4はAだけの内容である。"}, {"no": 71, "sec": "読解", "qt": "dokkai-long", "pid": "E3-P11", "q": "家事が楽になったという実感が少ないのはなぜだと筆者は述べているか。", "o": ["新しい道具の使い方を覚えるのに時間がかかるから", "便利になるにつれて、求められる水準が上がってきたから", "家族が家事を手伝わなくなったから", "便利な道具が高くて買えない家庭が多いから"], "a": 2, "x": "第二段落に、道具が便利になるたびに求められる水準が上がったとある。"}, {"no": 72, "sec": "読解", "qt": "dokkai-long", "pid": "E3-P11", "q": "筆者が休みの日の朝にコーヒーを豆から入れているのはなぜか。", "o": ["豆から入れたほうが味がよいから", "家族と話す時間を作るため", "手を動かす間、頭が静かになる時間を残すため", "効率のよい入れ方を見つけたいから"], "a": 3, "x": "第五段落に、手を動かしている間だけ頭の中が静かになるとあり、無駄と分かって残していると述べている。"}, {"no": 73, "sec": "読解", "qt": "dokkai-long", "pid": "E3-P11", "q": "この文章で筆者が最も言いたいことは何か。", "o": ["何を機械に任せ、何を自分の手に残すかを自分で選ぶことが大切だ。", "便利な道具は、できるだけ使わないほうがよい。", "家事にかかる時間は、これからも減らし続けるべきだ。", "空いた時間には、別の家事を入れて有効に使うべきだ。"], "a": 1, "x": "最終段落で、何を任せ何を残すかを選ぶことこそが便利な時代の暮らし方だと述べている。"}, {"no": 74, "sec": "読解", "qt": "dokkai-info", "pid": "E3-P12", "q": "田中さんは市外に住んでいるが、市内の会社に勤めている。平日の夜なら毎週参加できる。田中さんが申し込める講座はどれか。", "o": ["A", "B", "C", "D"], "a": 3, "x": "市外に住む人が申し込めるのはCのみで、Cは水曜日の夜に全三回行われるため条件に合う。"}, {"no": 75, "sec": "読解", "qt": "dokkai-info", "pid": "E3-P12", "q": "十一月八日の講座に参加したい人は、どうすればよいか。", "o": ["十一月一日までに、窓口で申し込む。", "十一月一日までに、ホームページで申し込む。", "十一月七日までに、電話で申し込む。", "申し込まずに、当日直接会場へ行く。"], "a": 2, "x": "十一月八日はBの講座で、申込はホームページのみ、締め切りは一週間前の十一月一日である。"}], "4": [{"no": 1, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "先月の台風で、市内の道路や橋に大きな[[損害]]が出た。", "o": ["そんかい", "そんがい", "そうがい", "そうかい"], "a": 2, "x": "「損害」は「そんがい」と読む。「害」は「がい」と濁る。「そんかい」「そうがい」は誤り。"}, {"no": 2, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "市の新しい補助制度は、地元の商店街に良い[[刺激]]を与えている。", "o": ["しげき", "しけき", "じげき", "しげぎ"], "a": 1, "x": "「刺激」は「しげき」と読む。「刺」は「し」、「激」は「げき」。「しけき」「じげき」は濁点の位置の誤り。"}, {"no": 3, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "この地域では、休日に[[治療]]を受けられる病院が少ない。", "o": ["ちりゅう", "じりょう", "ちりょう", "ちりょ"], "a": 3, "x": "「治療」は「ちりょう」と読む。「療」は拗音＋長音で「りょう」。「ちりょ」と長音を落とさないこと。"}, {"no": 4, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "道路に落ちていたガラスの[[破片]]を、市の職員が片づけた。", "o": ["はべん", "ばへん", "はぺん", "はへん"], "a": 4, "x": "「破片」は「はへん」と読む。「片」をここでは「へん」と清音で読む。「はべん」「はぺん」は誤り。"}, {"no": 5, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "財源が[[乏しい]]自治体では、公共施設の建て替えがなかなか進まない。", "o": ["とほしい", "とぼしい", "とうぼしい", "とぼうしい"], "a": 2, "x": "「乏しい」は「とぼしい」と読む。「足りない」という意味。長音にしたり清音にしたりしないこと。"}, {"no": 6, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "駅前の再開発工事は、今のところ[[じゅんちょう]]に進んでいる。", "o": ["準調", "順調", "純調", "順長"], "a": 2, "x": "「じゅんちょう」は「順調」と書く。物事が予定どおりに進むこと。「準」「純」は音が同じでも意味が違う。"}, {"no": 7, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "市が管理する公園のもみじが、[[あざやか]]に色づいてきた。", "o": ["鮮やか", "明やか", "彩やか", "新やか"], "a": 1, "x": "「あざやか」は「鮮やか」と書く。色や動きがはっきりしていて美しいこと。「明」「彩」は「あざ」とは読まない。"}, {"no": 8, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "この土地は、[[えいきゅう]]に市民の緑地として残されることになった。", "o": ["氷久", "永人", "永久", "氷人"], "a": 3, "x": "「えいきゅう」は「永久」と書く。「永」は「えい」、「久」は「きゅう」。「氷」は「ひょう」で形が似ているだけ。"}, {"no": 9, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "駐車[[いはん]]の取り締まりが、商店街の周辺で強化された。", "o": ["偉判", "違判", "偉反", "違反"], "a": 4, "x": "「いはん」は「違反」と書く。決まりにそむくこと。「偉」は「い」と読むが意味が合わず、「判」は「はん」でも意味が違う。"}, {"no": 10, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "市は[[かいご]]を担う家族を支えるための相談窓口を開いた。", "o": ["介護", "看護", "介穫", "看穫"], "a": 1, "x": "「かいご」は「介護」と書く。「看護」は「かんご」で別の語。「穫」は「かく」で「ご」とは読まない。"}, {"no": 11, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "今日の説明会には、市長のほかに（　　）市長も出席した。", "o": ["副", "準", "助", "次"], "a": 1, "x": "「副市長」が正しい。「副〜」は主となるものに次ぐ立場を表す。「副大臣」「副社長」なども同じ。"}, {"no": 12, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "町内会の集まりの案内は、招待（　　）ではなくメールで届いた。", "o": ["書", "状", "文", "票"], "a": 2, "x": "「招待状」が正しい。「〜状」は書面や、そのような形・様子を表す。「賞状」「粉状」なども同じ。"}, {"no": 13, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "市は（　　）必要な手続きを減らし、窓口での待ち時間を短くした。", "o": ["無", "非", "不", "未"], "a": 3, "x": "「不必要」が正しい。「不〜」は「〜でない」という打ち消しを表す。「不合格」「不便」なども同じ。"}, {"no": 14, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "市は、古い橋の安全性について（　　）調査を行うことにした。", "o": ["複", "重", "副", "再"], "a": 4, "x": "「再調査」が正しい。「再〜」は「もう一度」という意味。「再放送」「再利用」なども同じ。"}, {"no": 15, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "この地区では、住民アンケートの回収（　　）が八割を超えた。", "o": ["度", "率", "量", "性"], "a": 2, "x": "「回収率」が正しい。「〜率」は全体に対する割合を表す。「進学率」「合格率」なども同じ。"}, {"no": 16, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "この町の祭りには、他の地域では見られない（　　）の雰囲気がある。", "o": ["専属", "独特", "限定", "孤立"], "a": 2, "x": "そこにしかない特別な様子を表すので「独特」。「専属」は所属、「限定」は範囲を区切ること、「孤立」は一つだけ離れていること。"}, {"no": 17, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "災害のときこそ、日ごろの訓練の成果が（　　）される。", "o": ["表現", "明示", "発揮", "公開"], "a": 3, "x": "持っている力を実際に出すことなので「発揮」。「表現」は気持ちを表すこと、「明示」ははっきり示すこと、「公開」は広く見せること。"}, {"no": 18, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "作業中の（　　）のまま説明会に出てしまい、少し恥ずかしかった。", "o": ["容姿", "姿勢", "様子", "格好"], "a": 4, "x": "服装を含めた外見を表すので「格好」。「容姿」は顔立ちや体つき、「姿勢」は体の構え、「様子」は全体のありさま。"}, {"no": 19, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "夜間の工事の音について、近所の住民から（　　）が寄せられた。", "o": ["苦情", "悪口", "皮肉", "反論"], "a": 1, "x": "迷惑を受けて改善を求める訴えなので「苦情」。「悪口」は人を悪く言うこと、「皮肉」は遠回しの非難、「反論」は意見に対する言い返し。"}, {"no": 20, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "この五年で、市内の土地の値段は少しずつ（　　）している。", "o": ["増加", "上昇", "向上", "上達"], "a": 2, "x": "値段や温度などが高くなることは「上昇」。「増加」は数や量が増えること、「向上」は質がよくなること、「上達」は技能が伸びること。"}, {"no": 21, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "（　　）ごみを出す曜日を間違えて、近所の人に注意された。", "o": ["すっきり", "ぎっしり", "ぐっすり", "うっかり"], "a": 4, "x": "注意が足りず失敗する様子は「うっかり」。「すっきり」は気分がよいさま、「ぎっしり」は詰まったさま、「ぐっすり」はよく眠るさま。"}, {"no": 22, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "市民会館の掲示板には、地域の行事の案内が（　　）と貼られていた。", "o": ["さっぱり", "ぼんやり", "ぎっしり", "うっかり"], "a": 3, "x": "すきまなく詰まっている様子は「ぎっしり」。「さっぱり」は残らないさま、「ぼんやり」ははっきりしないさま、「うっかり」は不注意なさま。"}, {"no": 23, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "この地域に伝わる織物には、昔からの[[テクニック]]が生かされている。", "o": ["知識", "技術", "工夫", "訓練"], "a": 2, "x": "「テクニック」は「技術」に置き換えられる。物事を行うためのわざのこと。「知識」「工夫」「訓練」は意味が異なる。"}, {"no": 24, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "新しい駅ができて、この町の様子は[[一転した]]。", "o": ["すっかり変わった", "少し変わった", "やっと決まった", "急に止まった"], "a": 1, "x": "「一転した」は「すっかり変わった」に置き換えられる。それまでとまったく違う状態になること。"}, {"no": 25, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "町内会の会議で、[[勝手な]]意見ばかり言う人がいて話が進まなかった。", "o": ["いじわるな", "なさけない", "だらしない", "わがままな"], "a": 4, "x": "「勝手な」は「わがままな」に置き換えられる。他人のことを考えず自分の思うとおりにする様子。"}, {"no": 26, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "説明会で厳しい意見が続き、担当者は[[うつむいて]]話を聞いていた。", "o": ["遠くを見て", "目を閉じて", "下を向いて", "腕を組んで"], "a": 3, "x": "「うつむいて」は「下を向いて」に置き換えられる。顔を下に向けることをいう。"}, {"no": 27, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "市の広報でうその電話に注意を呼びかけていたので、多くの住民が[[用心した]]という。", "o": ["気をつけた", "落ち着いた", "がんばった", "よく考えた"], "a": 1, "x": "「用心した」は「気をつけた」に置き換えられる。悪いことが起きないように注意することをいう。"}, {"no": 28, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "きっかけ", "o": ["台風で中止になった行事の、新しい日程のきっかけを決めた。", "市の広報紙は、月に一度のきっかけで発行されている。", "ボランティアに誘われたことがきっかけで、地域の活動に参加するようになった。", "駅前の再開発は、五年後の完成をきっかけとして工事が進んでいる。"], "a": 3, "x": "「きっかけ」は物事が始まる原因や機会のこと。1は「日取り」、2は「割合」、4は「目標」が適切。"}, {"no": 29, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "廃止", "o": ["利用者が減ったため、この路線のバスは来年三月で廃止される。", "会議の途中で停電が起き、話し合いは廃止になった。", "古くなった校舎は、来月から廃止して新しく建て直す。", "大雨のため、本日の公園の使用を廃止します。"], "a": 1, "x": "「廃止」は制度や仕組みをやめること。2は「中止」、3は「取り壊し」、4は「禁止」が適切。"}, {"no": 30, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "中断", "o": ["この制度は利用者が少なく、来年度で中断されることになった。", "台風で倒れた木を、市の職員が中断して運び出した。", "新しい図書館の場所については、住民の意見が中断している。", "強い雨のため、地域の清掃活動は一時中断された。"], "a": 4, "x": "「中断」は続いていたことが途中で止まること。1は「廃止」、2は「切断」、3は「分かれて」が適切。"}, {"no": 31, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "妥当", "o": ["この案は住民の反対が多く、議会で妥当されなかった。", "市が示した補助金の額は、専門家から見ても妥当なものだ。", "新しい市民ホールは、音楽会にも妥当な設備が整っている。", "窓口での説明が妥当だったため、住民から質問が相次いだ。"], "a": 2, "x": "「妥当」は判断や内容が無理なく適切であること。1は「可決」、3は「十分な」、4は「不十分」が適切。"}, {"no": 32, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "頑固", "o": ["市の担当者は、住民の質問に頑固に答えてくれた。", "台風に備えて、屋根を頑固に直しておいた。", "父は頑固な性格で、町内会のやり方を変えることに最後まで反対した。", "今年の冬は寒さが頑固で、雪かきの当番も増えた。"], "a": 3, "x": "「頑固」は自分の考えを変えようとしない性格をいう。1は「ていねいに」、2は「頑丈に」、4は「厳しく」が適切。"}, {"no": 33, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "引っ越してきたばかりのころは、隣に住む人の名前（　　）知らなかった。", "o": ["ほど", "こそ", "すら", "だけ"], "a": 3, "x": "「〜すら」は「〜さえ」と同じで、当然そうであるはずのことも成り立たないことを表す。名詞に付く。"}, {"no": 34, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "今年（　　）、地域の防災訓練に参加しようと思っている。", "o": ["こそ", "さえ", "まで", "でも"], "a": 1, "x": "「〜こそ」はそれを特に強調して取り立てる。「今年こそ」で今年は必ずという気持ちを表す。"}, {"no": 35, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "必要な書類（　　）そろっていれば、窓口での手続きは五分で終わります。", "o": ["だけ", "ほど", "のみ", "さえ"], "a": 4, "x": "「〜さえ〜ば」で、それだけが条件であることを表す。「だけ」「のみ」は「〜ば」と組み合わせてこの形をつくらない。"}, {"no": 36, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "ごみの不法投棄を放っておくと、地域の環境が大きく損なわれ（　　）。", "o": ["かねる", "かねない", "がたい", "そうもない"], "a": 2, "x": "「〜かねない」は悪い可能性があることを表す。「〜かねる」は「できない」で意味が反対になる。"}, {"no": 37, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "この町は、人口が少ない（　　）、文化施設がよく整っている。", "o": ["にしては", "にかけては", "にあたっては", "にわたっては"], "a": 1, "x": "「〜にしては」は、そこから予想されることと実際が違う場合に使う。人口が少ないのに施設が多い、という関係。"}, {"no": 38, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "（　　）自分の住む町でこれほど大きな災害が起こるとは思わなかった。", "o": ["さすがに", "たしかに", "まさか", "せっかく"], "a": 3, "x": "「まさか〜ない」で、そんなことは起こるはずがないと思っていた気持ちを表す。文末の打ち消しと呼応する。"}, {"no": 39, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "地域の委員を引き受けた（　　）、最後まで責任を持ってやりたい。", "o": ["ばかりに", "からには", "とたんに", "かぎりでは"], "a": 2, "x": "「〜からには」は、そうした以上は当然こうするという決意や義務を表す。後ろに話し手の意志が来る。"}, {"no": 40, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "今回発表された数字は、調査全体のごく一部（　　）。", "o": ["にほかならない", "というものだ", "にきまっている", "にすぎない"], "a": 4, "x": "「〜にすぎない」は「ただ〜だけだ」と程度が低いことを表す。「にほかならない」は「まさに〜だ」で意味が逆。"}, {"no": 41, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "予算が足りない以上、今年の花火大会は中止（　　）。", "o": ["するどころではない", "しかねない", "してはならない", "せざるを得ない"], "a": 4, "x": "「〜ざるを得ない」は、したくないが事情によりそうするしかないことを表す。「する」は「せざるを得ない」となる。"}, {"no": 42, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "この地区に住む子どもの数は、ここ十年で減る（　　）。", "o": ["ところだ", "一方だ", "次第だ", "おかげだ"], "a": 2, "x": "「〜一方だ」は、ある傾向がどんどん進んでいくことを表す。動詞の辞書形に付く。"}, {"no": 43, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "多くのボランティアが集まってくれた（　　）、公園の清掃は短い時間で終わった。", "o": ["おかげで", "せいで", "くせに", "わりに"], "a": 1, "x": "「〜おかげで」はよい結果の理由を表す。「せいで」は悪い結果の理由なので合わない。"}, {"no": 44, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "本日は、遠くからいらっしゃった講師の先生を、私が駅まで（　　）。", "o": ["お迎えになりました", "迎えてくださいました", "お迎えしました", "お迎えくださいました"], "a": 3, "x": "自分の動作なので謙譲語の「お〜する」を使い「お迎えしました」となる。他の三つは相手を高める尊敬語で、自分の動作には使えない。"}, {"no": 45, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "駅前に＿＿＿　＿＿＿　★　＿＿＿　、多くの住民が期待している。", "o": ["できる", "という", "計画に", "大きな公園が"], "a": 2, "x": "正しい語順：大きな公園が→できる→という→計画に。★は3番目＝「という」。"}, {"no": 46, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "この地区の防災マップは＿＿＿　＿＿＿　＿＿＿　★　作られた。", "o": ["何度も", "話し合う", "住民が", "ことによって"], "a": 4, "x": "正しい語順：住民が→何度も→話し合う→ことによって。★は4番目＝「ことによって」。"}, {"no": 47, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "たとえ＿＿＿　★　＿＿＿　＿＿＿　、市は説明を続けるべきだ。", "o": ["賛成する", "少なかったとしても", "この計画に", "人が"], "a": 1, "x": "正しい語順：この計画に→賛成する→人が→少なかったとしても。★は2番目＝「賛成する」。"}, {"no": 48, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "この町の秋の行事＿＿＿　＿＿＿　★　＿＿＿　、やはり神社の祭りだろう。", "o": ["多くの人が", "といえば", "真っ先に", "思い浮かべるのは"], "a": 3, "x": "正しい語順：といえば→多くの人が→真っ先に→思い浮かべるのは。★は3番目＝「真っ先に」。"}, {"no": 49, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "彼は＿＿＿　＿＿＿　＿＿＿　★　、地域の安全を守ってきた。", "o": ["として", "三十年以上", "消防団の", "一員"], "a": 2, "x": "正しい語順：消防団の→一員→として→三十年以上。★は4番目＝「三十年以上」。"}, {"no": 50, "sec": "言語知識", "qt": "bunpo-text", "pid": "E4-P1", "q": "（50）", "o": ["ところが", "そのうえ", "そこで", "つまり"], "a": 1, "x": "廃止案が示されたのに反対が起きた、という予想と反する展開なので逆接の「ところが」が入る。"}, {"no": 51, "sec": "言語知識", "qt": "bunpo-text", "pid": "E4-P1", "q": "（51）", "o": ["たとえば", "しかも", "むしろ", "ただし"], "a": 2, "x": "前に挙げた不便な点にさらに別の点を付け加えているので、添加を表す「しかも」が入る。"}, {"no": 52, "sec": "言語知識", "qt": "bunpo-text", "pid": "E4-P1", "q": "（52）", "o": ["ところが", "たとえば", "そこで", "また"], "a": 3, "x": "不便な点が分かったことを受けて対策を取ったという流れなので、「そこで」が入る。"}, {"no": 53, "sec": "言語知識", "qt": "bunpo-text", "pid": "E4-P1", "q": "（53）", "o": ["ものではない", "はずがない", "ことはない", "わけではない"], "a": 4, "x": "利用者は増えたが全部が解決したとは言えない、という部分否定なので「わけではない」が入る。"}, {"no": 54, "sec": "言語知識", "qt": "bunpo-text", "pid": "E4-P1", "q": "（54）", "o": ["に違いない", "わけがない", "どころではない", "おそれがある"], "a": 1, "x": "経験がきっと力になるという強い推量なので「に違いない」が入る。他は否定的な意味になり合わない。"}, {"no": 55, "sec": "読解", "qt": "dokkai-short", "pid": "E4-P2", "q": "新しい予約の仕組みについて、この文章から分かることは何か。", "o": ["インターネットで予約するには、その前に窓口での手続きが必要である。", "来月から、窓口と電話での予約はできなくなる。", "身分証明書があれば、登録しなくてもインターネットで予約できる。", "空いている日を確かめられるのは、窓口に来た人だけである。"], "a": 1, "x": "初めて利用する人は窓口で登録が必要だと書かれている。窓口と電話での予約も続くので2は誤り。"}, {"no": 56, "sec": "読解", "qt": "dokkai-short", "pid": "E4-P3", "q": "筆者の考えに合うものはどれか。", "o": ["店の数が減ったことは、商店街にとって残念なことだ。", "商店街は変化しながら続いていくことが大切だ。", "昔からの店を守るために、新しい店は必要ない。", "商店街の見た目を整えることが今後の課題だ。"], "a": 2, "x": "最後の一文に、大切なのは変わり続けられることだとある。数が減ったことを残念だとは述べていない。"}, {"no": 57, "sec": "読解", "qt": "dokkai-short", "pid": "E4-P4", "q": "このお知らせで最も伝えたいことは何か。", "o": ["資源ごみを出す時間が朝八時までに変わったこと", "道路工事のため、九月は資源ごみが集められないこと", "九月だけ資源ごみの収集日が変わること", "十月から収集日が第一・第三水曜日になること"], "a": 3, "x": "九月に限り収集日が変わり、十月からは元に戻ると書かれている。時間は変わらない。"}, {"no": 58, "sec": "読解", "qt": "dokkai-short", "pid": "E4-P5", "q": "筆者は、図書館の価値についてどのように述べているか。", "o": ["多くの本をそろえていることに価値がある。", "調べ物の相談に乗ることが最も重要な役割である。", "本を借りる場所としての役割は、すでに終わっている。", "その地域にしかない記録を守れることに価値がある。"], "a": 4, "x": "その土地にしかない記録を守れるのは図書館だけだと述べ、本の数だけでは価値は測れないと結んでいる。"}, {"no": 59, "sec": "読解", "qt": "dokkai-short", "pid": "E4-P6", "q": "筆者が最も言いたいことは何か。", "o": ["アンケートの結果は、全体の数字を見れば十分に分かる。", "住みやすいと答えた人が増えたことを、まず喜ぶべきだ。", "一つ一つの回答に表れた不便の声を、次の計画に生かすべきだ。", "バスの本数を増やすことが、市の最も急ぐべき課題である。"], "a": 3, "x": "最後の一文で、全体の数字だけで安心せず個々の声を読み取ることが必要だと述べている。"}, {"no": 60, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P7", "q": "参加者が少ない理由について、役員たちはどう考えていたか。", "o": ["若い世帯が訓練の内容を難しいと感じているから", "訓練の時間帯や内容に問題があるから", "訓練があることが住民に知られていないから", "掲示板や回覧板が使われなくなっているから"], "a": 2, "x": "役員の間では、日曜の午前という時間や、毎年同じ内容が原因ではないかという意見が出ていた。3は実際に聞いて初めて分かったこと。"}, {"no": 61, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P7", "q": "今年、参加者が増えたのはなぜか。", "o": ["知らせ方を増やし、参加しやすさを具体的に伝えたから", "訓練の時間を日曜の午前から変えたから", "訓練の内容を毎年変えることにしたから", "小さな子どものいる家族を特別に招いたから"], "a": 1, "x": "メールでの連絡を加え、一時間で終わることや途中参加ができることを具体的に書いたと述べられている。"}, {"no": 62, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P7", "q": "筆者が防災訓練で最も大切だと考えていることは何か。", "o": ["消火器の使い方を正しく覚えること", "決められた広場まで早く避難できるようになること", "参加者の数を毎年増やしていくこと", "いざというときに助け合える住民同士の関係をつくること"], "a": 4, "x": "最後の段落で、声をかけ合える相手を知っておくことこそ本当の備えだと述べている。"}, {"no": 63, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P8", "q": "手続きをインターネットでできるようにすることの利点として、筆者は何を挙げているか。", "o": ["窓口に行く時間を取りにくい人の負担が減ること", "市役所の職員の数を減らすことができること", "手続きにかかる費用が安くなること", "書類の書き方を間違える人が減ること"], "a": 1, "x": "第一段落に、平日の昼間に休みを取りにくい人の負担が軽くなるとある。職員を減らすことは利点として述べていない。"}, {"no": 64, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P8", "q": "以前より不便になることさえあるとあるが、それはどのような場合か。", "o": ["インターネットでの手続きが複雑になった場合", "窓口の受付時間が短くなった場合", "機器を使えない人がいるのに、窓口の職員が減らされた場合", "住民票の請求がインターネットだけに限られた場合"], "a": 3, "x": "第二段落に、操作に慣れていない人がいるのに便利になったからと職員が減らされる場合が挙げられている。"}, {"no": 65, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P8", "q": "筆者の考えに最も近いものはどれか。", "o": ["窓口での手続きは、いずれなくしていくべきだ。", "画面と窓口の両方を用意し、住民が選べるようにすべきだ。", "福祉の相談も、画面を通して行えるようにすべきだ。", "インターネットでの手続きは、若い人だけが使えばよい。"], "a": 2, "x": "最終段落で、大切なのは窓口をなくすことではなく選べるようにすることだと述べている。"}, {"no": 66, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P9", "q": "筆者の同級生が店を続けているのはなぜか。", "o": ["十分な利益が出ているから", "近所の人が立ち寄り、話をする場所になっているから", "行政から取り壊しの費用の助けを受けられるから", "空き家をとても安く借りることができたから"], "a": 2, "x": "もうかるかと聞かれて首を横に振りながらも、お年寄りが次々と立ち寄るから続けていると述べられている。"}, {"no": 67, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P9", "q": "意味がまるで違うとあるが、どういうことか。", "o": ["空き家を壊す費用と、店を開く費用は大きく違うということ", "行政の対策と住民の活動とは、目的がまったく反対だということ", "空き家の数を減らすことと、人の集まる場所をつくることとは別のことだということ", "家の持ち主と借り手とでは、空き家に対する考え方が違うということ"], "a": 3, "x": "家が一軒減ることと人が集まる場所が一つ増えることを比べており、その二つは別のことだと述べている。"}, {"no": 68, "sec": "読解", "qt": "dokkai-mid", "pid": "E4-P9", "q": "筆者は空き家の問題をどのようにとらえ直したか。", "o": ["建物をどう管理していくかという問題としてとらえ直した。", "遠くに住む家族の責任の問題としてとらえ直した。", "行政の支援が足りないという問題としてとらえ直した。", "人が集まる場所が失われていくという問題としてとらえ直した。"], "a": 4, "x": "家の問題として見ていた自分に気づき、失われるのは誰かと話すための場所だと述べている。"}, {"no": 69, "sec": "読解", "qt": "dokkai-compare", "pid": "E4-P10", "q": "地域の行事について、AとBが共通して述べていることは何か。", "o": ["住民が中心になって運営することが望ましい。", "行政が費用を全額負担すべきである。", "行事の数は少しずつ減らしていくべきである。", "担い手の高齢化が最大の問題である。"], "a": 1, "x": "Aは住民が自分たちの手で運営してこそ意味があると述べ、Bも住民の運営を望ましいと認めている。"}, {"no": 70, "sec": "読解", "qt": "dokkai-compare", "pid": "E4-P10", "q": "行政の関わり方について、AとBはどのように述べているか。", "o": ["Aは費用の負担が必要だと述べ、Bは場所を貸すだけでよいと述べている。", "Aは行政が計画を立てるべきだと述べ、Bは住民に任せるべきだと述べている。", "Aは目立たない支援にとどめるべきだと述べ、Bは地域の力を見て足りない分を補うべきだと述べている。", "AもBも、行政は地域の行事に関わるべきではないと述べている。"], "a": 3, "x": "Aは場所や手続きといった目立たない支えを求め、Bはその地域の力に応じて足りない分を補うべきだとしている。"}, {"no": 71, "sec": "読解", "qt": "dokkai-long", "pid": "E4-P11", "q": "説明会でよく起こることとして、筆者は何を挙げているか。", "o": ["担当者が資料を用意しないまま会が始まること", "発言するのは立場のはっきりした一部の人だけであること", "参加者が多すぎて意見を言う時間が足りなくなること", "住民の意見がまったく記録に残されないこと"], "a": 2, "x": "手を挙げるのは強く賛成する人か強く反対する人で、多くの人は一言も発しないまま帰ると述べられている。"}, {"no": 72, "sec": "読解", "qt": "dokkai-long", "pid": "E4-P11", "q": "誰も望んでいなかった結末とは、どのようなことか。", "o": ["住民の意見が一つにまとまってしまうこと", "説明会の回数が増えすぎてしまうこと", "反対が多いと受け取られ、計画そのものが止められること", "行政が住民の意見を聞かずに計画を進めてしまうこと"], "a": 3, "x": "立場のはっきりした人だけが残った結果、行政が反対が多いと受け取り計画を止めてしまうことを指している。"}, {"no": 73, "sec": "読解", "qt": "dokkai-long", "pid": "E4-P11", "q": "筆者が考える合意とはどのようなものか。", "o": ["全員が同じ意見になり、反対する人がいなくなること", "多数決によって、より多くの人が賛成する案を選ぶこと", "行政が住民の要望をすべて計画に取り入れること", "自分の言ったことが決まったもののどこかに残っていると感じられること"], "a": 4, "x": "最終段落で、合意とは全員が同じ意見になることではなく、自分の言ったことが残っていると感じられることだと述べている。"}, {"no": 74, "sec": "読解", "qt": "dokkai-info", "pid": "E4-P12", "q": "ワンさんは市内の会社に勤めている28歳である。時間が取れるのは土曜日の午前中だけで、費用のかからないものに参加したいと考えている。ワンさんが申し込める講座はどれか。", "o": ["A", "B", "C", "D"], "a": 1, "x": "Aは土曜の午前で費用も無料、対象もどなたでもなので参加できる。Bは65歳以上、Cは午後までかかり費用も必要、Dは日曜で対象も合わない。"}, {"no": 75, "sec": "読解", "qt": "dokkai-info", "pid": "E4-P12", "q": "この案内の内容と合っているものはどれか。", "o": ["四つの講座は、どれも電話で申し込むことができる。", "費用がかかる講座は、当日会場で支払う。", "定員を超えた場合は、申し込んだ順に参加できる人が決まる。", "どの講座も、申込の締め切りは9月中である。"], "a": 2, "x": "注意の欄に費用は当日会場で支払うとある。申込方法はBが窓口、Cはホームページで、定員を超えた場合は抽選、Cの締め切りは10月3日である。"}], "5": [{"no": 1, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "大雨が続いたため、山あいの畑は大きな[[損害]]を受けた。", "o": ["そうがい", "そんかい", "そんがい", "そうかい"], "a": 3, "x": "「損害」は「そんがい」と読む。「損」は「そん」、「害」は「がい」と濁って読む。"}, {"no": 2, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "朝の冷たい空気が肌を[[刺激]]して、目がすっかりさめた。", "o": ["しげき", "しけき", "じげき", "しげぎ"], "a": 1, "x": "「刺激」は「しげき」と読む。「刺」は「し」、「激」は「げき」で、二字目が濁ることに注意する。"}, {"no": 3, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "旅先で足をくじいてしまい、近くの病院で[[治療]]を受けた。", "o": ["ちりょ", "じりょう", "ちりゅう", "ちりょう"], "a": 4, "x": "「治療」は「ちりょう」と読む。「療」は「りょう」と長く伸ばす拗音であることに注意する。"}, {"no": 4, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "海岸には流れ着いたガラスの[[破片]]が落ちていて、危なかった。", "o": ["ばへん", "はへん", "はべん", "はぺん"], "a": 2, "x": "「破片」は「はへん」と読む。「破」は「は」、「片」は「へん」で、どちらも濁らない。"}, {"no": 5, "sec": "言語知識", "qt": "kanji-read", "pid": "", "q": "この島は雨が少なく、水の資源が[[乏しい]]。", "o": ["とほしい", "どぼしい", "とぼしい", "とうぼしい"], "a": 3, "x": "「乏しい」は「とぼしい」と読む。数や量が足りないという意味の形容詞である。"}, {"no": 6, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "けがの回復は[[じゅんちょう]]で、来週からまた山を歩けそうだ。", "o": ["準調", "順調", "純調", "順長"], "a": 2, "x": "「じゅんちょう」は「順調」と書く。物事が順序よく進む様子を表す。「準」「純」「長」は使わない。"}, {"no": 7, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "秋の山はもみじが[[あざやか]]で、写真を撮る人が絶えない。", "o": ["明やか", "彩やか", "鮮やか", "新やか"], "a": 3, "x": "「あざやか」は「鮮やか」と書く。「鮮」は新鮮の「鮮」と同じ字である。"}, {"no": 8, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "この氷河は[[えいきゅう]]に残るものではなく、少しずつとけている。", "o": ["永久", "氷久", "永休", "氷休"], "a": 1, "x": "「えいきゅう」は「永久」と書く。「永」は永遠の「永」、「久」は久しぶりの「久」である。「氷」と書かないよう注意する。"}, {"no": 9, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "決められた登山道以外を歩くのは、公園の規則[[いはん]]になる。", "o": ["違判", "偉反", "偉判", "違反"], "a": 4, "x": "「いはん」は「違反」と書く。「違」は違うの「違」、「反」は反対の「反」である。「偉」「判」は使わない。"}, {"no": 10, "sec": "言語知識", "qt": "kanji-write", "pid": "", "q": "祖母の[[かいご]]をしながら、月に一度は近くの温泉に出かけている。", "o": ["介穫", "看護", "介護", "看穫"], "a": 3, "x": "「かいご」は「介護」と書く。「看護」は「かんご」と読み、別の語なので区別する。"}, {"no": 11, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "この薬は効き目が強い分、（　　）作用にも注意が必要だ。", "o": ["逆", "副", "反", "裏"], "a": 2, "x": "「副作用」で、主な働きのほかに現れる望ましくない働きを表す。「副大臣」「副社長」なども同じ使い方。"}, {"no": 12, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "飛行機の窓から見ると、雲が帯（　　）に長くのびていた。", "o": ["風", "式", "状", "形"], "a": 3, "x": "「帯状」で、帯のような形を表す。「粉状」「らせん状」なども同じ使い方。"}, {"no": 13, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "体調が悪いときの登山は、体に（　　）必要な負担をかける。", "o": ["不", "未", "非", "無"], "a": 1, "x": "「不必要」で、必要でないことを表す。「不合格」「不便」なども同じ使い方。"}, {"no": 14, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "台風でこわれた登山道は、来年の春に（　　）整備される予定だ。", "o": ["新", "改", "復", "再"], "a": 4, "x": "「再整備」で、もう一度整備することを表す。「再調査」「再利用」なども同じ使い方。"}, {"no": 15, "sec": "言語知識", "qt": "goi-form", "pid": "", "q": "この市の健康診断の受診（　　）は、昨年より五ポイント上がった。", "o": ["度", "率", "性", "力"], "a": 2, "x": "「受診率」で、全体のうち診察を受けた人の割合を表す。「合格率」「成功率」なども同じ使い方。"}, {"no": 16, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "この島には、ほかの場所では見られない（　　）の植物が育っている。", "o": ["専属", "独特", "限定", "孤立"], "a": 2, "x": "「独特」は、そのものだけが持っている性質を表す。「専属」は所属、「限定」は数や範囲の制限、「孤立」は他から離れることで、いずれも合わない。"}, {"no": 17, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "日ごろの練習の成果を（　　）して、彼はマラソン大会で三位に入った。", "o": ["表現", "公開", "発揮", "明示"], "a": 3, "x": "「発揮」は、持っている力を十分に外に出すこと。「表現」は気持ちを表すこと、「公開」は広く見せること、「明示」ははっきり示すことで、力については使わない。"}, {"no": 18, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "山を歩くときは、動きやすい（　　）で参加してください。", "o": ["格好", "容姿", "様子", "姿勢"], "a": 1, "x": "「格好」は服装や身なりのこと。「容姿」は顔立ちや体つき、「様子」はありさま、「姿勢」は体の構えを表し、服装の意味にはならない。"}, {"no": 19, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "夜おそくまで花火をする観光客に、近所から（　　）が寄せられた。", "o": ["悪口", "皮肉", "反論", "苦情"], "a": 4, "x": "「苦情」は、迷惑を受けた人が伝える不満のこと。「悪口」は人を悪く言うこと、「皮肉」は遠回しないやみ、「反論」は意見への言い返しで、ここには合わない。"}, {"no": 20, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "午後になって気温が急に（　　）し、山の雪がとけはじめた。", "o": ["増加", "上昇", "向上", "上達"], "a": 2, "x": "「上昇」は、温度や高さなどが上がること。「増加」は数や量が増えること、「向上」は質がよくなること、「上達」は技術が伸びることで、気温には使わない。"}, {"no": 21, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "（　　）して、宿の予約を一日ずらして取ってしまった。", "o": ["うっかり", "すっきり", "ぎっしり", "ぐっすり"], "a": 1, "x": "「うっかり」は、注意が足りず思わず失敗する様子。「すっきり」は気分がさわやかな様子、「ぎっしり」はすきまなく詰まった様子、「ぐっすり」は深く眠る様子を表す。"}, {"no": 22, "sec": "言語知識", "qt": "goi-context", "pid": "", "q": "旅行から帰ったかばんには、おみやげが（　　）つまっていた。", "o": ["さっぱり", "ぼんやり", "ぎっしり", "うっかり"], "a": 3, "x": "「ぎっしり」は、すきまなくいっぱいに詰まっている様子。「さっぱり」はさわやかな様子、「ぼんやり」ははっきりしない様子、「うっかり」は不注意な様子を表す。"}, {"no": 23, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "泳ぎ方の[[テクニック]]を身につけると、長い距離でも体が疲れにくい。", "o": ["知識", "技術", "工夫", "訓練"], "a": 2, "x": "「テクニック」は「技術」に置き換えられる。物事をうまく行うためのわざのこと。「知識」は知っている内容、「工夫」は考えを出すこと、「訓練」は練習を指す。"}, {"no": 24, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "朝は青空が広がっていたのに、昼過ぎから天気が[[一転した]]。", "o": ["少し変わった", "やっと決まった", "急に止まった", "すっかり変わった"], "a": 4, "x": "「一転した」は「すっかり変わった」と言いかえられる。それまでとまったく違う状態になることを表す。"}, {"no": 25, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "[[勝手な]]行動をとると、団体旅行では周りの人に迷惑がかかる。", "o": ["いじわるな", "わがままな", "なさけない", "だらしない"], "a": 2, "x": "「勝手な」は「わがままな」と言いかえられる。自分の都合だけで動く様子を表す。「いじわるな」は人を困らせる、「なさけない」は情けない、「だらしない」はきちんとしていないという意味。"}, {"no": 26, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "彼は診察室で[[うつむいて]]、医師の話を静かに聞いていた。", "o": ["下を向いて", "遠くを見て", "目を閉じて", "腕を組んで"], "a": 1, "x": "「うつむいて」は「下を向いて」と言いかえられる。顔を下に向ける動作を表す。"}, {"no": 27, "sec": "言語知識", "qt": "goi-synonym", "pid": "", "q": "今年は雪が多いと聞いていたので、例年よりも[[用心した]]。", "o": ["落ち着いた", "がんばった", "気をつけた", "よく考えた"], "a": 3, "x": "「用心した」は「気をつけた」と言いかえられる。危険がないように前もって注意することを表す。"}, {"no": 28, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "きっかけ", "o": ["この温泉宿は、料理のきっかけがとてもよいと聞いている。", "毎朝のジョギングは、去年の健康診断の結果がきっかけで始めた。", "山に登る前に、天気のきっかけを確かめておこう。", "疲れのきっかけで、彼は途中で歩くのをやめてしまった。"], "a": 2, "x": "「きっかけ」は、物事が始まる直接の理由や機会のこと。1は「評判」、3は「具合」、4は「せい」が正しい。"}, {"no": 29, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "廃止", "o": ["大雨で、登山道の一部が廃止してしまった。", "この薬は五年前に廃止されて、今は別のものが使われている。", "体調が悪かったので、週末の旅行の予定を廃止した。", "利用者が減ったため、山あいの村を通るバス路線が廃止された。"], "a": 4, "x": "「廃止」は、続いていた制度やしくみをやめること。1は「くずれて」、2は「作られなくなって」、3は「取りやめた」が正しい。"}, {"no": 30, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "中断", "o": ["大雨で川の水が増えたため、川下りのツアーは一時中断された。", "この道は工事のため、車の通行が中断されている。", "彼は三十年勤めた会社を中断して、山の近くで農業を始めた。", "この地域を訪れる観光客の数は、五年間で大きく中断している。"], "a": 1, "x": "「中断」は、続いていた物事が途中で止まること。2は「止められて」、3は「退職して」、4は「減少して」が正しい。"}, {"no": 31, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "妥当", "o": ["彼の泳ぎ方はとても妥当で、水しぶきがほとんど上がらない。", "今日は妥当な天気で、遠くの山までよく見えた。", "専門家は、この旅行にかかる費用の見積もりを妥当だと判断した。", "この宿の一泊の値段は妥当に安いので、すぐに予約が埋まる。"], "a": 3, "x": "「妥当」は、判断や内容が無理なく適切であること。1は「きれい」、2は「よい」、4は「非常に」が正しい。"}, {"no": 32, "sec": "言語知識", "qt": "goi-usage", "pid": "", "q": "頑固", "o": ["この山道は頑固で、大雨が降ってもくずれない。", "祖父は頑固で、医者に止められても毎朝の山歩きをやめない。", "彼女は頑固に練習を重ね、ついに富士山に登りきった。", "今年の冬は頑固な寒さが続き、湖が全面的にこおった。"], "a": 2, "x": "「頑固」は、自分の考えを変えようとしない性格を表す。1は「じょうぶ」、3は「地道に」、4は「きびしい」が正しい。"}, {"no": 33, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "山頂は風が強く、立っていること（　　）難しかった。", "o": ["こそ", "ほど", "すら", "ばかり"], "a": 3, "x": "「すら」は極端な例を挙げて、それさえもできないと強調する。立つという簡単なことも難しかったという意味になる。"}, {"no": 34, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "今年（　　）、前から行きたかった屋久島の森を歩いてみたい。", "o": ["こそ", "ばかり", "ほど", "きり"], "a": 1, "x": "「こそ」は前の語を強く取り立てる。今年は必ず、という強い気持ちを表す。"}, {"no": 35, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "天気（　　）よければ、山頂から遠くの海まで見えるはずだ。", "o": ["ほど", "まで", "のみ", "さえ"], "a": 4, "x": "「〜さえ〜ば」は、それだけが条件であることを表す。天気という一つの条件がそろえばよいという意味になる。"}, {"no": 36, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "十分な準備をせずに冬山に入るのは、大きな事故につながり（　　）。", "o": ["かねる", "かねない", "がたい", "えない"], "a": 2, "x": "「〜かねない」は、よくないことが起こる可能性があることを表す。「かねる」は「できない」の意味で反対になる。"}, {"no": 37, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "三月（　　）、今日はずいぶん暖かく、上着がいらないほどだ。", "o": ["にしては", "にとっては", "によっては", "にあたっては"], "a": 1, "x": "「〜にしては」は、その基準から予想されることと違う様子を表す。三月なのに暖かすぎるという意味になる。"}, {"no": 38, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "（　　）九月に雪が降るとは、地元の人も思っていなかった。", "o": ["まるで", "いかにも", "まさか", "たとえ"], "a": 3, "x": "「まさか〜ない」は、そんなことは起こるはずがないという強い驚きを表す。文末の否定と呼応する。"}, {"no": 39, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "登ると決めた（　　）、途中であきらめずに歩き通したい。", "o": ["ところで", "からには", "につれて", "とともに"], "a": 2, "x": "「〜からには」は、そうすると決めた以上は当然こうするという話し手の決意を表す。"}, {"no": 40, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "私が登ったのは、あの山のふもとにある小さな丘（　　）。", "o": ["に違いない", "にきまっている", "どころではない", "にすぎない"], "a": 4, "x": "「〜にすぎない」は、たいしたものではないと低く評価する言い方。小さな丘でしかないという意味になる。"}, {"no": 41, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "台風が近づいてきたため、楽しみにしていた登山は中止せ（　　）。", "o": ["るほかなかった", "ずにはおかなかった", "ないではいられなかった", "ざるを得なかった"], "a": 4, "x": "「〜ざるを得ない」は、したくないが、そうするしかないことを表す。「中止せ」に続く形は「ざるを得なかった」である。"}, {"no": 42, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "雨が少ない日が続き、この湖の水位は下がる（　　）。", "o": ["ものだ", "一方だ", "次第だ", "ばかりか"], "a": 2, "x": "「〜一方だ」は、ある方向へ変化が進み続けることを表す。下がり続けているという意味になる。"}, {"no": 43, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "山小屋の方が道を教えてくれた（　　）、迷わずに頂上に着けた。", "o": ["おかげで", "せいで", "くせに", "わりに"], "a": 1, "x": "「〜おかげで」は、よい結果になった原因を表す。「せいで」は悪い結果の原因に使う。"}, {"no": 44, "sec": "言語知識", "qt": "bunpo-form", "pid": "", "q": "私は先生ご夫妻を、空港まで車で（　　）ました。", "o": ["お迎えになり", "ご迎えし", "お迎えし", "お迎えられ"], "a": 3, "x": "自分の動作をへりくだって言う謙譲語は「お〜する」の形になるので、「お迎えしました」が正しい。「お迎えになる」は尊敬語で、先生の動作に使う。"}, {"no": 45, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "友人から、＿＿＿　＿＿＿　★　＿＿＿　、一度行ってみたくなった。", "o": ["湖が", "あるという", "山の中に", "話を聞いて"], "a": 2, "x": "正しい語順：山の中に→湖が→あるという→話を聞いて。★は3番目＝「あるという」。"}, {"no": 46, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "この地方の景色は、＿＿＿　★　＿＿＿　＿＿＿　まったく違って見える。", "o": ["よって", "季節に", "光も", "色も"], "a": 1, "x": "正しい語順：季節に→よって→色も→光も。★は2番目＝「よって」。"}, {"no": 47, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "たとえ出発のときに＿＿＿　＿＿＿　★　＿＿＿　油断してはいけない。", "o": ["天気が", "山の上では", "よかった", "としても"], "a": 4, "x": "正しい語順：天気が→よかった→としても→山の上では。★は3番目＝「としても」。"}, {"no": 48, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "この土地の＿＿＿　＿＿＿　＿＿＿　★　思い出す人が多いだろう。", "o": ["いえば", "名物と", "温泉を", "まず"], "a": 3, "x": "正しい語順：名物と→いえば→まず→温泉を。★は4番目＝「温泉を」。"}, {"no": 49, "sec": "言語知識", "qt": "bunpo-compose", "pid": "", "q": "この森は、＿＿＿　★　＿＿＿　＿＿＿　多くの人に親しまれている。", "o": ["場所として", "地元の", "野鳥を", "観察できる"], "a": 4, "x": "正しい語順：野鳥を→観察できる→場所として→地元の。★は2番目＝「観察できる」。"}, {"no": 50, "sec": "言語知識", "qt": "bunpo-text", "pid": "E5-P1", "q": "（50）", "o": ["そこで", "ところが", "しかも", "つまり"], "a": 2, "x": "二時間で着くと考えていたことと、三十分で息が上がったこととが反対の内容なので、逆接の「ところが」が入る。"}, {"no": 51, "sec": "言語知識", "qt": "bunpo-text", "pid": "E5-P1", "q": "（51）", "o": ["しかも", "ところが", "それとも", "たとえば"], "a": 1, "x": "ひざの痛みに加えて荷物の重さという困ったことを付け加えているので、添加を表す「しかも」が入る。"}, {"no": 52, "sec": "言語知識", "qt": "bunpo-text", "pid": "E5-P1", "q": "（52）", "o": ["しかし", "それでも", "そこで", "ところが"], "a": 3, "x": "体力の落ち方に驚いたので歩くことにした、という流れである。前の内容を受けて対策をとることを表す「そこで」が入る。"}, {"no": 53, "sec": "言語知識", "qt": "bunpo-text", "pid": "E5-P1", "q": "（53）", "o": ["に違いない", "どころではない", "にすぎない", "わけではない"], "a": 4, "x": "後に「しかし」が続き、別のよい変化が述べられているので、部分的に打ち消す「わけではない」が入る。"}, {"no": 54, "sec": "言語知識", "qt": "bunpo-text", "pid": "E5-P1", "q": "（54）", "o": ["わけがない", "ものだ", "はずがない", "どころではない"], "a": 2, "x": "一般的にそういうものだという筆者の実感を述べているので、「ものだ」が適切である。"}, {"no": 55, "sec": "読解", "qt": "dokkai-short", "pid": "E5-P2", "q": "木の下の落ち葉を残したほうがよいのは、なぜか。", "o": ["見た目が自然で美しくなるから", "土の水分を保ち、木の栄養にもなるから", "小さな生き物を集めることができるから", "掃除にかかる手間を減らせるから"], "a": 2, "x": "落ち葉は土の水分の蒸発を防ぎ、分解されて木の栄養になると述べられている。"}, {"no": 56, "sec": "読解", "qt": "dokkai-short", "pid": "E5-P3", "q": "筆者が写真を撮るのをやめて気づいたことは何か。", "o": ["写真を撮らないほうが、旅の記憶が強く残るということ", "写真を撮ると、よい構図の作品ができるということ", "旅の記憶は時間がたてば必ず薄れてしまうということ", "旅先では写真より地図のほうが役に立つということ"], "a": 1, "x": "写真を撮らなくなったことで、音やにおいまで思い出せるようになったと述べている。"}, {"no": 57, "sec": "読解", "qt": "dokkai-short", "pid": "E5-P4", "q": "このトレーナーの考えに合うのはどれか。", "o": ["運動が続かないのは、意志が弱いからである。", "毎日必ず走る時間を決めておくべきである。", "まず始めやすい小さな目標を立てるとよい。", "五分間の運動を毎日続けることが最も大切だ。"], "a": 3, "x": "外に出るだけという小さな目標から始めればよいと勧めている。"}, {"no": 58, "sec": "読解", "qt": "dokkai-short", "pid": "E5-P5", "q": "筆者の考えに合うのはどれか。", "o": ["朝食は健康のために必ずとるべきだ。", "夜おそい時間の食事は絶対に避けなければならない。", "食事の回数はできるだけ減らしたほうがよい。", "食習慣は人によって違ってよく、一日全体の調整が大切だ。"], "a": 4, "x": "一日全体の量と間隔を整えることが大切で、食習慣は人それぞれでよいと述べている。"}, {"no": 59, "sec": "読解", "qt": "dokkai-short", "pid": "E5-P6", "q": "ガイドの説明によると、山で気をつけなければならないのはどんなことか。", "o": ["平地よりも雲の量が多いこと", "天気の変化が早く現れるので、判断を遅らせないこと", "斜面では風の向きが分かりにくいこと", "雨が降る前には必ず空が暗くなること"], "a": 2, "x": "山では変化が早く現れるため、引き返す判断を遅らせないことが大切だと述べられている。"}, {"no": 60, "sec": "読解", "qt": "
