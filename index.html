<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おぼえるドリル</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おぼえるドリル">
<style>
:root{--navy:#1F3864;--red:#C45911;--bg:#f5f6fa;--card:#fff;--fg:#1b1f2a;--sub:#5a6272;--line:#d9dde6;--ok:#2e7d32;--ng:#c62828;--weak:#c62828;--mid:#d98a00;--good:#2e7d32}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--fg:#e8ebf2;--sub:#a3acc0;--line:#2e3650;--navy:#8fb0ff;--red:#ff9a5c;--ok:#66bb6a;--ng:#ef5350;--weak:#ef5350;--mid:#ffb74d;--good:#66bb6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 -apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
h1{font-size:22px;margin:6px 0;color:var(--navy)} h2{font-size:18px;margin:0 0 6px;color:var(--navy)}
rt{font-size:.55em}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:2px solid var(--navy);border-radius:12px;background:var(--card);color:var(--navy);font:inherit;font-weight:700;text-align:center;cursor:pointer}
.btn.pri{background:var(--navy);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{display:inline-block;width:auto;padding:6px 14px;margin:2px;font-size:15px}
.btn:disabled{opacity:.45}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
label{display:block;margin:10px 0 2px;font-weight:700}
.sub{color:var(--sub);font-size:15px}
.bar{height:16px;background:var(--line);border-radius:8px;position:relative;overflow:visible;margin:4px 0 2px}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--good)}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--red)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{display:inline-block;padding:0 8px;border-radius:8px;font-size:13px;font-weight:700;color:#fff}
.t0{background:#8a93a6}.t1{background:var(--weak)}.t2{background:var(--mid)}.t3{background:var(--good)}
.q{font-size:20px;line-height:2;margin:10px 0;min-height:60px}
.ch{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;font-size:19px;cursor:pointer;user-select:none}
.ch.ok{border-color:var(--ok);background:rgba(46,125,50,.15)} .ch.ng{border-color:var(--ng);background:rgba(198,40,40,.13)}
.fb{font-weight:700;font-size:18px;margin:8px 0}
.prog{height:8px;background:var(--line);border-radius:4px;margin:6px 0}.prog>i{display:block;height:100%;background:var(--red);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
[lang=vi],[lang=ne],[lang=en]{font-family:"Segoe UI","Noto Sans","Nirmala UI",-apple-system,sans-serif}
.warn{border-color:var(--red);background:rgba(196,89,17,.1)}
.err{color:var(--ng);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
var DATA = [{"id": "B-3_2-001", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "「庭」の書き順はちょっと難しいです。私が黒板に書い（　）るから、同じように書いてください。", "a": "てみせ", "w": ["みせ", "てみる", "ておき"], "x": {"ja": "「〜てみせる」は「やって見せる」という意味。先生が書いて、学生に見せている。「てみる」は「試す」で、意味がちがう。", "en": "「〜てみせる」 means to do something to show someone. The speaker will write it as a demonstration. 〜てみる means to try, which does not fit.", "ne": "「〜てみせる」 को अर्थ कसैलाई गरेर देखाउनु हो। यहाँ लेखेर देखाउने कुरा छ। 〜てみる (प्रयास गर्नु) मिल्दैन।", "vi": "「〜てみせる」 nghĩa là làm cho người khác xem. Ở đây người nói viết mẫu. 〜てみる (thử) không hợp.", "zh": "「〜てみせる」意为做给别人看。这里是写示范给对方看。「〜てみる」(试着做)不合适。"}}, {"id": "B-3_2-002", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "勤めていた会社が倒産したのを（　）独立することにしました。", "a": "{契機|けいき}に", "w": ["{契機|けいき}で", "をもとに", "のもとで"], "x": {"ja": "「〜を契機に」は「〜をきっかけに」という意味。会社の倒産が、独立のきっかけになった。「を」を使うので「契機で」は不自然だ。", "en": "「〜を契機に」 (=as an opportunity) means 〜をきっかけに. The company’s bankruptcy triggered the decision. 契機で is not natural.", "ne": "「〜を契機に」 (=अवसरको रूपमा) को अर्थ 〜をきっかけに हो। कम्पनी डुब्नु नै स्वतन्त्र हुने कारण बन्यो। 契機で अस्वाभाविक छ।", "vi": "「〜を契機に」 (=nhân cơ hội) nghĩa là 〜をきっかけに. Việc công ty phá sản là cơ hội để tự lập. 契機で không tự nhiên.", "zh": "「〜を契機に」(=以……为契机)即「〜をきっかけに」。公司倒闭成了独立的契机。「契機で」不自然。"}}, {"id": "B-3_2-003", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "A：クラシックはあんまり聴かない？\nB：聴かない（　）けど、そんなには。日本のポップスが多いかな。", "a": "こともない", "w": ["に沿って", "にしろ", "てほしいものだ"], "x": {"ja": "「〜ないこともない」は「少しはある」という弱い肯定。「聴かないこともないけど」=「聴くこともある」。「にしろ」などは意味が合わない。", "en": "「〜ないこともない」 (=not that I never do) is a soft affirmation: “I do sometimes.” Other choices do not fit the meaning.", "ne": "「〜ないこともない」 (=नगर्ने होइन भन्ने) हल्का सकारात्मक अर्थ हो: “कहिलेकाहीँ सुन्छु”। अन्य विकल्प मिल्दैनन्।", "vi": "「〜ないこともない」 (=không phải là không) là khẳng định nhẹ: “thỉnh thoảng cũng nghe”. Các lựa chọn khác không hợp nghĩa.", "zh": "「〜ないこともない」(=并非不……)是委婉的肯定,意为“偶尔也听”。其他选项意思不合。"}}, {"id": "B-3_2-004", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "太陽光発電（　）、風力発電（　）、自然のエネルギーから電気をつくっているんです。※（　）には同じ言葉が入ります。", "a": "にしろ", "w": ["に沿って", "こともない", "だけのことはあって"], "x": {"ja": "「AにしろBにしろ」は「AでもBでも」という意味。同じ言葉を2回使う。太陽光も風力も自然エネルギーだ。", "en": "「AにしろBにしろ」 (=whether A or B) means “both A and B.” The same word is used twice: solar and wind are both natural energy.", "ne": "「AにしろBにしろ」 (=A होस् वा B) को अर्थ “A पनि B पनि” हो। एउटै शब्द दुई पटक आउँछ।", "vi": "「AにしろBにしろ」 (=dù là A hay B) nghĩa là “cả A lẫn B”. Dùng cùng một từ hai lần.", "zh": "「AにしろBにしろ」(=无论A还是B)意为“A也好B也好”。同一个词用两次。"}}, {"id": "B-3_2-005", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "せっかくですが、この仕事はお（　）かねます。", "a": "引き受け", "w": ["引き受けて", "引き受けた", "引き受けられ"], "x": {"ja": "「〜かねる」は「〜することができない」という意味。「お＋ます形の語幹＋かねる」で「お引き受けしかねます」となる。「せっかくですが」と合う。", "en": "「〜かねる」 (=cannot / hard to) means “unable to do.” The form is お＋stem＋かねます: お引き受けしかねます. It matches “せっかくですが.”", "ne": "「〜かねる」 (=गर्न सकिँदैन) को अर्थ “गर्न नसक्नु”। お＋stem＋かねます रूप: お引き受けしかねます।", "vi": "「〜かねる」 (=khó mà, không thể) nghĩa là “không thể làm”. Dạng お＋thân động từ＋かねます: お引き受けしかねます.", "zh": "「〜かねる」(=难以、无法)意为“不能做”。形式为「お+动词词干+かねます」:お引き受けしかねます。"}}, {"id": "B-3_2-006", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "すばらしいマンションだ。（　）だけのことはある。", "a": "家賃が高い", "w": ["駅から近い", "静かだ", "新しい"], "x": {"ja": "「〜だけのことはある」は「〜だから、すばらしいのは当然だ」という意味。家賃が高いから、すばらしいマンションなのは当然だ。", "en": "「〜だけのことはある」 (=living up to) means “it is natural that it is great because of ...”. The rent is high, so the great apartment is no surprise.", "ne": "「〜だけのことはある」 (=को योग्य) को अर्थ “… भएकाले राम्रो हुनु स्वाभाविक”। भाडा महँगो छ, त्यसैले राम्रो अपार्टमेन्ट हुनु स्वाभाविक।", "vi": "「〜だけのことはある」 (=xứng đáng với) nghĩa là “vì … nên tốt là đương nhiên”. Tiền thuê cao nên chung cư tuyệt vời cũng dễ hiểu.", "zh": "「〜だけのことはある」(=不愧是)意为“因为……所以出色是理所当然的”。房租高,公寓出色也就不奇怪。"}}, {"id": "B-3_2-007", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "政治家には、もう少し国民の気持ちをわか（　）。", "a": "ってほしいものだ", "w": ["ることもない", "りかねる", "るに限って"], "x": {"ja": "「〜てほしいものだ」は「〜してほしい」という強い願い。政治家に、国民の気持ちをわかってほしいと言っている。", "en": "「〜てほしいものだ」 (=I really wish ...) is a strong wish. The speaker wishes politicians would understand the people.", "ne": "「〜てほしいものだ」 (=… भए हुन्थ्यो) बलियो इच्छा हो। राजनीतिज्ञहरूले जनताको भावना बुझून् भन्ने चाहना।", "vi": "「〜てほしいものだ」 (=ước gì …) là mong muốn mạnh. Người nói mong chính trị gia hiểu cảm xúc của người dân.", "zh": "「〜てほしいものだ」(=真希望……)是强烈的愿望。希望政治家能理解民众的心情。"}}, {"id": "B-3_2-008", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "本日の運動会は（　）に沿って順番に進めていきます。", "a": "プログラム", "w": ["いつもの年", "学年", "年齢"], "x": {"ja": "「〜に沿って」は「〜のとおりに」という意味。プログラムの順番どおりに進める。「プログラム」は決まった流れだから合う。", "en": "「〜に沿って」 (=in line with) means “following.” The event proceeds in the order of the program, which fits.", "ne": "「〜に沿って」 (=… अनुसार) को अर्थ “… अनुरूप”। कार्यक्रमको क्रम अनुसार अगाडि बढ्छ।", "vi": "「〜に沿って」 (=theo) nghĩa là “đúng như”. Tiến hành theo thứ tự của chương trình, nên hợp lý.", "zh": "「〜に沿って」(=按照)意为“依照”。按节目单的顺序进行,所以合适。"}}, {"id": "B-3_2-009", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "（　）、こちらではお答えしかねます。", "a": "それは個人情報ですから", "w": ["この問題はとても易しいので", "担当の者がおりますので", "すぐにお答えできますので"], "x": {"ja": "「〜かねる」は「できない」という意味。個人情報は教えられないから、「お答えしかねます」と言う。理由として自然なのは「個人情報ですから」だ。", "en": "「〜かねる」 (=cannot) means “unable.” Personal information cannot be shared, so the reason “それは個人情報ですから” fits. The other options give reasons to answer.", "ne": "「〜かねる」 (=सकिँदैन) को अर्थ “गर्न नसक्नु”। व्यक्तिगत जानकारी दिन मिल्दैन, त्यसैले “個人情報ですから” मिल्छ।", "vi": "「〜かねる」 (=không thể) nghĩa là “không làm được”. Thông tin cá nhân không thể trả lời, nên “個人情報ですから” hợp lý.", "zh": "「〜かねる」(=无法)意为“不能”。个人信息不能回答,所以「個人情報ですから」合适。"}}, {"id": "B-3_2-010", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "このレストランのサービスは最高だ。さすが（　）だけのことはある。", "a": "有名な", "w": ["有名だったら", "有名で", "有名なら"], "x": {"ja": "「さすが〜だけのことはある」は、名詞や「な」形容詞のあとに「な」を付ける。「有名な」が正しい。「有名な+だけのことはある」の形になる。", "en": "In 「さすが〜だけのことはある」, a な-adjective takes な before だけ. So 有名な is correct. The meaning is “as expected of a famous restaurant.”", "ne": "「さすが〜だけのことはある」 मा な-विशेषणपछि な लाग्छ। त्यसैले 有名な सही हो। अर्थ: “प्रसिद्ध रेस्टुरेन्ट भएकाले अपेक्षित नै।”", "vi": "Trong 「さすが〜だけのことはある」, tính từ な đi với な trước だけ. Nên 有名な đúng. Nghĩa: “đúng là nhà hàng nổi tiếng.”", "zh": "「さすが〜だけのことはある」中,な形容词后接「な」再加だけ,所以「有名な」正确。意为“不愧是有名的餐厅”。"}}, {"id": "B-3_2-011", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "会社の方針（　）、新しいサービスを開発している。", "a": "に沿って", "w": ["にとって", "にかけて", "にかぎって"], "x": {"ja": "「〜に沿って」は「〜のとおりに」という意味。会社の方針を基準にして開発している。「にとって」は「〜の立場では」で意味がちがう。", "en": "「〜に沿って」 (=in line with) means “following.” They develop services following company policy. にとって means “for (someone)” and does not fit.", "ne": "「〜に沿って」 (=… अनुसार)। कम्पनीको नीति अनुसार विकास गरिँदै छ। にとって (…का लागि) मिल्दैन।", "vi": "「〜に沿って」 (=theo) nghĩa là “đúng như”. Phát triển dịch vụ theo phương châm công ty. にとって (đối với) không hợp.", "zh": "「〜に沿って」(=按照)。按公司方针开发新服务。「にとって」(对……来说)不合适。"}}, {"id": "B-3_2-012", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "太郎は練習の厳しさに{耐|た}えかねて、（　）。", "a": "サッカー部を辞めてしまった", "w": ["サッカー部に入りたがっている", "サッカー部の練習が好きになった", "サッカー部のレギュラー選手になった"], "x": {"ja": "「〜かねる(かねて)」は「〜しきれなくて」という意味。練習が厳しすぎて耐えられず、部活をやめた。後ろの文は、その結果になる文を選ぶ。", "en": "「〜かねる(かねて)」 (=unable to ...) means “could not bear.” Taro could not endure the hard practice, so he quit the club. The result must fit.", "ne": "「〜かねる(かねて)」 (=सहन नसकेर) को अर्थ “… गर्न नसकेर”। कडा अभ्यास सहन नसकेर क्लब छाडे। नतिजा मिल्ने वाक्य छान्नुहोस्।", "vi": "「〜かねる(かねて)」 (=không chịu nổi) nghĩa là “không thể chịu được”. Taro không chịu nổi tập luyện khắt khe nên bỏ câu lạc bộ.", "zh": "「〜かねる(かねて)」(=忍受不了)意为“承受不住”。太郎受不了严格的训练,退出了足球部。"}}, {"id": "B-3_2-013", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 3-2", "freq": 0, "q": "彼は日本のニュースにとても{詳|くわ}しい。毎日インターネットで日本語のニュースを（　）だけのことはある。", "a": "読んでいる", "w": ["読む", "読んだ", "読めば"], "x": {"ja": "「〜だけのことはある」の前は、普通形の「〜ている」が合う。毎日読んでいるから、詳しいのは当然だ。続けている努力を表す。", "en": "Before 「〜だけのことはある」, a plain form like 読んでいる fits. He reads every day, so being well-informed is natural. It shows continued effort.", "ne": "「〜だけのことはある」 अघि 読んでいる जस्तो साधारण रूप मिल्छ। हरेक दिन पढ्ने भएकाले जानकार हुनु स्वाभाविक।", "vi": "Trước 「〜だけのことはある」 hợp với thể thường 読んでいる. Ngày nào cũng đọc nên giỏi là đương nhiên.", "zh": "「〜だけのことはある」前面接普通形「読んでいる」。每天都读,所以熟悉是理所当然的。"}}, {"id": "B-4_1-014", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "子供たちは、将来の夢について、{恥|は}ずかしがる（　）発表し合った。", "a": "ことなく", "w": ["なく", "あげく", "として"], "x": {"ja": "「〜ことなく」は「〜しないで」という意味。恥ずかしがらないで発表した。「あげく」は「そのあとで」で、合わない。", "en": "「〜ことなく」 (=without ...ing) means “without doing.” The children presented without feeling shy. あげく does not fit.", "ne": "「〜ことなく」 (=… नगरी) को अर्थ “नगरीकन”। केटाकेटीहरूले लाज नमानी प्रस्तुत गरे। あげく मिल्दैन।", "vi": "「〜ことなく」 (=mà không) nghĩa là “không làm”. Bọn trẻ phát biểu mà không ngại ngùng. あげく không hợp.", "zh": "「〜ことなく」(=不……地)意为“没有……”。孩子们毫不害羞地发表。「あげく」不合适。"}}, {"id": "B-4_1-015", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "彼女も、みんなのリクエスト（　）、一曲歌った。", "a": "にこたえて", "w": ["にむけて", "として", "つつも"], "x": {"ja": "「〜に応えて」は「相手の期待や要求にこたえて」という意味。みんなのリクエストに応えて歌った。「に向けて」は方向で、意味がちがう。", "en": "「〜に応えて」 (=in response to) means answering someone’s request. She sang in response to everyone’s requests. に向けて (toward) does not fit.", "ne": "「〜に応えて」 (=… को जवाफमा) अर्थात् अरूको अनुरोध पूरा गर्दै। सबैको अनुरोध अनुसार गीत गाइन्। に向けて मिल्दैन।", "vi": "「〜に応えて」 (=đáp lại) nghĩa là đáp ứng yêu cầu. Cô ấy hát đáp lại yêu cầu của mọi người. に向けて (hướng tới) không hợp.", "zh": "「〜に応えて」(=响应)意为回应期待或要求。她应大家的请求唱了一首歌。「に向けて」(面向)不合适。"}}, {"id": "B-4_1-016", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "熱が十分に下がらない（　）、外出したりしないでください。", "a": "かぎり", "w": ["に限って", "あげく", "として"], "x": {"ja": "「〜ない限り」は「〜しない間は」という意味。熱が下がらないあいだは、外出しないでと言っている。「に限って」は意味がちがう。", "en": "「〜ない限り」 (=as long as ... not / unless) means “as long as it does not happen.” Do not go out unless the fever goes down. に限って has a different meaning.", "ne": "「〜ない限り」 (=… नभएसम्म) को अर्थ “नभएसम्म”। ज्वरो नघटेसम्म बाहिर नजानुहोस्। に限って फरक अर्थ।", "vi": "「〜ない限り」 (=chừng nào chưa) nghĩa là “chừng nào không…”. Chừng nào sốt chưa hạ thì đừng ra ngoài. に限って nghĩa khác.", "zh": "「〜ない限り」(=只要不……就)意为“在没有……期间”。烧没退之前不要外出。「に限って」意思不同。"}}, {"id": "B-4_1-017", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "A：韓国では、何人かで食事をすると、年上の人が払うのが普通なんだって。B：習慣（　）、いつも払うのは大変そうだなあ。", "a": "とはいうものの", "w": ["あげく", "に限って", "として"], "x": {"ja": "「〜とはいうものの」は「〜と言われるが、でも」という意味。習慣だと言うが、毎回払うのは大変そうだと言っている。前と後ろが逆の内容になる。", "en": "「〜とはいうものの」 (=that said / although) means “it is said ..., but ...”. It is a custom, but always paying seems hard. The two parts contrast.", "ne": "「〜とはいうものの」 (=भने पनि) को अर्थ “… भनिए पनि”। चलन भए पनि हर पटक तिर्नु गाह्रो हुन्छ। अघिल्लो र पछिल्लो भाग विपरीत हुन्छन्।", "vi": "「〜とはいうものの」 (=tuy nói là) nghĩa là “tuy nói vậy nhưng”. Là phong tục, nhưng lúc nào cũng trả thì vất vả. Hai vế trái ngược nhau.", "zh": "「〜とはいうものの」(=虽说)意为“虽然这么说,但是……”。虽是习惯,但总是付钱也挺辛苦。前后内容相反。"}}, {"id": "B-4_1-018", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "彼は（　）あげく、弁護士になるのをあきらめてしまった。", "a": "10年も勉強を続けた", "w": ["妻と相談した", "試験に落ちた", "退職した"], "x": {"ja": "「〜あげく」は「長い時間や努力のあとで、悪い結果になった」という意味。10年勉強を続けたあと、あきらめた。つながる内容はこれだけだ。", "en": "「〜あげく」 (=after all that, in the end) means a bad result after long effort. After studying for 10 years, he gave up. Only this choice fits.", "ne": "「〜あげく」 (=अन्तमा) को अर्थ लामो समय/प्रयासपछि नराम्रो नतिजा। १० वर्ष पढेपछि हार मान्यो। यही विकल्प मिल्छ।", "vi": "「〜あげく」 (=rốt cuộc) nghĩa là sau thời gian dài cố gắng thì kết quả xấu. Học 10 năm rồi cuối cùng bỏ cuộc. Chỉ lựa chọn này hợp.", "zh": "「〜あげく」(=到头来)意为经过长时间努力后得到不好的结果。学了10年,最后放弃了。只有这个选项合适。"}}, {"id": "B-4_1-019", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "つまらない番組だと思いつつ、（　）。", "a": "最後まで見てしまった", "w": ["好きな番組に変えた", "途中で見るのをやめた", "いい番組はほかになかった"], "x": {"ja": "「〜つつ(も)」は「〜ながら、でも」という意味。つまらないと思ったのに、最後まで見た。前と後ろが逆になる文を選ぶ。", "en": "「〜つつ(も)」 (=while / even though) means “even though ...”. He thought it was boring but watched to the end. The two parts contrast.", "ne": "「〜つつ(も)」 (=… भए पनि) को अर्थ “… गर्दै पनि”। बोरिङ लाग्दा पनि अन्तसम्म हेर्‍यो। अघि र पछि विपरीत हुन्छन्।", "vi": "「〜つつ(も)」 (=dù … nhưng) nghĩa là “mặc dù”. Nghĩ là chán nhưng vẫn xem đến cuối. Hai vế trái ngược.", "zh": "「〜つつ(も)」(=虽然……却)意为“尽管”。觉得无聊,却看到了最后。前后相反。"}}, {"id": "B-4_1-020", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "今まで（　）としてあの人のことを思い出さない日はなかった。", "a": "1日", "w": ["1週間", "1ヵ月", "1年"], "x": {"ja": "「〜として〜ない」は「少しも〜ない」と強く否定する。「1日として〜ない日はなかった」=「毎日思い出した」。一番短い「1日」を使う。", "en": "「〜として〜ない」 (=not even one) is a strong negation. 1日として〜ない means “every single day.” The smallest unit, 1日, is used.", "ne": "「〜として〜ない」 (=एउटा पनि होइन) बलियो निषेध हो। 1日として〜ない = “हरेक दिन”। सबैभन्दा सानो एकाइ 1日 प्रयोग हुन्छ।", "vi": "「〜として〜ない」 (=dù một … cũng không) là phủ định mạnh. 1日として〜ない nghĩa là “ngày nào cũng”. Dùng đơn vị nhỏ nhất là 1日.", "zh": "「〜として〜ない」(=连一……都不)是强烈否定。「1日として〜ない」即“每天都”。用最小的单位「1日」。"}}, {"id": "B-4_1-021", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "水泳の練習は大好きだが、その日に限って（　）。", "a": "気が進まない", "w": ["プールで泳いだ", "特別な練習をした", "早く終わった"], "x": {"ja": "「〜に限って」は「その時だけ、いつもと違う(悪い)ことが起こる」という意味。練習が好きなのに、その日だけ気が進まなかった。", "en": "「〜に限って」 (=just that time) means that something unusual (often bad) happens only then. He loves practice but felt unmotivated that day.", "ne": "「〜に限って」 (=ठीक त्यही बेला) को अर्थ त्यही बेला मात्र असामान्य (प्रायः नराम्रो) कुरा हुन्छ। अभ्यास मन पर्ने भए पनि त्यस दिन मन लागेन।", "vi": "「〜に限って」 (=đúng lúc đó) nghĩa là chỉ lúc đó mới xảy ra điều khác thường (xấu). Thích tập bơi nhưng hôm đó lại không có hứng.", "zh": "「〜に限って」(=偏偏)意为只有那时发生异常(多为不好的)事。喜欢游泳练习,偏偏那天提不起劲。"}}, {"id": "B-4_1-022", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "さんざん人に迷惑をかけたあげく、（　）。", "a": "彼はいなくなってしまった", "w": ["彼は成功した", "彼の姿が見えない", "彼は安心した"], "x": {"ja": "「〜あげく」は、長い迷惑のあとの悪い結果を表す。迷惑をかけたあと、いなくなったという流れが自然だ。「成功」「安心」は合わない。", "en": "「〜あげく」 (=in the end) shows a bad result after a long trouble. After causing trouble, he disappeared. Success or relief does not fit.", "ne": "「〜あげく」 लामो झन्झटपछिको नराम्रो नतिजा देखाउँछ। सबैलाई सताएपछि ऊ हरायो। सफलता/आराम मिल्दैन।", "vi": "「〜あげく」 (=rốt cuộc) chỉ kết quả xấu sau thời gian dài. Gây phiền phức rồi biến mất là hợp lý. “Thành công/yên tâm” không hợp.", "zh": "「〜あげく」表示经过长时间后的不好结果。给人添了很多麻烦,最后消失了,很自然。“成功”“安心”不合适。"}}, {"id": "B-4_1-023", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "彼はすべて知りつつ、（　）。", "a": "だれにも本当のことを話そうとしなかった", "w": ["みんな知っていた", "だれも彼に本当のことを聞こうとしなかった", "みんなは何も知らなかった"], "x": {"ja": "「〜つつ(も)」は「〜のに」という意味。全部知っているのに、だれにも話さなかった。前と逆の行動が続く。", "en": "「〜つつ(も)」 (=even though) means “although.” He knew everything but told no one. The action contrasts with the first part.", "ne": "「〜つつ(も)」 को अर्थ “… भए पनि”। सबै थाहा हुँदा पनि कसैलाई भनेन। पछिल्लो कार्य विपरीत हुन्छ।", "vi": "「〜つつ(も)」 (=dù) nghĩa là “mặc dù”. Biết hết nhưng không nói với ai. Hành động trái ngược với vế trước.", "zh": "「〜つつ(も)」意为“虽然”。什么都知道,却对谁也不说。后面的行为与前面相反。"}}, {"id": "B-4_1-024", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "急いでいるときに限って（　）。", "a": "バスもタクシーも来ない", "w": ["バスが来る", "タクシーに乗らないほうがいい", "バスに乗る"], "x": {"ja": "「〜に限って」は、悪いことが「その時だけ」起こる気持ちを表す。急いでいるときに、バスもタクシーも来ないという困った状況だ。", "en": "「〜に限って」 (=of all times) expresses bad luck happening just then. When in a hurry, neither a bus nor a taxi comes.", "ne": "「〜に限って」 ठीक त्यही बेला नराम्रो हुने भाव देखाउँछ। हतारमा हुँदा बस र ट्याक्सी दुवै आउँदैनन्।", "vi": "「〜に限って」 (=đúng lúc…lại) diễn tả điều xấu xảy ra đúng lúc đó. Lúc vội thì cả xe buýt lẫn taxi đều không đến.", "zh": "「〜に限って」表示偏偏那时发生不好的事。着急的时候,公交和出租车都不来。"}}, {"id": "B-4_1-025", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "今までの人生には何一つとして（　）。", "a": "つらいことはなかった", "w": ["楽しいことばかりだった", "うれしいことがあった", "いい思い出がある"], "x": {"ja": "「何一つとして〜ない」は「ひとつも〜ない」という強い否定。後ろは否定の内容になる。「つらいことはなかった」が正しい。", "en": "「何一つとして〜ない」 (=not a single thing) is a strong negation, so the end must be negative. “There was nothing painful” is correct.", "ne": "「何一つとして〜ない」 (=एउटा पनि छैन) बलियो निषेध हो, पछिल्लो भाग नकारात्मक हुनुपर्छ। “दुःखको कुरा थिएन” सही।", "vi": "「何一つとして〜ない」 (=không có lấy một) là phủ định mạnh, nên vế sau phải là phủ định. “Không có điều gì khổ” là đúng.", "zh": "「何一つとして〜ない」(=连一个……都没有)是强烈否定,后面要是否定内容。「つらいことはなかった」正确。"}}, {"id": "B-4_1-026", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 4-1", "freq": 0, "q": "不景気とはいうものの、（　）。", "a": "人々の表情は明るい", "w": ["給料が下がった", "みんなの生活が苦しい", "みんな節約している"], "x": {"ja": "「〜とはいうものの」は「〜と言うが、実は」という意味。不景気だと言うが、人々の表情は明るい。前と逆の内容を選ぶ。", "en": "「〜とはいうものの」 (=although) means “it is said ..., but actually ...”. It is a recession, but people look cheerful. Choose the contrasting content.", "ne": "「〜とはいうものの」 (=भने पनि)। मन्दी भने पनि मानिसहरूको अनुहार उज्यालो छ। विपरीत अर्थ चाहिन्छ।", "vi": "「〜とはいうものの」 (=tuy nói vậy) nghĩa là “tuy nói… nhưng thực ra”. Nói là kinh tế khó khăn, nhưng nét mặt mọi người vẫn tươi. Chọn nội dung trái ngược.", "zh": "「〜とはいうものの」(=虽说)意为“虽说……但实际上”。虽说不景气,人们的表情却很明朗。选相反的内容。"}}, {"id": "B-5_2-027", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "外国語を学ぶ（　）は、外国の文化を学ぶということでもある。", "a": "ということ", "w": ["という", "ものなら", "ことには"], "x": {"ja": "「〜ということは、〜ということでもある」は「つまり〜だ」と言いかえる文型。外国語を学ぶことは、文化を学ぶことでもある、と言っている。", "en": "「〜ということは」 (=that means / to ...) restates something: learning a foreign language also means learning a foreign culture. The topic is marked with は.", "ne": "「〜ということは」 (=भन्नु …) ले कुरा अर्को शब्दमा भन्छ: विदेशी भाषा सिक्नु भनेको संस्कृति सिक्नु पनि हो।", "vi": "「〜ということは」 (=việc … có nghĩa là) diễn đạt lại: học ngoại ngữ cũng là học văn hóa nước đó.", "zh": "「〜ということは」(=……就是意味着)用来换种说法:学外语也就是学外国文化。"}}, {"id": "B-5_2-028", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "町を元気にする方法について、一緒に考え（　）ありませんか。", "a": "ようでは", "w": ["ようと", "まいか", "上で"], "x": {"ja": "「〜(よ)うではないか」は「いっしょに〜しよう」と呼びかける言い方。「考えようではありませんか」で、みんなで考えようと誘っている。", "en": "「〜(よ)うではないか」 (=let’s ...) is a way to invite people: 考えようではありませんか means “let’s think together.”", "ne": "「〜(よ)うではないか」 (=… गरौँ) अरूलाई आह्वान गर्ने तरिका हो: 考えようではありませんか = “सँगै सोचौँ।”", "vi": "「〜(よ)うではないか」 (=cùng … nhé) là cách rủ mọi người: 考えようではありませんか là “cùng suy nghĩ nhé”.", "zh": "「〜(よ)うではないか」(=让我们……吧)是号召的说法:「考えようではありませんか」即“一起想想吧”。"}}, {"id": "B-5_2-029", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "何が起こるかわからないから、試験の時は、早く行く（　）よ。", "a": "にこしたことはない", "w": ["ないことには", "ようものなら", "に相違ない"], "x": {"ja": "「〜にこしたことはない」は「〜のがいちばんいい」という意味。何が起こるかわからないから、早く行くのがいちばんいい。", "en": "「〜にこしたことはない」 (=nothing is better than) means “it is best to ...”. Since anything can happen, going early is best.", "ne": "「〜にこしたことはない」 (=… भन्दा राम्रो छैन) को अर्थ “… नै उत्तम”। केही पनि हुन सक्ने भएकाले चाँडै जानु नै उत्तम।", "vi": "「〜にこしたことはない」 (=không gì bằng) nghĩa là “tốt nhất là …”. Không biết chuyện gì xảy ra nên đi sớm là tốt nhất.", "zh": "「〜にこしたことはない」(=再好不过)意为“最好是……”。不知会发生什么,所以早点去最好。"}}, {"id": "B-5_2-030", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "その時は結局、一週間会社を休むことになったので、もう二度と無理する（　）と思ったんです。", "a": "まい", "w": ["うえで", "ないことには", "にこしたことはない"], "x": {"ja": "「〜まい」は「〜ないだろう/〜ないつもりだ」の意味。休むことになったので、もう無理しないと決めた。「ないことには」は意味がちがう。", "en": "「〜まい」 (=will not) means “I won’t / probably not.” After being off a week, the speaker decided never to push too hard again. ないことには does not fit.", "ne": "「〜まい」 (=गर्ने छैन) को अर्थ “गर्दिनँ/नहोला”। एक हप्ता बिदा लिनु परेकाले फेरि जबरजस्ती नगर्ने निर्णय गरियो।", "vi": "「〜まい」 (=sẽ không) nghĩa là “sẽ không/chắc không”. Vì phải nghỉ một tuần nên quyết định không gắng sức nữa.", "zh": "「〜まい」(=不会、不打算)。因为休了一周,所以决定不再勉强。「ないことには」不合适。"}}, {"id": "B-5_2-031", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "この書類をよく読み、はんこを（　）上で、提出してください。", "a": "押した", "w": ["押す", "押して", "押している"], "x": {"ja": "「〜上で」は「〜してから」という意味。動詞は「た形」に付く。書類を読み、はんこを押してから提出する順番だ。", "en": "「〜上で」 (=after doing) means “after ...ing”. With verbs, use the た-form: 押した上で. Read, stamp, then submit.", "ne": "「〜上で」 (=… गरेपछि) को अर्थ “… गरेपछि”। क्रियामा た-रूप: 押した上で। पढ्ने, छाप लगाउने, अनि बुझाउने।", "vi": "「〜上で」 (=sau khi) nghĩa là “sau khi làm”. Động từ dùng thể た: 押した上で. Đọc, đóng dấu rồi mới nộp.", "zh": "「〜上で」(=在……之后)意为“做了……之后”。动词用た形:押した上で。先读、盖章,再提交。"}}, {"id": "B-5_2-032", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "今回も試験に失敗しようものなら、（　）。", "a": "人生真っ暗だ", "w": ["来年また受験しよう", "来年は必ず合格すると思う", "後悔はしない"], "x": {"ja": "「〜(よ)うものなら」は「もし〜したら大変なことになる」という意味。失敗したら人生が暗くなる、と悪い結果が続く。", "en": "「〜(よ)うものなら」 (=if one should ...) means “if that happens, something bad follows.” If he fails again, life will look hopeless.", "ne": "「〜(よ)うものなら」 (=यदि … भयो भने) को अर्थ “यदि यस्तो भयो भने ठूलो समस्या”। फेरि असफल भए जीवन अँध्यारो हुन्छ।", "vi": "「〜(よ)うものなら」 (=nếu lỡ … thì) nghĩa là “nếu xảy ra thì hậu quả xấu”. Nếu lại thi trượt thì đời tối tăm.", "zh": "「〜(よ)うものなら」(=万一……就)意为“要是……就糟了”。要是再考砸,人生就一片黑暗。"}}, {"id": "B-5_2-033", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "部屋がもっと広くないことには、（　）。", "a": "30人の会議には使えない", "w": ["掃除が大変だ", "家賃も安いはずだ", "引っ越しできない"], "x": {"ja": "「〜ないことには」は「〜なければ、できない」という意味。後ろは否定になる。部屋が広くないと、30人の会議に使えない。", "en": "「〜ないことには」 (=unless) means “if not ..., cannot ...”. The ending is negative. Without a bigger room, it cannot be used for a 30-person meeting.", "ne": "「〜ないことには」 (=… नभई) को अर्थ “… नभए गर्न सकिँदैन”। पछिल्लो भाग नकारात्मक। कोठा ठूलो नभए ३० जनाको बैठकमा प्रयोग हुँदैन।", "vi": "「〜ないことには」 (=nếu không … thì) nghĩa là “nếu không … thì không thể”. Vế sau phủ định. Phòng không rộng hơn thì không dùng cho họp 30 người.", "zh": "「〜ないことには」(=如果不……就)意为“不……就无法”。后面是否定。房间不更大,就不能用于30人的会议。"}}, {"id": "B-5_2-034", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "この薬は、（　）上でお飲みください。", "a": "説明書をよく読んだ", "w": ["食事が終わった", "医師が説明した", "水を飲んだ"], "x": {"ja": "「〜上で」は「〜してから」という意味。薬を飲む前に説明書をよく読む。「説明書をよく読んだ上で」の順番が自然だ。", "en": "「〜上で」 (=after doing) means “after ...ing.” Read the instructions carefully, then take the medicine.", "ne": "「〜上で」 (=… गरेपछि)। औषधि खानु अघि निर्देशन राम्ररी पढ्नुहोस्।", "vi": "「〜上で」 (=sau khi) nghĩa là “sau khi làm”. Đọc kỹ hướng dẫn rồi mới uống thuốc.", "zh": "「〜上で」(=在……之后)。先仔细读说明书,再服药。"}}, {"id": "B-5_2-035", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "あの人と一緒にお酒を飲もうものなら、（　）よ。", "a": "朝まで帰してくれません", "w": ["楽しいです", "やめたほうがいいです", "早く帰ります"], "x": {"ja": "「〜(よ)うものなら」は「もし〜したら大変だ」という意味。一緒にお酒を飲んだら、朝まで帰れない、という困った結果が続く。", "en": "「〜(よ)うものなら」 (=if one were to ...) means “if so, trouble.” If you drink with that person, you cannot go home until morning.", "ne": "「〜(よ)うものなら」 (=यदि … गरेमा) को अर्थ “यदि गरे समस्या”। उनीसँग मदिरा पिए बिहानसम्म घर फर्कन दिँदैनन्।", "vi": "「〜(よ)うものなら」 (=nếu lỡ … thì) nghĩa là “nếu làm thì rắc rối”. Uống rượu với người đó thì đến sáng cũng không cho về.", "zh": "「〜(よ)うものなら」(=万一……就)。要是和那个人一起喝酒,会被拉着喝到天亮不让回家。"}}, {"id": "B-5_2-036", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "えみさんは今日なんだか元気がない。何かあった（　）。", "a": "に違いない", "w": ["に間違いない", "に違いはない", "ようものなら"], "x": {"ja": "「〜に違いない」は「きっと〜だ」という強い推測。元気がない様子から、何かあったと推測している。「に相違ない」と同じ意味だ。", "en": "「〜に違いない」 (=must be) is a strong guess: “surely.” Emi looks down, so something must have happened. It is the same as に相違ない.", "ne": "「〜に違いない」 बलियो अनुमान हो: “निश्चय”। एमी निरुत्साहित देखिएकाले केही भएको हुनुपर्छ। に相違ない जस्तै अर्थ।", "vi": "「〜に違いない」 (=chắc chắn) là suy đoán mạnh. Thấy Emi không vui nên chắc đã có chuyện. Cùng nghĩa với に相違ない.", "zh": "「〜に違いない」(=一定是)是强烈的推测。看恵美没精神,推测一定发生了什么。与「に相違ない」意思相同。"}}, {"id": "B-5_2-037", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "雪がもっと降らないことには、（　）。", "a": "スキー場はオープンできない", "w": ["わたしはありがたい", "スケート場の客が増える", "客足が{伸|の}びる"], "x": {"ja": "「〜ないことには」は「〜なければ、できない」という意味。雪が降らなければ、スキー場はオープンできない。後ろは否定の内容だ。", "en": "「〜ないことには」 (=unless) means “without ..., cannot ...”. Unless more snow falls, the ski resort cannot open. The ending is negative.", "ne": "「〜ないことには」 (=… नभई)। हिउँ नपरेसम्म स्कीइङ मैदान खोल्न सकिँदैन। पछिल्लो भाग नकारात्मक।", "vi": "「〜ないことには」 (=nếu không … thì). Tuyết không rơi thêm thì khu trượt tuyết không mở được. Vế sau phủ định.", "zh": "「〜ないことには」(=不……就)。雪不再多下,滑雪场就无法开放。后面是否定内容。"}}, {"id": "B-5_2-038", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "税金問題に関心が高まっているため、今回の投票率は（　）に相違ない。", "a": "高くなる", "w": ["高くなるだろう", "高くなりそう", "高まっている"], "x": {"ja": "「〜に相違ない」は「きっと〜だ」という強い推測。関心が高いから、投票率は高くなるに違いない。前に「高くなる」を使うのが自然。", "en": "「〜に相違ない」 (=surely) is a strong guess. Because interest is rising, the turnout will surely be higher. The plain form 高くなる fits before it.", "ne": "「〜に相違ない」 बलियो अनुमान हो। चासो बढेकाले मतदान दर निश्चय बढ्नेछ। अघि 高くなる (साधारण रूप) मिल्छ।", "vi": "「〜に相違ない」 (=chắc chắn) là suy đoán mạnh. Quan tâm tăng nên tỷ lệ bỏ phiếu chắc chắn sẽ cao. Trước đó dùng thể thường 高くなる.", "zh": "「〜に相違ない」(=一定)是强烈推测。关注度提高,投票率一定会升高。前面接普通形「高くなる」。"}}, {"id": "B-5_2-039", "subject": "bunpo", "qtype": "bunpo-form", "level": "N2", "unit": "文法 Unit 5-2", "freq": 0, "q": "外国のこんな小さな村では（　）まいと思ったのだが、予想外だった。", "a": "日本語を耳にすることはある", "w": ["わたしは仕事を探す", "わたしは家を買う", "電車が走っている"], "x": {"ja": "「〜まい」は「〜ないだろう」という否定の推量。「耳にすることはあるまい」=「聞くことはないだろう」と思ったが、予想外だった。", "en": "「〜まい」 (=probably not) is a negative guess. 耳にすることはあるまい means “I thought I would not hear Japanese,” but the result was unexpected.", "ne": "「〜まい」 नकारात्मक अनुमान हो। 耳にすることはあるまい = “जापानी सुनिँदैन होला” भन्ने सोचेको, तर अप्रत्याशित भयो।", "vi": "「〜まい」 (=chắc sẽ không) là phỏng đoán phủ định. 耳にすることはあるまい nghĩa là “chắc không nghe thấy tiếng Nhật”, nhưng ngoài dự đoán.", "zh": "「〜まい」(=大概不会)是否定推测。「耳にすることはあるまい」意为“以为不会听到日语”,结果出乎意料。"}}, {"id": "G-1-001", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 3, "q": "{締|し}め切りは来月の（　）で、10日までに出してください。", "a": "{上旬|じょうじゅん}", "w": ["{中旬|ちゅうじゅん}", "{下旬|げじゅん}", "月末"], "x": {"ja": "「10日まで」なので、1日〜10日の「上旬」が正解です。「中旬」は11〜20日、「下旬」は21日以降、「月末」は月の終わりです。", "en": "The deadline is \"by the 10th,\" so 「上旬」(=the first 10 days of a month) is correct. 「中旬」 is the 11th-20th, 「下旬」 is the 21st onward, and 「月末」 is the end of the month.", "ne": "\"१० गतेसम्म\" भनिएकाले 「上旬」(=महिनाको पहिलो १० दिन) सही हो। 「中旬」 ११–२० गते, 「下旬」 २१ गतेपछि, 「月末」 महिनाको अन्त्य हो।", "vi": "Hạn là \"đến ngày 10\" nên 「上旬」(=10 ngày đầu tháng) là đúng. 「中旬」 là ngày 11–20, 「下旬」 từ ngày 21, 「月末」 là cuối tháng.", "zh": "因为是“10号之前”,所以「上旬」(=每月1日到10日)正确。「中旬」是11–20日,「下旬」是21日以后,「月末」是月底。"}}, {"id": "G-1-002", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "会社は（　）しか開いていないので、土曜日と日曜日は行けません。", "a": "平日", "w": ["休日", "祝日", "元日"], "x": {"ja": "土曜日と日曜日は行けないので、月曜日から金曜日の「平日」が正解です。「休日」「祝日」は土日と重なる休みの日です。", "en": "Since the speaker can't go on Saturday or Sunday, 「平日」(=weekdays, Monday to Friday) is correct. 「休日」(=days off) and 「祝日」(=public holidays) overlap with weekends.", "ne": "शनिबार र आइतबार जान नसकिने भएकाले 「平日」(=सोमबारदेखि शुक्रबारसम्मका कार्यदिन) सही हो। 「休日」(=बिदाको दिन) र 「祝日」(=सार्वजनिक बिदा) सप्ताहान्तसँग मिल्छन्।", "vi": "Vì thứ Bảy và Chủ nhật không đi được nên 「平日」(=ngày thường, thứ Hai đến thứ Sáu) là đúng. 「休日」(=ngày nghỉ) và 「祝日」(=ngày lễ) trùng với cuối tuần.", "zh": "因为周六和周日去不了,所以「平日」(=周一到周五的工作日)正确。「休日」(=休息日)和「祝日」(=法定节假日)与周末重叠。"}}, {"id": "G-1-003", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "5月5日は「こどもの日」で、国が決めた（　）の一つです。", "a": "祝日", "w": ["平日", "日付", "{西暦|せいれき}"], "x": {"ja": "国が決めた休みの日は「祝日」です。「平日」は月〜金、「日付」は何月何日のことです。", "en": "A holiday set by the country is a 「祝日」(=public holiday). 「平日」 means weekdays, and 「日付」 means the date.", "ne": "देशले तोकेको बिदाको दिन 「祝日」(=सार्वजनिक बिदा) हो। 「平日」 कार्यदिन र 「日付」 मिति हो।", "vi": "Ngày nghỉ do nhà nước quy định là 「祝日」(=ngày lễ). 「平日」 là ngày thường, 「日付」 là ngày tháng.", "zh": "国家规定的休息日是「祝日」(=法定节假日)。「平日」是工作日,「日付」是日期。"}}, {"id": "G-1-004", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 1, "q": "この寺は（　）700年ごろに建てられたと言われています。", "a": "{西暦|せいれき}", "w": ["元日", "年中", "日付"], "x": {"ja": "「700年ごろ」は年を数えるときの言い方なので、「西暦」(=Western calendar year)が正解です。「元日」は1月1日、「年中」は一年じゅうです。", "en": "「700年ごろ」 counts a year, so 「西暦」(=the Western (A.D.) calendar) is correct. 「元日」 is January 1st, and 「年中」 means all year round.", "ne": "「700年ごろ」 वर्ष गन्ने तरिका भएकाले 「西暦」(=पश्चिमी पात्रो/ईस्वी सन्) सही हो। 「元日」 जनवरी १ र 「年中」 वर्षभरि हो।", "vi": "「700年ごろ」 là cách nói về năm nên 「西暦」(=Dương lịch) là đúng. 「元日」 là ngày 1 tháng 1, 「年中」 là suốt năm.", "zh": "「700年ごろ」是表示年份的说法,所以「西暦」(=公历)正确。「元日」是1月1日,「年中」是一整年。"}}, {"id": "G-1-005", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 1, "q": "日本では、（　）に家族でおせち料理を食べる習慣があります。", "a": "元日", "w": ["平日", "月末", "日中"], "x": {"ja": "おせち料理を食べるのは1月1日なので、「元日」が正解です。「平日」「月末」「日中」は新年の日ではありません。", "en": "Osechi is eaten on January 1st, so 「元日」(=New Year's Day) is correct. 「平日」, 「月末」 and 「日中」 are not the New Year day.", "ne": "ओसेचि १ जनवरीमा खाइने भएकाले 「元日」(=नयाँ वर्षको पहिलो दिन) सही हो। 「平日」, 「月末」, 「日中」 नयाँ वर्षको दिन होइनन्।", "vi": "Osechi được ăn vào ngày 1 tháng 1 nên 「元日」(=ngày mùng 1 Tết dương) là đúng. 「平日」, 「月末」, 「日中」 không phải ngày đầu năm.", "zh": "御节料理在1月1日吃,所以「元日」(=元旦)正确。「平日」「月末」「日中」都不是新年的日子。"}}, {"id": "G-1-006", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 1, "q": "今日は月曜日ですから、（　）は水曜日です。", "a": "あさって", "w": ["後日", "当日", "しあさって"], "x": {"ja": "今日が月曜日なら2日後は水曜日で、「あさって」(=the day after tomorrow)が正解です。「しあさって」は3日後(木曜日)です。", "en": "If today is Monday, two days later is Wednesday: 「あさって」(=the day after tomorrow). 「しあさって」 is three days later (Thursday).", "ne": "आज सोमबार हो भने २ दिनपछि बुधबार हुन्छ: 「あさって」(=पर्सि) सही हो। 「しあさって」 ३ दिनपछि (बिहीबार) हो।", "vi": "Nếu hôm nay là thứ Hai thì 2 ngày sau là thứ Tư: 「あさって」(=ngày kia) là đúng. 「しあさって」 là 3 ngày sau (thứ Năm).", "zh": "今天是周一的话,两天后是周三,所以「あさって」(=后天)正确。「しあさって」是三天后(周四)。"}}, {"id": "G-1-007", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "夏は（　）はとても暑いので、朝と夕方に散歩をしています。", "a": "日中", "w": ["夜中", "年中", "日常"], "x": {"ja": "夏の暑いときは、昼間は暑いので「日中」(=daytime)が正解です。朝と夕方に散歩するのは、日中が暑いからです。「夜中」は深夜、「年中」は一年じゅうです。", "en": "In summer the daytime is hot, so 「日中」(=daytime) is correct. 「夜中」 means the middle of the night, and 「年中」 means all year.", "ne": "गर्मीमा दिनको समय धेरै तातो हुने भएकाले 「日中」(=दिउँसो) सही हो। 「夜中」 मध्यरात र 「年中」 वर्षभरि हो।", "vi": "Mùa hè ban ngày rất nóng nên 「日中」(=ban ngày) là đúng. 「夜中」 là nửa đêm, 「年中」 là suốt năm.", "zh": "夏天白天很热,所以「日中」(=白天)正确。「夜中」是深夜,「年中」是一整年。"}}, {"id": "G-1-008", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 1, "q": "（　）の1時に友達から電話が来て、寝ていたのに起こされた。", "a": "夜中", "w": ["日付", "年中", "日程"], "x": {"ja": "寝ていたのに電話で起こされたので、夜おそい時間の「夜中」(=middle of the night)が正解です。「日付」「日程」は日にちのことです。", "en": "The person was woken up from sleep, so 「夜中」(=the middle of the night) is correct. 「日付」 and 「日程」 are about dates and schedules.", "ne": "सुतिरहेको बेला फोनले उठाइएकाले 「夜中」(=मध्यरात) सही हो। 「日付」 र 「日程」 मिति र कार्यक्रमसँग सम्बन्धित हुन्।", "vi": "Đang ngủ mà bị gọi dậy nên 「夜中」(=nửa đêm) là đúng. 「日付」 và 「日程」 nói về ngày tháng và lịch trình.", "zh": "睡着时被电话吵醒,所以「夜中」(=半夜)正确。「日付」「日程」是日期和日程。"}}, {"id": "G-1-009", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "窓の外で何かが光ったが、（　）のことで何だったかわからなかった。", "a": "{一瞬|いっしゅん}", "w": ["{瞬間|しゅんかん}", "一時", "同時"], "x": {"ja": "「一瞬のこと」は「とても短い時間のこと」という意味で、これが正解です。「瞬間」は「その瞬間」のように使うことが多いです。", "en": "「一瞬のこと」 means \"something that happened in a very short time,\" so 「一瞬」(=a moment) is correct. 「瞬間」 is usually used as in 「その瞬間」(=that instant).", "ne": "「一瞬のこと」 को अर्थ \"धेरै छोटो समयमा भएको कुरा\" हो, त्यसैले 「一瞬」(=एक क्षण) सही हो। 「瞬間」 प्रायः 「その瞬間」 को रूपमा प्रयोग हुन्छ।", "vi": "「一瞬のこと」 nghĩa là \"việc xảy ra trong thời gian rất ngắn\" nên 「一瞬」(=trong chốc lát) là đúng. 「瞬間」 thường dùng dạng 「その瞬間」(=khoảnh khắc đó).", "zh": "「一瞬のこと」意思是“时间非常短的事”,所以「一瞬」(=一瞬间)正确。「瞬間」多用于「その瞬間」(=那一刻)。"}}, {"id": "G-1-010", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "今日は時間がないので、詳しいことは（　）お話しします。", "a": "後日", "w": ["常に", "年中", "日常"], "x": {"ja": "「あとの日」に話すので、「後日」(=a later day)が正解です。「常に」は「いつも」、「年中」は一年じゅう、「日常」はふだんの生活です。", "en": "The speaker will talk on a later day, so 「後日」(=at a later date) is correct. 「常に」 means always, 「年中」 means all year, and 「日常」 means daily life.", "ne": "पछिको दिनमा कुरा गरिने भएकाले 「後日」(=पछि कुनै दिन) सही हो। 「常に」 सधैँ, 「年中」 वर्षभरि र 「日常」 दैनिक जीवन हो।", "vi": "Sẽ nói vào một ngày sau nên 「後日」(=vào ngày sau) là đúng. 「常に」 là luôn luôn, 「年中」 là suốt năm, 「日常」 là sinh hoạt hằng ngày.", "zh": "因为是改天再说,所以「後日」(=日后)正确。「常に」是总是,「年中」是一整年,「日常」是日常生活。"}}, {"id": "G-1-011", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 3, "q": "新しいカメラを買ったので、（　）公園で写真を撮ってみた。", "a": "早速", "w": ["近々", "常に", "日常"], "x": {"ja": "買ったあと、「すぐに」写真を撮ったので、「早速」(=right away)が正解です。「近々」は「近いうちに」で、これからのことに使います。", "en": "The person took photos right after buying it, so 「早速」(=right away) is correct. 「近々」 means \"soon\" and is used for the future.", "ne": "किनेपछि तुरुन्तै फोटो खिचिएकाले 「早速」(=तुरुन्तै) सही हो। 「近々」 को अर्थ \"चाँडै\" हो र यो भविष्यका लागि प्रयोग हुन्छ।", "vi": "Mua xong là chụp ảnh ngay nên 「早速」(=ngay lập tức) là đúng. 「近々」 nghĩa là \"sắp tới\", dùng cho tương lai.", "zh": "买了之后马上就拍了照,所以「早速」(=立刻)正确。「近々」是“不久之后”,用于将来。"}}, {"id": "G-1-012", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 3, "q": "旅行に行く前に、必要な情報を（　）に調べておいた。", "a": "事前", "w": ["当日", "同時", "日常"], "x": {"ja": "「行く前に」「前もって」という意味なので、「事前」(=beforehand)が正解です。「当日」はその日なので、「行く前に」と合いません。", "en": "It means \"before going / in advance,\" so 「事前」(=beforehand) is correct. 「当日」 means the day itself, which doesn't fit \"before the trip.\"", "ne": "\"जानुअघि / पहिले नै\" भन्ने अर्थ भएकाले 「事前」(=अगावै) सही हो। 「当日」 त्यही दिन हो, त्यसैले \"जानुअघि\" सँग मिल्दैन।", "vi": "Nghĩa là \"trước khi đi / làm trước\" nên 「事前」(=trước) là đúng. 「当日」 là chính ngày đó, không hợp với \"trước chuyến đi\".", "zh": "意思是“出发前/提前”,所以「事前」(=事先)正确。「当日」是当天,与“出发前”矛盾。"}}, {"id": "G-1-013", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "（　）の若い人は、新聞をあまり読まない。", "a": "近頃", "w": ["近々", "今回", "当日"], "x": {"ja": "「このごろ」という意味の「近頃」(=these days)が正解です。「近々」は「近いうちに」で、未来のことに使います。", "en": "「近頃」(=these days, lately) is correct. 「近々」 means \"in the near future\" and is used for the future.", "ne": "「近頃」(=यी दिनहरूमा) सही हो। 「近々」 को अर्थ \"चाँडै\" हो र यो भविष्यमा प्रयोग हुन्छ।", "vi": "「近頃」(=dạo này, gần đây) là đúng. 「近々」 nghĩa là \"sắp tới\", dùng cho tương lai.", "zh": "「近頃」(=最近)正确。「近々」是“近期”,用于将来。"}}, {"id": "G-1-014", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "新しい駅が（　）オープンするそうです。", "a": "近々", "w": ["近頃", "当時", "常に"], "x": {"ja": "まだオープンしていないので未来のことです。「近いうちに」という意味の「近々」(=soon)が正解です。「近頃」は今に近い過去のことに使います。", "en": "The station hasn't opened yet, so it is about the future: 「近々」(=soon) is correct. 「近頃」 is used for the recent past or present.", "ne": "स्टेशन अझै खुलेको छैन, भविष्यको कुरा हो: 「近々」(=चाँडै) सही हो। 「近頃」 भर्खरको विगत वा वर्तमानमा प्रयोग हुन्छ।", "vi": "Ga chưa mở nên là chuyện tương lai: 「近々」(=sắp tới) là đúng. 「近頃」 dùng cho quá khứ gần hoặc hiện tại.", "zh": "还没开业,是将来的事,所以「近々」(=近期)正确。「近頃」用于最近的过去或现在。"}}, {"id": "G-1-015", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "10年の努力が実って、（　）彼は試験に合格した。", "a": "ついに", "w": ["一時", "早速", "常に"], "x": {"ja": "10年かかって、長い時間のあとで結果が出たので、「ついに」(=finally)が正解です。「早速」は「すぐに」、「常に」は「いつも」です。", "en": "After a long ten years the result came, so 「ついに」(=finally) is correct. 「早速」 means \"right away,\" and 「常に」 means \"always.\"", "ne": "१० वर्षको लामो समयपछि नतिजा आएकाले 「ついに」(=अन्ततः) सही हो। 「早速」 तुरुन्तै र 「常に」 सधैँ हो।", "vi": "Sau 10 năm dài mới có kết quả nên 「ついに」(=cuối cùng) là đúng. 「早速」 là ngay lập tức, 「常に」 là luôn luôn.", "zh": "经过漫长的10年才有结果,所以「ついに」(=终于)正确。「早速」是立刻,「常に」是总是。"}}, {"id": "G-1-016", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "彼は（　）冷静で、どんなときでも怒らない。", "a": "常に", "w": ["間もなく", "早速", "一時"], "x": {"ja": "「どんなときでも」とあるので、「いつも」という意味の「常に」(=always)が正解です。「間もなく」は「もうすぐ」、「一時」は短い間です。", "en": "\"At any time\" is stated, so 「常に」(=always) is correct. 「間もなく」 means \"soon,\" and 「一時」 means \"for a short while.\"", "ne": "\"जुनसुकै बेला\" भनिएकाले 「常に」(=सधैँ) सही हो। 「間もなく」 चाँडै र 「一時」 छोटो समय हो।", "vi": "Có cụm \"lúc nào cũng\" nên 「常に」(=luôn luôn) là đúng. 「間もなく」 là sắp, 「一時」 là một lúc ngắn.", "zh": "因为说“任何时候”,所以「常に」(=总是)正确。「間もなく」是马上,「一時」是短暂的一段时间。"}}, {"id": "G-1-017", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "ピアノを{弾|ひ}きながら歌うという、二つのことを（　）にやってのけた。", "a": "同時", "w": ["事前", "後日", "近々"], "x": {"ja": "二つのことを「同じ時に」やったので、「同時」(=at the same time)が正解です。「事前」は前もって、「後日」はあとの日です。", "en": "Two things were done at the same time, so 「同時」(=at the same time) is correct. 「事前」 means beforehand, and 「後日」 means a later day.", "ne": "दुई कुरा एकै समयमा गरिएकाले 「同時」(=एकैसाथ) सही हो। 「事前」 अगावै र 「後日」 पछिको दिन हो।", "vi": "Hai việc được làm cùng lúc nên 「同時」(=cùng lúc) là đúng. 「事前」 là trước, 「後日」 là ngày sau.", "zh": "两件事在同一时间做,所以「同時」(=同时)正确。「事前」是事先,「後日」是改天。"}}, {"id": "G-1-018", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 3, "q": "窓を開けた（　）、強い風が入ってきた。", "a": "途端", "w": ["同時", "事前", "一時"], "x": {"ja": "「Vた途端(に)」(=just when ~)の形で、「窓を開けた途端」が正解です。「開けた同時」とは言いません。", "en": "The pattern is 「Vた途端(に)」(=the moment ~), so 「窓を開けた途端」 is correct. We don't say 「開けた同時」.", "ne": "「Vた途端(に)」(=~ गर्ने बित्तिकै) को ढाँचा भएकाले 「窓を開けた途端」 सही हो। 「開けた同時」 भनिँदैन।", "vi": "Mẫu câu là 「Vた途端(に)」(=ngay khi ~) nên 「窓を開けた途端」 là đúng. Không nói 「開けた同時」.", "zh": "句型是「Vた途端(に)」(=刚一~就),所以「窓を開けた途端」正确。不说「開けた同時」。"}}, {"id": "G-1-019", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 3, "q": "映画は（　）始まりますので、お席にお戻りください。", "a": "間もなく", "w": ["近頃", "事前", "常に"], "x": {"ja": "「もうすぐ」という意味の「間もなく」(=soon)が正解です。アナウンスでよく使います。「近頃」は「このごろ」、「事前」は前もってです。", "en": "「間もなく」(=soon, shortly) is correct and is often used in announcements. 「近頃」 means \"these days,\" and 「事前」 means \"beforehand.\"", "ne": "「間もなく」(=चाँडै) सही हो र घोषणामा प्रायः प्रयोग हुन्छ। 「近頃」 यी दिनहरूमा र 「事前」 अगावै हो।", "vi": "「間もなく」(=sắp, chẳng bao lâu nữa) là đúng, hay dùng trong thông báo. 「近頃」 là dạo này, 「事前」 là trước.", "zh": "「間もなく」(=马上)正确,常用于广播。「近頃」是最近,「事前」是事先。"}}, {"id": "G-1-020", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "3日間の（　）を組んで、観光する場所を決めた。", "a": "日程", "w": ["日付", "日時", "時期"], "x": {"ja": "旅行で何日にどこへ行くかという計画は「日程」(=schedule, itinerary)です。「日付」は何月何日、「日時」は日と時間のことです。", "en": "A plan of where to go on which day of a trip is a 「日程」(=schedule). 「日付」 is the date, and 「日時」 is the date and time.", "ne": "यात्रामा कुन दिन कहाँ जाने भन्ने योजना 「日程」(=कार्यक्रम तालिका) हो। 「日付」 मिति र 「日時」 मिति र समय हो।", "vi": "Kế hoạch đi đâu vào ngày nào trong chuyến đi là 「日程」(=lịch trình). 「日付」 là ngày tháng, 「日時」 là ngày giờ.", "zh": "旅行中哪天去哪里的计划叫「日程」(=日程安排)。「日付」是日期,「日時」是日期和时间。"}}, {"id": "G-1-021", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "手紙を書くとき、右上に（　）を書くのを忘れた。", "a": "日付", "w": ["日程", "時期", "日常"], "x": {"ja": "手紙に書く「何年何月何日」は「日付」(=date)です。「日程」は予定、「時期」は季節やころです。", "en": "The \"year, month and day\" written on a letter is the 「日付」(=date). 「日程」 is a schedule, and 「時期」 is a season or period.", "ne": "पत्रमा लेखिने \"साल, महिना, गते\" 「日付」(=मिति) हो। 「日程」 कार्यक्रम र 「時期」 मौसम वा समय हो।", "vi": "\"Năm, tháng, ngày\" viết trong thư là 「日付」(=ngày tháng). 「日程」 là lịch trình, 「時期」 là mùa hoặc thời kỳ.", "zh": "信里写的“某年某月某日”是「日付」(=日期)。「日程」是日程,「時期」是季节或时期。"}}, {"id": "G-1-022", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "あの店は夏も冬も（　）休まず開いている。", "a": "年中", "w": ["日中", "一時", "近頃"], "x": {"ja": "夏も冬も、一年じゅう休まないので、「年中」(=all year round)が正解です。「日中」は昼間、「近頃」は最近です。", "en": "The shop doesn't close in summer or winter, so 「年中」(=all year round) is correct. 「日中」 means daytime, and 「近頃」 means lately.", "ne": "गर्मी र जाडो दुवैमा बन्द नहुने भएकाले 「年中」(=वर्षभरि) सही हो। 「日中」 दिउँसो र 「近頃」 हालसालै हो।", "vi": "Mùa hè hay mùa đông đều không nghỉ nên 「年中」(=suốt năm) là đúng. 「日中」 là ban ngày, 「近頃」 là dạo này.", "zh": "无论夏天冬天全年不休息,所以「年中」(=全年)正确。「日中」是白天,「近頃」是最近。"}}, {"id": "G-1-023", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "桜が{咲|さ}く（　）は、どこの観光地も人が多い。", "a": "時期", "w": ["日付", "日程", "日時"], "x": {"ja": "桜が咲く季節のことなので、「時期」(=season, period)が正解です。「日付」「日程」「日時」は、決まった日や時間のことです。", "en": "It is about the season when cherry blossoms bloom, so 「時期」(=season, period) is correct. 「日付」, 「日程」 and 「日時」 refer to fixed dates or times.", "ne": "सकुरा फुल्ने मौसमको कुरा भएकाले 「時期」(=समय/मौसम) सही हो। 「日付」, 「日程」, 「日時」 निश्चित दिन वा समयका लागि हुन्।", "vi": "Nói về mùa hoa anh đào nở nên 「時期」(=thời kỳ, mùa) là đúng. 「日付」, 「日程」, 「日時」 chỉ ngày giờ cụ thể.", "zh": "说的是樱花开放的季节,所以「時期」(=时期)正确。「日付」「日程」「日時」指确定的日子或时间。"}}, {"id": "G-1-024", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 3, "q": "私が学生だった（　）は、携帯電話を持っている人が少なかった。", "a": "当時", "w": ["当日", "今回", "近頃"], "x": {"ja": "学生だった「そのころ」の話なので、「当時」(=at that time)が正解です。「当日」はその日、「近頃」は最近です。", "en": "It is about \"that time\" when the speaker was a student, so 「当時」(=at that time) is correct. 「当日」 is that day, and 「近頃」 is lately.", "ne": "विद्यार्थी हुँदाको \"त्यो बेलाको\" कुरा भएकाले 「当時」(=त्यतिबेला) सही हो। 「当日」 त्यही दिन र 「近頃」 हालसालै हो।", "vi": "Nói về \"hồi đó\" khi còn là sinh viên nên 「当時」(=lúc đó) là đúng. 「当日」 là ngày hôm đó, 「近頃」 là dạo này.", "zh": "说的是当学生的“那个时候”,所以「当時」(=当时)正确。「当日」是当天,「近頃」是最近。"}}, {"id": "G-1-025", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "試験の（　）は、朝早く起きて会場に行った。", "a": "当日", "w": ["当時", "今回", "日常"], "x": {"ja": "試験が行われる「その日」のことなので、「当日」(=the day itself)が正解です。「当時」は「そのころ」で、長い時間のことです。", "en": "It is about the day the exam is held, so 「当日」(=the day itself) is correct. 「当時」 means \"at that time\" and is about a longer period.", "ne": "परीक्षा हुने \"त्यही दिन\" को कुरा भएकाले 「当日」(=त्यही दिन) सही हो। 「当時」 \"त्यतिबेला\" हो, लामो समयको लागि।", "vi": "Nói về \"chính ngày\" thi nên 「当日」(=ngày hôm đó) là đúng. 「当時」 là \"lúc đó\", chỉ khoảng thời gian dài hơn.", "zh": "说的是考试的“那一天”,所以「当日」(=当天)正确。「当時」是“那时”,指较长的时间。"}}, {"id": "G-1-026", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 1", "freq": 1, "q": "（　）の試験は、前回より難しかった。", "a": "今回", "w": ["当時", "日常", "常に"], "x": {"ja": "「前回より」と比べているので、「このたび」の意味の「今回」(=this time)が正解です。「当時」は過去、「日常」は毎日の生活です。", "en": "It compares with \"last time,\" so 「今回」(=this time) is correct. 「当時」 is about the past, and 「日常」 is daily life.", "ne": "\"अघिल्लो पटक भन्दा\" तुलना गरिएकाले 「今回」(=यसपटक) सही हो। 「当時」 विगतको र 「日常」 दैनिक जीवन हो।", "vi": "So sánh với \"lần trước\" nên 「今回」(=lần này) là đúng. 「当時」 là quá khứ, 「日常」 là sinh hoạt hằng ngày.", "zh": "与“上次”相比,所以「今回」(=这次)正确。「当時」是过去,「日常」是日常生活。"}}, {"id": "G-1-027", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "新しい辞書を買って、[[早速]]使ってみた。", "a": "すぐに", "w": ["ゆっくり", "時々", "久しぶりに"], "x": {"ja": "「早速」は「すぐに」という意味です。買ってすぐ使ったということです。「ゆっくり」「時々」などは意味がちがいます。", "en": "「早速」 means \"right away\" (=すぐに). The person used it right after buying. 「ゆっくり」 (slowly) and 「時々」 (sometimes) have different meanings.", "ne": "「早速」 को अर्थ \"तुरुन्तै\" (=すぐに) हो। किनेपछि तुरुन्तै प्रयोग गरियो। 「ゆっくり」(बिस्तारै) र 「時々」(कहिलेकाहीँ) को अर्थ फरक छ।", "vi": "「早速」 nghĩa là \"ngay lập tức\" (=すぐに). Mua xong là dùng ngay. 「ゆっくり」(chậm rãi) và 「時々」(thỉnh thoảng) có nghĩa khác.", "zh": "「早速」的意思是“立刻”(=すぐに)。买了马上就用了。「ゆっくり」(慢慢地)和「時々」(有时)意思不同。"}}, {"id": "G-1-028", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "[[近頃]]、駅前に新しい店が増えた。", "a": "最近", "w": ["昔", "将来", "来年"], "x": {"ja": "「近頃」は「最近」という意味です。「昔」や「将来」は、近い今ではありません。", "en": "「近頃」 means 「最近」(=recently). 「昔」 (long ago) and 「将来」 (the future) are not about the present time.", "ne": "「近頃」 को अर्थ 「最近」(=हालसालै) हो। 「昔」(धेरै पहिले) र 「将来」(भविष्य) वर्तमान होइनन्।", "vi": "「近頃」 nghĩa là 「最近」(=gần đây). 「昔」(ngày xưa) và 「将来」(tương lai) không phải thời gian hiện tại.", "zh": "「近頃」的意思是「最近」(=最近)。「昔」(从前)和「将来」(将来)不是现在这段时间。"}}, {"id": "G-1-029", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "[[近々]]、引っ越しをする予定です。", "a": "近いうちに", "w": ["先月すでに", "何年も前に", "毎日のように"], "x": {"ja": "「近々」は「近いうちに」という意味で、未来のことです。「先月すでに」「何年も前に」は過去なので合いません。", "en": "「近々」 means \"in the near future.\" 「先月すでに」 and 「何年も前に」 are in the past, so they don't fit.", "ne": "「近々」 को अर्थ \"चाँडै\" हो, भविष्यको कुरा। 「先月すでに」 र 「何年も前に」 विगतका हुन्, मिल्दैनन्।", "vi": "「近々」 nghĩa là \"sắp tới\", chuyện tương lai. 「先月すでに」 và 「何年も前に」 là quá khứ nên không hợp.", "zh": "「近々」的意思是“近期”,是将来的事。「先月すでに」「何年も前に」是过去,不合适。"}}, {"id": "G-1-030", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "[[当日]]は雨でも行います。", "a": "その日", "w": ["前の日", "次の日", "毎日"], "x": {"ja": "「当日」は「その日」という意味です。「前の日」「次の日」は、その日ではありません。", "en": "「当日」 means \"that day\" (=その日). 「前の日」 (the day before) and 「次の日」 (the next day) are different days.", "ne": "「当日」 को अर्थ \"त्यही दिन\" (=その日) हो। 「前の日」(अघिल्लो दिन) र 「次の日」(अर्को दिन) फरक दिन हुन्।", "vi": "「当日」 nghĩa là \"ngày hôm đó\" (=その日). 「前の日」(ngày trước) và 「次の日」(ngày sau) là ngày khác.", "zh": "「当日」的意思是“那一天”(=その日)。「前の日」(前一天)和「次の日」(后一天)不是那天。"}}, {"id": "G-1-031", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 1, "q": "[[日常]]会話なら、問題なく話せます。", "a": "ふだんの", "w": ["特別な", "初めての", "外国の"], "x": {"ja": "「日常」は「ふだんの」という意味です。「日常会話」は、毎日の生活で使う会話です。「特別な」は反対の意味です。", "en": "「日常」 means \"ordinary, everyday.\" 「日常会話」 is the conversation used in daily life. 「特別な」 (special) is the opposite.", "ne": "「日常」 को अर्थ \"सामान्य/दैनिक\" हो। 「日常会話」 दैनिक जीवनमा प्रयोग हुने कुराकानी हो। 「特別な」(विशेष) उल्टो अर्थ हो।", "vi": "「日常」 nghĩa là \"thường ngày\". 「日常会話」 là hội thoại dùng trong đời sống hằng ngày. 「特別な」(đặc biệt) có nghĩa ngược lại.", "zh": "「日常」的意思是“平常的”。「日常会話」是日常生活中用的会话。「特別な」(特别的)意思相反。"}}, {"id": "G-1-032", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "大雨のため、電車は[[一時]]止まった。", "a": "しばらくの間", "w": ["ずっと", "何度も", "突然"], "x": {"ja": "「一時」は「しばらくの間」という意味で、短い間だけという意味です。「ずっと」は止まったままの長い時間なので合いません。", "en": "「一時」 means \"for a while\" (a short period only). 「ずっと」 (all the time) means a long period, so it doesn't fit.", "ne": "「一時」 को अर्थ \"केही समयको लागि\" हो, छोटो अवधिमात्र। 「ずっと」(निरन्तर) लामो समय हो, मिल्दैन।", "vi": "「一時」 nghĩa là \"trong một lúc\", chỉ một thời gian ngắn. 「ずっと」(suốt) là thời gian dài nên không hợp.", "zh": "「一時」的意思是“一段时间”,只是短暂的时间。「ずっと」(一直)是长时间,不合适。"}}, {"id": "G-1-033", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "[[間もなく]]電車が来ます。", "a": "もうすぐ", "w": ["さっき", "何度も", "ゆっくり"], "x": {"ja": "「間もなく」は「もうすぐ」という意味です。電車が来る少し前に使います。「さっき」は過去のことです。", "en": "「間もなく」 means \"soon\" (=もうすぐ). It's used shortly before a train comes. 「さっき」 (a little while ago) is the past.", "ne": "「間もなく」 को अर्थ \"चाँडै\" (=もうすぐ) हो। रेल आउनुभन्दा केही अगि प्रयोग हुन्छ। 「さっき」(भर्खरै) विगत हो।", "vi": "「間もなく」 nghĩa là \"sắp\" (=もうすぐ). Dùng ngay trước khi tàu đến. 「さっき」(lúc nãy) là quá khứ.", "zh": "「間もなく」的意思是“马上”(=もうすぐ)。电车快到时使用。「さっき」(刚才)是过去。"}}, {"id": "G-1-034", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "[[事前に]]連絡してください。", "a": "前もって", "w": ["後で", "すぐに", "毎回"], "x": {"ja": "「事前に」は「前もって」という意味です。「後で」「すぐに」は、前もってではありません。", "en": "「事前に」 means \"in advance\" (=前もって). 「後で」 (later) and 「すぐに」 (immediately) are not \"in advance.\"", "ne": "「事前に」 को अर्थ \"अगावै\" (=前もって) हो। 「後で」(पछि) र 「すぐに」(तुरुन्तै) अगावै होइनन्।", "vi": "「事前に」 nghĩa là \"làm trước\" (=前もって). 「後で」(sau) và 「すぐに」(ngay) không phải \"trước\".", "zh": "「事前に」的意思是“提前”(=前もって)。「後で」(以后)和「すぐに」(马上)不是提前。"}}, {"id": "G-1-035", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 1, "q": "[[当時]]、この町にはビルが少なかった。", "a": "その頃", "w": ["今", "近い将来", "毎日"], "x": {"ja": "「当時」は「そのころ」という意味で、過去のことです。「今」「近い将来」は合いません。", "en": "「当時」 means \"at that time\" and is about the past. 「今」 (now) and 「近い将来」 (the near future) don't fit.", "ne": "「当時」 को अर्थ \"त्यतिबेला\" हो, विगतको कुरा। 「今」(अहिले) र 「近い将来」(नजिकको भविष्य) मिल्दैनन्।", "vi": "「当時」 nghĩa là \"hồi đó\", chuyện quá khứ. 「今」(bây giờ) và 「近い将来」(tương lai gần) không hợp.", "zh": "「当時」的意思是“那个时候”,是过去的事。「今」(现在)和「近い将来」(不久的将来)不合适。"}}, {"id": "G-1-036", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "あの人は[[年中]]忙しそうだ。", "a": "一年じゅう", "w": ["今年だけ", "来年から", "夏の間だけ"], "x": {"ja": "「年中」は「一年じゅう」という意味です。「年中忙しそう」は、いつも忙しそうということです。", "en": "「年中」 means \"all year round.\" 「年中忙しそう」 means he always seems busy.", "ne": "「年中」 को अर्थ \"वर्षभरि\" हो। 「年中忙しそう」 भनेको सधैँ व्यस्त देखिन्छ भन्ने हो।", "vi": "「年中」 nghĩa là \"suốt năm\". 「年中忙しそう」 là lúc nào cũng có vẻ bận.", "zh": "「年中」的意思是“一整年”。「年中忙しそう」是说总是很忙的样子。"}}, {"id": "G-1-037", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "[[同時]]に二つの仕事はできない。", "a": "同じ時に", "w": ["順番に", "前もって", "少しあとで"], "x": {"ja": "「同時」は「同じ時に」という意味です。「順番に」は一つずつなので反対です。", "en": "「同時」 means \"at the same time.\" 「順番に」 (one after another) is the opposite.", "ne": "「同時」 को अर्थ \"एकै समयमा\" हो। 「順番に」(एकपछि अर्को) उल्टो हो।", "vi": "「同時」 nghĩa là \"cùng lúc\". 「順番に」(lần lượt) có nghĩa ngược lại.", "zh": "「同時」的意思是“在同一时间”。「順番に」(按顺序)意思相反。"}}, {"id": "G-1-038", "subject": "goi", "qtype": "goi-usage", "level": "N2", "unit": "語彙 Unit 1", "freq": 3, "q": "「途端」の使い方として、一番いいものはどれですか。", "a": "家を出た途端、雨が降り始めた。", "w": ["朝起きる途端、顔を洗います。", "駅に着いた途端に、友達に電話をかけよう。", "私は宿題を終えた途端、遊びに行きたいです。"], "x": {"ja": "「Vた途端(に)」(=just when ~)は、あることのすぐあとに、思いがけないことが起こる文に使います。「家を出た途端、雨が降り始めた」が正解です。「起きる途端」「かけよう」「行きたい」のような、意志・希望・習慣の文には使えません。", "en": "「Vた途端(に)」(=the moment ~) is used when something unexpected happens right after an action. 「家を出た途端、雨が降り始めた」 is correct. It cannot be used for will, hope or habit, as in 「起きる途端」, 「かけよう」 or 「行きたい」.", "ne": "「Vた途端(に)」(=~ गर्ने बित्तिकै) कुनै काम गरेपछि तुरुन्तै अनपेक्षित कुरा हुँदा प्रयोग हुन्छ। 「家を出た途端、雨が降り始めた」 सही हो। 「起きる途端」, 「かけよう」, 「行きたい」 जस्ता इच्छा, आशा वा बानीका वाक्यमा प्रयोग गर्न मिल्दैन।", "vi": "「Vた途端(に)」(=vừa ~ thì) dùng khi sau một hành động xảy ra việc bất ngờ. 「家を出た途端、雨が降り始めた」 là đúng. Không dùng được trong câu ý chí, mong muốn, thói quen như 「起きる途端」, 「かけよう」, 「行きたい」.", "zh": "「Vた途端(に)」(=刚一~就)用于某个动作之后马上发生意想不到的事。「家を出た途端、雨が降り始めた」正确。不能用于「起きる途端」「かけよう」「行きたい」这类表示意志、希望、习惯的句子。"}}, {"id": "G-1-039", "subject": "goi", "qtype": "goi-usage", "level": "N2", "unit": "語彙 Unit 1", "freq": 2, "q": "「早速」の使い方として、一番いいものはどれですか。", "a": "引っ越し祝いにもらった{鍋|なべ}で、早速料理を作ってみた。", "w": ["昨日は早速忙しくて、何も食べられなかった。", "彼は早速親切な人なので、みんなに好かれている。", "明日は試験があるので、早速寝ないほうがいい。"], "x": {"ja": "「早速」(=right away)は、あることのあとすぐに行動するときに使います。「もらった鍋で早速料理を作ってみた」が正解です。状態を表す文や、「〜ないほうがいい」の文には使えません。", "en": "「早速」(=right away) is used when someone acts immediately after something. 「もらった鍋で早速料理を作ってみた」 is correct. It cannot be used for states or for 「〜ないほうがいい」 sentences.", "ne": "「早速」(=तुरुन्तै) कुनै कुरापछि तुरुन्तै काम गर्दा प्रयोग हुन्छ। 「もらった鍋で早速料理を作ってみた」 सही हो। अवस्था बताउने वाक्य वा 「〜ないほうがいい」 वाक्यमा प्रयोग गर्न मिल्दैन।", "vi": "「早速」(=ngay lập tức) dùng khi hành động ngay sau một việc nào đó. 「もらった鍋で早速料理を作ってみた」 là đúng. Không dùng cho câu chỉ trạng thái hay câu 「〜ないほうがいい」.", "zh": "「早速」(=立刻)用于某事之后马上行动。「もらった鍋で早速料理を作ってみた」正确。不能用于表示状态的句子或「〜ないほうがいい」的句子。"}}, {"id": "G-2-001", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 1, "q": "家族みんなで（　）を囲んで夕食を食べた。", "a": "{食卓|しょくたく}", "w": ["洗面所", "寝室", "近所"], "x": {"ja": "家族で夕食を食べるために囲む場所は「食卓」(=dining table)です。「洗面所」は顔を洗うところ、「寝室」は寝る部屋です。", "en": "The place the family sits around to eat dinner is the 「食卓」(=dining table). 「洗面所」 is where you wash your face, and 「寝室」 is the bedroom.", "ne": "परिवारले बेलुकाको खाना खान घेरिने ठाउँ 「食卓」(=भोजन टेबल) हो। 「洗面所」 मुख धुने ठाउँ र 「寝室」 सुत्ने कोठा हो।", "vi": "Nơi cả nhà quây quần ăn tối là 「食卓」(=bàn ăn). 「洗面所」 là chỗ rửa mặt, 「寝室」 là phòng ngủ.", "zh": "全家围坐吃晚饭的地方是「食卓」(=餐桌)。「洗面所」是洗脸的地方,「寝室」是卧室。"}}, {"id": "G-2-002", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 1, "q": "朝は（　）で顔を洗って、歯をみがく。", "a": "洗面所", "w": ["{食卓|しょくたく}", "寝室", "物件"], "x": {"ja": "顔を洗って歯をみがく場所は「洗面所」(=washroom, sink area)です。「食卓」はご飯を食べるテーブル、「寝室」は寝る部屋です。", "en": "The place to wash your face and brush your teeth is the 「洗面所」(=washroom). 「食卓」 is the dining table, and 「寝室」 is the bedroom.", "ne": "मुख धुने र दाँत माझ्ने ठाउँ 「洗面所」(=वासबेसिन भएको ठाउँ) हो। 「食卓」 खाने टेबल र 「寝室」 सुत्ने कोठा हो।", "vi": "Nơi rửa mặt và đánh răng là 「洗面所」(=chỗ rửa mặt). 「食卓」 là bàn ăn, 「寝室」 là phòng ngủ.", "zh": "洗脸刷牙的地方是「洗面所」(=盥洗室)。「食卓」是吃饭的桌子,「寝室」是睡觉的房间。"}}, {"id": "G-2-003", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 1, "q": "この家には、子ども部屋が2つと、夫婦の（　）が1つあります。", "a": "寝室", "w": ["管理人", "近所", "物件"], "x": {"ja": "夫婦が寝る部屋は「寝室」(=bedroom)です。「管理人」は人、「近所」は家の近くの場所、「物件」は家や部屋のことです。", "en": "The room where the couple sleeps is the 「寝室」(=bedroom). 「管理人」 is a person, 「近所」 is the neighborhood, and 「物件」 is a house or room for rent/sale.", "ne": "दम्पतीले सुत्ने कोठा 「寝室」(=सुत्ने कोठा) हो। 「管理人」 व्यक्ति, 「近所」 घर वरपरको ठाउँ र 「物件」 घर वा कोठा हो।", "vi": "Phòng vợ chồng ngủ là 「寝室」(=phòng ngủ). 「管理人」 là người, 「近所」 là khu xung quanh nhà, 「物件」 là nhà hoặc phòng (bất động sản).", "zh": "夫妇睡觉的房间是「寝室」(=卧室)。「管理人」是人,「近所」是家附近,「物件」是房屋或房间。"}}, {"id": "G-2-004", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "（　）の人とは、会ったらあいさつをするようにしている。", "a": "近所", "w": ["自宅", "物件", "家賃"], "x": {"ja": "家の近くに住んでいる人は「近所」(=neighborhood)の人です。「自宅」は自分の家、「家賃」は部屋を借りるお金です。", "en": "People who live near your home are people of the 「近所」(=neighborhood). 「自宅」 is one's own house, and 「家賃」 is the rent.", "ne": "घर नजिक बस्ने मानिसहरू 「近所」(=छिमेक) का मानिस हुन्। 「自宅」 आफ्नो घर र 「家賃」 कोठा भाडा हो।", "vi": "Người sống gần nhà là người 「近所」(=hàng xóm, khu lân cận). 「自宅」 là nhà mình, 「家賃」 là tiền thuê nhà.", "zh": "住在家附近的人是「近所」(=邻居、附近)的人。「自宅」是自己的家,「家賃」是房租。"}}, {"id": "G-2-005", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "届いた荷物を（　）に持って帰った。", "a": "自宅", "w": ["近所", "管理人", "大家"], "x": {"ja": "荷物を持って帰る場所は、自分の家の「自宅」(=one's own home)です。「大家」「管理人」は人なので、「持って帰る」場所ではありません。", "en": "The place you bring your package back to is your own home, 「自宅」(=one's home). 「大家」 and 「管理人」 are people, not places to go home to.", "ne": "सामान लिएर फर्किने ठाउँ आफ्नै घर 「自宅」(=आफ्नो घर) हो। 「大家」 र 「管理人」 व्यक्ति हुन्, फर्किने ठाउँ होइनन्।", "vi": "Nơi mang đồ về là nhà mình, 「自宅」(=nhà riêng). 「大家」 và 「管理人」 là người, không phải nơi để về.", "zh": "把包裹带回的地方是自己的家「自宅」(=自己家)。「大家」「管理人」是人,不是可以带回去的地方。"}}, {"id": "G-2-006", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "この辺りは静かな（　）街で、商店はあまりない。", "a": "住宅", "w": ["賃貸", "物件", "寝室"], "x": {"ja": "「住宅街」(=residential area)は、家がたくさんある場所です。「商店はあまりない」という説明と合います。「賃貸」は借りること、「物件」は家や部屋のことです。", "en": "「住宅街」(=a residential area) is a place with many houses, which matches \"few shops.\" 「賃貸」 means renting, and 「物件」 is a house or room.", "ne": "「住宅街」(=आवासीय क्षेत्र) धेरै घर भएको ठाउँ हो, \"पसल कम\" भन्ने कुरासँग मिल्छ। 「賃貸」 भाडामा लिनु र 「物件」 घर वा कोठा हो।", "vi": "「住宅街」(=khu dân cư) là nơi có nhiều nhà, hợp với \"ít cửa hàng\". 「賃貸」 là thuê, 「物件」 là nhà hoặc phòng.", "zh": "「住宅街」(=住宅区)是有很多住宅的地方,与“商店不多”相符。「賃貸」是出租,「物件」是房屋或房间。"}}, {"id": "G-2-007", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "家は買わずに、（　）のアパートに住むことにした。", "a": "賃貸", "w": ["家賃", "物件", "住宅"], "x": {"ja": "家を買わずに、お金を払って借りる家は「賃貸」(=rental)です。「家賃」は借りるお金、「住宅」は人が住む家のことです。", "en": "A home you rent by paying money instead of buying is a 「賃貸」(=rental). 「家賃」 is the rent money, and 「住宅」 is a house to live in.", "ne": "घर नकिनी पैसा तिरेर भाडामा लिइने घर 「賃貸」(=भाडाको) हो। 「家賃」 भाडाको पैसा र 「住宅」 बस्ने घर हो。", "vi": "Nhà không mua mà trả tiền thuê là 「賃貸」(=cho thuê). 「家賃」 là tiền thuê, 「住宅」 là nhà để ở.", "zh": "不买房而是付钱租的房子是「賃貸」(=出租、租赁)。「家賃」是租金,「住宅」是住的房子。"}}, {"id": "G-2-008", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 3, "q": "この部屋は駅から近いので、（　）が高い。", "a": "家賃", "w": ["賃貸", "日当たり", "間取り"], "x": {"ja": "駅から近い部屋は、人気があるので「家賃」(=rent)が高いです。「賃貸」は借りること、「日当たり」は日の光、「間取り」は部屋の配置です。", "en": "A room close to the station is popular, so the 「家賃」(=rent) is high. 「賃貸」 means renting, 「日当たり」 is sunlight, and 「間取り」 is the room layout.", "ne": "स्टेशन नजिकको कोठा लोकप्रिय हुने भएकाले 「家賃」(=भाडा) महँगो हुन्छ। 「賃貸」 भाडामा लिनु, 「日当たり」 घामको उज्यालो र 「間取り」 कोठाको बनावट हो।", "vi": "Phòng gần ga được ưa chuộng nên 「家賃」(=tiền thuê nhà) cao. 「賃貸」 là thuê, 「日当たり」 là ánh nắng, 「間取り」 là cách bố trí phòng.", "zh": "离车站近的房间很受欢迎,所以「家賃」(=房租)高。「賃貸」是租赁,「日当たり」是日照,「間取り」是户型。"}}, {"id": "G-2-009", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "不動産屋で、条件に合う（　）を紹介してもらった。", "a": "物件", "w": ["間取り", "日当たり", "家賃"], "x": {"ja": "不動産屋が紹介するのは、家や部屋の「物件」(=a property)です。「間取り」は部屋の配置、「家賃」はお金のことです。", "en": "What a real estate agent introduces is a 「物件」(=a property: a house or room). 「間取り」 is the layout, and 「家賃」 is the rent.", "ne": "घरजग्गा एजेन्टले चिनाउने कुरा घर वा कोठा 「物件」(=सम्पत्ति) हो। 「間取り」 कोठाको बनावट र 「家賃」 भाडा हो।", "vi": "Công ty bất động sản giới thiệu 「物件」(=bất động sản: nhà hoặc phòng). 「間取り」 là cách bố trí phòng, 「家賃」 là tiền thuê.", "zh": "房产中介介绍的是房屋或房间,即「物件」(=房产)。「間取り」是户型,「家賃」是租金。"}}, {"id": "G-2-010", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "（　）の悪い部屋は、昼でも暗くて、{洗濯物|せんたくもの}が{乾|かわ}きにくい。", "a": "日当たり", "w": ["家賃", "最寄り", "賃貸"], "x": {"ja": "昼でも暗くて洗濯物が乾きにくいのは、太陽の光が入らないからです。「日当たり」(=sunlight)が正解です。「最寄り」は一番近いことです。", "en": "A room that is dark even at noon and where laundry dries slowly gets little sun, so 「日当たり」(=sunlight exposure) is correct. 「最寄り」 means nearest.", "ne": "दिउँसो पनि अँध्यारो र लुगा सुक्न गाह्रो हुनु घाम नआउनु हो, त्यसैले 「日当たり」(=घाम पर्ने अवस्था) सही हो। 「最寄り」 सबैभन्दा नजिक हो।", "vi": "Ban ngày cũng tối, đồ giặt khó khô là vì thiếu ánh nắng, nên 「日当たり」(=độ nắng chiếu vào) là đúng. 「最寄り」 là gần nhất.", "zh": "白天也很暗、衣服难干,是因为阳光照不进来,所以「日当たり」(=日照)正确。「最寄り」是最近的。"}}, {"id": "G-2-011", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "この家は（　）がよくて、狭くても広く感じる。", "a": "間取り", "w": ["家賃", "最寄り", "大家"], "x": {"ja": "狭くても広く感じるのは、部屋の配置がいいからです。「間取り」(=floor plan)が正解です。「大家」は建物を持っている人です。", "en": "A small house that feels spacious has a good layout, so 「間取り」(=floor plan) is correct. 「大家」 is the owner of the building.", "ne": "सानो भए पनि फराकिलो लाग्नु कोठाको बनावट राम्रो भएकाले हो, त्यसैले 「間取り」(=कोठाको नक्सा) सही हो। 「大家」 भवनको मालिक हो।", "vi": "Nhỏ mà thấy rộng là nhờ cách bố trí phòng tốt, nên 「間取り」(=sơ đồ phòng) là đúng. 「大家」 là chủ nhà.", "zh": "虽然小却觉得宽敞,是因为布局好,所以「間取り」(=户型)正确。「大家」是房东。"}}, {"id": "G-2-012", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "このアパートは（　）30年なので、古いけれど家賃が安い。", "a": "築", "w": ["{徒歩|とほ}", "南向き", "最寄り"], "x": {"ja": "「築30年」(=built 30 years ago)は、建ててから30年たったという意味です。古い建物を表します。「徒歩」「最寄り」は場所や行き方のことです。", "en": "「築30年」(=30 years since built) means 30 years have passed since it was built, showing an old building. 「徒歩」 and 「最寄り」 are about location or how to get there.", "ne": "「築30年」(=बनेको ३० वर्ष) भनेको बनेको ३० वर्ष भयो भन्ने हो, पुरानो भवन जनाउँछ। 「徒歩」 र 「最寄り」 ठाउँ वा जाने तरिकासँग सम्बन्धित हुन्।", "vi": "「築30年」(=xây được 30 năm) nghĩa là đã 30 năm kể từ khi xây, chỉ tòa nhà cũ. 「徒歩」 và 「最寄り」 nói về vị trí hay cách đi.", "zh": "「築30年」(=建成30年)是说建好后已过了30年,表示旧建筑。「徒歩」「最寄り」是关于位置或走法的词。"}}, {"id": "G-2-013", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "（　）の部屋は、冬でも日がよく入って暖かい。", "a": "南向き", "w": ["北向き", "ペット不可", "防犯"], "x": {"ja": "冬でも日がよく入って暖かいのは、太陽の方向の「南向き」(=south-facing)の部屋です。「北向き」は反対で、日が入りにくいです。", "en": "A room that gets sun and stays warm even in winter is 「南向き」(=south-facing). 「北向き」 (north-facing) is the opposite and gets little sun.", "ne": "जाडोमा पनि घाम राम्रोसँग आएर तातो हुने कोठा 「南向き」(=दक्षिणतर्फ फर्केको) हो। 「北向き」(उत्तरतर्फ) उल्टो हो, घाम कम आउँछ।", "vi": "Phòng có nắng, ấm cả mùa đông là phòng 「南向き」(=hướng nam). 「北向き」(hướng bắc) thì ngược lại, ít nắng.", "zh": "冬天也能照进阳光、很暖和的是「南向き」(=朝南)的房间。「北向き」(朝北)相反,不容易照进阳光。"}}, {"id": "G-2-014", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "地震のときは、（　）の{避難所|ひなんじょ}に行ってください。", "a": "最寄り", "w": ["住宅", "賃貸", "日当たり"], "x": {"ja": "「いちばん近い」避難所は、「最寄り」(=nearest)の避難所です。「住宅」「賃貸」は家に関係する言葉で、近さは表しません。", "en": "The shelter that is the closest is the 「最寄り」(=nearest) shelter. 「住宅」 and 「賃貸」 are about housing and do not express nearness.", "ne": "सबैभन्दा नजिकको आश्रयस्थल 「最寄り」(=सबैभन्दा नजिकको) आश्रयस्थल हो। 「住宅」 र 「賃貸」 घरसँग सम्बन्धित शब्द हुन्, नजिकपन जनाउँदैनन्।", "vi": "Nơi lánh nạn gần nhất là nơi lánh nạn 「最寄り」(=gần nhất). 「住宅」 và 「賃貸」 liên quan đến nhà ở, không chỉ độ gần.", "zh": "最近的避难所就是「最寄り」(=最近的)避难所。「住宅」「賃貸」是和住房有关的词,不表示距离近。"}}, {"id": "G-2-015", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "駅から（　）5分の便利な場所にある。", "a": "{徒歩|とほ}", "w": ["築", "最寄り", "南向き"], "x": {"ja": "「徒歩5分」(=5 minutes on foot)は、歩いて5分という意味です。「築」は建ててからの年数、「最寄り」は一番近いことです。", "en": "「徒歩5分」(=5 minutes on foot) means five minutes by walking. 「築」 is the years since built, and 「最寄り」 means nearest.", "ne": "「徒歩5分」(=पैदल ५ मिनेट) को अर्थ हिँडेर ५ मिनेट हो। 「築」 बनेको वर्ष र 「最寄り」 सबैभन्दा नजिक हो।", "vi": "「徒歩5分」(=đi bộ 5 phút) nghĩa là đi bộ mất 5 phút. 「築」 là số năm kể từ khi xây, 「最寄り」 là gần nhất.", "zh": "「徒歩5分」(=步行5分钟)是走路5分钟的意思。「築」是建成后的年数,「最寄り」是最近的。"}}, {"id": "G-2-016", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "アパートを所有している（　）さんは、同じ建物の1階に住んでいる。", "a": "大家", "w": ["管理人", "不動産屋", "近所"], "x": {"ja": "アパートを持っている人は「大家」(=landlord)です。「管理人」は建物の世話をする人で、持ち主ではありません。", "en": "The person who owns the apartment is the 「大家」(=landlord). The 「管理人」 looks after the building and is not the owner.", "ne": "अपार्टमेन्टको मालिक 「大家」(=घरधनी) हो। 「管理人」 भवनको हेरचाह गर्ने व्यक्ति हो, मालिक होइन।", "vi": "Người sở hữu căn hộ là 「大家」(=chủ nhà). 「管理人」 là người trông coi tòa nhà, không phải chủ sở hữu.", "zh": "拥有公寓的人是「大家」(=房东)。「管理人」是照管建筑的人,不是所有者。"}}, {"id": "G-2-017", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "留守の間に届いた荷物は、マンションの（　）室に預けてあった。", "a": "管理人", "w": ["大家", "近所", "賃貸"], "x": {"ja": "留守の間に荷物を預かってくれる人は「管理人」(=building manager)です。「管理人室」はその人がいる部屋です。「大家」は建物の持ち主です。", "en": "The person who keeps packages while you're out is the 「管理人」(=building manager), and the 「管理人室」 is their office. 「大家」 is the owner.", "ne": "तपाईं नहुँदा सामान राखिदिने व्यक्ति 「管理人」(=भवन व्यवस्थापक) हो, 「管理人室」 उनको कोठा हो। 「大家」 मालिक हो।", "vi": "Người giữ hộ đồ khi vắng nhà là 「管理人」(=quản lý tòa nhà), 「管理人室」 là phòng của người đó. 「大家」 là chủ sở hữu.", "zh": "你不在家时帮忙代收包裹的人是「管理人」(=管理员),「管理人室」是管理员的房间。「大家」是房东。"}}, {"id": "G-2-018", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "一人暮らしなので、（　）カメラが付いているマンションを選んだ。", "a": "防犯", "w": ["予防", "防止", "防災"], "x": {"ja": "「防犯カメラ」(=security camera)は、泥棒などの犯罪を防ぐカメラです。「防犯」は犯罪を防ぐこと、「防災」は災害を防ぐこと、「予防」は病気などを防ぐことです。", "en": "A 「防犯カメラ」(=security camera) helps prevent crimes like theft. 「防犯」 is crime prevention, 「防災」 is disaster prevention, and 「予防」 is preventing things like illness.", "ne": "「防犯カメラ」(=सुरक्षा क्यामेरा) चोरी जस्ता अपराध रोक्ने क्यामेरा हो। 「防犯」 अपराध रोकथाम, 「防災」 विपद् रोकथाम र 「予防」 रोग आदिको रोकथाम हो।", "vi": "「防犯カメラ」(=camera an ninh) là camera ngăn tội phạm như trộm cắp. 「防犯」 là phòng chống tội phạm, 「防災」 là phòng chống thiên tai, 「予防」 là phòng bệnh.", "zh": "「防犯カメラ」(=防盗监控摄像头)是防止盗窃等犯罪的摄像头。「防犯」是防止犯罪,「防災」是防灾,「予防」是预防疾病等。"}}, {"id": "G-2-019", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "このアパートは（　）なので、犬も猫も飼えません。", "a": "ペット不可", "w": ["ペット可", "家具付き", "エアコン付き"], "x": {"ja": "犬も猫も飼えないので、「ペット不可」(=no pets allowed)が正解です。「ペット可」は反対で、ペットを飼ってもいいという意味です。", "en": "Neither dogs nor cats are allowed, so 「ペット不可」(=no pets allowed) is correct. 「ペット可」 is the opposite: pets are allowed.", "ne": "कुकुर र बिरालो दुवै पाल्न नमिल्ने भएकाले 「ペット不可」(=घरपालुवा जनावर निषेध) सही हो। 「ペット可」 उल्टो हो, पाल्न मिल्छ भन्ने अर्थ।", "vi": "Chó mèo đều không nuôi được nên 「ペット不可」(=cấm nuôi thú cưng) là đúng. 「ペット可」 ngược lại, nghĩa là được nuôi.", "zh": "狗和猫都不能养,所以「ペット不可」(=禁止养宠物)正确。「ペット可」相反,是可以养宠物。"}}, {"id": "G-2-020", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "（　）の部屋なので、ベッドも{冷蔵庫|れいぞうこ}も買わなくていい。", "a": "家具付き", "w": ["ペット不可", "北向き", "築30年"], "x": {"ja": "ベッドも冷蔵庫も買わなくていいのは、最初からある「家具付き」(=furnished)の部屋だからです。", "en": "You don't need to buy a bed or fridge because it's a 「家具付き」(=furnished) room, where furniture is already provided.", "ne": "ओछ्यान र फ्रिज किन्न नपर्ने कारण पहिलेदेखि नै फर्निचर भएको 「家具付き」(=फर्निचरसहितको) कोठा हुनु हो।", "vi": "Không cần mua giường, tủ lạnh vì là phòng 「家具付き」(=có sẵn nội thất).", "zh": "不用买床和冰箱,是因为这是「家具付き」(=带家具)的房间。"}}, {"id": "G-2-021", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 1, "q": "ラップをして（　）に入れると、すぐに温まる。", "a": "電子レンジ", "w": ["{炊飯器|すいはんき}", "やかん", "{包丁|ほうちょう}"], "x": {"ja": "ラップをした食べ物を温める機械は「電子レンジ」(=microwave)です。「炊飯器」はご飯をたく機械、「やかん」はお湯をわかす道具です。", "en": "The machine that warms food covered with plastic wrap is the 「電子レンジ」(=microwave). 「炊飯器」 cooks rice, and 「やかん」 boils water.", "ne": "र्‍यापले छोपेको खाना तताउने मेसिन 「電子レンジ」(=माइक्रोवेभ) हो। 「炊飯器」 भात पकाउने मेसिन र 「やかん」 पानी उमाल्ने भाँडो हो।", "vi": "Máy làm nóng thức ăn bọc màng bọc là 「電子レンジ」(=lò vi sóng). 「炊飯器」 là nồi cơm điện, 「やかん」 là ấm đun nước.", "zh": "给盖了保鲜膜的食物加热的机器是「電子レンジ」(=微波炉)。「炊飯器」是煮饭的电饭煲,「やかん」是烧水壶。"}}, {"id": "G-2-022", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 1, "q": "（　）のスイッチを入れておいたので、帰ったらすぐご飯が食べられる。", "a": "{炊飯器|すいはんき}", "w": ["電子レンジ", "やかん", "{包丁|ほうちょう}"], "x": {"ja": "スイッチを入れておくと、帰ってすぐご飯が食べられる機械は「炊飯器」(=rice cooker)です。「電子レンジ」は温める機械です。", "en": "A machine you switch on so that rice is ready when you get home is the 「炊飯器」(=rice cooker). 「電子レンジ」 is for warming food.", "ne": "स्विच अन गरेर राख्दा घर फर्कनासाथ भात खान मिल्ने मेसिन 「炊飯器」(=राइस कुकर) हो। 「電子レンジ」 तताउने मेसिन हो।", "vi": "Bật công tắc sẵn thì về nhà là có cơm ăn ngay: đó là 「炊飯器」(=nồi cơm điện). 「電子レンジ」 là máy làm nóng.", "zh": "提前按下开关,回家就能马上吃上饭,这是「炊飯器」(=电饭煲)。「電子レンジ」是加热用的机器。"}}, {"id": "G-2-023", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 1, "q": "お茶を入れるために、（　）でお湯をわかした。", "a": "やかん", "w": ["{包丁|ほうちょう}", "{炊飯器|すいはんき}", "{食卓|しょくたく}"], "x": {"ja": "お湯をわかす道具は「やかん」(=kettle)です。「包丁」は切る道具、「炊飯器」はご飯をたく機械です。", "en": "The tool for boiling water is the 「やかん」(=kettle). 「包丁」 is a knife for cutting, and 「炊飯器」 cooks rice.", "ne": "पानी उमाल्ने भाँडो 「やかん」(=केतली) हो। 「包丁」 काट्ने चक्कु र 「炊飯器」 भात पकाउने मेसिन हो।", "vi": "Dụng cụ đun nước sôi là 「やかん」(=ấm đun nước). 「包丁」 là dao để cắt, 「炊飯器」 là nồi cơm điện.", "zh": "烧开水的用具是「やかん」(=水壶)。「包丁」是切东西的菜刀,「炊飯器」是煮饭的电饭煲。"}}, {"id": "G-2-024", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 2", "freq": 1, "q": "この（　）はよく切れるので、肉も魚も簡単に切れる。", "a": "{包丁|ほうちょう}", "w": ["やかん", "{炊飯器|すいはんき}", "電子レンジ"], "x": {"ja": "肉や魚を切る道具は「包丁」(=kitchen knife)です。「よく切れる」という言葉と合います。", "en": "The tool for cutting meat and fish is the 「包丁」(=kitchen knife). It matches the phrase \"cuts well.\"", "ne": "मासु र माछा काट्ने औजार 「包丁」(=रसोईको चक्कु) हो। \"राम्ररी काटिन्छ\" भन्ने कुरासँग मिल्छ।", "vi": "Dụng cụ cắt thịt cá là 「包丁」(=dao làm bếp). Hợp với cụm \"cắt rất bén\".", "zh": "切肉和鱼的工具是「包丁」(=菜刀)。与“很锋利”这句话相符。"}}, {"id": "G-2-025", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "[[自宅]]でゆっくり休みます。", "a": "自分の家", "w": ["会社", "友達の家", "ホテル"], "x": {"ja": "「自宅」は「自分の家」という意味です。「ゆっくり休む」場所として合います。「会社」「ホテル」は自分の家ではありません。", "en": "「自宅」 means \"one's own home.\" It fits as a place to rest quietly. 「会社」 (company) and 「ホテル」 (hotel) are not one's home.", "ne": "「自宅」 को अर्थ \"आफ्नो घर\" हो। आराम गर्ने ठाउँको रूपमा मिल्छ। 「会社」(कम्पनी) र 「ホテル」(होटल) आफ्नो घर होइनन्।", "vi": "「自宅」 nghĩa là \"nhà của mình\". Hợp với nơi nghỉ ngơi thong thả. 「会社」(công ty) và 「ホテル」(khách sạn) không phải nhà mình.", "zh": "「自宅」的意思是“自己的家”。适合作为好好休息的地方。「会社」(公司)和「ホテル」(酒店)不是自己的家。"}}, {"id": "G-2-026", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "[[最寄り]]の駅まで歩いて行きます。", "a": "いちばん近い", "w": ["いちばん大きい", "いちばん古い", "いちばん安い"], "x": {"ja": "「最寄り」は「いちばん近い」という意味です。「最寄りの駅」は、いちばん近い駅のことです。「大きい」「古い」「安い」ではありません。", "en": "「最寄り」 means \"nearest.\" 「最寄りの駅」 is the closest station. It does not mean biggest, oldest or cheapest.", "ne": "「最寄り」 को अर्थ \"सबैभन्दा नजिकको\" हो। 「最寄りの駅」 सबैभन्दा नजिकको स्टेशन हो। सबैभन्दा ठूलो, पुरानो वा सस्तो होइन।", "vi": "「最寄り」 nghĩa là \"gần nhất\". 「最寄りの駅」 là ga gần nhất. Không phải lớn nhất, cũ nhất hay rẻ nhất.", "zh": "「最寄り」的意思是“最近的”。「最寄りの駅」是最近的车站。不是最大、最旧或最便宜的。"}}, {"id": "G-2-027", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "[[家賃]]を毎月払っています。", "a": "部屋を借りるためのお金", "w": ["電気を使ったお金", "学校に払うお金", "国に払うお金"], "x": {"ja": "「家賃」は、部屋を借りるために毎月払うお金です。電気代や学費、税金ではありません。", "en": "「家賃」 is the money paid every month to rent a room. It is not an electricity bill, school fees or taxes.", "ne": "「家賃」 कोठा भाडामा लिन हरेक महिना तिर्ने पैसा हो। बिजुली बिल, पढाइ शुल्क वा कर होइन।", "vi": "「家賃」 là tiền trả hằng tháng để thuê phòng. Không phải tiền điện, học phí hay thuế.", "zh": "「家賃」是每月为租房付的钱。不是电费、学费或税金。"}}, {"id": "G-2-028", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "[[{徒歩|とほ}]]で10分かかります。", "a": "歩いて", "w": ["自転車で", "バスで", "電車で"], "x": {"ja": "「徒歩」は「歩いて」という意味です。「徒歩で10分」は、歩いて10分かかるということです。", "en": "「徒歩」 means \"on foot.\" 「徒歩で10分」 means it takes ten minutes by walking.", "ne": "「徒歩」 को अर्थ \"हिँडेर\" हो। 「徒歩で10分」 भनेको हिँडेर १० मिनेट लाग्छ भन्ने हो।", "vi": "「徒歩」 nghĩa là \"đi bộ\". 「徒歩で10分」 là đi bộ mất 10 phút.", "zh": "「徒歩」的意思是“步行”。「徒歩で10分」是走路要花10分钟。"}}, {"id": "G-2-029", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "マンションの[[管理人]]に荷物を預けた。", "a": "建物の世話をする人", "w": ["部屋を紹介する人", "隣に住んでいる人", "家賃を集めて建物を持っている人"], "x": {"ja": "「管理人」は建物の世話をする人です。「家賃を集めて建物を持っている人」は「大家」、「部屋を紹介する人」は「不動産屋」です。", "en": "A 「管理人」(=building manager) is a person who looks after the building. The person who collects rent and owns the building is the 「大家」, and the one who introduces rooms is a 「不動産屋」.", "ne": "「管理人」(=भवन व्यवस्थापक) भवनको हेरचाह गर्ने व्यक्ति हो। भाडा उठाउने र भवनको मालिक 「大家」 हो, कोठा चिनाउने व्यक्ति 「不動産屋」 हो।", "vi": "「管理人」(=người quản lý) là người trông coi tòa nhà. Người thu tiền thuê và sở hữu tòa nhà là 「大家」, người giới thiệu phòng là 「不動産屋」.", "zh": "「管理人」(=管理员)是照管建筑的人。收租并拥有建筑的是「大家」,介绍房间的是「不動産屋」。"}}, {"id": "G-2-030", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "[[日当たり]]がいい部屋を探しています。", "a": "太陽の光がよく入ること", "w": ["駅に近いこと", "部屋が広いこと", "家賃が安いこと"], "x": {"ja": "「日当たり」は、太陽の光がよく入ることです。駅に近いことや広さ、家賃のことではありません。", "en": "「日当たり」 means how well sunlight comes in. It is not about being near the station, size or rent.", "ne": "「日当たり」 घाम कत्तिको राम्रोसँग आउँछ भन्ने हो। स्टेशन नजिक हुनु, ठूलो हुनु वा भाडासँग सम्बन्धित होइन।", "vi": "「日当たり」 là việc ánh nắng chiếu vào nhiều. Không liên quan đến gần ga, độ rộng hay tiền thuê.", "zh": "「日当たり」是阳光照进来的程度。与离车站近、面积大小或房租无关。"}}, {"id": "G-2-031", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 2", "freq": 2, "q": "[[賃貸]]の部屋に住んでいる。", "a": "お金を払って借りている", "w": ["自分で買った", "親にもらった", "会社が無料で貸してくれた"], "x": {"ja": "「賃貸」は、お金を払って借りることです。「自分で買った」は「購入」、「親にもらった」「会社が無料で貸してくれた」は賃貸ではありません。", "en": "「賃貸」 means renting by paying money. \"Bought it oneself\" is a purchase, and receiving it from parents or free from the company is not 「賃貸」.", "ne": "「賃貸」 पैसा तिरेर भाडामा लिनु हो। \"आफैँ किन्नु\" खरिद हो, अभिभावकले दिनु वा कम्पनीले निःशुल्क दिनु 「賃貸」 होइन।", "vi": "「賃貸」 là trả tiền để thuê. \"Tự mua\" là mua nhà, được bố mẹ cho hoặc công ty cho ở miễn phí thì không phải 「賃貸」.", "zh": "「賃貸」是付钱租借。“自己买的”是购买,父母给的或公司免费借的都不是「賃貸」。"}}, {"id": "G-3-001", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 1, "q": "（　）は紙でできていて、{硬貨|こうか}より軽い。", "a": "{紙幣|しへい}", "w": ["{硬貨|こうか}", "預金", "収入"], "x": {"ja": "紙でできているお金は「紙幣」(=banknote)です。「硬貨」は金属のお金(コイン)で、「預金」は銀行に預けたお金です。", "en": "Money made of paper is a 「紙幣」(=banknote). 「硬貨」 is metal money (coins), and 「預金」 is money deposited at a bank.", "ne": "कागजबाट बनेको पैसा 「紙幣」(=नोट) हो। 「硬貨」 धातुको पैसा (सिक्का) र 「預金」 बैंकमा राखेको पैसा हो।", "vi": "Tiền làm bằng giấy là 「紙幣」(=tiền giấy). 「硬貨」 là tiền kim loại (đồng xu), 「預金」 là tiền gửi ngân hàng.", "zh": "纸做的钱是「紙幣」(=纸币)。「硬貨」是金属钱(硬币),「預金」是存在银行的钱。"}}, {"id": "G-3-002", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "去年は（　）が少なくて、貯金ができなかった。", "a": "収入", "w": ["支出", "税金", "料金"], "x": {"ja": "貯金ができなかったのは、入ってくるお金が少なかったからです。「収入」(=income)が正解です。「支出」は出ていくお金で、反対の意味です。", "en": "The person couldn't save because the money coming in was small: 「収入」(=income) is correct. 「支出」 is money going out, the opposite.", "ne": "बचत गर्न नसकिएको आम्दानी कम भएकाले हो: 「収入」(=आम्दानी) सही हो। 「支出」 बाहिर जाने पैसा हो, उल्टो अर्थ।", "vi": "Không tiết kiệm được vì tiền vào ít: 「収入」(=thu nhập) là đúng. 「支出」 là tiền chi ra, nghĩa ngược lại.", "zh": "没能存钱是因为进来的钱少,所以「収入」(=收入)正确。「支出」是花出去的钱,意思相反。"}}, {"id": "G-3-003", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "毎月の（　）が収入より多いので、貯金が減っていく。", "a": "支出", "w": ["収入", "預金", "黒字"], "x": {"ja": "収入より多くて貯金が減るのは、出ていくお金の「支出」(=expenses)です。「収入」は入ってくるお金、「黒字」はお金が余ることです。", "en": "Money that exceeds income and reduces savings is 「支出」(=expenses), the money going out. 「収入」 is money coming in, and 「黒字」 means a surplus.", "ne": "आम्दानीभन्दा बढी भएर बचत घट्नु बाहिर
