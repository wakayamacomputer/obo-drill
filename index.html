 जाने पैसा 「支出」(=खर्च) हो। 「収入」 आउने पैसा र 「黒字」 पैसा बाँकी हुनु हो।", "vi": "Nhiều hơn thu nhập nên tiền tiết kiệm giảm: đó là tiền chi ra 「支出」(=chi tiêu). 「収入」 là tiền vào, 「黒字」 là thặng dư.", "zh": "比收入多、存款减少的是花出去的钱「支出」(=支出)。「収入」是进来的钱,「黒字」是有盈余。"}}, {"id": "G-3-004", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "給料は毎月、銀行の（　）に振り込まれる。", "a": "口座", "w": ["領収書", "{請求書|せいきゅうしょ}", "{為替|かわせ}"], "x": {"ja": "給料が振り込まれる銀行のものは「口座」(=bank account)です。「領収書」は払った証拠、「請求書」はお金を払ってもらうための紙、「為替」はお金を送る仕組みです。", "en": "What a salary is transferred into at a bank is the 「口座」(=bank account). 「領収書」 is a receipt, 「請求書」 is a bill, and 「為替」 is a money transfer system.", "ne": "तलब बैंकमा जम्मा हुने ठाउँ 「口座」(=बैंक खाता) हो। 「領収書」 रसिद, 「請求書」 बिल र 「為替」 पैसा पठाउने प्रणाली हो।", "vi": "Nơi lương được chuyển vào ở ngân hàng là 「口座」(=tài khoản ngân hàng). 「領収書」 là biên lai, 「請求書」 là hóa đơn đòi tiền, 「為替」 là chuyển tiền.", "zh": "工资打进银行的是「口座」(=银行账户)。「領収書」是收据,「請求書」是付款通知单,「為替」是汇款方式。"}}, {"id": "G-3-005", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "銀行にお金を（　）しておけば、安全だ。", "a": "預金", "w": ["寄付", "消費", "{請求|せいきゅう}"], "x": {"ja": "銀行にお金をあずけることは「預金」(=deposit)と言います。「寄付」はお金をあげること、「消費」は使うこと、「請求」はお金を払うように言うことです。", "en": "Putting money in a bank is called 「預金」(=deposit). 「寄付」 is donating money, 「消費」 is spending, and 「請求」 is asking someone to pay.", "ne": "बैंकमा पैसा राख्नुलाई 「預金」(=निक्षेप) भनिन्छ। 「寄付」 पैसा दान गर्नु, 「消費」 खर्च गर्नु र 「請求」 तिर्न माग्नु हो।", "vi": "Gửi tiền vào ngân hàng gọi là 「預金」(=tiền gửi). 「寄付」 là quyên góp, 「消費」 là tiêu dùng, 「請求」 là yêu cầu thanh toán.", "zh": "把钱存进银行叫「預金」(=存款)。「寄付」是捐钱,「消費」是消费,「請求」是要求付款。"}}, {"id": "G-3-006", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "払ったという{証拠|しょうこ}として、店で（　）をもらった。", "a": "領収書", "w": ["{請求書|せいきゅうしょ}", "口座", "{奨学金|しょうがくきん}"], "x": {"ja": "払ったという証拠の紙は「領収書」(=receipt)です。「請求書」は払う前にもらう紙で、「これを払ってください」という意味です。", "en": "The paper proving that you paid is a 「領収書」(=receipt). A 「請求書」(=bill) is received before paying and means \"please pay this.\"", "ne": "तिरिसकेको प्रमाण दिने कागज 「領収書」(=रसिद) हो। 「請求書」(=बिल) तिर्नुअघि पाइन्छ, \"यो तिर्नुहोस्\" भन्ने अर्थ।", "vi": "Giấy chứng minh đã trả tiền là 「領収書」(=biên lai). 「請求書」(=hóa đơn đòi tiền) nhận trước khi trả, nghĩa là \"hãy trả khoản này\".", "zh": "证明已付款的纸是「領収書」(=收据)。「請求書」(=账单)是付款前收到的,意思是“请支付这笔钱”。"}}, {"id": "G-3-007", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "代金を払ってもらうために、取引先に（　）を送った。", "a": "{請求書|せいきゅうしょ}", "w": ["領収書", "預金", "口座"], "x": {"ja": "お金を払ってもらうために送る紙は「請求書」(=invoice)です。「領収書」は払ったあとに出す紙で、順番が反対です。", "en": "The paper sent to ask for payment is a 「請求書」(=invoice). A 「領収書」 is given after payment, so the order is opposite.", "ne": "पैसा तिर्न लगाउन पठाइने कागज 「請求書」(=बिल/इन्भ्वाइस) हो। 「領収書」 तिरेपछि दिइन्छ, क्रम उल्टो हो।", "vi": "Giấy gửi để yêu cầu trả tiền là 「請求書」(=hóa đơn đòi tiền). 「領収書」 được đưa sau khi trả tiền, thứ tự ngược lại.", "zh": "为让对方付款而寄出的纸是「請求書」(=请款单)。「領収書」是付款之后开的,顺序相反。"}}, {"id": "G-3-008", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 3, "q": "国や市に（　）を払うのは、国民の義務です。", "a": "税金", "w": ["{奨学金|しょうがくきん}", "領収書", "割り{勘|かん}"], "x": {"ja": "国や市に払うお金は「税金」です。「奨学金」はもらうお金、「領収書」は払った証明の紙、「割り勘」はみんなで分けて払うことです。", "en": "The money you pay to the country or city is 税金 (=tax). 奨学金 (=scholarship) is money you receive, 領収書 (=receipt) is paper proving payment, and 割り勘 (=splitting the bill) is sharing a payment.", "ne": "देश वा सहरलाई तिर्ने पैसा 税金 (=कर) हो। 奨学金 (=छात्रवृत्ति) पाइने पैसा हो, 領収書 (=रसिद) तिरेको प्रमाण हो, र 割り勘 (=बिल बराबर बाँडेर तिर्ने) मिलेर बाँडेर तिर्नु हो।", "vi": "Tiền nộp cho nhà nước hay thành phố là 税金 (=thuế). 奨学金 (=học bổng) là tiền được nhận, 領収書 (=hóa đơn/biên nhận) là giấy chứng minh đã trả, 割り勘 (=chia đều tiền) là cùng chia nhau trả.", "zh": "交给国家或市政府的钱是“税金”(=税款)。“奨学金”(=奖学金)是领取的钱,“領収書”(=收据)是付款证明,“割り勘”(=AA制)是大家平摊付款。"}}, {"id": "G-3-009", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "電車の（　）が来月から値上がりすることになった。", "a": "料金", "w": ["税金", "{奨学金|しょうがくきん}", "{為替|かわせ}"], "x": {"ja": "電車に乗るときに払うお金は「料金」です。「税金」は国に払うお金で、ここには合いません。", "en": "The money you pay to ride a train is 料金 (=fare/charge). 税金 (=tax) is paid to the government, so it does not fit here.", "ne": "रेल चढ्दा तिर्ने पैसा 料金 (=भाडा/शुल्क) हो। 税金 (=कर) सरकारलाई तिरिन्छ, त्यसैले यहाँ मिल्दैन।", "vi": "Tiền trả khi đi tàu điện là 料金 (=cước phí/giá vé). 税金 (=thuế) là tiền nộp cho nhà nước nên không hợp ở đây.", "zh": "乘电车要付的钱是“料金”(=费用/票价)。“税金”(=税款)是交给国家的钱,这里不合适。"}}, {"id": "G-3-010", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "人気の商品で、発売当日に（　）になった。", "a": "売り切れ", "w": ["赤字", "円高", "割り{勘|かん}"], "x": {"ja": "人気で全部売れて、なくなったことを「売り切れ」と言います。「赤字」は損をすること、「円高」はお金の価値の話です。", "en": "When a popular item is all sold and none is left, we say 売り切れ (=sold out). 赤字 (=being in the red) is about losing money, and 円高 (=strong yen) is about currency value.", "ne": "लोकप्रिय सामान सबै बिकेर सकिनुलाई 売り切れ (=सबै बिक्री भइसक्यो) भनिन्छ। 赤字 (=घाटा) पैसा गुमाउनु हो, 円高 (=येन महँगो हुनु) मुद्राको मूल्यको कुरा हो।", "vi": "Hàng được ưa chuộng bán hết sạch thì gọi là 売り切れ (=bán hết). 赤字 (=thua lỗ) là bị lỗ, 円高 (=đồng yên tăng giá) là chuyện giá trị tiền tệ.", "zh": "受欢迎的商品全部卖完、没有了,叫“売り切れ”(=售罄)。“赤字”(=亏损)是亏钱,“円高”(=日元升值)是货币价值的事。"}}, {"id": "G-3-011", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "先月より（　）が10％増えて、300万円になった。", "a": "売り上げ", "w": ["{為替|かわせ}", "領収書", "口座"], "x": {"ja": "売った金額の合計が「売り上げ」です。10％増えて300万円になったのは売り上げです。「口座」は銀行のお金を入れる場所です。", "en": "The total amount of money from selling is 売り上げ (=sales/revenue). Sales rose 10% to 3 million yen. 口座 (=bank account) is a place in a bank for your money.", "ne": "बेचेको रकमको जोड 売り上げ (=बिक्री रकम) हो। १०% बढेर ३० लाख येन भयो भन्ने बिक्री हो। 口座 (=बैंक खाता) बैंकमा पैसा राख्ने ठाउँ हो।", "vi": "Tổng số tiền bán được là 売り上げ (=doanh thu). Doanh thu tăng 10% thành 3 triệu yên. 口座 (=tài khoản ngân hàng) là nơi gửi tiền ở ngân hàng.", "zh": "卖出商品的金额总和是“売り上げ”(=销售额)。增长10%变成300万日元的是销售额。“口座”(=银行账户)是银行里存钱的地方。"}}, {"id": "G-3-012", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "今年は{無駄|むだ}な支出を減らしたので、会社は（　）になった。", "a": "黒字", "w": ["赤字", "円高", "値上がり"], "x": {"ja": "無駄な支出を減らすと、収入が支出より多くなります。これを「黒字」と言います。「赤字」は反対です。", "en": "If you cut wasteful spending, income becomes larger than spending. This is called 黒字 (=in the black/profit). 赤字 (=deficit) is the opposite.", "ne": "अनावश्यक खर्च घटाउँदा आम्दानी खर्चभन्दा बढी हुन्छ। यसलाई 黒字 (=नाफा) भनिन्छ। 赤字 (=घाटा) उल्टो हो।", "vi": "Giảm chi tiêu lãng phí thì thu nhập nhiều hơn chi tiêu. Điều này gọi là 黒字 (=có lãi). 赤字 (=thua lỗ) thì ngược lại.", "zh": "减少浪费的支出后,收入就比支出多。这叫“黒字”(=盈利)。“赤字”(=亏损)则相反。"}}, {"id": "G-3-013", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "客が減って、その店は3年連続で（　）だ。", "a": "赤字", "w": ["黒字", "円高", "商売"], "x": {"ja": "客が減ると、収入より支出が多くなります。それを「赤字」と言います。「黒字」は反対の意味です。", "en": "When customers decrease, spending becomes larger than income. This is called 赤字 (=a deficit/loss). 黒字 (=profit) means the opposite.", "ne": "ग्राहक घटेपछि खर्च आम्दानीभन्दा बढी हुन्छ। यसलाई 赤字 (=घाटा) भनिन्छ। 黒字 (=नाफा) को अर्थ उल्टो हो।", "vi": "Khách giảm thì chi tiêu nhiều hơn thu nhập. Đó gọi là 赤字 (=thua lỗ). 黒字 (=có lãi) có nghĩa ngược lại.", "zh": "顾客减少,支出就比收入多。这叫“赤字”(=亏损)。“黒字”(=盈利)意思相反。"}}, {"id": "G-3-014", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 3, "q": "（　）になると、海外旅行に行く人は得をする。", "a": "円高", "w": ["円安", "値上がり", "黒字"], "x": {"ja": "「円高」は円の価値が上がることです。そのため、外国のものが安く買えて、海外旅行は得です。「円安」は反対です。", "en": "円高 (=strong yen) means the yen's value goes up. Foreign things become cheaper, so overseas travel is a good deal. 円安 (=weak yen) is the opposite.", "ne": "円高 (=येन बलियो हुनु) भनेको येनको मूल्य बढ्नु हो। त्यसैले विदेशी सामान सस्तो हुन्छ र विदेश यात्रा फाइदाजनक हुन्छ। 円安 (=येन कमजोर हुनु) उल्टो हो।", "vi": "円高 (=đồng yên lên giá) là giá trị của yên tăng. Vì vậy mua đồ nước ngoài rẻ hơn, đi du lịch nước ngoài có lợi. 円安 (=yên mất giá) thì ngược lại.", "zh": "“円高”(=日元升值)是日元的价值上升。因此外国的东西能买得便宜,出国旅行划算。“円安”(=日元贬值)则相反。"}}, {"id": "G-3-015", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 3, "q": "（　）が進んで、輸入する品物の値段が上がっている。", "a": "円安", "w": ["円高", "黒字", "割り{勘|かん}"], "x": {"ja": "輸入品の値段が上がるのは、円の価値が下がる「円安」のときです。「円高」だと輸入品は安くなります。", "en": "Imported goods get more expensive when the yen's value falls, which is 円安 (=weak yen). With 円高 (=strong yen), imports get cheaper.", "ne": "येनको मूल्य घट्ने 円安 (=येन कमजोर हुनु) मा आयातित सामानको मूल्य बढ्छ। 円高 (=येन बलियो हुनु) मा आयातित सामान सस्तो हुन्छ।", "vi": "Giá hàng nhập khẩu tăng khi giá trị yên giảm, tức là 円安 (=yên mất giá). Khi 円高 (=yên lên giá) thì hàng nhập khẩu rẻ đi.", "zh": "进口商品价格上涨,是日元价值下降的“円安”(=日元贬值)时。“円高”(=日元升值)时进口商品会变便宜。"}}, {"id": "G-3-016", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "{小麦|こむぎ}の（　）で、パンの値段も高くなった。", "a": "値上がり", "w": ["売り切れ", "割り{勘|かん}", "節約"], "x": {"ja": "物の値段が高くなることを「値上がり」と言います。パンの値段が高くなった理由として合います。「節約」はお金を使わないようにすることです。", "en": "When the price of something rises, it is called 値上がり (=a price increase). It fits as the reason bread got expensive. 節約 (=saving/economizing) means trying not to spend money.", "ne": "सामानको मूल्य बढ्नुलाई 値上がり (=मूल्य वृद्धि) भनिन्छ। पाउरोटीको मूल्य बढ्ने कारणका रूपमा यो मिल्छ। 節約 (=बचत गर्नु) पैसा खर्च नगर्न खोज्नु हो।", "vi": "Việc giá cả tăng lên gọi là 値上がり (=tăng giá). Hợp với lý do giá bánh mì đắt lên. 節約 (=tiết kiệm) là cố gắng không tiêu tiền.", "zh": "东西价格变高叫“値上がり”(=涨价)。适合作为面包变贵的原因。“節約”(=节约)是尽量不花钱。"}}, {"id": "G-3-017", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "祖父は小さな店で（　）を始めて、30年続けた。", "a": "商売", "w": ["取引先", "会計", "{為替|かわせ}"], "x": {"ja": "店をして物を売る仕事を「商売」と言います。「商売を始める」とよく言います。「取引先」は仕事の相手の会社です。", "en": "Running a shop and selling things is called 商売 (=business/trade). We often say 「商売を始める」. 取引先 (=business partner) is a company you do business with.", "ne": "पसल चलाएर सामान बेच्ने काम 商売 (=व्यापार) हो। 「商売を始める」 भनिन्छ। 取引先 (=व्यापारिक साझेदार) काम गर्ने साथी कम्पनी हो।", "vi": "Mở cửa hàng và bán đồ gọi là 商売 (=buôn bán/kinh doanh). Thường nói 「商売を始める」. 取引先 (=đối tác làm ăn) là công ty đối tác trong công việc.", "zh": "开店卖东西的工作叫“商売”(=生意)。常说“商売を始める”(做起生意)。“取引先”(=交易对象/客户公司)是工作上往来的公司。"}}, {"id": "G-3-018", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "（　）との打ち合わせがあるので、今日は早く会社を出る。", "a": "取引先", "w": ["商売", "{為替|かわせ}", "売り上げ"], "x": {"ja": "仕事で商品やお金のやりとりをする会社が「取引先」です。打ち合わせをする相手として合います。「商売」は仕事そのものです。", "en": "A company you exchange goods or money with for work is a 取引先 (=business partner/client). It fits as someone you have a meeting with. 商売 (=business) is the work itself.", "ne": "काममा सामान वा पैसाको लेनदेन गर्ने कम्पनी 取引先 (=व्यापारिक साझेदार) हो। बैठक गर्ने पक्षका रूपमा मिल्छ। 商売 (=व्यापार) काम आफैँ हो।", "vi": "Công ty trao đổi hàng hóa hay tiền bạc trong công việc là 取引先 (=đối tác làm ăn). Hợp với người họp bàn. 商売 (=kinh doanh) là bản thân công việc.", "zh": "工作中与之进行商品或资金往来的公司是“取引先”(=业务往来单位)。适合作开会的对象。“商売”(=生意)指工作本身。"}}, {"id": "G-3-019", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "期限までに授業料を（　）ください。", "a": "納めて", "w": ["寄付して", "{請求|せいきゅう}して", "消費して"], "x": {"ja": "授業料のような決まったお金を払うときは「納める」を使います。「寄付する」は人を助けるために出すこと、「請求する」はお金を求めることです。", "en": "For fixed payments like tuition, we use 納める (=to pay). 寄付する (=to donate) is giving money to help people, and 請求する (=to demand payment/bill) is asking for money.", "ne": "शुल्क जस्ता तोकिएको पैसा तिर्दा 「納める」 (=बुझाउनु) प्रयोग गरिन्छ। 寄付する (=दान दिनु) मानिसलाई मद्दत गर्न पैसा दिनु हो, 請求する (=माग गर्नु/बिल पठाउनु) पैसा माग्नु हो।", "vi": "Khi trả khoản tiền quy định như học phí, dùng 「納める」 (=nộp). 寄付する (=quyên góp) là đưa tiền để giúp người khác, 請求する (=yêu cầu thanh toán) là đòi tiền.", "zh": "支付学费这类固定的钱时用“納める”(=缴纳)。“寄付する”(=捐款)是为帮助别人而出钱,“請求する”(=要求付款)是向人要钱。"}}, {"id": "G-3-020", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "食事が終わったので、店員さんに（　）をお願いした。", "a": "会計", "w": ["支出", "預金", "値上がり"], "x": {"ja": "食事のあとにお金を払うことを「会計」と言います。「支出」は出ていくお金、「預金」は銀行に預けたお金です。", "en": "Paying after a meal is called 会計 (=the bill/checkout). 支出 (=spending) is money going out, and 預金 (=savings deposit) is money kept in a bank.", "ne": "खाना खाएपछि पैसा तिर्नुलाई 会計 (=बिल/भुक्तानी) भनिन्छ। 支出 (=खर्च) बाहिर जाने पैसा हो, 預金 (=बैंक जम्मा) बैंकमा राखेको पैसा हो।", "vi": "Trả tiền sau bữa ăn gọi là 会計 (=thanh toán). 支出 (=chi tiêu) là tiền đi ra, 預金 (=tiền gửi) là tiền gửi ở ngân hàng.", "zh": "饭后付钱叫“会計”(=结账)。“支出”(=支出)是花出去的钱,“預金”(=存款)是存在银行的钱。"}}, {"id": "G-3-021", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "災害で被害を受けた人たちのために、少しですが（　）をしました。", "a": "寄付", "w": ["節約", "消費", "預金"], "x": {"ja": "困っている人のためにお金を出すことが「寄付」です。「節約」はお金を使わないこと、「消費」はお金や物を使うことです。", "en": "Giving money for people in trouble is 寄付 (=a donation). 節約 (=saving) is not spending money, and 消費 (=consumption) is using money or goods.", "ne": "समस्यामा परेका मानिसका लागि पैसा दिनु 寄付 (=दान) हो। 節約 (=बचत) पैसा खर्च नगर्नु हो, 消費 (=उपभोग) पैसा वा सामान प्रयोग गर्नु हो।", "vi": "Đưa tiền cho người gặp khó khăn là 寄付 (=quyên góp). 節約 (=tiết kiệm) là không tiêu tiền, 消費 (=tiêu dùng) là dùng tiền hoặc đồ.", "zh": "为有困难的人出钱就是“寄付”(=捐款)。“節約”(=节约)是不花钱,“消費”(=消费)是使用钱或物品。"}}, {"id": "G-3-022", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "電気代を（　）するために、使わない部屋の電気は消している。", "a": "節約", "w": ["消費", "寄付", "会計"], "x": {"ja": "電気代を少なくするために、むだをなくすことを「節約」と言います。「消費」は使うこと、「寄付」は人にあげることです。", "en": "Cutting waste to reduce the electricity bill is 節約 (=saving/economizing). 消費 (=consumption) is using something, and 寄付 (=donation) is giving to others.", "ne": "बिजुलीको बिल घटाउन अनावश्यक खर्च हटाउनु 節約 (=बचत) हो। 消費 (=उपभोग) प्रयोग गर्नु हो, 寄付 (=दान) अरूलाई दिनु हो।", "vi": "Bỏ lãng phí để giảm tiền điện gọi là 節約 (=tiết kiệm). 消費 (=tiêu dùng) là sử dụng, 寄付 (=quyên góp) là cho người khác.", "zh": "为了减少电费而杜绝浪费叫“節約”(=节约)。“消費”(=消费)是使用,“寄付”(=捐款)是给别人。"}}, {"id": "G-3-023", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 3, "q": "友達と食事をしたとき、代金は（　）にした。", "a": "割り{勘|かん}", "w": ["会計", "寄付", "{請求|せいきゅう}"], "x": {"ja": "みんなで同じ金額を払うことを「割り勘」と言います。「会計」は払うこと自体で、「請求」はお金を求めることです。", "en": "Everyone paying the same amount is called 割り勘 (=splitting the bill). 会計 (=the bill) is the paying itself, and 請求 (=a demand for payment) is asking for money.", "ne": "सबैले बराबर रकम तिर्नुलाई 割り勘 (=बिल बराबर बाँड्नु) भनिन्छ। 会計 (=बिल) तिर्ने काम आफैँ हो, 請求 (=माग/बिल) पैसा माग्नु हो।", "vi": "Mọi người cùng trả số tiền bằng nhau gọi là 割り勘 (=chia đều tiền). 会計 (=thanh toán) là việc trả tiền, 請求 (=yêu cầu thanh toán) là đòi tiền.", "zh": "大家平摊同样金额叫“割り勘”(=AA制)。“会計”(=结账)是付款本身,“請求”(=请求付款)是要钱。"}}, {"id": "G-3-024", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "今月の（　）は、25日に銀行に振り込まれる。", "a": "給料", "w": ["税金", "料金", "支出"], "x": {"ja": "働いてもらうお金が「給料」で、銀行に振り込まれます。「税金」「料金」「支出」は払うお金です。", "en": "The money you receive for working is 給料 (=salary), and it is transferred to your bank. 税金 (=tax), 料金 (=fee), and 支出 (=spending) are money you pay out.", "ne": "काम गरेर पाइने पैसा 給料 (=तलब) हो र बैंकमा पठाइन्छ। 税金 (=कर), 料金 (=शुल्क), 支出 (=खर्च) तिर्ने पैसा हुन्।", "vi": "Tiền nhận được khi đi làm là 給料 (=lương) và được chuyển vào ngân hàng. 税金 (=thuế), 料金 (=phí), 支出 (=chi tiêu) là tiền phải trả.", "zh": "工作所得的钱是“給料”(=工资),会汇入银行。“税金”(=税)、“料金”(=费用)、“支出”(=支出)都是付出去的钱。"}}, {"id": "G-3-025", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "基本の給料のほかに、家族がいる人には家族（　）が出る。", "a": "手当", "w": ["料金", "税金", "{為替|かわせ}"], "x": {"ja": "基本の給料のほかに出るお金を「手当」と言います。「家族手当」はよく使う言葉です。「料金」や「税金」は払うお金です。", "en": "Money paid in addition to the basic salary is called 手当 (=allowance). 「家族手当」 (=family allowance) is a common word. 料金 (=fee) and 税金 (=tax) are money you pay.", "ne": "आधारभूत तलबबाहेक दिइने पैसालाई 手当 (=भत्ता) भनिन्छ। 「家族手当」 (=परिवार भत्ता) धेरै प्रयोग हुने शब्द हो। 料金 (=शुल्क) र 税金 (=कर) तिर्ने पैसा हुन्।", "vi": "Tiền được trả thêm ngoài lương cơ bản gọi là 手当 (=phụ cấp). 「家族手当」 (=phụ cấp gia đình) là từ hay dùng. 料金 (=phí) và 税金 (=thuế) là tiền phải trả.", "zh": "基本工资之外发的钱叫“手当”(=补贴)。“家族手当”(=家属补贴)是常用词。“料金”和“税金”是要付的钱。"}}, {"id": "G-3-026", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "夏と冬に（　）が出るので、旅行に行く予定だ。", "a": "ボーナス", "w": ["税金", "領収書", "割り{勘|かん}"], "x": {"ja": "夏と冬に会社からもらう特別なお金を「ボーナス」と言います。「税金」「領収書」「割り勘」は意味が合いません。", "en": "The special money you get from the company in summer and winter is a ボーナス (=bonus). 税金 (=tax), 領収書 (=receipt), and 割り勘 (=splitting the bill) do not fit.", "ne": "गर्मी र जाडोमा कम्पनीबाट पाइने विशेष पैसा ボーナス (=बोनस) हो। 税金 (=कर), 領収書 (=रसिद), 割り勘 (=बिल बाँड्नु) अर्थ मिल्दैन।", "vi": "Tiền đặc biệt nhận từ công ty vào mùa hè và mùa đông là ボーナス (=tiền thưởng). 税金 (=thuế), 領収書 (=biên nhận), 割り勘 (=chia tiền) không hợp nghĩa.", "zh": "夏天和冬天从公司领到的特别的钱叫“ボーナス”(=奖金)。“税金”(=税)、“領収書”(=收据)、“割り勘”(=AA制)意思不合。"}}, {"id": "G-3-027", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "海外に送金するときは、（　）レートを確認しておいたほうがいい。", "a": "{為替|かわせ}", "w": ["税金", "会計", "割り{勘|かん}"], "x": {"ja": "「為替レート」は、円と外国のお金を交換するときの比べ方です。海外に送金する前に確認します。", "en": "為替レート (=exchange rate) is the rate used when exchanging yen and foreign money. You check it before sending money abroad.", "ne": "「為替レート」 (=विनिमय दर) येन र विदेशी मुद्रा साटासाट गर्दाको दर हो। विदेशमा पैसा पठाउनुअघि यसलाई जाँच्नुपर्छ।", "vi": "「為替レート」 (=tỷ giá hối đoái) là mức quy đổi khi đổi yên sang tiền nước ngoài. Nên kiểm tra trước khi chuyển tiền ra nước ngoài.", "zh": "“為替レート”(=汇率)是日元与外币兑换时的比率。向海外汇款前要先确认。"}}, {"id": "G-3-028", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "買い物にかかる（　）税が上がって、生活が苦しくなった。", "a": "消費", "w": ["預金", "寄付", "節約"], "x": {"ja": "買い物のときにかかる税金を「消費税」と言います。「消費」は物やお金を使うことです。", "en": "The tax added when you shop is called 消費税 (=consumption tax). 消費 (=consumption) means using goods or money.", "ne": "किनमेल गर्दा लाग्ने करलाई 消費税 (=उपभोग कर) भनिन्छ। 消費 (=उपभोग) सामान वा पैसा प्रयोग गर्नु हो।", "vi": "Thuế tính khi mua sắm gọi là 消費税 (=thuế tiêu dùng). 消費 (=tiêu dùng) là việc dùng hàng hóa hay tiền.", "zh": "购物时要交的税叫“消費税”(=消费税)。“消費”(=消费)是使用物品或钱。"}}, {"id": "G-3-029", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "学費が払えないので、（　）を{申請|しんせい}した。", "a": "{奨学金|しょうがくきん}", "w": ["税金", "預金", "割り{勘|かん}"], "x": {"ja": "学費が払えない人は、勉強のためのお金「奨学金」を申請します。「預金」は自分のお金を銀行に預けることです。", "en": "A person who cannot pay tuition applies for 奨学金 (=a scholarship), money for studying. 預金 (=a deposit) means keeping your own money in a bank.", "ne": "शुल्क तिर्न नसक्ने मानिसले पढाइका लागि पैसा 奨学金 (=छात्रवृत्ति) का लागि आवेदन दिन्छ। 預金 (=बैंक जम्मा) आफ्नो पैसा बैंकमा राख्नु हो।", "vi": "Người không trả nổi học phí sẽ xin 奨学金 (=học bổng), tiền dùng cho việc học. 預金 (=gửi tiền) là gửi tiền của mình vào ngân hàng.", "zh": "付不起学费的人会申请用于学习的钱“奨学金”(=奖学金)。“預金”(=存款)是把自己的钱存进银行。"}}, {"id": "G-3-030", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "[[{硬貨|こうか}]]を財布に入れた。", "a": "金属でできたお金", "w": ["紙でできたお金", "カードで払うお金", "外国のお金"], "x": {"ja": "「硬貨」は金属でできたお金、つまりコインです。紙でできたお金は「紙幣」と言います。", "en": "硬貨 (=coin) is money made of metal. Money made of paper is called 紙幣 (=banknote).", "ne": "「硬貨」 (=सिक्का) धातुले बनेको पैसा हो। कागजको पैसालाई 紙幣 (=नोट) भनिन्छ।", "vi": "「硬貨」 (=tiền xu) là tiền làm bằng kim loại, tức là đồng xu. Tiền làm bằng giấy gọi là 紙幣 (=tiền giấy).", "zh": "“硬貨”(=硬币)是金属做的钱,也就是硬币。纸做的钱叫“紙幣”(=纸币)。"}}, {"id": "G-3-031", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "彼はアルバイトで学費を[[{稼|かせ}いでいる]]。", "a": "働いてお金を得ている", "w": ["お金を借りている", "お金を貯めて使わない", "お金を人にあげている"], "x": {"ja": "「稼ぐ」は、働いてお金を得ることです。借りる、貯める、あげるとは違います。", "en": "稼ぐ (=to earn) means getting money by working. It is different from borrowing, saving, or giving.", "ne": "「稼ぐ」 (=कमाउनु) काम गरेर पैसा पाउनु हो। ऋण लिनु, जम्मा गर्नु वा दिनुभन्दा फरक हो।", "vi": "「稼ぐ」 (=kiếm tiền) là làm việc để có tiền. Khác với vay, tích lũy hay cho tiền.", "zh": "“稼ぐ”(=挣钱)是通过工作得到钱。和借钱、攒钱、送钱不同。"}}, {"id": "G-3-032", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "電気を消して[[節約]]する。", "a": "むだをなくして少なくする", "w": ["全部使ってしまう", "人にあげる", "前もって払う"], "x": {"ja": "「節約」は、むだをなくして使う量を少なくすることです。全部使うことや人にあげることではありません。", "en": "節約 (=saving/economizing) means cutting waste and using less. It is not using everything or giving to others.", "ne": "「節約」 (=बचत) अनावश्यक खर्च हटाएर कम प्रयोग गर्नु हो। सबै खर्च गर्नु वा अरूलाई दिनु होइन।", "vi": "「節約」 (=tiết kiệm) là bỏ lãng phí và dùng ít đi. Không phải dùng hết hay cho người khác.", "zh": "“節約”(=节约)是杜绝浪费、减少使用量。不是全部用光或送给别人。"}}, {"id": "G-3-033", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "税金を[[納める]]。", "a": "払う", "w": ["集める", "返す", "計算する"], "x": {"ja": "「納める」は、税金などを決まったところへ払うという意味です。いちばん近い言葉は「払う」です。", "en": "納める (=to pay/hand in) means to pay taxes and similar money to a set place. The closest word is 払う (=to pay).", "ne": "「納める」 (=बुझाउनु) को अर्थ कर आदि तोकिएको ठाउँमा तिर्नु हो। सबैभन्दा नजिकको शब्द 「払う」 (=तिर्नु) हो।", "vi": "「納める」 (=nộp) nghĩa là trả thuế… cho nơi quy định. Từ gần nghĩa nhất là 「払う」 (=trả tiền).", "zh": "“納める”(=缴纳)是把税款等交给规定的地方。最接近的词是“払う”(=支付)。"}}, {"id": "G-3-034", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "{小麦|こむぎ}の[[値上がり]]が続いている。", "a": "値段が高くなること", "w": ["値段が安くなること", "売れなくなること", "品物がなくなること"], "x": {"ja": "「値上がり」は、物の値段が高くなることです。反対は「値下がり」です。", "en": "値上がり (=a price rise) means the price of something goes up. The opposite is 値下がり (=a price drop).", "ne": "「値上がり」 (=मूल्य वृद्धि) सामानको मूल्य बढ्नु हो। उल्टो 値下がり (=मूल्य घट्नु) हो।", "vi": "「値上がり」 (=tăng giá) là giá hàng cao lên. Ngược lại là 値下がり (=giảm giá).", "zh": "“値上がり”(=涨价)是东西的价格变高。反义词是“値下がり”(=降价)。"}}, {"id": "G-3-035", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "この店は今月も[[赤字]]だった。", "a": "収入より支出が多いこと", "w": ["収入が支出より多いこと", "お金が全然ないこと", "税金が高いこと"], "x": {"ja": "「赤字」は、収入より支出が多くて、お金が足りないことです。反対は「黒字」です。お金が全然ないという意味ではありません。", "en": "赤字 (=a deficit) means spending is more than income, so money falls short. The opposite is 黒字 (=a surplus). It does not mean having no money at all.", "ne": "「赤字」 (=घाटा) भनेको आम्दानीभन्दा खर्च बढी भएर पैसा नपुग्नु हो। उल्टो 黒字 (=नाफा) हो। पैसा बिलकुलै नहुनु भन्ने अर्थ होइन।", "vi": "「赤字」 (=thua lỗ) là chi tiêu nhiều hơn thu nhập nên thiếu tiền. Ngược lại là 黒字 (=có lãi). Không có nghĩa là hoàn toàn không có tiền.", "zh": "“赤字”(=亏损)是支出比收入多、钱不够。反义词是“黒字”(=盈利)。并不是指一分钱都没有。"}}, {"id": "G-3-036", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "今日は[[割り{勘|かん}]]にしよう。", "a": "みんなで同じ金額を払うこと", "w": ["一人が全部払うこと", "店が安くすること", "次の日に払うこと"], "x": {"ja": "「割り勘」は、みんなで同じ金額を払うことです。一人が全部払う場合は「おごる」と言います。", "en": "割り勘 (=splitting the bill) means everyone pays the same amount. When one person pays for all, we say おごる (=to treat).", "ne": "「割り勘」 (=बिल बराबर बाँड्नु) सबैले बराबर रकम तिर्नु हो। एक जनाले सबै तिरे 「おごる」 (=खुवाउनु/पैसा तिरिदिनु) भनिन्छ।", "vi": "「割り勘」 (=chia đều tiền) là mọi người cùng trả số tiền bằng nhau. Khi một người trả hết thì gọi là おごる (=mời/đãi).", "zh": "“割り勘”(=AA制)是大家付同样的金额。一个人全付的话叫“おごる”(=请客)。"}}, {"id": "G-3-037", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "彼は毎年、困っている人のために[[寄付]]している。", "a": "お金を出してあげている", "w": ["お金を借りている", "お金を銀行に預けている", "お金を貯めている"], "x": {"ja": "「寄付」は、困っている人や団体のためにお金を出すことです。貸すことや貯めることとは違います。", "en": "寄付 (=a donation) means giving money for people or groups in need. It is different from lending or saving.", "ne": "「寄付」 (=दान) समस्यामा परेका मानिस वा संस्थाका लागि पैसा दिनु हो। ऋण दिनु वा जम्मा गर्नुभन्दा फरक हो।", "vi": "「寄付」 (=quyên góp) là đưa tiền cho người hoặc tổ chức đang gặp khó khăn. Khác với cho vay hay tích lũy.", "zh": "“寄付”(=捐款)是为有困难的人或团体出钱。和借钱、攒钱不同。"}}, {"id": "G-3-038", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "[[取引先]]に電話をかけた。", "a": "仕事で商品やお金のやりとりをする会社", "w": ["同じ会社で働く人", "会社の社長", "会社を辞めた人"], "x": {"ja": "「取引先」は、仕事で商品やお金のやりとりをする会社です。同じ会社の人は「同僚」と言います。", "en": "取引先 (=a business partner) is a company you exchange goods or money with for work. People in your own company are 同僚 (=coworkers).", "ne": "「取引先」 (=व्यापारिक साझेदार) काममा सामान वा पैसाको लेनदेन गर्ने कम्पनी हो। उही कम्पनीका मानिसलाई 同僚 (=सहकर्मी) भनिन्छ।", "vi": "「取引先」 (=đối tác làm ăn) là công ty trao đổi hàng hóa, tiền bạc trong công việc. Người cùng công ty gọi là 同僚 (=đồng nghiệp).", "zh": "“取引先”(=交易对象)是工作上进行商品或资金往来的公司。同一公司的人叫“同僚”(=同事)。"}}, {"id": "G-3-039", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 3", "freq": 1, "q": "この商品は[[売り切れ]]です。", "a": "全部売れて残っていないこと", "w": ["値段が高いこと", "古くて売れないこと", "新しく入ってきたこと"], "x": {"ja": "「売り切れ」は、全部売れて残っていないことです。値段や古さの話ではありません。", "en": "売り切れ (=sold out) means everything has been sold and nothing remains. It is not about price or age.", "ne": "「売り切れ」 (=सबै बिक्री भइसक्यो) सबै बिकेर केही नबाँकी हुनु हो। मूल्य वा पुरानो हुने कुरा होइन।", "vi": "「売り切れ」 (=bán hết) là bán hết sạch, không còn gì. Không liên quan đến giá hay đồ cũ.", "zh": "“売り切れ”(=售罄)是全部卖完、没有剩下。和价格或旧不旧无关。"}}, {"id": "G-3-040", "subject": "goi", "qtype": "goi-usage", "level": "N2", "unit": "語彙 Unit 3", "freq": 3, "q": "「{儲|もう}かる」「{儲|もう}ける」の使い方として、正しいものはどれですか。", "a": "この店は客が多くて、よく{儲|もう}かっている。", "w": ["彼は{株|かぶ}で100万円{儲|もう}かった。", "安く買って高く売れば、大きな利益が{儲|もう}かる。", "商品を売って、店がお金を{儲|もう}かった。"], "x": {"ja": "「儲かる」は、利益が出るという意味で、お金は主語になります。「お金を儲ける」のように、お金を目的語にするのは「儲ける」です。", "en": "儲かる (=to be profitable) means profit is made, and the shop or person is the subject. When money is the object, as in 「お金を儲ける」, we use 儲ける (=to earn a profit).", "ne": "「儲かる」 (=नाफा हुनु) को अर्थ नाफा हुनु हो, यसमा पसल वा व्यक्ति कर्ता हुन्छ। 「お金を儲ける」 जस्तो पैसा कर्म हुँदा 儲ける (=नाफा कमाउनु) प्रयोग हुन्छ।", "vi": "「儲かる」 (=có lãi) nghĩa là sinh lợi nhuận; chủ ngữ là cửa hàng hay người. Khi dùng tiền làm tân ngữ như 「お金を儲ける」 thì dùng 儲ける (=kiếm lời).", "zh": "“儲かる”(=赚钱/有盈利)表示出了利润,主语是店或人。像“お金を儲ける”这样以钱作宾语时,用“儲ける”(=赚取)。"}}, {"id": "G-3-041", "subject": "goi", "qtype": "goi-usage", "level": "N2", "unit": "語彙 Unit 3", "freq": 2, "q": "「納める」の使い方として、正しいものはどれですか。", "a": "税金を期限までに納めた。", "w": ["ランチの代金を納めた。", "コンビニでジュースを買って、お金を納めた。", "友達にお金を納めて貸した。"], "x": {"ja": "「納める」は、税金や授業料など、決まったところへ払うときに使います。日常の買い物や貸すお金には使いません。", "en": "納める (=to pay) is used for paying taxes, tuition, and similar money to a set place. It is not used for everyday shopping or lending money.", "ne": "「納める」 (=बुझाउनु) कर, शुल्क जस्ता तोकिएको ठाउँमा तिर्दा प्रयोग गरिन्छ। दैनिक किनमेल वा ऋण दिँदा प्रयोग गरिँदैन।", "vi": "「納める」 (=nộp) dùng khi trả thuế, học phí… cho nơi quy định. Không dùng cho mua sắm hằng ngày hay cho vay tiền.", "zh": "“納める”(=缴纳)用于把税款、学费等交到规定的地方。不用于日常购物或借钱给人。"}}, {"id": "G-4-001", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "{電卓|でんたく}を使わないで、頭の中で（　）した。", "a": "計算", "w": ["測定", "省略", "{偶数|ぐうすう}"], "x": {"ja": "頭の中で数をたしたりひいたりすることは「計算」です。「測定」は長さや重さを測ることです。", "en": "Adding and subtracting numbers in your head is 計算 (=calculation). 測定 (=measurement) is measuring length or weight.", "ne": "दिमागमा संख्या जोड्नु घटाउनु 計算 (=गणना) हो। 測定 (=नाप्नु) लम्बाइ वा तौल नाप्नु हो।", "vi": "Cộng trừ số trong đầu là 計算 (=tính toán). 測定 (=đo đạc) là đo chiều dài hay cân nặng.", "zh": "在脑子里加减数字是“計算”(=计算)。“測定”(=测量)是量长度或重量。"}}, {"id": "G-4-002", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "食事のあと、店員さんに「お（　）をお願いします」と言った。", "a": "{勘定|かんじょう}", "w": ["測定", "単位", "{偶数|ぐうすう}"], "x": {"ja": "「お勘定」は、食事のあとに払うお金のことで、「お会計」と同じ意味です。「測定」「単位」は合いません。", "en": "お勘定 (=the bill) is the money you pay after a meal, the same as お会計 (=the check). 測定 (=measurement) and 単位 (=unit/credit) do not fit.", "ne": "「お勘定」 (=बिल) खाना खाएपछि तिर्ने पैसा हो, 「お会計」 जस्तै अर्थ हो। 測定 (=नाप) र 単位 (=एकाइ/क्रेडिट) मिल्दैन।", "vi": "「お勘定」 (=thanh toán) là tiền trả sau bữa ăn, cùng nghĩa với 「お会計」. 測定 (=đo đạc) và 単位 (=đơn vị/tín chỉ) không hợp.", "zh": "“お勘定”(=结账)是饭后付的钱,和“お会計”意思相同。“測定”(=测量)和“単位”(=单位/学分)不合适。"}}, {"id": "G-4-003", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "仕事が（　）いて、休む時間がない。", "a": "たまって", "w": ["積もって", "数えて", "省いて"], "x": {"ja": "仕事が増えて残ることを「仕事がたまる」と言います。「積もる」は雪やほこりが上に重なることです。", "en": "When work piles up and remains, we say 「仕事がたまる」 (たまる=to accumulate). 積もる (=to pile up) is for snow or dust layering on top.", "ne": "काम थपिएर बाँकी रहनुलाई 「仕事がたまる」 (たまる=जम्मा हुनु) भनिन्छ। 積もる (=माथि थुप्रिनु) हिउँ वा धुलोको लागि प्रयोग हुन्छ।", "vi": "Công việc nhiều lên và còn tồn lại thì nói 「仕事がたまる」 (たまる=dồn lại). 積もる (=chất thành lớp) dùng cho tuyết, bụi.", "zh": "工作增多、积压下来说“仕事がたまる”(たまる=积压)。“積もる”(=堆积)用于雪、灰尘等层层叠在上面。"}}, {"id": "G-4-004", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "夜の間に雪が（　）、道が真っ白になった。", "a": "積もって", "w": ["たまって", "数えて", "測って"], "x": {"ja": "雪が上に重なって増えることは「積もる」です。「たまる」は仕事やお金などが少しずつ増えることです。", "en": "Snow layering up is 積もる (=to pile up). たまる (=to accumulate) is for things like work or money gradually increasing.", "ne": "हिउँ माथि माथि थुप्रिनु 積もる (=थुप्रिनु) हो। たまる (=जम्मा हुनु) काम वा पैसा बिस्तारै बढ्दा प्रयोग हुन्छ।", "vi": "Tuyết chồng lên nhau nhiều thêm là 積もる (=tích tụ thành lớp). たまる (=dồn lại) dùng cho công việc, tiền bạc dần nhiều lên.", "zh": "雪层层叠加变多是“積もる”(=积)。“たまる”(=积攒/积压)用于工作、钱等一点点增多。"}}, {"id": "G-4-005", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "{健康診断|けんこうしんだん}で、視力の（　）を受けた。", "a": "測定", "w": ["計算", "{勘定|かんじょう}", "省略"], "x": {"ja": "視力など体の数や大きさを調べることは「測定」です。「計算」は数をたしたりひいたりすることです。", "en": "Checking numbers or size of the body, like eyesight, is 測定 (=measurement). 計算 (=calculation) is adding or subtracting numbers.", "ne": "दृष्टि जस्ता शरीरको संख्या वा आकार जाँच्नु 測定 (=नाप) हो। 計算 (=गणना) संख्या जोड्नु घटाउनु हो।", "vi": "Kiểm tra số đo, kích thước của cơ thể như thị lực là 測定 (=đo). 計算 (=tính toán) là cộng trừ số.", "zh": "检查视力等身体的数值或大小是“測定”(=测量)。“計算”(=计算)是对数字做加减。"}}, {"id": "G-4-006", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "時間がないので、細かい説明は（　）、結論だけ話します。", "a": "省いて", "w": ["数えて", "積もって", "たまって"], "x": {"ja": "「省く」は、いらないものをなくすことです。細かい説明をなくして、結論だけ話します。「数える」「積もる」は意味が合いません。", "en": "省く (=to omit) means to remove things that are not needed. Leave out the detailed explanation and give only the conclusion. 数える (=to count) and 積もる (=to pile up) do not fit.", "ne": "「省く」 (=छोड्नु) अनावश्यक कुरा हटाउनु हो। विस्तृत व्याख्या छोडेर निष्कर्ष मात्र भन्ने हो। 数える (=गन्नु) र 積もる (=थुप्रिनु) अर्थ मिल्दैन।", "vi": "「省く」 (=lược bỏ) là bỏ những thứ không cần. Bỏ phần giải thích chi tiết, chỉ nói kết luận. 数える (=đếm) và 積もる (=chất đống) không hợp nghĩa.", "zh": "“省く”(=省略)是去掉不需要的东西。去掉细节说明,只讲结论。“数える”(=数)和“積もる”(=积)意思不合。"}}, {"id": "G-4-007", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "大学を卒業するには、必要な（　）を全部取らなければならない。", "a": "単位", "w": ["回数", "種類", "数字"], "x": {"ja": "大学で勉強の量を表す数えかたが「単位」です。「単位を取る」と言います。「回数」は何回かという数です。", "en": "The unit counting the amount of study at university is 単位 (=credit). We say 「単位を取る」. 回数 (=number of times) is how many times something happens.", "ne": "विश्वविद्यालयमा पढाइको मात्रा जनाउने गन्ती 単位 (=क्रेडिट) हो। 「単位を取る」 भनिन्छ। 回数 (=पटक) कति पटक भन्ने संख्या हो।", "vi": "Cách tính lượng học ở đại học là 単位 (=tín chỉ). Nói 「単位を取る」. 回数 (=số lần) là số lần làm gì đó.", "zh": "在大学里表示学习量的计量是“単位”(=学分)。说“単位を取る”(修学分)。“回数”(=次数)是做了几次的数。"}}, {"id": "G-4-008", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "図書館で本を借りられる（　）は、月に5回までです。", "a": "回数", "w": ["面積", "速度", "単位"], "x": {"ja": "何回借りられるかという数は「回数」です。「面積」は広さ、「速度」はスピード、「単位」は数え方の基準です。", "en": "The number of times you can borrow is 回数 (=number of times). 面積 (=area) is size of space, 速度 (=speed) is how fast, and 単位 (=unit) is a standard for counting.", "ne": "कति पटक लिन सकिन्छ भन्ने संख्या 回数 (=पटक) हो। 面積 (=क्षेत्रफल) ठाउँको आकार, 速度 (=गति) स्पीड, 単位 (=एकाइ) गन्ने मापदण्ड हो।", "vi": "Số lần có thể mượn là 回数 (=số lần). 面積 (=diện tích) là độ rộng, 速度 (=tốc độ) là mức nhanh chậm, 単位 (=đơn vị) là chuẩn để đếm.", "zh": "能借几次的数是“回数”(=次数)。“面積”(=面积)是大小,“速度”(=速度)是快慢,“単位”(=单位)是计数的标准。"}}, {"id": "G-4-009", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "この部屋の（　）は、20平方メートルです。", "a": "面積", "w": ["量", "速度", "回数"], "x": {"ja": "部屋の広さは「面積」で表します。平方メートルは面積の単位です。「速度」は速さのことです。", "en": "The size of a room is shown by 面積 (=area). Square meters are a unit of area. 速度 (=speed) is about how fast something is.", "ne": "कोठाको आकार 面積 (=क्षेत्रफल) ले जनाइन्छ। वर्ग मिटर क्षेत्रफलको एकाइ हो। 速度 (=गति) चाल हो।", "vi": "Độ rộng của căn phòng được biểu thị bằng 面積 (=diện tích). Mét vuông là đơn vị của diện tích. 速度 (=tốc độ) là mức nhanh chậm.", "zh": "房间的大小用“面積”(=面积)表示。平方米是面积的单位。“速度”(=速度)指快慢。"}}, {"id": "G-4-010", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "高速道路では、決められた（　）を守って運転してください。", "a": "速度", "w": ["回数", "面積", "単位"], "x": {"ja": "車などの速さは「速度」です。「速度を守る」と言います。「面積」は広さのことです。", "en": "The speed of cars and so on is 速度 (=speed). We say 「速度を守る」 (=keep to the speed limit). 面積 (=area) is about size.", "ne": "गाडी आदिको चाल 速度 (=गति) हो। 「速度を守る」 (=गति सीमा पालना गर्नु) भनिन्छ। 面積 (=क्षेत्रफल) आकारको कुरा हो।", "vi": "Mức nhanh chậm của xe là 速度 (=tốc độ). Nói 「速度を守る」 (=giữ đúng tốc độ). 面積 (=diện tích) là độ rộng.", "zh": "汽车等的快慢是“速度”(=速度)。说“速度を守る”(遵守限速)。“面積”(=面积)指大小。"}}, {"id": "G-4-011", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "この店では、パンを50（　）も売っている。", "a": "種類", "w": ["人前", "通", "部"], "x": {"ja": "パンが何種類あるかを言うときは「種類」を使います。「人前」は料理の量、「通」は手紙、「部」は新聞の数え方です。", "en": "To say how many kinds of bread there are, use 種類 (=kinds/types). 人前 (=portions) counts food, 通 (=counter for letters), and 部 (=counter for copies of newspapers) are other counters.", "ne": "पाउरोटी कति किसिमका छन् भन्दा 種類 (=किसिम) प्रयोग गरिन्छ। 人前 (=जना जति खाना) खानाको मात्रा, 通 (=चिठ्ठी गन्ने शब्द), 部 (=पत्रिका/प्रति गन्ने शब्द) हुन्।", "vi": "Khi nói có bao nhiêu loại bánh mì thì dùng 種類 (=loại). 人前 (=suất ăn) đếm món ăn, 通 (=lá/bức thư) đếm thư, 部 (=bản/tờ) đếm báo.", "zh": "说面包有多少种时用“種類”(=种类)。“人前”(=一人份)数料理,“通”(=封)数信,“部”(=份)数报纸。"}}, {"id": "G-4-012", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "友達に手紙を3（　）書いた。", "a": "通", "w": ["人前", "部", "単位"], "x": {"ja": "手紙やメールは「通」で数えます。「3通」と言います。「人前」は料理、「部」は新聞や書類に使います。", "en": "Letters and e-mails are counted with 通 (=counter for letters). We say 「3通」. 人前 (=portion) is for food, and 部 (=copy) is for newspapers and documents.", "ne": "चिठ्ठी र इमेल 通 (=चिठ्ठी गन्ने शब्द) ले गनिन्छ। 「3通」 भनिन्छ। 人前 (=जना जति) खानाको लागि, 部 (=प्रति) पत्रिका र कागजातको लागि हो।", "vi": "Thư và email được đếm bằng 通 (=lá/bức). Nói 「3通」. 人前 (=suất) dùng cho món ăn, 部 (=bản) dùng cho báo và tài liệu.", "zh": "信和邮件用“通”(=封)来数,说“3通”。“人前”(=份)用于料理,“部”(=份)用于报纸和文件。"}}, {"id": "G-4-013", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "ステーキを2（　）注文して、友達と分けた。", "a": "人前", "w": ["通", "部", "単位"], "x": {"ja": "料理の量は「人前」で数えます。「2人前」は、2人が食べる量です。「通」は手紙、「部」は新聞です。", "en": "The amount of food is counted with 人前 (=portion). 「2人前」 is enough for two people. 通 (=for letters) and 部 (=for newspapers) are other counters.", "ne": "खानाको मात्रा 人前 (=जना जति) ले गनिन्छ। 「2人前」 दुई जनाले खाने मात्रा हो। 通 (=चिठ्ठी) र 部 (=पत्रिका) अरू गन्ने शब्द हुन्।", "vi": "Lượng món ăn được đếm bằng 人前 (=suất). 「2人前」 là lượng cho hai người ăn. 通 (=thư) và 部 (=báo) là các cách đếm khác.", "zh": "料理的量用“人前”(=一人份)来数。“2人前”是两个人吃的量。“通”(=封,用于信)和“部”(=份,用于报纸)是其他量词。"}}, {"id": "G-4-014", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "新聞を3（　）買って、友達にも渡した。", "a": "部", "w": ["通", "人前", "単位"], "x": {"ja": "新聞や書類は「部」で数えます。「3部」と言います。「通」は手紙、「人前」は料理に使います。", "en": "Newspapers and documents are counted with 部 (=copy). We say 「3部」. 通 (=for letters) and 人前 (=portion) are used for letters and food.", "ne": "पत्रिका र कागजात 部 (=प्रति) ले गनिन्छ। 「3部」 भनिन्छ। 通 (=चिठ्ठी) र 人前 (=जना जति खाना) अरू प्रयोग हुन्।", "vi": "Báo và tài liệu được đếm bằng 部 (=bản/tờ). Nói 「3部」. 通 (=thư) dùng cho thư, 人前 (=suất) dùng cho món ăn.", "zh": "报纸和文件用“部”(=份)来数,说“3部”。“通”(=封)用于信,“人前”(=一人份)用于料理。"}}, {"id": "G-4-015", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "この表には、売り上げの（　）が並んでいる。", "a": "数字", "w": ["{偶数|ぐうすう}", "面積", "速度"], "x": {"ja": "表に並んでいる数のことを「数字」と言います。「偶数」は2で割れる数、「面積」「速度」は意味が違います。", "en": "The numbers lined up in a table are called 数字 (=figures/numbers). 偶数 (=even number) is a number divisible by 2; 面積 (=area) and 速度 (=speed) have different meanings.", "ne": "तालिकामा लाइनमा रहेका संख्यालाई 数字 (=अंक) भनिन्छ। 偶数 (=जोर संख्या) २ ले भाग जाने संख्या हो, 面積 (=क्षेत्रफल) र 速度 (=गति) को अर्थ फरक छ।", "vi": "Những con số xếp trong bảng gọi là 数字 (=con số). 偶数 (=số chẵn) là số chia hết cho 2; 面積 (=diện tích), 速度 (=tốc độ) có nghĩa khác.", "zh": "表中排列的数叫“数字”(=数字)。“偶数”(=偶数)是能被2整除的数,“面積”(=面积)和“速度”(=速度)意思不同。"}}, {"id": "G-4-016", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "2、4、6、8のような（　）は、2で割り切れる。", "a": "{偶数|ぐうすう}", "w": ["{奇数|きすう}", "単位", "未満"], "x": {"ja": "2で割り切れる数、2、4、6、8などを「偶数」と言います。「奇数」は1、3、5のような数で、反対です。", "en": "Numbers divisible by 2, like 2, 4, 6, 8, are 偶数 (=even numbers). 奇数 (=odd numbers), like 1, 3, 5, are the opposite.", "ne": "२ ले भाग जाने संख्या, २, ४, ६, ८ आदिलाई 偶数 (=जोर संख्या) भनिन्छ। 奇数 (=बिजोर संख्या) १, ३, ५ जस्ता संख्या हुन्, उल्टो हो।", "vi": "Số chia hết cho 2 như 2, 4, 6, 8 gọi là 偶数 (=số chẵn). 奇数 (=số lẻ) là các số như 1, 3, 5, ngược lại.", "zh": "能被2整除的数,如2、4、6、8,叫“偶数”(=偶数)。“奇数”(=奇数)是1、3、5这样的数,和偶数相反。"}}, {"id": "G-4-017", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "1、3、5のように、2で割り切れない数を（　）という。", "a": "{奇数|きすう}", "w": ["{偶数|ぐうすう}", "未満", "合計"], "x": {"ja": "2で割り切れない数、1、3、5などを「奇数」と言います。「偶数」は2で割り切れる数で、反対です。", "en": "Numbers not divisible by 2, like 1, 3, 5, are 奇数 (=odd numbers). 偶数 (=even numbers) are divisible by 2, the opposite.", "ne": "२ ले भाग नजाने संख्या, १, ३, ५ आदिलाई 奇数 (=बिजोर संख्या) भनिन्छ। 偶数 (=जोर संख्या) २ ले भाग जाने संख्या हो, उल्टो।", "vi": "Số không chia hết cho 2 như 1, 3, 5 gọi là 奇数 (=số lẻ). 偶数 (=số chẵn) là số chia hết cho 2, ngược lại.", "zh": "不能被2整除的数,如1、3、5,叫“奇数”(=奇数)。“偶数”(=偶数)是能被2整除的数,相反。"}}, {"id": "G-4-018", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 3, "q": "子どもを守るため、18歳（　）の人は、この映画を見ることができません。", "a": "未満", "w": ["以上", "以内", "以来"], "x": {"ja": "「18歳未満」は、18歳より下の人で、18歳は入りません。「以上」は18歳も入る、「以内」は範囲の中という意味です。", "en": "「18歳未満」 (未満=less than) means people younger than 18; 18 is not included. 以上 (=or more) includes 18, and 以内 (=within) means inside a range.", "ne": "「18歳未満」 (未満=भन्दा कम) भनेको १८ वर्षभन्दा कमका मानिस हुन्, १८ समावेश हुँदैन। 以上 (=वा भन्दा बढी) मा १८ समावेश हुन्छ, 以内 (=भित्र) दायरा भित्र हो।", "vi": "「18歳未満」 (未満=chưa đến) là người dưới 18 tuổi, không bao gồm 18 tuổi. 以上 (=từ… trở lên) bao gồm cả 18, 以内 (=trong vòng) là trong phạm vi.", "zh": "“18歳未満”(未満=不满)指低于18岁的人,不包括18岁。“以上”(=以上)包括18岁,“以内”(=以内)指范围之内。"}}, {"id": "G-4-019", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "この地域は自然が（　）で、野菜も果物もおいしい。", "a": "豊か", "w": ["{膨大|ぼうだい}", "無限", "大半"], "x": {"ja": "自然が多くて美しいことは「豊かな自然」と言います。「膨大」は量がとても多い、「無限」は限りがないという意味で、自然には合いません。", "en": "A nature that is plentiful and beautiful is 「豊かな自然」 (豊か=rich). 膨大 (=huge in amount) and 無限 (=limitless) do not fit nature here.", "ne": "प्रकृति प्रशस्त र सुन्दर हुनुलाई 「豊かな自然」 (豊か=समृद्ध) भनिन्छ। 膨大 (=धेरै नै ठूलो मात्रा) र 無限 (=असीमित) यहाँ प्रकृतिसँग मिल्दैन।", "vi": "Thiên nhiên phong phú, đẹp gọi là 「豊かな自然」 (豊か=phong phú). 膨大 (=khổng lồ) và 無限 (=vô hạn) không hợp với thiên nhiên ở đây.", "zh": "自然资源丰富美丽叫“豊かな自然”(豊か=丰饶)。“膨大”(=庞大)和“無限”(=无限)不适合形容这里的自然。"}}, {"id": "G-4-020", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 3, "q": "彼は海外での経験が（　）なので、頼りになる。", "a": "豊富", "w": ["無限", "少々", "大半"], "x": {"ja": "経験がたくさんあることは「経験が豊富」と言います。「無限」は限りがないこと、「少々」は少しのことです。", "en": "Having a lot of experience is 「経験が豊富」 (豊富=abundant). 無限 (=limitless) means no limit, and 少々 (=a little) means a small amount.", "ne": "धेरै अनुभव हुनुलाई 「経験が豊富」 (豊富=प्रशस्त) भनिन्छ। 無限 (=असीमित) सीमा नहुनु, 少々 (=अलिकति) थोरै हो।", "vi": "Có nhiều kinh nghiệm là 「経験が豊富」 (豊富=phong phú). 無限 (=vô hạn) là không có giới hạn, 少々 (=một chút) là ít.", "zh": "经验很多叫“経験が豊富”(豊富=丰富)。“無限”(=无限)是没有尽头,“少々”(=稍微)是一点点。"}}, {"id": "G-4-021", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "{宇宙|うちゅう}は（　）に広がっているように思える。", "a": "無限", "w": ["大半", "未満", "少々"], "x": {"ja": "「無限」は、限りがないという意味です。宇宙が終わりなく広がるように思えるときに使います。「未満」は数に届かないことです。", "en": "無限 (=limitless) means there is no end. Use it when the universe seems to spread without end. 未満 (=under) means not reaching a number.", "ne": "「無限」 (=असीमित) को अर्थ सीमा नहुनु हो। ब्रह्माण्ड अन्त्यहीन फैलिएको जस्तो लाग्दा प्रयोग हुन्छ। 未満 (=भन्दा कम) संख्या नपुग्नु हो।", "vi": "「無限」 (=vô hạn) nghĩa là không có giới hạn. Dùng khi vũ trụ có vẻ mở rộng mãi không cùng. 未満 (=chưa đến) là chưa tới một con số.", "zh": "“無限”(=无限)是没有尽头的意思。宇宙看起来无边无际时使用。“未満”(=不满)是没有达到某个数。"}}, {"id": "G-4-022", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 3, "q": "（　）お待ちください。すぐに確認いたします。", "a": "少々", "w": ["大半", "大量", "無限"], "x": {"ja": "「少々」は「少し」の丁寧な言い方です。「少々お待ちください」は、お客様に使うよく聞く表現です。「大量」「無限」は反対のイメージです。", "en": "少々 (=a little) is the polite way to say 少し. 「少々お待ちください」 is a common phrase said to customers. 大量 (=large amount) and 無限 (=limitless) give the opposite image.", "ne": "「少々」 (=अलिकति) 「少し」 को शिष्ट रूप हो। 「少々お待ちください」 ग्राहकलाई भनिने सामान्य वाक्य हो। 大量 (=धेरै मात्रा) र 無限 (=असीमित) उल्टो छवि दिन्छन्।", "vi": "「少々」 (=một chút) là cách nói lịch sự của 「少し」. 「少々お待ちください」 là câu thường nói với khách. 大量 (=số lượng lớn) và 無限 (=vô hạn) có nghĩa ngược lại.", "zh": "“少々”(=稍微)是“少し”的礼貌说法。“少々お待ちください”是对客人常说的话。“大量”(=大量)和“無限”(=无限)意思相反。"}}, {"id": "G-4-023", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "この本は、（　）の人しか知らない事実を書いている。", "a": "一部", "w": ["大半", "大量", "豊富"], "x": {"ja": "「しか〜ない」とあるので、少ない数の人が合います。「一部」は全体の中の少しです。「大半」は多いほうです。", "en": "Because of 「しか〜ない」, a small number of people fits. 一部 (=a part) is a small share of the whole. 大半 (=most) is the larger part.", "ne": "「しか〜ない」 भएकाले थोरै मानिस मिल्छ। 一部 (=केही भाग) पूरामध्ये थोरै हो। 大半 (=धेरैजसो) ठूलो भाग हो।", "vi": "Vì có 「しか〜ない」 nên hợp với số người ít. 一部 (=một phần) là một ít trong tổng thể. 大半 (=đa số) là phần nhiều.", "zh": "因为有“しか〜ない”,所以适合表示少数人。“一部”(=一部分)是整体中的一小部分。“大半”(=大半)是多的那一方。"}}, {"id": "G-4-024", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 3, "q": "会議では、（　）の人が賛成して、反対したのは数人だけだった。", "a": "大半", "w": ["一部", "少々", "未満"], "x": {"ja": "反対したのが数人だけなので、賛成した人はほとんどです。「大半」は「ほとんど」という意味です。「一部」は少しです。", "en": "Only a few people opposed, so almost everyone agreed. 大半 (=most) means ほとんど (=almost all). 一部 (=a part) means only a few.", "ne": "विरोध गर्ने केही मात्र भएकाले सहमत हुनेहरू धेरै जसो हुन्। 大半 (=धेरैजसो) को अर्थ ほとんど (=प्रायः सबै) हो। 一部 (=केही भाग) थोरै हो।", "vi": "Chỉ vài người phản đối nên người tán thành là hầu hết. 大半 (=đa số) nghĩa là ほとんど (=hầu hết). 一部 (=một phần) là ít.", "zh": "反对的只有几个人,所以赞成的是绝大多数。“大半”(=大半)是“ほとんど”(=几乎)的意思。“一部”(=一部分)是少数。"}}, {"id": "G-4-025", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "台風のあと、海岸にごみが（　）流れ着いた。", "a": "大量に", "w": ["少々", "未満", "豊かに"], "x": {"ja": "たくさんのごみが流れ着いたので、「大量に」が合います。「少々」は少し、「豊かに」はごみには使いません。", "en": "A lot of trash washed ashore, so 大量に (=in large amounts) fits. 少々 (=a little) is small, and 豊かに (=richly) is not used for trash.", "ne": "धेरै फोहोर बगेर आएकाले 「大量に」 (=ठूलो मात्रामा) मिल्छ। 少々 (=अलिकति) थोरै हो, 豊かに (=समृद्ध रूपमा) फोहोरका लागि प्रयोग हुँदैन।", "vi": "Nhiều rác trôi dạt vào nên hợp với 「大量に」 (=với số lượng lớn). 少々 (=một chút) là ít, 豊かに (=phong phú) không dùng cho rác.", "zh": "漂来了很多垃圾,所以用“大量に”(=大量地)合适。“少々”(=稍微)是少,“豊かに”(=丰富地)不用于垃圾。"}}, {"id": "G-4-026", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "朝ご飯をしっかり食べて、（　）{睡眠|すいみん}も取った。", "a": "たっぷり", "w": ["少々", "一部", "未満"], "x": {"ja": "「たっぷり」は、十分にという意味です。睡眠を十分に取ったと言いたいときに合います。「少々」「一部」は量が少ない言い方です。", "en": "たっぷり (=plenty/fully) means enough. It fits when you want to say you got enough sleep. 少々 (=a little) and 一部 (=a part) mean a small amount.", "ne": "「たっぷり」 (=प्रशस्त/पूरा) को अर्थ पर्याप्त हो। पर्याप्त निद्रा लिएँ भन्न चाहँदा मिल्छ। 少々 (=अलिकति) र 一部 (=केही भाग) थोरै मात्रा हो।", "vi": "「たっぷり」 (=thật nhiều/đầy đủ) nghĩa là đủ đầy. Hợp khi muốn nói đã ngủ đủ giấc. 少々 (=một chút) và 一部 (=một phần) là lượng ít.", "zh": "“たっぷり”(=充足)是足够的意思。想说睡眠充足时合适。“少々”(=稍微)和“一部”(=一部分)是量少的说法。"}}, {"id": "G-4-027", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 3, "q": "この図書館には、（　）な量の資料が保管されている。", "a": "{膨大|ぼうだい}", "w": ["豊か", "一部", "{偶数|ぐうすう}"], "x": {"ja": "「膨大」は、数や量が非常に多いことです。資料の量が多いときに使います。「豊か」は自然や心など、よい意味で多いときに使います。", "en": "膨大 (=huge) means a very large number or amount. Use it when the amount of materials is big. 豊か (=rich) is for nature or feelings, being plentiful in a good sense.", "ne": "「膨大」 (=अत्यन्त ठूलो) संख्या वा मात्रा धेरै नै ठूलो हुनु हो। सामग्रीको मात्रा धेरै हुँदा प्रयोग हुन्छ। 豊か (=समृद्ध) प्रकृति वा मन जस्ता राम्रो अर्थमा प्रशस्त हुँदा प्रयोग हुन्छ।", "vi": "「膨大」 (=khổng lồ) là số hay lượng cực kỳ nhiều. Dùng khi lượng tài liệu nhiều. 豊か (=phong phú) dùng cho thiên nhiên, tâm hồn… theo nghĩa tốt.", "zh": "“膨大”(=庞大)指数量非常多。资料量多时使用。“豊か”(=丰富)用于自然、内心等好的方面的丰富。"}}, {"id": "G-4-028", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "ケーキは3個、クッキーは5個で、（　）8個です。", "a": "合計", "w": ["単位", "面積", "回数"], "x": {"ja": "全部をたした数を「合計」と言います。3個と5個で8個になります。「単位」「面積」「回数」は意味が合いません。", "en": "The number you get by adding everything is 合計 (=total). 3 and 5 make 8. 単位 (=unit), 面積 (=area), and 回数 (=number of times) do not fit.", "ne": "सबै जोडेर आउने संख्यालाई 合計 (=जम्मा) भनिन्छ। ३ र ५ ले ८ हुन्छ। 単位 (=एकाइ), 面積 (=क्षेत्रफल), 回数 (=पटक) अर्थ मिल्दैन।", "vi": "Con số cộng tất cả lại gọi là 合計 (=tổng cộng). 3 và 5 thành 8. 単位 (=đơn vị), 面積 (=diện tích), 回数 (=số lần) không hợp nghĩa.", "zh": "把全部加起来的数叫“合計”(=合计)。3个加5个是8个。“単位”(=单位)、“面積”(=面积)、“回数”(=次数)意思不合。"}}, {"id": "G-4-029", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "池の水が{凍|こお}るほど寒く、朝の気温が（　）10度まで下がった。", "a": "マイナス", "w": ["プラス", "未満", "{偶数|ぐうすう}"], "x": {"ja": "0度より低い温度は「マイナス10度」と言います。「プラス」は0より高いほうです。「未満」は数に届かないことです。", "en": "A temperature below 0 degrees is called 「マイナス10度」 (マイナス=minus). プラス (=plus) is above 0. 未満 (=under) means not reaching a number.", "ne": "० डिग्रीभन्दा तलको तापक्रमलाई 「マイナス10度」 (マイナス=ऋणात्मक) भनिन्छ। プラス (=धनात्मक) ० भन्दा माथि हो। 未満 (=भन्दा कम) संख्या नपुग्नु हो।", "vi": "Nhiệt độ thấp hơn 0 độ gọi là 「マイナス10度」 (マイナス=âm). プラス (=dương) là cao hơn 0. 未満 (=chưa đến) là chưa tới một con số.", "zh": "低于0度的温度说“マイナス10度”(マイナス=零下)。“プラス”(=零上)是高于0。“未満”(=不满)是没有达到某个数。"}}, {"id": "G-4-030", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "寝られないとき、{羊|ひつじ}を（　）という方法がある。", "a": "数える", "w": ["省く", "積もる", "たまる"], "x": {"ja": "羊を一匹ずつ数えるので、「数える」が合います。「省く」はなくすこと、「積もる」「たまる」は増えて重なることです。", "en": "You count sheep one by one, so 数える (=to count) fits. 省く (=to omit) is to remove, and 積もる and たまる (=to pile up) mean to build up.", "ne": "भेडा एक एक गरेर गनिन्छ, त्यसैले 「数える」 (=गन्नु) मिल्छ। 省く (=छोड्नु) हटाउनु हो, 積もる र たまる (=थुप्रिनु) बढेर जम्मा हुनु हो।", "vi": "Đếm cừu từng con một nên hợp với 「数える」 (=đếm). 省く (=lược bỏ) là bỏ đi, 積もる và たまる (=tích tụ) là nhiều lên chồng chất.", "zh": "羊是一只一只数的,所以“数える”(=数)合适。“省く”(=省略)是去掉,“積もる”和“たまる”(=积)是增多堆积。"}}, {"id": "G-4-031", "subject": "goi", "qtype": "goi-context", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "このスープは塩の（　）が多すぎて、しょっぱい。", "a": "量", "w": ["数字", "面積", "回数"], "x": {"ja": "塩の多さや少なさは「量」で言います。「量が多い」「量が少ない」と使います。「数字」「回数」は合いません。", "en": "How much or how little salt there is is expressed with 量 (=amount). We say 「量が多い」 and 「量が少ない」. 数字 (=figure) and 回数 (=number of times) do not fit.", "ne": "नुनको धेरै वा थोरै हुनु 量 (=मात्रा) ले भनिन्छ। 「量が多い」, 「量が少ない」 प्रयोग हुन्छ। 数字 (=अंक) र 回数 (=पटक) मिल्दैन।", "vi": "Lượng muối nhiều hay ít được nói bằng 量 (=lượng). Dùng 「量が多い」, 「量が少ない」. 数字 (=con số) và 回数 (=số lần) không hợp.", "zh": "盐的多少用“量”(=量)表示。说“量が多い”“量が少ない”。“数字”(=数字)和“回数”(=次数)不合适。"}}, {"id": "G-4-032", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 3, "q": "[[少々]]お待ちください。", "a": "少し", "w": ["たくさん", "ゆっくり", "すぐに"], "x": {"ja": "「少々」は「少し」と同じ意味です。「少々お待ちください」は丁寧な言い方です。「たくさん」「すぐに」とは違います。", "en": "少々 (=a little) means the same as 少し. 「少々お待ちください」 is a polite phrase. It is different from たくさん (=a lot) and すぐに (=immediately).", "ne": "「少々」 (=अलिकति) को अर्थ 「少し」 जस्तै हो। 「少々お待ちください」 शिष्ट वाक्य हो। たくさん (=धेरै) र すぐに (=तुरुन्तै) भन्दा फरक हो।", "vi": "「少々」 (=một chút) cùng nghĩa với 「少し」. 「少々お待ちください」 là cách nói lịch sự. Khác với たくさん (=nhiều) và すぐに (=ngay lập tức).", "zh": "“少々”(=稍微)和“少し”意思相同。“少々お待ちください”是礼貌的说法。和“たくさん”(=很多)、“すぐに”(=马上)不同。"}}, {"id": "G-4-033", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 3, "q": "学生の[[大半]]が賛成した。", "a": "半分より多く", "w": ["半分より少なく", "ちょうど半分", "一人だけ"], "x": {"ja": "「大半」は、全体の半分より多い部分で、ほとんどという意味です。ちょうど半分や少ない場合には使いません。", "en": "大半 (=the majority) is the part larger than half of the whole, meaning almost all. It is not used for exactly half or a small number.", "ne": "「大半」 (=धेरैजसो) पूरामध्ये आधाभन्दा बढी भाग हो, ほとんど (=प्रायः सबै) को अर्थ। ठ्याक्कै आधा वा थोरैका लागि प्रयोग हुँदैन।", "vi": "「大半」 (=đa số) là phần nhiều hơn một nửa của tổng thể, nghĩa là hầu hết. Không dùng cho đúng một nửa hay số ít.", "zh": "“大半”(=大半)是整体中超过一半的部分,意思是几乎。不用于刚好一半或少数的情况。"}}, {"id": "G-4-034", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "セールで[[大量]]に買い物をした。", "a": "たくさん", "w": ["少し", "急いで", "安く"], "x": {"ja": "「大量に」は、たくさんという意味です。量がとても多いときに使います。「少し」は反対です。", "en": "大量に (=in large amounts) means a lot. Use it when the amount is very big. 少し (=a little) is the opposite.", "ne": "「大量に」 (=ठूलो मात्रामा) को अर्थ धेरै हो। मात्रा धेरै ठूलो हुँदा प्रयोग हुन्छ। 少し (=अलिकति) उल्टो हो।", "vi": "「大量に」 (=với số lượng lớn) nghĩa là nhiều. Dùng khi lượng rất nhiều. 少し (=một chút) thì ngược lại.", "zh": "“大量に”(=大量地)是很多的意思。数量非常多时使用。“少し”(=一点)相反。"}}, {"id": "G-4-035", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "彼は[[豊富]]な知識を持っている。", "a": "たくさんある", "w": ["少ない", "正しくない", "{珍|めずら}しい"], "x": {"ja": "「豊富」は、たくさんあることです。知識が豊富は、知っていることが多いという意味です。「少ない」は反対です。", "en": "豊富 (=abundant) means there is a lot. 「知識が豊富」 means knowing many things. 少ない (=few) is the opposite.", "ne": "「豊富」 (=प्रशस्त) धेरै हुनु हो। 「知識が豊富」 भनेको धेरै कुरा जान्नु हो। 少ない (=थोरै) उल्टो हो।", "vi": "「豊富」 (=phong phú) là có nhiều. 「知識が豊富」 nghĩa là biết nhiều điều. 少ない (=ít) thì ngược lại.", "zh": "“豊富”(=丰富)是有很多。“知識が豊富”是知道的很多的意思。“少ない”(=少)相反。"}}, {"id": "G-4-036", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "[[{膨大|ぼうだい}]]な資料を調べた。", "a": "非常に多い", "w": ["非常に古い", "非常に重要な", "非常に少ない"], "x": {"ja": "「膨大」は、数や量が非常に多いことです。資料を調べるのが大変なくらい多いイメージです。「少ない」は反対です。", "en": "膨大 (=huge) means the number or amount is extremely large. The image is so much that checking the materials is hard. 少ない (=few) is the opposite.", "ne": "「膨大」 (=अत्यन्त ठूलो) संख्या वा मात्रा धेरै नै बढी हुनु हो। सामग्री जाँच्न गाह्रो पर्ने गरी धेरै भएको छवि हो। 少ない (=थोरै) उल्टो हो।", "vi": "「膨大」 (=khổng lồ) là số hay lượng cực kỳ nhiều. Hình dung nhiều đến mức tra cứu tài liệu rất vất vả. 少ない (=ít) thì ngược lại.", "zh": "“膨大”(=庞大)指数量非常多。给人多到查资料都很辛苦的印象。“少ない”(=少)相反。"}}, {"id": "G-4-037", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "店員さんに[[{勘定|かんじょう}]]をお願いした。", "a": "お会計", "w": ["注文", "予約", "案内"], "x": {"ja": "「勘定」は、食事のあとに払うお金のことで、「お会計」と同じです。注文や予約とは違います。", "en": "勘定 (=the bill) is the money you pay after a meal, the same as お会計 (=the check). It is different from ordering or reserving.", "ne": "「勘定」 (=बिल) खाना खाएपछि तिर्ने पैसा हो, 「お会計」 जस्तै हो। अर्डर वा आरक्षणभन्दा फरक हो।", "vi": "「勘定」 (=thanh toán) là tiền trả sau bữa ăn, giống 「お会計」. Khác với gọi món hay đặt chỗ.", "zh": "“勘定”(=结账)是饭后付的钱,和“お会計”相同。与点菜、预约不同。"}}, {"id": "G-4-038", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "星が[[数え切れない]]ほど{輝|かがや}いている。", "a": "多すぎて全部数えられない", "w": ["少なくてすぐ数えられる", "数えてはいけない", "数えたくない"], "x": {"ja": "「数え切れない」は、多すぎて全部数えられないという意味です。星がとても多いときに使います。", "en": "数え切れない (=countless) means there are too many to count them all. It is used when there are very many stars.", "ne": "「数え切れない」 (=गन्न नसकिने) को अर्थ धेरै भएर सबै गन्न नसकिनु हो। ताराहरू धेरै हुँदा प्रयोग हुन्छ।", "vi": "「数え切れない」 (=không đếm xuể) nghĩa là nhiều quá không đếm hết được. Dùng khi có rất nhiều ngôi sao.", "zh": "“数え切れない”(=数不胜数)是多得数不过来的意思。星星非常多时使用。"}}, {"id": "G-4-039", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 3, "q": "10歳[[未満]]の子どもは無料です。", "a": "10歳より下の子ども(10歳は入らない)", "w": ["10歳以下の子ども(10歳も入る)", "10歳より上の子ども(10歳は入らない)", "10歳以上の子ども(10歳も入る)"], "x": {"ja": "「未満」は、その数を含まないで、それより下という意味です。10歳未満は、10歳の子どもは入りません。10歳も入るのは「以下」です。", "en": "未満 (=under) means below that number, not including it. Under 10 does not include 10-year-olds. 以下 (=or less) would include 10.", "ne": "「未満」 (=भन्दा कम) को अर्थ त्यो संख्या समावेश नगरी त्योभन्दा तल हो। १० वर्ष未満 मा १० वर्षका बच्चा पर्दैनन्। १० पनि पर्ने भए 「以下」 (=वा भन्दा कम) हुन्छ।", "vi": "「未満」 (=chưa đến) nghĩa là thấp hơn con số đó, không bao gồm nó. 10歳未満 không có trẻ 10 tuổi. Nếu gồm cả 10 thì là 「以下」 (=từ… trở xuống).", "zh": "“未満”(=不满)是不含该数、比它小的意思。10岁未満不包括10岁的孩子。包括10岁的是“以下”(=以下)。"}}, {"id": "G-4-040", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "{宇宙|うちゅう}は[[無限]]だと言われている。", "a": "限りがない", "w": ["とても古い", "まだよくわかっていない", "とても暗い"], "x": {"ja": "「無限」は、限りがないという意味です。宇宙に終わりがないという言い方に合います。「無限」は古いという意味ではありません。", "en": "無限 (=infinite) means without limit. It fits the idea that space has no end. It does not mean old.", "ne": "「無限」 (=असीमित) को अर्थ सीमा नहुनु हो। ब्रह्माण्डको अन्त्य छैन भन्ने भनाइसँग मिल्छ। पुरानो भन्ने अर्थ होइन।", "vi": "「無限」 (=vô hạn) nghĩa là không có giới hạn. Hợp với cách nói vũ trụ không có điểm kết thúc. Không có nghĩa là cũ.", "zh": "“無限”(=无限)是没有尽头的意思。符合宇宙没有尽头的说法。不是“很古老”的意思。"}}, {"id": "G-4-041", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "細かい説明を[[省いた]]。", "a": "なくした", "w": ["付け加えた", "増やした", "直した"], "x": {"ja": "「省く」は、いらないものをなくすことです。付け加えたり増やしたりするのとは反対です。", "en": "省く (=to omit) means to remove what is not needed. It is the opposite of adding or increasing.", "ne": "「省く」 (=छोड्नु) अनावश्यक कुरा हटाउनु हो। थप्नु वा बढाउनुको उल्टो हो।", "vi": "「省く」 (=lược bỏ) là bỏ đi những thứ không cần. Ngược lại với thêm vào hay làm tăng.", "zh": "“省く”(=省略)是去掉不需要的东西。和添加、增加相反。"}}, {"id": "G-4-042", "subject": "goi", "qtype": "goi-synonym", "level": "N2", "unit": "語彙 Unit 4", "freq": 2, "q": "雪が[[積もった]]。", "a": "重なって増えた", "w": ["全部{溶|と}けた", "少し降っただけだった", "止んだ"], "x": {"ja": "「積もる」は、雪などが重なって増えることです。全部溶けたり、少し降っただけの場合は使いません。", "en": "積もる (=to pile up) means snow and such layers up and increases. It is not used when it all melted or only snowed a little.", "ne": "「積もる」 (=थुप्रिनु) हिउँ आदि माथि माथि थपिएर बढ्नु हो। सबै पग्लिएमा वा अलिकति मात्र परेमा प्रयोग हुँदैन।", "vi": "「積もる」 (=chất thành lớp) là tuyết… chồng lên và dày thêm. Không dùng khi tuyết tan hết hay chỉ rơi một chút.", "zh": "“積もる”(=积)是雪等层层叠加变多。全部融化或只下了一点时不用。"}}, {"id": "K-U33-R32", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "子供の[[笑顔]]を見ると、幸せな気持ちになる。", "a": "えがお", "w": ["わらがお", "しょうがん", "えがん"], "x": {"ja": "「笑顔」は「えがお」と読む。「笑」は「え」と読むことがある。「わらがお」とは言わない。", "en": "「笑顔」 is read えがお (smiling face). 笑 is read え here. わらがお is not a real word.", "ne": "「笑顔」 लाई えがお भनेर पढिन्छ (हँसिलो अनुहार)। यहाँ 笑 लाई え पढिन्छ। わらがお भन्ने शब्द हुँदैन।", "vi": "「笑顔」 đọc là えがお (khuôn mặt tươi cười). Chữ 笑 ở đây đọc là え. Không có từ わらがお.", "zh": "「笑顔」读作えがお(笑脸)。这里「笑」读え。没有わらがお这个词。"}}, {"id": "K-U33-R33", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "すみませんが、田中さんに[[伝言]]をお願いします。", "a": "でんごん", "w": ["でんげん", "てんごん", "でんこと"], "x": {"ja": "「伝言」は「でんごん」と読む。「言」は「ごん」と読む。「でんげん」ではない。", "en": "「伝言」 is read でんごん (a message). 言 is read ごん here, not げん.", "ne": "「伝言」 लाई でんごん पढिन्छ (सन्देश)। यहाँ 言 を ごん पढिन्छ, げん होइन।", "vi": "「伝言」 đọc là でんごん (lời nhắn). Chữ 言 đọc là ごん, không phải げん.", "zh": "「伝言」读作でんごん(口信)。「言」读ごん,不是げん。"}}, {"id": "K-U33-R34", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "今日は課長の[[機嫌]]が悪かった。", "a": "きげん", "w": ["きけん", "ぎげん", "きっげん"], "x": {"ja": "「機嫌」は「きげん」と読む。人の気分のことだ。「きけん」(危険)とまちがえないこと。", "en": "「機嫌」 is read きげん (a person's mood). Do not confuse it with きけん (危険, danger).", "ne": "「機嫌」 लाई きげん पढिन्छ (मानिसको मनस्थिति)। きけん (危険, खतरा) सँग नमिसाउनुहोस्।", "vi": "「機嫌」 đọc là きげん (tâm trạng của người). Đừng nhầm với きけん (危険, nguy hiểm).", "zh": "「機嫌」读作きげん(心情)。不要和きけん(危険,危险)混淆。"}}, {"id": "K-U33-R35", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "{怖|こわ}い夢を見て、大きな声で[[叫んで]]しまった。", "a": "さけんで", "w": ["さかんで", "さげんで", "さきんで"], "x": {"ja": "「叫ぶ」は「さけぶ」と読む。「叫んで」は「さけんで」になる。大きな声を出すという意味だ。", "en": "「叫ぶ」 is read さけぶ (to shout), so 叫んで is さけんで.", "ne": "「叫ぶ」 लाई さけぶ पढिन्छ (चिच्याउनु), त्यसैले 叫んで = さけんで।", "vi": "「叫ぶ」 đọc là さけぶ (kêu to), nên 叫んで là さけんで.", "zh": "「叫ぶ」读作さけぶ(大喊),所以「叫んで」是さけんで。"}}, {"id": "K-U33-R36", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "人を[[憎んで]]ばかりいると、つらくなるよ。", "a": "にくんで", "w": ["なやんで", "ぞうんで", "にがんで"], "x": {"ja": "「憎む」は「にくむ」と読む。「憎んで」は「にくんで」。「にくい」(嫌いだ)の仲間の言葉だ。", "en": "「憎む」 is read にくむ (to hate), so 憎んで is にくんで. It is related to にくい (hateful).", "ne": "「憎む」 लाई にくむ पढिन्छ (घृणा गर्नु), त्यसैले 憎んで = にくんで।", "vi": "「憎む」 đọc là にくむ (căm ghét), nên 憎んで là にくんで.", "zh": "「憎む」读作にくむ(憎恨),所以「憎んで」是にくんで。"}}, {"id": "K-U33-W02", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "[[なや]]みがあったらいつでも相談してください。", "a": "悩", "w": ["憎", "脳", "怒"], "x": {"ja": "「悩み」は「悩」と書く。心(りっしんべん)があるから、気持ちの問題だ。「脳」は頭の「のう」で、形が似ているが意味がちがう。", "en": "「なやみ」 (worry) is written 悩. It has the heart radical (忄). 脳 (brain) looks similar but has a different meaning.", "ne": "「なやみ」 (चिन्ता) लाई 悩 लेखिन्छ। यसमा मन (忄) को भाग छ। 脳 (दिमाग) देखिन मिल्दोजुल्दो छ तर अर्थ फरक छ।", "vi": "「なやみ」 (nỗi lo) viết là 悩. Có bộ tâm (忄). 脳 (não) trông giống nhưng nghĩa khác.", "zh": "「なやみ」(烦恼)写作「悩」,带竖心旁。「脳」(大脑)字形相似但意思不同。"}}, {"id": "K-U33-W07", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "各自の仕事の現[[じょう]]を報告してください。", "a": "状", "w": ["情", "精", "伏"], "x": {"ja": "「現状」は「今の状態」という意味で、「状」と書く。「情」は気持ちや様子の意味で、「現情」とは言わない。", "en": "「現状」 means the present state, written with 状. 情 means feeling, and 現情 is not a word.", "ne": "「現状」 को अर्थ अहिलेको अवस्था हो, 状 लेखिन्छ। 情 भावना हो, 現情 भन्ने शब्द हुँदैन।", "vi": "「現状」 nghĩa là tình trạng hiện tại, viết bằng 状. 情 là tình cảm, không có từ 現情.", "zh": "「現状」意为现在的状况,写作「状」。「情」是感情,没有「現情」这个词。"}}, {"id": "K-U33-W09", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "子供を[[おこ]]りすぎるのはよくないよ。", "a": "怒", "w": ["憎", "起", "恕"], "x": {"ja": "「怒る」は「おこる」と読み、「怒」と書く。「起こる」(事件が起こる)とは意味がちがう。人にいかるときは「怒る」。", "en": "「おこる」 meaning to get angry is written 怒. 起こる means to happen, which is different.", "ne": "「おこる」 (रिसाउनु) लाई 怒 लेखिन्छ। 起こる (घटना हुनु) को अर्थ फरक छ।", "vi": "「おこる」 (tức giận) viết là 怒. 起こる (xảy ra) có nghĩa khác.", "zh": "表示「生气」的「おこる」写作「怒」。「起こる」(发生)意思不同。"}}, {"id": "K-U33-W12", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "私も早く[[こい]]人がほしいなあ。", "a": "恋", "w": ["変", "愛", "恕"], "x": {"ja": "「恋人」は「恋」と書く。「愛」は「あい」と読むことが多く、「あい人」とは言わない。", "en": "「恋人」 (lover) is written with 恋. 愛 is usually read あい, and あい人 is not used.", "ne": "「恋人」 (प्रेमी/प्रेमिका) मा 恋 लेखिन्छ। 愛 सामान्यतया あい पढिन्छ, あい人 भनिँदैन।", "vi": "「恋人」 (người yêu) viết bằng 恋. 愛 thường đọc là あい, không nói あい人.", "zh": "「恋人」(恋人)写作「恋」。「愛」多读あい,不说「あい人」。"}}, {"id": "K-U33-W22", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "テレビを見ながらよく独り[[ごと]]を言ってしまう。", "a": "言", "w": ["事", "答", "吉"], "x": {"ja": "「独り言」は「ひとりごと」で、「言」を書く。「ひとりごと」は一人で話す言葉のこと。「事」ではない。", "en": "「独り言」 (ひとりごと) means talking to oneself and uses 言 (words), not 事 (thing).", "ne": "「独り言」 (ひとりごと) अर्थात् एक्लै बोल्नु, 言 (शब्द) लेखिन्छ, 事 होइन।", "vi": "「独り言」 (ひとりごと) là nói một mình, dùng 言 (lời nói), không phải 事.", "zh": "「独り言」(ひとりごと)是自言自语,用「言」而不是「事」。"}}, {"id": "K-U34-R05", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "[[今日]]では、外国人の店員は{珍|めずら}しくなくなった。", "a": "こんにち", "w": ["きょう", "きんじつ", "こんじつ"], "x": {"ja": "「今日では」は「今の時代では」という意味で、「こんにち」と読む。「きょう」(今日)は、その日のことだ。", "en": "「今日では」 means “nowadays” and 今日 is read こんにち here. きょう means “today” (this day).", "ne": "「今日では」 को अर्थ “आजकल” हो, यहाँ 今日 लाई こんにち पढिन्छ। きょう भनेको आजको दिन हो।", "vi": "「今日では」 nghĩa là “ngày nay”, 今日 đọc là こんにち. きょう là “hôm nay”.", "zh": "「今日では」意为“如今”,「今日」读こんにち。きょう是“今天”。"}}, {"id": "K-U34-R06", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "環境を守るために[[身近]]でできることはありますか。", "a": "みぢか", "w": ["しんきん", "みちか", "しんじか"], "x": {"ja": "「身近」は「みぢか」と読む。「身」は「み」、「近」は「ちか」。「ち」が「ぢ」に変わる特別な言葉だ。", "en": "「身近」 is read みぢか (close to oneself). ち changes to ぢ in this word.", "ne": "「身近」 लाई みぢか पढिन्छ (आफ्नो नजिक)। यस शब्दमा ち を ぢ बनिन्छ।", "vi": "「身近」 đọc là みぢか (gần gũi). Trong từ này ち biến thành ぢ.", "zh": "「身近」读作みぢか(身边)。这个词里ち浊化为ぢ。"}}, {"id": "K-U34-R11", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "いつか[[訪ねて]]みたい場所がたくさんあります。", "a": "たずねて", "w": ["おとずねて", "とずねて", "ほうねて"], "x": {"ja": "「訪ねる」は「たずねる」と読む。人や場所に会いに行く意味だ。「尋ねる」(質問する)と区別しよう。", "en": "「訪ねる」 is read たずねる (to visit). Do not confuse it with 尋ねる (to ask).", "ne": "「訪ねる」 लाई たずねる पढिन्छ (भेट्न जानु)। 尋ねる (सोध्नु) सँग फरक छुट्याउनुहोस्।", "vi": "「訪ねる」 đọc là たずねる (đến thăm). Phân biệt với 尋ねる (hỏi).", "zh": "「訪ねる」读作たずねる(拜访)。注意与「尋ねる」(询问)区分。"}}, {"id": "K-U34-R13", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "神社で妹の入試合格を[[祈った]]。", "a": "いのった", "w": ["おった", "きのった", "いろった"], "x": {"ja": "「祈る」は「いのる」と読む。神様にお願いすることだ。「祈った」は「いのった」。", "en": "「祈る」 is read いのる (to pray), so 祈った is いのった.", "ne": "「祈る」 लाई いのる पढिन्छ (प्रार्थना गर्नु), त्यसैले 祈った = いのった।", "vi": "「祈る」 đọc là いのる (cầu nguyện), nên 祈った là いのった.", "zh": "「祈る」读作いのる(祈祷),所以「祈った」是いのった。"}}, {"id": "K-U34-R25", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "自分の{傘|かさ}だとすぐ分かるように、[[目印]]を付けておこう。", "a": "めじるし", "w": ["もくいん", "めしるし", "めいじるし"], "x": {"ja": "「目印」は「めじるし」と読む。「じるし」は「しるし」が変わった形で、「じ」と濁る。", "en": "「目印」 is read めじるし (a mark to recognize something). しるし becomes じるし in a compound.", "ne": "「目印」 लाई めじるし पढिन्छ (चिनारी)। यहाँ しるし は じるし बन्छ।", "vi": "「目印」 đọc là めじるし (dấu hiệu nhận biết). しるし biến thành じるし trong từ ghép.", "zh": "「目印」读作めじるし(标记)。「しるし」在复合词里浊化成「じるし」。"}}, {"id": "K-U34-W08", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "この寺には有名な[[ぶつ]]像があるそうだ。", "a": "仏", "w": ["物", "払", "公"], "x": {"ja": "「仏像」は「仏」と書く。「物」は「もの」「ぶつ」と読むが、「物像」という言葉はない。", "en": "「仏像」 (Buddha statue) is written with 仏. 物 can be read ぶつ, but 物像 is not a word.", "ne": "「仏像」 (बुद्धको मूर्ति) मा 仏 लेखिन्छ। 物 पनि ぶつ पढिन्छ तर 物像 शब्द हुँदैन।", "vi": "「仏像」 (tượng Phật) viết bằng 仏. 物 cũng đọc ぶつ nhưng không có từ 物像.", "zh": "「仏像」(佛像)写作「仏」。「物」也可读ぶつ,但没有「物像」这个词。"}}, {"id": "K-U34-W12", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "道で転んでしまって、[[は]]ずかしかった。", "a": "恥", "w": ["恋", "聴", "恩"], "x": {"ja": "「恥ずかしい」は「恥」と書く。心の気持ちを表す漢字だ。「恋」は形が少し似ているので注意。", "en": "「はずかしい」 (embarrassed) is written with 恥. 恋 looks a little similar, so be careful.", "ne": "「はずかしい」 (लाज) मा 恥 लेखिन्छ। 恋 अलि मिल्दोजुल्दो देखिन्छ, होशियार हुनुहोस्।", "vi": "「はずかしい」 (xấu hổ) viết bằng 恥. 恋 hơi giống nên cần chú ý.", "zh": "「はずかしい」(害羞)写作「恥」。「恋」字形有点像,要注意。"}}, {"id": "K-U34-W13", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "新型が発売され、[[きゅう]]型が安くなった。", "a": "旧", "w": ["古", "元", "九"], "x": {"ja": "「旧型」は「古い型」という意味で、「旧」と書く。新型の反対だ。「古型」とは言わない。", "en": "「旧型」 means an old model, written with 旧. It is the opposite of 新型. 古型 is not used.", "ne": "「旧型」 को अर्थ पुरानो मोडेल हो, 旧 लेखिन्छ। 新型 को उल्टो हो। 古型 भनिँदैन।", "vi": "「旧型」 nghĩa là kiểu cũ, viết bằng 旧. Trái nghĩa với 新型. Không dùng 古型.", "zh": "「旧型」意为旧款,写作「旧」,与「新型」相对。不说「古型」。"}}, {"id": "K-U34-W15", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "彼はいつも{穏|おだ}やかな人という[[いん]]象です。", "a": "印", "w": ["引", "院", "即"], "x": {"ja": "「印象」は「印」と書く。「印象」は心に残るイメージのこと。「引」と形が似ているが、ちがう字だ。", "en": "「印象」 (impression) is written with 印. It looks like 引 but is a different character.", "ne": "「印象」 (छाप) मा 印 लेखिन्छ। 引 सँग मिल्दोजुल्दो छ तर फरक अक्षर हो।", "vi": "「印象」 (ấn tượng) viết bằng 印. Giống 引 nhưng là chữ khác.", "zh": "「印象」写作「印」。和「引」字形相似,但是不同的字。"}}, {"id": "K-U34-W16", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "就職活動で、A社を[[ほう]]問した。", "a": "訪", "w": ["方", "報", "話"], "x": {"ja": "「訪問」は「訪」と書く。会社や人の所に行くことだ。「訪」の右の部分は「方」だが、「方」だけではない。", "en": "「訪問」 (visit) is written with 訪. The right side is 方, but the character is 訪, not 方 alone.", "ne": "「訪問」 (भ्रमण) मा 訪 लेखिन्छ। दायाँ भाग 方 हो, तर अक्षर 訪 हो, 方 मात्र होइन।", "vi": "「訪問」 (thăm hỏi) viết bằng 訪. Bên phải là 方 nhưng chữ đúng là 訪.", "zh": "「訪問」(拜访)写作「訪」。右边是「方」,但字是「訪」,不是单独的「方」。"}}, {"id": "K-U35-R01", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "先祖を[[敬う]]気持ちを持っている日本人は多いという。", "a": "うやまう", "w": ["うかがう", "けいう", "うやなう"], "x": {"ja": "「敬う」は「うやまう」と読む。目上の人を大切に思うことだ。「うかがう」は「伺う」と書く。", "en": "「敬う」 is read うやまう (to respect). うかがう is written 伺う and means something else.", "ne": "「敬う」 लाई うやまう पढिन्छ (सम्मान गर्नु)। うかがう लाई 伺う लेखिन्छ, अर्थ फरक छ।", "vi": "「敬う」 đọc là うやまう (kính trọng). うかがう viết là 伺う, nghĩa khác.", "zh": "「敬う」读作うやまう(尊敬)。「うかがう」写作「伺う」,意思不同。"}}, {"id": "K-U35-R07", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "田中課長は課のメンバーの意見を[[尊重]]してくれる。", "a": "そんちょう", "w": ["そんじょう", "そんじゅう", "ぞんちょう"], "x": {"ja": "「尊重」は「そんちょう」と読む。「重」は「ちょう」と読む。「そんじゅう」ではない。", "en": "「尊重」 is read そんちょう (to respect). 重 is read ちょう here.", "ne": "「尊重」 लाई そんちょう पढिन्छ (सम्मान)। यहाँ 重 लाई ちょう पढिन्छ।", "vi": "「尊重」 đọc là そんちょう (tôn trọng). Chữ 重 đọc là ちょう.", "zh": "「尊重」读作そんちょう(尊重)。「重」读ちょう。"}}, {"id": "K-U35-R19", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "お寺の中で仏像を[[拝んだ]]。", "a": "おがんだ", "w": ["おかんだ", "はいんだ", "おろがんだ"], "x": {"ja": "「拝む」は「おがむ」と読む。手を合わせて神や仏にお祈りすることだ。「拝んだ」は「おがんだ」。", "en": "「拝む」 is read おがむ (to pray with hands together), so 拝んだ is おがんだ.", "ne": "「拝む」 लाई おがむ पढिन्छ (हात जोडेर प्रार्थना गर्नु), त्यसैले 拝んだ = おがんだ।", "vi": "「拝む」 đọc là おがむ (chắp tay cầu nguyện), nên 拝んだ là おがんだ.", "zh": "「拝む」读作おがむ(合掌参拜),所以「拝んだ」是おがんだ。"}}, {"id": "K-U35-R22", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "お客様のご意見、確かに[[承り]]ました。", "a": "うけたまわり", "w": ["うけたまり", "うけたもり", "しょうり"], "x": {"ja": "「承る」は「うけたまわる」と読む。「聞く」「受ける」の敬語だ。「承り」は「うけたまわり」。", "en": "「承る」 is read うけたまわる, the humble form of 聞く and 受ける. 承り is うけたまわり.", "ne": "「承る」 लाई うけたまわる पढिन्छ, यो 聞く/受ける को विनम्र रूप हो। 承り = うけたまわり।", "vi": "「承る」 đọc là うけたまわる, là khiêm nhường ngữ của 聞く, 受ける. 承り là うけたまわり.", "zh": "「承る」读作うけたまわる,是「聞く」「受ける」的谦让语。「承り」读うけたまわり。"}}, {"id": "K-U35-R27", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "あの人は私にとって特別な[[存在]]でした。", "a": "そんざい", "w": ["ぞんざい", "そんぞい", "そうざい"], "x": {"ja": "「存在」は「そんざい」と読む。「在」は「ざい」と読む。「ぞんざい」は別の言葉(いいかげんな様子)だ。", "en": "「存在」 is read そんざい (existence). ぞんざい is a different word meaning rough or careless.", "ne": "「存在」 लाई そんざい पढिन्छ (अस्तित्व)। ぞんざい अर्को शब्द हो (लापरवाही)।", "vi": "「存在」 đọc là そんざい (sự tồn tại). ぞんざい là từ khác (cẩu thả).", "zh": "「存在」读作そんざい(存在)。「ぞんざい」是另一个词(草率)。"}}, {"id": "K-U35-W05", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "この本はレポートを書くときに[[さん]]考になる。", "a": "参", "w": ["産", "賛", "惨"], "x": {"ja": "「参考」は「参」と書く。「参考になる」は役に立つという意味。「産」「賛」は形が似ているので注意。", "en": "「参考」 (reference) is written with 参. 産 and 賛 look similar, so be careful.", "ne": "「参考」 (सन्दर्भ) मा 参 लेखिन्छ। 産 र 賛 मिल्दोजुल्दा छन्, होशियार।", "vi": "「参考」 (tham khảo) viết bằng 参. 産 và 賛 trông giống nên chú ý.", "zh": "「参考」(参考)写作「参」。「産」「賛」字形相似,要注意。"}}, {"id": "K-U35-W09", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "{締|し}め切りは明日でも[[かま]]いませんよ。", "a": "構", "w": ["講", "購", "溝"], "x": {"ja": "「かまいません」は「構いません」と書く。「かまわない」は問題ないという意味だ。「講」「購」は形が似ているがちがう。", "en": "「かまいません」 is written 構いません (it is fine / no problem). 講 and 購 look similar but are different.", "ne": "「かまいません」 लाई 構いません लेखिन्छ (कुनै समस्या छैन)। 講 र 購 मिल्दोजुल्दा तर फरक छन्।", "vi": "「かまいません」 viết là 構いません (không sao). 講 và 購 giống nhưng khác chữ.", "zh": "「かまいません」写作「構いません」(没关系)。「講」「購」字形相似但不同。"}}, {"id": "K-U35-W11", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "この国では、王様は国民にとても[[そん]]敬されている。", "a": "尊", "w": ["参", "拝", "存"], "x": {"ja": "「尊敬」は「尊」と書く。目上の人をすばらしいと思うことだ。「存」は形が似ているので注意。", "en": "「尊敬」 (respect) is written with 尊. 存 looks similar, so be careful.", "ne": "「尊敬」 (सम्मान) मा 尊 लेखिन्छ। 存 मिल्दोजुल्दो छ, होशियार।", "vi": "「尊敬」 (tôn kính) viết bằng 尊. 存 trông giống nên chú ý.", "zh": "「尊敬」(尊敬)写作「尊」。「存」字形相似,要注意。"}}, {"id": "K-U35-W12", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "チケットを[[はい]]見しますので、よろしくお願いいたします。", "a": "拝", "w": ["承", "伺", "排"], "x": {"ja": "「拝見」は「見る」の謙譲語で、「拝」と書く。「拝」は「おがむ」の字だ。「見せていただく」という気持ちがある。", "en": "「拝見」 is the humble form of 見る, written with 拝. 拝 is the character of おがむ (to pray). It shows respect.", "ne": "「拝見」 は 見る को विनम्र रूप हो, 拝 लेखिन्छ। 拝 は おがむ को अक्षर हो।", "vi": "「拝見」 là khiêm nhường ngữ của 見る, viết bằng 拝. 拝 là chữ của おがむ (cúi lạy).", "zh": "「拝見」是「見る」的谦让语,写作「拝」。「拝」是「おがむ」(参拜)的字。"}}, {"id": "K-U35-W13", "subject": "kanji", "qtype": "kanji-write", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "この書類を10部コピーですね。[[しょう]]知しました。", "a": "承", "w": ["了", "召", "証"], "x": {"ja": "「承知」は「分かりました」の丁寧な言い方で、「承」と書く。「了解」「了承」の「了」ではない。", "en": "「承知」 is a polite way to say “I understand,” written with 承. It is not 了 as in 了解.", "ne": "「承知」 は “बुझें” को विनम्र भाषा हो, 承 लेखिन्छ। 了解 को 了 होइन।", "vi": "「承知」 là cách nói lịch sự của “đã hiểu”, viết bằng 承. Không phải 了 như trong 了解.", "zh": "「承知」是“明白了”的礼貌说法,写作「承」。不是「了解」的「了」。"}}, {"id": "K-U33-C01", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "面接で、最近の健康[[状態]]を聞かれた。", "a": "じょうたい", "w": ["せいしん", "じょうきょう", "たいちょう"], "x": {"ja": "「状態」は「じょうたい」と読む。健康の状態は、体の様子のことだ。「状」は「じょう」と読む。", "en": "「状態」 is read じょうたい (condition). 状 is read じょう.", "ne": "「状態」 लाई じょうたい पढिन्छ (अवस्था)। 状 लाई じょう पढिन्छ।", "vi": "「状態」 đọc là じょうたい (tình trạng). 状 đọc là じょう.", "zh": "「状態」读作じょうたい(状态)。「状」读じょう。"}}, {"id": "K-U33-C02", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "私の父は家族に[[愛情]]深い人でした。", "a": "あいじょう", "w": ["れんあい", "じょうねつ", "あいちゃく"], "x": {"ja": "「愛情」は「あいじょう」と読む。「愛」は「あい」、「情」は「じょう」。家族を大切に思う気持ちのこと。", "en": "「愛情」 is read あいじょう (affection). 愛 is あい and 情 is じょう.", "ne": "「愛情」 लाई あいじょう पढिन्छ (माया)। 愛 = あい, 情 = じょう।", "vi": "「愛情」 đọc là あいじょう (tình cảm). 愛 là あい, 情 là じょう.", "zh": "「愛情」读作あいじょう(爱情/感情)。「愛」读あい,「情」读じょう。"}}, {"id": "K-U33-C03", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "{爪|つめ}が窓ガラスに当たって「キーッ」と[[嫌な]]音がした。", "a": "いやな", "w": ["にくらしい", "こわい", "いたい"], "x": {"ja": "「嫌な」は「いやな」と読む。「嫌」は「いや」。「にくらしい」は「憎らしい」と書く。", "en": "「嫌な」 is read いやな (unpleasant). 憎らしい (にくらしい) is a different word.", "ne": "「嫌な」 लाई いやな पढिन्छ (अप्रिय)। にくらしい は 憎らしい लेखिन्छ, फरक शब्द हो।", "vi": "「嫌な」 đọc là いやな (khó chịu). にくらしい viết là 憎らしい, khác nghĩa.", "zh": "「嫌な」读作いやな(讨厌的)。「にくらしい」写作「憎らしい」,是另一个词。"}}, {"id": "K-U33-C04", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "世界の[[言語]]の中で、スペイン語とポルトガル語は比較的似ている。", "a": "げんご", "w": ["ほうげん", "がいこくご", "ようご"], "x": {"ja": "「言語」は「げんご」と読む。「言」は「げん」、「語」は「ご」。世界のことば全体を指す。", "en": "「言語」 is read げんご (language). 言 is げん and 語 is ご.", "ne": "「言語」 लाई げんご पढिन्छ (भाषा)। 言 = げん, 語 = ご।", "vi": "「言語」 đọc là げんご (ngôn ngữ). 言 là げん, 語 là ご.", "zh": "「言語」读作げんご(语言)。「言」读げん,「語」读ご。"}}, {"id": "K-U33-C05", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-3", "freq": 0, "q": "結婚式の[[招待状]]が届いた。", "a": "しょうたいじょう", "w": ["じょうきょう", "あんないじょう", "じょうたい"], "x": {"ja": "「招待状」は「しょうたいじょう」と読む。「招待」に「状」(手紙)がついた言葉だ。「案内状」は別の言葉。", "en": "「招待状」 is read しょうたいじょう (invitation card). It is 招待 plus 状 (letter).", "ne": "「招待状」 लाई しょうたいじょう पढिन्छ (निमन्त्रणा पत्र)। 招待 + 状 (पत्र) हो।", "vi": "「招待状」 đọc là しょうたいじょう (thiệp mời). Là 招待 cộng 状 (thư).", "zh": "「招待状」读作しょうたいじょう(请柬)。由「招待」加「状」(信)组成。"}}, {"id": "K-U34-C01", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "日本では「[[宗教]]は特に無い」という人も多い。", "a": "しゅうきょう", "w": ["しんけい", "しんこう", "しゅうは"], "x": {"ja": "「宗教」は「しゅうきょう」と読む。神や仏を信じる教えのことだ。「信仰」は「しんこう」で、信じる気持ち。", "en": "「宗教」 is read しゅうきょう (religion). 信仰 (しんこう) is faith, a different word.", "ne": "「宗教」 लाई しゅうきょう पढिन्छ (धर्म)। 信仰 (しんこう) विश्वास हो, फरक शब्द।", "vi": "「宗教」 đọc là しゅうきょう (tôn giáo). 信仰 (しんこう) là đức tin, từ khác.", "zh": "「宗教」读作しゅうきょう(宗教)。「信仰」(しんこう)是信仰,是另一个词。"}}, {"id": "K-U34-C02", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "社長がいる以上、この会社は[[永久に]]変わらない。", "a": "えいきゅうに", "w": ["ひさしぶりに", "えいえんに", "ひさびさに"], "x": {"ja": "「永久に」は「えいきゅうに」と読む。ずっと続くという意味だ。「永遠」(えいえん)と似ているが、ここでは「永久」。", "en": "「永久に」 is read えいきゅうに (permanently). 永遠 (えいえん) is similar, but the word here is 永久.", "ne": "「永久に」 लाई えいきゅうに पढिन्छ (सधैँका लागि)। 永遠 (えいえん) मिल्दोजुल्दो छ तर यहाँ 永久।", "vi": "「永久に」 đọc là えいきゅうに (vĩnh viễn). Giống 永遠 (えいえん), nhưng ở đây là 永久.", "zh": "「永久に」读作えいきゅうに(永久)。与「永遠」(えいえん)相近,但这里是「永久」。"}}, {"id": "K-U34-C03", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "引っ越しして、[[落ち着いたら]]連絡しますね。", "a": "おちついたら", "w": ["らくだいしたら", "おちこんだら", "おとしたら"], "x": {"ja": "「落ち着く」は「おちつく」と読む。気持ちや生活が安定することだ。「落ち込む」(おちこむ)は元気がなくなること。", "en": "「落ち着く」 is read おちつく (to settle down). 落ち込む (おちこむ) means to feel down.", "ne": "「落ち着く」 लाई おちつく पढिन्छ (स्थिर हुनु)। 落ち込む (おちこむ) = निराश हुनु।", "vi": "「落ち着く」 đọc là おちつく (ổn định). 落ち込む (おちこむ) là buồn chán.", "zh": "「落ち着く」读作おちつく(安顿下来)。「落ち込む」(おちこむ)是情绪低落。"}}, {"id": "K-U34-C04", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "ご[[出身]]はどちらですか。", "a": "しゅっしん", "w": ["じしん", "しゅっせい", "しゅっちょう"], "x": {"ja": "「出身」は「しゅっしん」と読む。生まれた所や、出た学校のことだ。「出生」(しゅっせい)は生まれることなので別の言葉。", "en": "「出身」 is read しゅっしん (where one is from). 出生 (しゅっせい) means birth, a different word.", "ne": "「出身」 लाई しゅっしん पढिन्छ (कहाँको हो)। 出生 (しゅっせい) जन्म हो, फरक शब्द।", "vi": "「出身」 đọc là しゅっしん (quê quán). 出生 (しゅっせい) là sự ra đời, từ khác.", "zh": "「出身」读作しゅっしん(出身)。「出生」(しゅっせい)指出生,是另一个词。"}}, {"id": "K-U34-C05", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-4", "freq": 0, "q": "[[今度]]、休みの日にでも一緒に食事しませんか。", "a": "こんど", "w": ["こんかい", "こんご", "じかい"], "x": {"ja": "「今度」は「こんど」と読む。「今度」は「次の機会」の意味で、「こんかい」(今回)とはちがう。", "en": "「今度」 is read こんど, meaning “next time/sometime soon.” It differs from こんかい (今回, this time).", "ne": "「今度」 लाई こんど पढिन्छ, अर्थ “अर्को पटक”। こんかい (今回, यस पटक) भन्दा फरक।", "vi": "「今度」 đọc là こんど, nghĩa là “lần tới”. Khác với こんかい (今回, lần này).", "zh": "「今度」读作こんど,意为“下次”。与こんかい(今回,这次)不同。"}}, {"id": "K-U35-C01", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "明日10時ごろ、そちらに[[参ります]]。", "a": "まいります", "w": ["めしあがります", "いただきます", "はいけんします"], "x": {"ja": "「参る」は「行く・来る」の謙譲語で、「まいります」と読む。「めしあがる」は「食べる」の尊敬語だ。", "en": "「参ります」 is read まいります, the humble form of 行く/来る. めしあがる is the honorific form of 食べる.", "ne": "「参ります」 लाई まいります पढिन्छ, 行く/来る को विनम्र रूप। めしあがる は 食べる को सम्मानार्थी रूप हो।", "vi": "「参ります」 đọc là まいります, khiêm nhường ngữ của 行く/来る. めしあがる là kính ngữ của 食べる.", "zh": "「参ります」读作まいります,是「行く/来る」的谦让语。「めしあがる」是「食べる」的尊敬语。"}}, {"id": "K-U35-C02", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "この本は5つの章で[[構成]]されている。", "a": "こうせい", "w": ["こうぞう", "こうちく", "そしき"], "x": {"ja": "「構成」は「こうせい」と読む。いくつかの部分で全体を作ることだ。「構造」(こうぞう)は仕組みのこと。", "en": "「構成」 is read こうせい (to be composed of). 構造 (こうぞう) means structure, a different word.", "ne": "「構成」 लाई こうせい पढिन्छ (बनेको हुनु)। 構造 (こうぞう) = संरचना, फरक शब्द।", "vi": "「構成」 đọc là こうせい (cấu thành). 構造 (こうぞう) là cấu trúc, từ khác.", "zh": "「構成」读作こうせい(构成)。「構造」(こうぞう)指结构,是另一个词。"}}, {"id": "K-U35-C03", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "写真のデータはパソコンに[[保存]]してあります。", "a": "ほぞん", "w": ["そんざい", "そんぞく", "きろく"], "x": {"ja": "「保存」は「ほぞん」と読む。データやものをそのまま残すことだ。「存」はここでは「ぞん」と読む。", "en": "「保存」 is read ほぞん (to save/preserve). 存 is read ぞん here.", "ne": "「保存」 लाई ほぞん पढिन्छ (सुरक्षित राख्नु)। यहाँ 存 लाई ぞん पढिन्छ।", "vi": "「保存」 đọc là ほぞん (lưu giữ). Chữ 存 ở đây đọc là ぞん.", "zh": "「保存」读作ほぞん(保存)。「存」在这里读ぞん。"}}, {"id": "K-U35-C04", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 0, "q": "セミナーには各自パソコンを[[持参]]してください。", "a": "じさん", "w": ["さんか", "じぞく", "さんこう"], "x": {"ja": "「持参」は「じさん」と読む。自分で持って行くことだ。「参加」(さんか)の「参」は「さん」だが、「持」は「じ」と読む。", "en": "「持参」 is read じさん (to bring with you). 持 is read じ here.", "ne": "「持参」 लाई じさん पढिन्छ (आफैँ लिएर आउनु)। यहाँ 持 लाई じ पढिन्छ।", "vi": "「持参」 đọc là じさん (tự mang theo). Chữ 持 ở đây đọc là じ.", "zh": "「持参」读作じさん(自带)。「持」在这里读じ。"}}, {"id": "K-U35-C05", "subject": "kanji", "qtype": "kanji-read", "level": "N2", "unit": "漢字 Unit 3-5", "freq": 1, "q": "今年の新入社員は[[礼儀]]正しい人が多いね。", "a": "れいぎ", "w": ["けいご", "じょうしき", "けいい"], "x": {"ja": "「礼儀」は「れいぎ」と読む。人に対するきちんとした態度やマナーのことだ。「敬語」(けいご)は言葉づかいで、別の言葉。", "
