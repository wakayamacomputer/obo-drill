dokkai-mid", "pid": "E5-P7", "q": "子どものころの川は、筆者にとってどのような場所だったか。", "o": ["友達と魚をとって遊ぶ場所", "きれいに整えられた美しい場所", "遊ぶ場所ではなく、ただ水が流れていく場所", "危険なので近づいてはいけない場所"], "a": 3, "x": "第一段落に、遊ぶ場所ではなく、ただ水が流れていく場所にすぎなかったとある。"}, {"no": 61, "sec": "読解", "qt": "dokkai-mid", "pid": "E5-P7", "q": "市が進めている工事とは、どのようなものか。", "o": ["川をまっすぐにして水を流れやすくする工事", "コンクリートを外し、流れを曲げて浅い所と深い所をつくる工事", "川岸に草が生えないように整える工事", "川に魚を放して数を増やす工事"], "a": 2, "x": "第二段落に、コンクリートを外して石や土の岸に戻し、流れを曲げて浅い所と深い所をつくるとある。"}, {"no": 62, "sec": "読解", "qt": "dokkai-mid", "pid": "E5-P7", "q": "この工事を見て、筆者が感じたことは何か。", "o": ["人は失われた自然をそのまま作り直すことができる。", "自然にとっては、人が手を加えないことが最もよい。", "費用をかけても見た目が整わないのは問題である。", "人にできるのは条件を整えることだけだが、自然はそれに応えてくれる。"], "a": 4, "x": "最終段落に、できるのは条件を整えることだけだが、条件さえ整えば自然は早く応えてくれるとある。"}, {"no": 63, "sec": "読解", "qt": "dokkai-mid", "pid": "E5-P8", "q": "各地で始まっている試みとは、どのようなものか。", "o": ["観光地に入れる人の数を制限するもの", "観光地を訪れる人の時間を散らそうとするもの", "観光地の入場料を全体的に安くするもの", "見学コースの数を大幅に増やすもの"], "a": 2, "x": "第二段落に、訪れる人の数を減らすのではなく、訪れる時間を散らす考え方だとある。"}, {"no": 64, "sec": "読解", "qt": "dokkai-mid", "pid": "E5-P8", "q": "ある寺の取り組みの結果について、正しいものはどれか。", "o": ["一日の来訪者の合計が三割ほど減った。", "収入は減ったが、混雑は和らいだ。", "最も混む時間帯の来訪者が減り、一日の合計は減らなかった。", "早朝の来訪者が減り、夕方の来訪者が増えた。"], "a": 3, "x": "第三段落に、最も混む時間帯が三割ほど減った一方、一日の合計は減っていないとある。"}, {"no": 65, "sec": "読解", "qt": "dokkai-mid", "pid": "E5-P8", "q": "この試みについて、筆者はどのように考えているか。", "o": ["時間に余裕のない人には不利な面もあるが、意味のある試みだ。", "料金に差をつけるのは不公平なので、やめるべきだ。", "混雑を減らすには、訪れる人の数を制限するしかない。", "観光地の収入を増やすために効果的な方法である。"], "a": 1, "x": "第四段落で問題点を認めたうえで、第五段落で大きな意味があると述べている。"}, {"no": 66, "sec": "読解", "qt": "dokkai-mid", "pid": "E5-P9", "q": "筆者は、研究者の話を聞いて何を知ったか。", "o": ["一日一万歩ではまだ足りないということ", "歩数よりも座り続けている時間の長さが問題だということ", "朝と夜に分けて歩くほうが効果が高いということ", "歩数計の数字は正確ではないということ"], "a": 2, "x": "第一段落に、問題は歩いた数ではなく座っている時間の長さだとある。"}, {"no": 67, "sec": "読解", "qt": "dokkai-mid", "pid": "E5-P9", "q": "研究者が勧めている方法はどれか。", "o": ["まとまった運動の時間を毎日つくること", "一日の歩数を今よりも増やすこと", "三十分に一度立ち上がって少し歩くこと", "仕事の合間に軽い体操をすること"], "a": 3, "x": "第三段落に、三十分に一度立ち上がって二、三分歩くだけでよいとある。"}, {"no": 68, "sec": "読解", "qt": "dokkai-mid", "pid": "E5-P9", "q": "この文章で筆者が最も言いたいことは何か。", "o": ["歩数計は健康管理の役には立たない。", "忙しい人は運動をあきらめたほうがよい。", "タイマーを使えば誰でも健康になれる。", "分かりやすい数字だけを追うと、大切なことを見落とすことがある。"], "a": 4, "x": "最終段落に、分かりやすい数字だけを追いかけていると大事なことを見落とすとある。"}, {"no": 69, "sec": "読解", "qt": "dokkai-compare", "pid": "E5-P10", "q": "入山料について、AとBはどのように述べているか。", "o": ["AもBも、すぐに入山料を集めるべきだと述べている。", "AもBも、入山料を集めることに反対だと述べている。", "Aは賛成しており、Bはお金を集めること自体には反対していないが、慎重に考えるべきだと述べている。", "Aは費用の問題だけを、Bは登山者のマナーの問題だけを取り上げている。"], "a": 3, "x": "Aは賛成だと明言している。Bは使い道に反対する理由はないとしながらも、まず山の使い方を伝えるべきで料金の話はその後でよいと述べている。"}, {"no": 70, "sec": "読解", "qt": "dokkai-compare", "pid": "E5-P10", "q": "登る人の意識について、AとBの考え方はどのように違うか。", "o": ["Aは料金を払うことで意識が高まると考え、Bは逆に意識が下がる人も出ると考えている。", "Aは意識は変わらないと考え、Bは料金によって意識が高まると考えている。", "AもBも、料金では登る人の意識は変わらないと考えている。", "Aは登山道の整備を、Bは救助の費用を重く見ている。"], "a": 1, "x": "Aはお金を払って入る場所だと意識すればごみを捨てにくくなると述べ、Bはお金を払ったのだから何をしてもよいと考える人が出る心配を挙げている。"}, {"no": 71, "sec": "読解", "qt": "dokkai-long", "pid": "E5-P11", "q": "旅先の小さな駅で四時間過ごしたときのことについて、正しいものはどれか。", "o": ["最初から山の景色を楽しむつもりでベンチに座っていた。", "時刻表を調べて、別の行き方を見つけることができた。", "予定していた有名な建物を見に行くことができた。", "最初はいらいらしていたが、やがて遠くの山を眺めて過ごした。"], "a": 4, "x": "第二段落に、最初はいらいらしていたが、どうにもならないと分かってからはベンチに座って山を眺めていたとある。"}, {"no": 72, "sec": "読解", "qt": "dokkai-long", "pid": "E5-P11", "q": "自然の中で過ごすことについて、筆者はどのように述べているか。", "o": ["自然の中にいれば、誰でも自動的に心が休まる。", "自然の中では、写真を撮って記録することが最も大切だ。", "自然の中にいても、予定や時刻を気にしていては休まらない。", "都会にいるときのほうが情報が少なく、落ち着いて過ごせる。"], "a": 3, "x": "第五段落に、写真や次の目的地の時刻ばかり気にしているなら頭の中は都会と変わらないとある。"}, {"no": 73, "sec": "読解", "qt": "dokkai-long", "pid": "E5-P11", "q": "この文章で筆者が最も言いたいことは何か。", "o": ["旅行の計画は、分単位で細かく立てたほうがよい。", "旅の値打ちは、多くを見ることではなく、どう過ごしたかで決まる。", "電車が止まるような思いがけない旅こそ、記憶に残るものだ。", "都会を離れて、自然の中で暮らすようにするべきだ。"], "a": 2, "x": "最終段落に、何を見たかではなくどう過ごしたかで旅の値打ちは決まると述べられている。"}, {"no": 74, "sec": "読解", "qt": "dokkai-info", "pid": "E5-P12", "q": "留学生のキムさんは、10月18日（土）の午後だけ時間がある。事前の申し込みはしていない。キムさんが参加できるのはどれか。", "o": ["A 森の自然観察会", "B 健康ウォーキング教室", "C 海辺の生き物さがし", "D 星空観察と健康ヨガ"], "a": 3, "x": "Aは10月11日の午前で申し込みも必要、Bは日曜の午前で申し込みが必要、Dは10月25日の夜である。10月18日の午後に行われ、申し込みが要らないCだけが条件に合う。"}, {"no": 75, "sec": "読解", "qt": "dokkai-info", "pid": "E5-P12", "q": "このお知らせの内容と合っているものはどれか。", "o": ["健康ウォーキング教室は、雨が降っても行われる。", "四つの講座は、すべて事前の申し込みが必要である。", "費用は、申し込みのときに払わなければならない。", "星空観察と健康ヨガには、小学生も参加できる。"], "a": 1, "x": "注意欄に、雨天の場合Bは体育館の中で行うとある。Cは申し込みが不要、費用は当日会場で支払う、Dの対象は中学生以上である。"}]}, "passages": {"E1-P1": {"title": "以下は、ある留学生が学校の文集に書いた文章である。", "text": "日本に来る前、私は日本語の勉強にはとにかく暗記が大切だと聞いていた。単語も漢字も、ノートに何度も書いて覚えるのがいちばんだというのである。実際、来日したばかりのころの私は、毎晩机に向かって同じ言葉を書き続けていた。\n（50）、半年たっても、会話はほとんど上達しなかった。書けば書くほど覚えられるはずなのに、話そうとすると言葉が出てこない。（51）、会話のテストの点は少しずつ下がっていった。\n（52）、私は勉強のしかたを変えてみることにした。クラスの友だちと話す時間を毎日三十分だけ作り、その日に覚えた言葉をその場で使ってみるのである。もちろん、話すだけで漢字が書けるようになる（53）。しかし、一度使ってみた言葉は、不思議なほど長く記憶に残った。\n言葉というものは、机の上ではなく、人と人の間で育つ（54）。今の私は、そう思っている。"}, "E1-P2": {"title": "問題10（1）", "text": "学生のみなさんへ\n今年度から、図書館の本を借りる方法が変わります。これまではカウンターで学生証を見せて手続きをしていましたが、四月からは入り口の機械でご自分で手続きをしてください。返すときは、閉館後でも入り口の横にある返却ポストが使えます。なお、辞書と雑誌は今までどおり、館内でしか読むことができません。一人が借りられる本の数は五冊までで、これは変わりません。"}, "E1-P3": {"title": "問題10（2）", "text": "授業のノートを、何色ものペンできれいに整理する学生がいる。見せてもらうと確かに美しいが、その学生の試験の点がいいとは限らない。私が見てきたかぎり、成績が伸びるのは、むしろ字が多少汚くても、先生の話の中で「ここが大事だ」と感じた瞬間に手が動いている学生のほうである。ノートは人に見せる作品ではなく、自分の頭が動いた記録だ。あとで読み返して自分に意味が分かるなら、それで十分なのだ。"}, "E1-P4": {"title": "問題10（3）", "text": "山田さん\n来週の発表会について連絡します。発表の順番は、先週お伝えしたとおり三番目です。ただし教室が変わり、三階の第二会議室になりましたので、間違えないでください。当日使う資料は、前日の夜までに私にメールで送ってください。印刷はこちらでまとめて行います。パソコンは会議室のものを使いますので、持ってこなくてかまいません。\n中川"}, "E1-P5": {"title": "問題10（4）", "text": "「分からないことがあったら、すぐ質問しなさい」とよく言われる。しかし私は、質問をする前に五分だけ自分で考えてみることをすすめたい。五分考えると、自分がどこまで分かっていて、どこから分からないのかがはっきりする。そのうえで聞けば、相手の答えは自分の中にすっと入ってくる。何も考えずに聞いた答えは、その場では分かった気がしても、次の日には消えてしまうことが多い。"}, "E1-P6": {"title": "問題10（5）", "text": "テニス部 新入部員のみなさんへ\n練習は月・水・金の放課後、四時から六時までです。雨の日は、外には出ずに体育館で体力づくりを行います。ラケットは部のものを貸しますので、初めのうちは自分で買わなくてかまいません。ただし、シューズは各自で用意してください。また、最初の一か月は、練習のあとに必ず出席カードを顧問に出すこと。慣れてきたら、これは必要ありません。"}, "E1-P7": {"title": "問題11（1）", "text": "私の勤める大学では、数年前から授業の半分ほどがオンラインで行われるようになった。学生には好評である。通学に一時間半かかる学生も、家にいれば授業が始まる五分前まで眠っていられる。録画を何度も見返せるので、聞き取れなかったところを確認することもできる。成績を見るかぎり、平均点はむしろ少し上がった。\nそれでも私は、教室での授業をやめるつもりはない。理由は二つある。\n一つは、教室では学生が「分かっていない顔」をするからである。画面の向こうでは、みな同じように静かにうなずいている。ところが教室では、説明が難しすぎたとき、前の席の学生が急にペンを止め、後ろの学生が隣の人の手元をのぞく。その空気を感じて、私は説明をやり直す。オンラインでは、この合図が届かない。\nもう一つは、授業のあとの十分間である。教室では、聞きにくい質問を抱えた学生が、荷物をゆっくり片づけながら、私が一人になるのを待っている。その十分間に出てくる質問は、たいてい授業そのものより大切なことだ。オンラインの授業は、終了のボタンを押した瞬間に、その十分間ごと消えてしまう。\n便利さを否定するつもりはない。ただ、便利になったときに何が静かに失われたのかは、失った側が気づかないことが多い。私が教室にこだわるのは、そのためである。"}, "E1-P8": {"title": "問題11（2）", "text": "高校生のうちに将来の職業を決めておきなさい、とよく言われる。早く目標が決まれば、それに向かって努力できるというわけだ。確かに、そのとおりに進んで幸せになる人もいる。\nしかし、私が大学で毎年数百人の学生と話していて感じるのは、十七、八歳で決めた進路をそのまま歩き続けている学生は、実はそれほど多くないということである。むしろ、入学してから一度立ち止まり、専攻を変えたり、休学して働いてみたりした学生のほうが、卒業するころには生き生きとしている。\nこれは、決めるのが早すぎたからではない。決めたものを変えてはいけない、と思い込んでいたからである。目標というのは、地図の上に打った点ではなく、歩きながら少しずつ書き直していく線のようなものだ。書き直すことは失敗ではない。\n問題は、日本の学校が「変える」ための時間をあまり用意していないことだろう。時間割は細かく決まり、進路の相談は三年生の秋に集中する。そこで学生は、迷う前に決めてしまう。そして決めてから迷い、誰にも言えなくなる。\n私はゼミの学生に、毎年同じことを聞くことにしている。「今の進路を、明日変えてもいいとしたら、どうする」。その質問に笑って「変えません」と答える学生は、たいてい大丈夫だ。困った顔をして黙る学生とは、そこから長い話が始まる。"}, "E1-P9": {"title": "問題11（3）", "text": "駅前の市立図書館が新しくなった。三年ぶりに入ってみて驚いたのは、本の量ではなく、机の多さである。窓ぎわには一人用の席が並び、どの席にも電源がついている。二階には、声を出して話し合える部屋まである。以前の図書館は、静かに本を読む場所だった。今の図書館は、静かに何かをする場所になったらしい。\n高校生たちは、参考書を広げて勉強している。その多くは、図書館の本を一冊も開かない。それを見て、あれは図書館の使い方として正しくない、と言う人がいる。私はそうは思わない。\n図書館が長い間守ってきたのは、本そのものというより、お金を払わなくても誰でもそこにいていい場所、ということではなかったか。家に自分の机がない子ども、家では集中できない子どもにとって、そういう場所があるかどうかは小さな問題ではない。本を借りるかどうかは、そのあとの話である。\n現に、勉強のために通っていた高校生が、休けいのついでに書架の間を歩き、一冊手に取って帰っていく場面を、私は何度も見てきた。人は、そこにいる時間が長いほど、周りのものに手を伸ばす。図書館はそれを待てばいいのだ。\n新しい図書館の入り口には、「本と、それを読む人のための場所」と書かれている。私なら、「本と、いつか読むかもしれない人のための場所」と書きたい。"}, "E1-P10": {"title": "問題12 AとB", "text": "A\n宿題について、量が多すぎるという声をよく聞く。しかし私は、家庭学習の時間を確保する仕組みとして、宿題は今でも必要だと考えている。学ぶ習慣は、強い意志によってではなく、決まった時間に机に向かった回数によって作られるからだ。自分から進んで勉強する生徒だけを前提に制度を作れば、家で勉強を見てもらえない生徒との差は開く一方だろう。大切なのは、量を減らすことではない。答えを写せば終わってしまうような課題をやめ、その日の授業を思い出さなければ書けない課題に変えることである。\nB\n毎晩の宿題に追われ、部活動を終えて帰ってから一時間以上も机に向かう生徒を見ていると、これが本当に学力のためになっているのか疑問に思う。同じ課題を全員に出せば、すでに分かっている生徒には退屈な作業になり、分からない生徒には答えを写すだけの時間になる。学校が本当に家庭学習を支えたいのなら、全員に同じ量を出すのをやめ、放課後に残って質問できる時間と場所を用意するほうがよい。生徒に必要なのは、書く量ではなく、つまずいた場所で誰かに聞ける機会である。"}, "E1-P11": {"title": "問題13 文章", "text": "「この勉強が何の役に立つのですか」と学生に聞かれることがある。数学の証明や古典の文法を前にして、多くの人が一度は思う疑問だろう。私はこの質問を悪いものだとは思わない。むしろ、そう聞いてくれた学生とは、そこから本当の話ができる。\nただし私は、たいてい期待された答えを返さない。「将来こういう仕事で使うから」と説明することもできるが、それでは、その仕事に就かない人にとって、その勉強は無駄だったということになってしまう。実際、学校で学んだ内容のほとんどは、そのままの形で使われることはない。二次方程式を解く場面は、多くの人の人生に一度も訪れないだろう。\nそれでも私が勉強を無駄だと思わないのは、学ぶという経験が残すものが、内容そのものではないからである。分からない問題を前にして、すぐに投げ出さずに三十分粘る。うまくいかないやり方を捨てて、別の方法を試す。自分の答えが間違っていたと認めて、もう一度最初から考え直す。こうした頭と体の使い方は、教科の内容とは違って、大人になっても消えない。何を学んだかは忘れても、どう学んだかは残るのである。\nもう一つ言えるのは、役に立つかどうかは、学んでいる時点では分からないということだ。私は学生のころ、就職には関係がないと思いながら統計の授業を受けていた。その知識が必要になったのは、それから十五年後、まったく予想していなかった仕事の場面である。単位のためだけに座っていたあの時間が、後になって私を助けた。人生には、必要になってから学び始めたのでは間に合わないことが多い。学校がすぐには役に立たないものを教えるのは、いつ必要になるか分からないものを、あらかじめ配っておくためだと言ってもいい。\nだから私は、はじめの質問にこう答えることにしている。「今は分からない。ただ、君が二十年後にこの授業を思い出す日が来たら、そのとき私に教えてほしい」。学生はたいてい笑って帰っていく。それでいいと思っている。役に立つ理由を今すぐ示せなければ学ぶ価値がない、という考え方のほうが、私にはずっと危なく見える。すぐに役に立つ知識は、たいていすぐに古くなるからだ。\n学校で過ごす時間は、答えを集める時間ではなく、答えの出ない時間に耐える練習の時間である。そう考えれば、今日の授業が少し退屈だったとしても、それは決して無駄ではない。"}, "E1-P12": {"title": "さくら市学習センター 秋の学習講座のご案内", "text": "A　日本語作文講座\n　日時：10月3日から11月21日までの毎週土曜日　10:00〜11:30\n　対象：市内の高校生・大学生（日本語能力試験N3以上）\n　費用：2,000円（教材費込み）\n　定員：20名\n　申込方法：9月25日までにセンター窓口またはホームページ\n\nB　大学進学ガイダンス\n　日時：10月11日（土）　13:00〜16:00\n　対象：高校生とその保護者\n　費用：無料\n　定員：50名\n　申込方法：申込不要（当日、直接会場へ）\n\nC　数学基礎講座\n　日時：10月7日から12月9日までの毎週火曜日　18:00〜19:30\n　対象：高校生（学年は問いません）\n　費用：4,000円（全10回分）\n　定員：15名\n　申込方法：9月30日までにホームページのみ\n\nD　面接練習会\n　日時：11月8日（土）・11月15日（土）　14:00〜16:00（2日とも参加できる方）\n　対象：今年度に受験する高校3年生\n　費用：500円\n　定員：12名\n　申込方法：10月20日までに電話またはセンター窓口\n\n※定員をこえた場合は抽選とし、結果をメールでお知らせします。\n※費用は初回に会場でお支払いください。"}, "E2-P1": {"title": "以下は、ある会社員が社内報に書いた文章である。", "text": "入社したばかりのころ、私は電話に出るのが苦手だった。相手の会社名や名前が聞き取れず、何度も聞き返してしまう。（50）、用件を正しくメモできず、先輩に迷惑をかけたこともあった。\n（51）、私は電話に出る前に、よく使う言い方を紙に書いて机に貼ることにした。「恐れ入りますが」「少々お待ちください」。目の前に言葉があるだけで、不思議と落ち着いて話せるようになった。\n（52）、それで問題がすべて解決した（53）。急いでいる相手や早口の相手には、今でも緊張する。ただ、以前と違うのは、聞き取れなかったときに「もう一度お願いできますか」と言えるようになったことだ。分からないまま進めるより、その場で確かめたほうが早いと気づいたからである。\n仕事というのは、失敗しながら少しずつ身につけていく（54）。受話器の前で固まっている後輩を見ると、そう思う。"}, "E2-P2": {"title": "問題10（1）", "text": "社内メール\n件名 定例会議の進め方の変更について\n各位\n来月から、各部署の定例会議の時間を六十分から四十五分に短縮します。それに伴い、資料は前日の十七時までに共有フォルダに入れ、出席者は必ず目を通してから会議に出てください。会議の場では資料の読み上げは行わず、質問と意見の交換を中心に進めます。なお、自分が出席すべきかどうか迷う場合は、各部署の責任者に確認してください。\n総務部"}, "E2-P3": {"title": "問題10（2）", "text": "名刺は、ただの紙ではない。初めて会う相手に、自分がどこの誰であるかを伝えるための道具である。しかし、名刺を渡しただけで相手に覚えてもらえるわけではない。大切なのは、渡すときにどんな言葉を添えるかだ。私は必ず、自分がふだんどんな仕事をしているかを一言で説明するようにしている。そうすると、後日連絡をいただけることが多い。名刺は会話の入り口であって、ゴールではないのだと思う。"}, "E2-P4": {"title": "問題10（3）", "text": "在宅勤務が広がり、通勤の負担は確かに軽くなった。だが、私の職場では、若い社員から「相談しにくい」という声が上がっている。同じ部屋にいれば、困った顔をしているだけで先輩が気づいてくれる。画面越しでは、こちらから声を上げなければ誰も気づかない。制度を整えるだけでは足りないのだ。相談してよい時間をあらかじめ決めておくなど、声を出しやすくする工夫が必要だろう。"}, "E2-P5": {"title": "問題10（4）", "text": "お知らせ\n社員食堂のご利用について\n七月一日から、社員食堂の混雑を減らすため、利用開始時間を部署ごとに分けます。営業部と総務部は十一時三十分から、開発部と製造部は十二時十五分からです。決められた時間を過ぎてからでも入れますが、料理が売り切れている場合があります。弁当を持参する方は、これまでどおり四階の休憩室をご利用いただけます。"}, "E2-P6": {"title": "問題10（5）", "text": "新人のころ、失敗をすぐに報告できずに一日悩んだことがある。翌朝になって上司に伝えると、「なぜ昨日のうちに言わなかった」と強い口調で言われた。しかられたのは、失敗そのものではなく、報告が遅れたことだった。失敗は取り返せるが、過ぎた時間は取り返せない。あのとき学んだことを、私は今も部下に伝えている。悪い知らせほど早く、というのが私の職場の合言葉である。"}, "E2-P7": {"title": "問題11（1）", "text": "どの会社にもマニュアルがある。仕事の手順を書いた文書で、新しく入った人はまずこれを読む。私の勤める会社でも、電話の受け方から書類の書き方まで細かく決められている。おかげで、入社したばかりの社員でも、大きな失敗をせずに一日を終えることができる。\nしかし、去年から新人教育を任されるようになって、私は少し困っている。マニュアルどおりにできる社員は確かに増えた。ところが、そこに書かれていない場面になると、急に手が止まってしまうのだ。お客様から予想外の質問をされたとき、「マニュアルにありません」と答えた新人がいたと聞いて、私は考え込んでしまった。\nもちろん、悪いのは本人ではない。私たちがマニュアルを、ただ守るものとしてだけ渡してきたからだろう。あの文書は、先輩たちが失敗を重ねて作り上げた記録である。なぜその手順になったのか、どんな失敗があったのかを一緒に伝えなければ、単なる命令として受け取られてしまう。\nそこで今年から、研修のやり方を変えた。手順を教える前に、その手順が生まれたきっかけを話すことにしたのである。当然、時間はかかる。だが、理由を知っている人は、書かれていない場面でも自分で考えることができる。マニュアルは、考えなくてもいいようにするためではなく、考えるための土台にするためにあるのだと思う。"}, "E2-P8": {"title": "問題11（2）", "text": "会議で誰も発言しない時間が続くと、進行役はあせる。私も以前は、沈黙が三十秒も続くと耐えられず、「では、私の考えを申し上げますね」と自分から話し始めていた。会議は予定どおりに終わり、結論も出る。それで、うまく進行できたつもりでいた。\nところが、ある日、会議のあとで若い社員に言われた。「実は言いたいことがあったのですが、まとめているうちに話が先に進んでしまって」。そのとき初めて、私は自分が何をしていたのかに気づいた。沈黙は、何も起きていない時間ではなかった。参加者が頭の中で言葉を探している時間だったのである。\n考えてみれば、いい意見ほどすぐには出てこない。思いついたことをそのまま口にするのは簡単だが、自分の考えを人に分かるように整えるには時間がかかる。私は毎回、その時間をつぶしていたことになる。\n今は、質問をしたあと、心の中で十まで数えることにしている。数えている間は長く感じるが、たいてい七つか八つのあたりで誰かが口を開く。しかも、以前より内容のある意見が出るようになった。\n会議の質は、進行役がどれだけ話すかではなく、どれだけ待てるかで決まる。そう考えるようになってから、私は沈黙が怖くなくなった。"}, "E2-P9": {"title": "問題11（3）", "text": "三月は異動の季節である。私も先月、五年間担当した仕事を後任に引き継いだ。引き継ぎ書は四十ページになった。取引先の名前、担当者の性格、過去にあったトラブルとその対応。書き出してみて、自分がこれほど多くのことを覚えていたのかと驚いた。\n意外だったのは、書けなかったことのほうが多かったという事実である。たとえば、ある取引先には金曜日の午後に電話をしてはいけない。理由をうまく説明することはできないが、その時間は機嫌が悪いのだ。こういうことは、文章にすると失礼になるし、書いたところで相手には伝わらない。\n後任は熱心な人で、引き継ぎ書を何度も読んでくれた。それでも、最初の一か月はうまくいかなかったようだ。当然だと思う。私自身、五年かけて少しずつ覚えたことばかりなのだから。\nそのとき私が心がけたのは、答えを教えないことだった。困っていると聞けば会いに行くが、「私ならこうする」とは言わない。代わりに、以前どんなことがあったかを話すだけにする。判断するのは後任である。\n引き継ぎとは、知識を渡すことではなく、後任が自分で判断できるようになるまで見守ることなのだろう。私の五年は、そのまま渡せるものではない。渡せるのは、その入り口だけである。"}, "E2-P10": {"title": "問題12 AとB", "text": "A\n多くの会社で、服装を社員に任せる動きが広がっている。私の会社も去年からそうなった。最初は何を着ればいいのか戸惑ったが、今では良かったと思っている。何より、暑い日に楽な服で働けるだけで、午後の集中力が違う。服装が自由になると仕事の緊張感がなくなると言う人もいるが、そんなことはないだろう。緊張感は服装ではなく、仕事の内容から生まれるものだからだ。それに、毎朝何を着るかを考えることは、自分で判断する練習にもなる。会社が細かく決めなくても、社員は相手や場面に合わせて選べるはずである。\nB\n服装を自由にする会社が増えているが、私は、自由にするなら同時に説明が必要だと考えている。自由と言われても、何がよくて何がいけないのかが分からなければ、社員はかえって不安になる。実際、若い社員から「先輩と同じくらいの服装にしておけば安心だから」という声を聞いた。これでは自由にした意味がない。大切なのは、お客様の前に出る日はどうするか、社内だけで過ごす日はどうするかといった考え方を、会社が示すことだ。決まりをなくすことと、判断を社員任せにすることは違う。"}, "E2-P11": {"title": "問題13 文章", "text": "効率を上げよ、と言われて久しい。私の職場でも、数年前から会議の時間が短くなり、報告はすべて決まった書式で行うようになった。無駄をなくすという方針そのものに反対する人はいない。実際、以前より仕事は早く回るようになった。\nところが最近、気になることがあった。ある部署で、ほとんど同じ資料を二人の担当者が別々に作っていたことが分かったのである。二人は隣の席に座っている。以前なら、「今、何やってるの」というひと言で気づいたはずのことだ。\n考えてみれば、無駄として真っ先に削られたのは、この種のやりとりだった。昼休みの雑談、会議が始まる前の五分、廊下での立ち話。どれも成果には直接結びつかない。しかし、そこで交わされていたのは、決まった書式には収まらない情報である。今どんな仕事で困っているか、誰が何に詳しいか、あの取引先は今どんな様子か。こうしたことは報告書には書かれない。わざわざ書くほどのことではないと、本人が判断してしまうからだ。\n効率化とは、目的のはっきりした行動だけを残すことである。目的がはっきりしているものは測れるし、測れるものは管理できる。一方、雑談には目的がない。何の話になるか、話し始めた本人にも分からない。だから測ることができないし、削っても、何が失われたのかがすぐには見えない。損害が見えるのは、先ほどの例のように、ずっとあとになってからである。\n私は、昔に戻ればいいと言いたいのではない。長すぎる会議や、意味のない立ち話が本当に多かったことも覚えている。問題なのは、無駄をなくすという言葉が、いつのまにか、目的を説明できないことはするな、という意味になってしまったことだ。\n必要なのは、雑談を許すことではなく、雑談が生まれる場所を仕事の一部として設計することだろう。たとえば、週に一度、結論を出さない打ち合わせの時間を作る。何を話してもいいが、全員が今の仕事について一言ずつ話す。これは雑談のようでいて、実は情報の共有である。目的を持たせず、場所だけを用意するのである。\n効率とは、無駄をゼロにすることではない。何を無駄と呼ぶかを、その都度考え直すことだ。削ってはいけないものを削ってしまえば、あとで何倍もの時間を使うことになる。私たちの職場が学んだのは、そういうことだった。"}, "E2-P12": {"title": "さくら市 働く人のためのスキルアップ講座のご案内", "text": "さくら市では、働きながら学びたい方のための講座を開きます。\n申し込みは10月10日(金)までにお願いします。\nA　ビジネス日本語　メールの書き方\n　日時：毎週火曜日　19:00〜20:30(全6回)\n　対象：市内の企業に勤めている方\n　費用：3,000円\n　定員：20名\n　申込：電子メールのみ\n\nB　表計算ソフト入門\n　日時：毎週土曜日　10:00〜12:00(全4回)\n　対象：どなたでも(市内在住・在勤の方を優先)\n　費用：4,000円(教材費を含む)\n　定員：15名\n　申込：窓口またはホームページ\n\nC　プレゼンテーション実践\n　日時：毎週木曜日　19:00〜20:30(全5回)\n　対象：人前で話す機会がある方\n　費用：5,000円\n　定員：10名\n　申込：ホームページのみ\n\nD　接客の言葉づかい\n　日時：毎週土曜日　14:00〜16:00(全3回)\n　対象：接客の仕事をしている方、これから始める方\n　費用：2,000円\n　定員：25名\n　申込：窓口またはホームページ\n\n定員を超えた場合は抽選とし、結果は10月15日(水)までにお知らせします。\n問い合わせ さくら市生涯学習課 電話 012-345-6789(土日は休み)"}, "E3-P1": {"title": "以下は、ある新聞に掲載されたエッセイである。", "text": "食料品は週に一度、まとめて買うようにしている。買い物の回数が減れば、その分だけ時間も交通費も節約できるし、余計な物を手に取る機会も減るはずだ。（50）、実際にやってみると、うまくいかないことばかりだった。冷蔵庫の奥で野菜をだめにしてしまったり、足りない物が出て結局もう一度店に行ったりする。（51）、一度に大量に買うので、その日の支払いは決して安く感じられない。\n（52）、私は買い物に行く前に、冷蔵庫の中を写真に撮ることにした。売り場でその写真を見れば、家に何が残っているかがすぐに分かる。たったこれだけのことで、同じ物を二つ買ってしまう失敗はほとんどなくなった。\nもっとも、写真を撮ったからといって、むだがまったくなくなる（53）。急に外で食事をすることになれば、買った物は余る。それでも、以前より食品を捨てる回数が減ったのは確かだ。\n小さな工夫でも、続けていれば暮らしは少しずつ変わる（54）。"}, "E3-P2": {"title": "問題10（1）", "text": "冷蔵庫を開けるたびに、奥から使い忘れた食材が出てくる。それが嫌で、私は買ってきた物を全部、手前の見えるところに並べることにした。奥まで使えばたくさん入るが、見えない物は必ず忘れる。少ししか入らなくても、目に入る場所にあれば使い切れる。冷蔵庫は物をためておく箱ではなく、近いうちに食べる物を置く場所なのだと考えを変えてから、捨てる食品はずいぶん減った。"}, "E3-P3": {"title": "問題10（2）", "text": "以下は、通信販売の会社から届いたメールである。\nこのたびはご注文いただき、ありがとうございました。ご注文の商品のうち、食器のセットは本日発送いたしました。しかし、テーブルにつきましては工場の都合により、お届けが二週間ほど遅れる見込みでございます。お待ちいただける場合は、こちらからのご連絡は不要です。お取り消しをご希望の場合のみ、今週の金曜日までにお電話でお知らせください。ご迷惑をおかけし、申し訳ございません。"}, "E3-P4": {"title": "問題10（3）", "text": "わが家では、家事の当番表を作るのをやめた。表があると、自分の担当かどうかばかりを気にするようになり、気づいた人がさっとやるということがなくなったからだ。今は手の空いている人がやる。だれがどれだけやったかは数えない。もちろん不公平な日もあるが、一週間で見ればだいたい同じくらいになる。数えないほうが、かえって気持ちよく体が動くものだと分かった。"}, "E3-P5": {"title": "問題10（4）", "text": "安い物を買って何度も買い直すより、高くても長く使える物を買ったほうが得だとよく言われる。確かにそのとおりだが、私はこの考えをすべての物には当てはめない。長く使えるかどうかは、その物の質だけでなく、自分の暮らしがこれから変わらないかどうかにもよるからだ。子どもが小さいうちにだけ使う物は、質より値段で選ぶ。数年で使わなくなると分かっているからである。"}, "E3-P6": {"title": "問題10（5）", "text": "引っ越した日に、となりの部屋の人へあいさつに行った。相手は少し驚いた顔をしていたが、それ以来、廊下で会えば必ず声をかけてくれる。あいさつをしたからといって、急に親しくなるわけではない。ただ、名前と顔を知っているというだけで、上の階から物音がしても、あの人なら仕方がないと思える。近所づきあいとは、そういう小さな安心の積み重ねなのだろう。"}, "E3-P7": {"title": "問題11（1）", "text": "押し入れの奥から、十年前に買ったホットプレートが出てきた。買ったときは家族で焼き肉をするつもりだったが、実際に使ったのは二、三回である。それでも捨てられずにいたのは、まだ使えるからというより、買ったときの気持ちまで捨ててしまうようで惜しかったからだ。\n物が捨てられない人は、物そのものではなく、その物にくっついている時間を手放せずにいるのだと思う。旅行先で買った置き物、子どもが小さいころに着ていた服。使わないと分かっていても、捨てるという行為が、その時間をなかったことにするように感じられる。だから、いつか使うかもしれないという言い訳が必要になる。\n私は去年から、迷った物をいったん箱に入れて半年置くことにした。半年の間に一度も箱を開けなければ、それは今の暮らしに必要のない物だと考えて手放す。この方法のいいところは、捨てるかどうかをその場で決めなくてよいことだ。決断を先に延ばしているだけだと言われそうだが、半年たってから開けてみると、不思議なほど気持ちが変わっている。\n物を減らすこと自体が目的ではない。家の中にある物が、今の自分の暮らしと合っているかどうかを確かめたいのだ。使わない物が減った分だけ、よく使う物が取り出しやすくなり、毎日の動きが軽くなる。私にはそれで十分である。"}, "E3-P8": {"title": "問題11（2）", "text": "近所の小さな金物屋で、なべのふたを買った。うちのなべは十年以上前の物で、同じ大きさのふたがなかなか見つからない。店の主人はなべの直径を聞くと、奥から何枚か出してきて、これなら合うだろうと言った。値段はインターネットで探した物より少し高かったが、その場で手に取って確かめられたのはありがたかった。\nインターネットで買えば、たいていの物は安く、しかも早く届く。私も日用品の多くはそうしている。ただ、画面の上では、大きさも重さも、手ざわりも分からない。写真では立派に見えた物が、届いてみると思ったより小さいということが何度もあった。返品はできるが、箱に詰めて送り返す手間を考えると、結局そのまま使うことになる。\n金物屋の主人は、この店では売れない物のほうが多いと笑っていた。客はまず相談に来て、答えだけを持って帰り、買うのはインターネットなのだという。それでも相談に応じ続けるのは、そうやって店を開けておかなければ、直径を測ってふたを選ぶような知識が、どこにも残らなくなるからだそうだ。\n安く買うことは大切だ。しかし、値段だけを見て買う場所を選び続ければ、選び方を教えてくれる場所は静かに消えていく。私はこれからも、少し高くてもあの店でなべのふたを買うだろう。それは店のためというより、いつか困るのが自分だからである。"}, "E3-P9": {"title": "問題11（3）", "text": "夕食の支度にかかる時間を、一週間記録してみたことがある。平均すると四十分ほどだった。長いと感じるかどうかは人によるだろうが、私が驚いたのは、そのうち十分近くが、何を作るかを決めるための時間だったことである。冷蔵庫を開けたり閉めたりしながら、材料をながめて考える。その間、手はまったく動いていない。\nそこで私は、日曜日の夜に一週間分の献立を紙に書き出すことにした。書くといっても、主なおかずを七つ並べるだけの簡単な物だ。決めてしまえば、平日の夕方に迷うことはない。実際、支度の時間は三十分ほどに縮んだ。\nところが、思わぬことも起きた。迷わなくなったことで、料理そのものが楽しくなくなったのである。その日の気分で作る物を変えることができない。疲れて帰った日に、決められた献立を見ると、まるで命令されているように感じられた。\n今は、七つのうち二つは自由に決めてよいことにしている。五つは決めておき、二つは空けておく。この二つがあるだけで、献立表は命令ではなく提案に変わった。予定を立てることと、その日の気持ちに従うことは、どちらか一方を選ばなければならないものではない。決めておく部分と決めずに残しておく部分の割合を、自分に合うように調整すればよい。これは家事に限った話ではないと、私は思っている。"}, "E3-P10": {"title": "問題12 AとB", "text": "A\n子どもにおこづかいを渡すなら、毎月決まった日に決まった額を渡すのがよい。金額は多くなくてよい。大切なのは、限られたお金をどう使うかを自分で決める経験である。ほしい物が二つあれば、どちらかをあきらめるか、来月まで待つかを考えなければならない。失敗して月の半ばでお金がなくなっても、親は足してやらない。困るのは本人だが、その困り方こそが学びになる。買う前に立ち止まって考える習慣は、大人になってから急に身につくものではない。子どものうちに、小さな金額で失敗しておいたほうがよい。\nB\nわが家では、おこづかいを毎月決まって渡してはいない。子どもが必要だと思うときに、何にいくら使うのかを自分の言葉で説明してもらい、納得できれば渡している。決まった額を渡すやり方では、使い道を考えるより先に、いくらもらえるかだけが関心の中心になってしまうと感じるからだ。また、手伝いをした分だけお金を渡す家庭もあるが、私は賛成できない。家の仕事は家族の一員としてするものであって、お金を受け取ってする仕事ではない。お金の使い方を学ぶことと、家族の役割を学ぶことは、分けて考えたほうがよい。"}, "E3-P11": {"title": "問題13 文章", "text": "洗濯機のボタンを押せば、あとは干すだけである。米は炊飯器が炊いてくれる。掃除は自動で動く機械に任せている家もある。この五十年ほどで、家の仕事にかかる時間は大きく減った。手間が減ったのだから、その分だけ暮らしは楽になったはずである。ところが、家事が楽になったという実感を持っている人は、思ったより少ない。\n理由の一つは、道具が便利になるたびに、求められる水準が上がってきたことにある。洗濯機がなかったころ、服は汚れが目立ってから洗う物だった。今は一日着ただけで洗う。掃除機が広まると、床は毎日きれいであることが当たり前になった。道具が仕事を減らした分、私たちは仕事の量を増やしてきたのである。楽になったはずの時間は、別の家事に吸い取られていった。\nもう一つの理由は、手間が減ると同時に、暮らしの中の待ち時間も減ってしまったことだ。かつて、米をとぎ、火加減を見て、蒸らす時間を待つという一連の作業には、待つ時間が組み込まれていた。待っている間、人は何もしていないように見えて、実は次のことを考えたり、家族と話したりしていた。今、その時間は消え、代わりに別の用事が入る。効率がよくなったはずなのに、いつも何かに追われている感じがするのは、このためかもしれない。\n私は、便利な道具を手放そうと言いたいのではない。洗濯板に戻れと言われても困る。ただ、減った手間の分だけ何かを詰め込むという習慣は、一度見直してもよいと思う。空いた時間に別の仕事を入れなければ、その時間はそのまま自分の物になる。\nそれどころか、あえて手間を残しておくのも一つの方法だ。わが家では、休みの日の朝だけ、コーヒーを豆から挽いて入れることにしている。三分もかからない作業だが、その三分は明らかに他の時間と違う。音がして、においがして、終わるまで次のことができない。手を動かしている間だけ、頭の中が静かになる。効率だけを考えれば、この三分は無駄である。しかし、無駄だと分かっていて残している時間があるかどうかで、一日の感じ方はずいぶん変わる。\n家事は減らせるだけ減らせばよいというものではない。何を機械に任せ、何を自分の手に残すか。それを自分で選ぶことこそが、便利な時代の暮らし方なのだろうと思う。"}, "E3-P12": {"title": "さくら市生活支援センター 秋の暮らしの講座のご案内", "text": "さくら市生活支援センターでは、毎日の暮らしに役立つ講座を開きます。ご希望の講座をお選びください。\nA　はじめての家庭料理\n　日時：十一月の毎週土曜日　午前十時から正午まで（全四回）\n　対象：市内にお住まいの十八歳以上の方\n　費用：三千円（全四回分の材料費）\n　定員：十二名\n　申込：窓口のみ\n\nB　親子でパン作り\n　日時：十一月八日（土）　午前十時から午後一時まで\n　対象：市内にお住まいの小学生とその保護者\n　費用：一組千五百円（材料費）\n　定員：十組\n　申込：ホームページのみ\n\nC　上手な買い物と家計の見直し\n　日時：十一月の毎週水曜日　午後七時から八時三十分まで（全三回）\n　対象：市内にお住まいの方または市内にお勤めの方\n　費用：無料\n　定員：三十名\n　申込：電話またはホームページ\n\nD　衣類のお直し教室\n　日時：十一月十四日（金）　午後一時から午後三時まで\n　対象：市内にお住まいの方\n　費用：五百円（材料費）\n　定員：十五名\n　申込：申込不要　当日直接会場へ\n\n注意事項\n市外にお住まいの方がお申し込みいただけるのは、Cのみです。AとCは、全回に参加できる方が対象です。\n申込の締め切りは、各講座の開催日の一週間前です。定員を超えた場合は抽選となります。（Dを除く）\n問い合わせ　さくら市生活支援センター　電話　000-987-6543"}, "E4-P1": {"title": "以下は、ある市の広報紙に載ったコラムである。", "text": "私が住む地域には、駅から離れた住宅地を回る小さなバスが走っている。一日に六便しかないが、車を持たない高齢者にとっては大切な足である。数年前、利用者の減少を理由に、このバスを廃止するという案が市から示された。（50）、住民の反対の声が相次ぎ、話し合いの場が設けられることになった。\n会合で分かったのは、乗らないのではなく、不便だから乗れないという声が多いことだった。時刻表が病院の受付時間に合っていない。停留所がスーパーから遠い。（51）、行き先の表示が小さくて見えにくいという意見まで出た。（52）、市と住民は路線と時刻を一から見直し、試験的に半年間、新しい形で走らせてみることにした。\nその結果、利用者は以前の二倍近くになった。もっとも、これで問題がすべて解決した（53）。運行にかかる費用は今も市の負担が大きく、この先どうしていくかは決まっていない。それでも、住民が自分たちの手で路線をつくり直した経験は、次の課題に向き合うときの力になる（54）。"}, "E4-P2": {"title": "問題10（1）", "text": "本市では、来月から市民ホールや体育館などの予約をインターネットでも受け付けます。これまでは窓口か電話のみでしたが、新しい仕組みでは、空いている日をいつでも画面で確かめられます。ただし、初めてインターネットで予約する方は、一度窓口で登録の手続きをしていただく必要があります。登録の際には身分証明書をお持ちください。なお、これまでどおり窓口と電話での予約も続けますので、ご都合のよい方法をお選びください。"}, "E4-P3": {"title": "問題10（2）", "text": "私の店がある商店街は、二十年前に比べて店の数が半分になった。さびしいと言われることもあるが、私はそうは思っていない。空いた場所に若い人が小さな店を開き、以前とは違う客が通りを歩くようになったからだ。昔からの店と新しい店が並ぶ今の姿は、たしかに整ってはいない。しかし、町というものは、時間をかけて形を変えていくものだ。大切なのは、変わらないことではなく、変わり続けられることだと思う。"}, "E4-P4": {"title": "問題10（3）", "text": "町内会の皆さまへ　来月の資源ごみの収集日について、市から連絡がありましたのでお知らせします。これまでは第二・第四水曜日でしたが、道路工事のため、九月に限り第一・第三水曜日に変更となります。十月からは元に戻ります。なお、収集の時間は変わりませんので、これまでどおり当日の朝八時までに出してください。変更をご存じない方もいらっしゃると思いますので、ご近所の方にもお伝えいただければ幸いです。"}, "E4-P5": {"title": "問題10（4）", "text": "図書館は本を借りる場所だと思われがちだが、最近はそれだけではない。地域の資料を集めて残したり、調べ物の相談に乗ったりする役割も大きい。特に、市の歴史を記した文書や昔の写真といった資料は、図書館が集めておかなければ、いつの間にか失われてしまうものが多い。本はほかの場所でも手に入るが、その土地にしかない記録を守れるのは、そこにある図書館だけである。図書館の価値は、本の数だけでは測れない。"}, "E4-P6": {"title": "問題10（5）", "text": "先日、市が行った住民アンケートの結果が発表された。住みやすいと答えた人は七割を超え、前回より増えている。一方で、困っていることを尋ねた質問では、バスの本数が少ないという回答が最も多かった。住みやすいと感じながらも、日々の移動には不便を感じている人が少なくないということだろう。全体の数字だけを見て安心せず、こうした声を一つ一つ読み取ることが、次の計画づくりには欠かせない。"}, "E4-P7": {"title": "問題11（1）", "text": "私の住む団地では、毎年秋に防災訓練が行われる。消火器の使い方を習い、決められた広場まで避難する。参加するのはいつも同じ顔ぶれで、多くは六十代から七十代の人たちだ。若い世帯も増えているのに、訓練の日に姿を見ることはほとんどなかった。\n去年、私は自治会の役員として、参加者が少ない理由を考えてみた。日曜の午前という時間が悪いのではないか、内容が毎年同じで飽きられているのではないか。役員の間ではそんな意見が出た。しかし、実際に若い世帯の何人かに話を聞いてみると、返ってきたのは別の答えだった。訓練があること自体を知らなかった、というのである。案内は掲示板に貼ってあったが、通勤で急ぐ人はそこを見ない。回覧板も、共働きの家庭では読まれないまま次の家に回されていた。\nそこで今年は、案内の出し方を変えた。掲示板と回覧板に加えて、希望する住民にはメールで知らせる仕組みをつくり、内容も、一時間で終わること、途中からの参加でもよいことを具体的に書いた。すると、参加者は前の年の一・五倍になった。特に、小さな子どもを連れた家族の姿が目立った。\n訓練のあと、ある若い母親が、参加してみたら同じ階段を使う人の顔を初めて覚えました、と話してくれた。私はその言葉が何よりうれしかった。訓練の目的は、消火器の使い方を覚えることだけではない。いざというときに声をかけ合える相手を知っておくこと。それこそが本当の備えなのだと思う。"}, "E4-P8": {"title": "問題11（2）", "text": "市役所の手続きをインターネットでできるようにする取り組みが、全国の自治体で進んでいる。住民票の写しの請求や各種の届け出を、パソコンやスマートフォンから行えるようにするもので、窓口に行かずに済むという利点は大きい。とりわけ、平日の昼間に休みを取りにくい人にとっては、これまで大きな負担だったものが軽くなる。\nしかし、こうした取り組みには注意すべき点もある。第一に、すべての住民が同じように使えるわけではないということだ。機器の操作に慣れていない人や、家に通信の環境がない人にとっては、選べる方法が一つ増えただけで、実際には何も変わらない。それどころか、便利になったのだからと窓口の職員が減らされれば、以前より不便になることさえある。\n第二に、手続きの中には、担当者と話しながら進めたほうがよいものがあるということだ。福祉の相談や、事情が入り組んだ申請では、書類の形を整えることよりも、その人が何に困っているのかを聞き取ることのほうが重要になる。画面の上では、書かれていないことは伝わらない。困っていると言えない人ほど、支援から遠ざかってしまう。\nつまり、大切なのは窓口をなくすことではなく、住民が選べるようにすることである。急ぐ人は画面で済ませ、相談したい人は人に会う。どちらも同じように用意されて初めて、この取り組みは住民のためのものになるだろう。"}, "E4-P9": {"title": "問題11（3）", "text": "実家のある町に帰るたびに、空き家が増えていることに気づく。窓の閉まったままの家、庭に草が伸びた家。持ち主が亡くなったあと、遠くに住む子どもたちがどうすることもできずにいる例が多いと聞く。\n数年前、私の同級生が、そうした空き家の一つを借りて小さな店を始めた。飲み物を出すだけの、席が十ほどの店である。もうかるのかと聞くと、彼は笑って首を横に振った。それでも続けているのは、店を開けている間、近所のお年寄りが次々と立ち寄るからだという。買い物のついでに寄って、三十分ほど話して帰る。名前を呼び合う相手が一人増えるだけで、その人の一日は変わるのだと彼は言った。\n行政も空き家の対策に取り組んでいる。取り壊しの費用を助けたり、借り手を探す仕組みをつくったりしている。数の上では、それは確かに必要な仕事だろう。ただ、家が一軒減ることと、人が集まる場所が一つ増えることとは、意味がまるで違う。\n私は、空き家の問題を家の問題としてだけ見ていた自分に気づいた。使われなくなっていくのは建物ではなく、そこに流れていた時間のほうなのだ。同級生の店にあるのは、新しい建物でも珍しい料理でもない。かつてはどの家の縁側にもあった、誰かと話すためのわずかな場所である。それが失われたから、わざわざ店という形にしなければならなくなった。そう考えると、少しさびしい気もするのだが。"}, "E4-P10": {"title": "問題12 AとB", "text": "A\n地域の行事は、住民が自分たちの手で運営してこそ意味がある。役所が計画を立て、費用も人も出してくれる行事は、確かに見た目の立派なものになる。しかし、担当者が替われば内容が変わり、予算が削られればあっけなく消えてしまう。自分たちで話し合い、少ない予算をやりくりして続けてきた行事は、たとえ小さくても、住民の記憶に長く残る。行政に求めたいのは、お金や人ではない。場所を貸すこと、手続きを簡単にすることといった、目立たない支えである。手を出しすぎない支援こそが、地域を育てるのだと思う。\nB\n住民が自分たちで地域の行事を運営することは、確かに望ましい。しかし現実には、担い手の高齢化が進み、役員を引き受ける人が見つからない地域が増えている。そうした中で、自分たちでやりなさいと言うだけでは、行事はただ静かに消えていくだけだ。行政が計画の立て方を教え、事務の一部を引き受け、必要であれば費用も負担する。そこまでして初めて、続けられる形が見えてくる場合もある。大切なのは、住民に任せるか行政がやるかという線引きではなく、その地域が今どれだけの力を持っているかを見て、足りない分を補うことである。"}, "E4-P11": {"title": "問題13 文章", "text": "市が新しい施設をつくるとき、住民の意見が一つにまとまることは、まずない。私は十年ほど、いくつかの自治体で住民説明会の進行を手伝ってきたが、賛成と反対に分かれる場面を数えきれないほど見てきた。図書館をつくるという話でさえ、場所や規模をめぐって激しい議論になる。\n説明会でよく起こるのは、次のようなことだ。担当者が資料を読み上げ、最後にご意見はありませんかと問いかける。手を挙げるのは、たいてい強く反対する人か、強く賛成する人である。声の大きい意見が何度かやり取りされ、時間が来て終わる。後日、記録には住民から意見を聞いたと書かれる。だが、その場にいた多くの人は、一言も発しないまま帰っている。彼らが賛成だったのか反対だったのかは、誰にも分からない。\nこうした会が繰り返されると、住民の間には、意見を言っても仕方がないという気持ちが広がる。次からは、そもそも会場に来なくなる。すると残るのは、はじめから立場のはっきりした人たちだけになり、話し合いはますます対立の形をとる。行政の側もそれを見て反対が多いと受け取り、計画そのものを止めてしまうことがある。誰も望んでいなかった結末である。\n私が関わった中で雰囲気が変わったのは、進め方を少しだけ変えた時だった。全体で意見を出し合う前に、五、六人の小さな組に分かれて三十分ほど話す時間をつくったのである。小さな輪の中では、ふだん発言しない人も口を開く。そして出てくるのは、賛成か反対かという単純な答えではなかった。夜遅くまで開いていると子どもが心配だ、駐車場がなければ年寄りは行けない、そうした具体的な事情である。\n賛成と反対は足し算にも引き算にもならないが、こうした具体的な心配は、一つずつ形を変えて計画に組み込むことができる。開館の時間を工夫する、送り迎えの仕組みを考える。そうして直された案は、はじめの案より地味になる。それでも、出来上がったあとによく使われるのは、たいていそちらのほうである。\n合意とは、全員が同じ意見になることではない。自分の言ったことが、決まったもののどこかに残っていると感じられること。それだけで、人は自分の望んだ形でない結論も受け入れられる。かつて反対していた人が、完成した施設をあたりまえのように使っている姿を見るたびに、私はそう思う。話し合いに時間をかけることは、遠回りに見えて、実のところ最も確実な近道なのである。"}, "E4-P12": {"title": "さくら市 くらしの講座のご案内", "text": "さくら市では、この秋、くらしに役立つ講座を四つ開きます。市内にお住まいの方、市内にお勤めの方がお申し込みいただけます。\nA　防災はじめの一歩\n　日時：10月4日（土）午前10時〜正午\n　場所：市民防災センター\n　対象：どなたでも（小学生は保護者と一緒にご参加ください）\n　費用：無料\n　定員：30名\n　申込：9月20日（土）までに電話でお申し込みください。\n\nB　はじめてのパソコン手続き講座\n　日時：10月11日（土）午後1時〜午後4時\n　場所：中央公民館 第一研修室\n　対象：65歳以上の市民の方\n　費用：500円（教材費）\n　定員：12名\n　申込：9月26日（金）までに市役所2階の窓口でお申し込みください。\n\nC　地域の歴史を歩く\n　日時：10月18日（土）午前9時〜午後0時30分\n　場所：さくら市郷土資料館に集合\n　対象：中学生以上の方\n　費用：800円（保険料・入館料を含みます）\n　定員：20名\n　申込：10月3日（金）までに市のホームページからお申し込みください。\n\nD　子育て相談ひろば（全3回）\n　日時：10月5日・12日・19日（いずれも日曜）午前10時〜11時30分\n　場所：子育て支援センター\n　対象：3歳までのお子さんがいる方で、3回すべてに参加できる方\n　費用：無料\n　定員：15組\n　申込：9月30日（火）までに電話でお申し込みください。\n\n注意　費用は当日、会場でお支払いください。申込が定員を超えた場合は抽選とし、結果は郵便でお知らせします。\n問い合わせ　さくら市 生涯学習課 電話 012-345-6789"}, "E5-P1": {"title": "以下は、ある雑誌に掲載されたコラムである。", "text": "去年の秋、私は久しぶりに近くの低い山に登った。若いころは何度も登った山なので、二時間もあれば頂上に着くだろうと考えていた。（50）、歩きはじめて三十分でひざが痛くなり、息が上がってしまった。（51）、思っていたより荷物が重く、水の入ったボトルが肩に食い込む。結局、頂上まで四時間近くもかかってしまった。\n山を下りてから、私は自分の体力の落ち方に驚いた。（52）、まず毎朝三十分だけ歩くことにした。半年たった今、体重が大きく減った（53）。しかし、階段を上っても息が切れなくなり、朝の目覚めもよくなった。\n数字に表れる変化だけが成果ではない。体は、地道に続けたことに必ず応えてくれる（54）。今年の秋は、あの山にもう一度登ってみようと思っている。"}, "E5-P2": {"title": "問題10（1）", "text": "庭の落ち葉をすべて掃き集めてしまうのは、実はもったいないことだという。落ち葉は土の表面をおおって水分が蒸発するのを防ぎ、やがて小さな生き物に分解されて木の栄養になる。ある園芸家は、せめて木の下の落ち葉だけは残しておくよう勧めている。見た目の美しさを求めて何もかも取り除くと、かえって土がやせ、木そのものが弱ってしまうからだ。自然の中では、散らかって見えるものにも役割がある。"}, "E5-P3": {"title": "問題10（2）", "text": "去年から、旅先で写真を撮ることをやめてみた。カメラを構えていると、目の前の景色よりも画面の中の構図のほうが気になってしまうからだ。写真がなければ記憶は薄れるだろうと心配していたが、実際は逆だった。風の音や土のにおいまで、後からはっきり思い出せるようになったのである。写真は残るが、そのぶん自分の中には残らない。そういうこともあるのかもしれない。"}, "E5-P4": {"title": "問題10（3）", "text": "運動が続かない人の多くは、意志が弱いのではなく、立てた目標が高すぎるのだという。あるトレーナーは、まず「靴をはいて外に出るだけ」を目標にするよう勧めている。走らなくてもよいし、五分で戻ってきてもかまわない。実際に外に出てしまえば、たいていの人はそのまま歩きはじめる。始めることさえできれば、続けることはそれほど難しくないというのである。"}, "E5-P5": {"title": "問題10（4）", "text": "朝食は必ずとるべきだ、とよく言われる。しかし、この言葉がすべての人に当てはまるわけではない。夜おそくに食事をした人が無理に朝食をとれば、かえって胃に負担がかかることもある。大切なのは、決まった時刻に食べることそのものよりも、一日全体で食べる量と食事の間隔を整えることだ。健康によい食習慣は、生活のしかたによって人それぞれ違ってよいのである。"}, "E5-P6": {"title": "問題10（5）", "text": "山の天気は変わりやすいと言われるが、正確には変わりやすいのではなく、変化が早く現れるのだと、あるガイドは説明する。平地なら数時間かけて進む雲が、山では斜面に沿って一気に上がってくるからだ。したがって、空が急に暗くなったと感じたときには、すでに雨が近いことになる。引き返す判断を遅らせないことが、山では何よりの備えになるという。"}, "E5-P7": {"title": "問題11（1）", "text": "子どものころ、家の近くを流れる川は、コンクリートの壁にはさまれたまっすぐな水路だった。水はいつも茶色くにごっていて、魚がすんでいるとは思えなかった。私にとって川とは、遊ぶ場所ではなく、ただ水が流れていく場所にすぎなかった。\nその川が、十年ほど前から少しずつ姿を変えている。市が進めているのは、コンクリートを外して石や土の岸に戻す工事である。まっすぐだった流れをわざと曲げ、浅い所と深い所をつくる。手間も費用もかかるうえ、完成しても以前より見た目が整っているわけではない。むしろ、草がぼうぼうと生えた雑然とした川になった。\nところが、変化はすぐに現れた。曲がった所にできた深みに魚が集まり、浅瀬には小さな生き物が戻ってきた。夏になると、子どもたちが水に入って遊ぶ姿も見られるようになった。担当者によれば、流れに速い所と遅い所ができたことで、生き物がすめる場所の種類が増えたのだという。\n私はこの工事を見て、人が自然に対してできることの限界と可能性を同時に感じた。人間には、失われた自然をそっくり作り直すことはできない。できるのは、自然が自分の力で戻ってくるための条件を整えることだけだ。それでも、条件さえ整えば、自然は思いのほか早く応えてくれる。整えられた景色よりも雑然とした川のほうが豊かに見える。そう感じられるようになったこと自体が、この十年の一番の変化なのかもしれない。"}, "E5-P8": {"title": "問題11（2）", "text": "連休に有名な観光地へ出かけ、駅から出ることすらできないほどの人の波に巻き込まれた経験のある人は多いだろう。写真で見た静かな町並みはどこにもなく、目に入るのは人の背中ばかりである。せっかく来たのだからと歩き回り、疲れて帰る。旅の思い出が、混んでいたという一言で終わってしまうことも少なくない。\nこうした混雑を和らげるために、各地で時間をずらす試みが始まっている。ある町では、朝七時から九時までに入場した人の料金を半額にした。別の町では、夕方以降だけに開く特別な見学コースを設けた。いずれも、訪れる人の数そのものを減らすのではなく、訪れる時間を散らそうという考え方である。\n効果は数字にも表れている。ある寺では、この取り組みを始めてから、最も混む時間帯の来訪者が三割ほど減ったという。一方で、一日の合計は減っていない。つまり、町の収入を落とさずに混雑だけを和らげることができたことになる。\nもっとも、これで問題がすべて解決したわけではない。早朝や夕方に動けるのは、時間に余裕のある旅行者に限られる。休みが少ない人ほど、最も混む時間に行かざるを得ない。料金の差が、そのまま旅の質の差になってしまう心配もある。\nそれでも、この試みには大きな意味があると私は思う。旅行者にとっても、人のいない朝の道を歩く時間は、混雑の中で見る風景よりずっと記憶に残るはずだ。旅の満足は、どれだけ多くを見たかではなく、どれだけ落ち着いて見られたかで決まるように思う。"}, "E5-P9": {"title": "問題11（3）", "text": "健康のために一日一万歩、という言葉を聞いたことがある人は多いだろう。私も数年前から歩数計を持ち歩き、数字が届かない日は夜に近所を一周していた。ところが先日、ある研究者の話を聞いて、考えを改めることになった。問題は歩いた数ではなく、座っている時間の長さだというのである。\nその研究によると、一日の合計歩数が同じでも、座り続けている時間が長い人ほど体調をくずしやすい傾向があるという。朝と夜にまとめて歩き、昼間は八時間座りっぱなしという生活は、一見すると運動不足ではない。しかし体のほうは、長い時間動かないでいることに耐えられるようにはできていないらしい。\n解決の方法は、意外なほど単純だった。三十分に一度立ち上がり、二、三分歩くだけでよいというのである。水をくみに行く、窓を開ける、それだけで十分だと研究者は言う。まとまった運動の時間をつくろうとすると、忙しい人ほど続かない。しかし、立ち上がるだけなら誰にでもできる。\n私は歩数計を見るのをやめ、代わりに三十分ごとに鳴るタイマーを使うことにした。最初は仕事が中断されて落ち着かなかったが、一週間ほどで慣れた。肩のこりが軽くなり、午後に強い眠気を感じることも減った。歩数は以前より少ないのに、体は明らかに楽である。\n健康法は、数字で示されると分かりやすい。しかし、分かりやすい数字だけを追いかけていると、大事なことを見落とすこともある。私の場合、それは動かない時間の長さだった。"}, "E5-P10": {"title": "問題12 AとB", "text": "A\n多くの山で、登山者の増加による問題が起きている。ごみが捨てられ、登山道がけずられ、事故が起きるたびに救助の費用がかかる。こうした費用を税金だけでまかなうのは公平とは言えないだろう。私は、登る人から入山料を集めることに賛成である。\n料金を払うという行為には、金額以上の意味がある。お金を払って入る場所だと意識すれば、人はごみを捨てにくくなる。実際、入山料を導入した山では、ごみの量が目に見えて減ったという報告もある。山を守る費用を集めると同時に、登る人の心構えを変える。入山料には、その二つの働きがあるのだ。\nB\n山に入るのにお金を取ることが、はたしてよいことなのか、私はまだ迷っている。集めたお金が登山道の整備や救助のために使われるのなら、それ自体に反対する理由はない。\nただ、山は本来、誰にでも開かれた場所だった。料金がかかるようになれば、気軽に出かける人は減るだろう。特に、近所の低い山を毎朝歩いているような人たちにとって、負担は決して小さくない。また、お金を払ったのだから何をしてもよいと考える人が出てくる心配もある。まず必要なのは、山の使い方をていねいに伝えることではないか。料金の話は、その後でよいと思う。"}, "E5-P11": {"title": "問題13 文章", "text": "休みの日は必ずどこかへ出かけなければもったいない、と長い間思っていた。旅行の計画を立てるときも、朝から夜まで予定を詰め込み、移動の時間まで分単位で決めていた。効率よく回れば、それだけ多くのものを見られる。多く見れば、それだけよい旅になる。そう信じて疑わなかった。\n考えが変わったのは、三年前のことである。旅先で電車が止まり、小さな駅で四時間ほど足止めされた。予定していた見学先はすべて回れなくなり、私は最初、いらいらしながら時刻表をにらんでいた。しかし、どうにもならないと分かってからは、駅前のベンチに座り、ただ遠くの山を眺めているしかなかった。\n不思議なことに、その四時間のことを、私は今でもはっきり覚えている。雲の影が斜面をゆっくり移動していったこと、風が向きを変えるたびに草の色が違って見えたこと、夕方が近づくと鳥の声が急に増えたこと。同じ旅で見たはずの有名な建物や庭園は、写真を見なければ思い出せない。何もしていなかった時間だけが、深く残っているのである。\nその後、この経験について調べてみて、似たことを感じている人が少なくないと知った。ある研究では、自然の中でぼんやりと過ごす時間が、集中力の回復や気分の安定に役立つことが示されているという。都会の生活では、目にも耳にも絶えず情報が入ってくる。私たちはそのたびに何かを判断し、反応し続けている。自然の中では、その働きをしばらく休ませることができるらしい。\nただし、ここで注意しなければならないことがある。自然の中にいれば自動的に休まる、というわけではない。写真を撮ることに追われ、次の目的地に着く時刻ばかり気にしているなら、たとえ場所が山であっても、頭の中は都会にいるときと少しも変わらない。大切なのは景色そのものよりも、何もしなくてよいという状態に自分を置くことなのだろう。\n現代の生活では、この何もしない時間が最も手に入りにくい。時間が空けばすぐに予定を入れ、待ち時間があれば画面を見てしまう。私自身、あの日、電車が動いていたら、間違いなく次の場所へ急いでいたはずだ。四時間の足止めは、自分では決して選ばなかった贈り物だったことになる。\nそれ以来、私は旅の予定を半分ほどに減らしている。行き先を減らした分、覚えていることはかえって増えた。何を見たかではなく、どう過ごしたか。旅の値打ちはそこで決まるのだと、今は思っている。"}, "E5-P12": {"title": "みなと市 自然と健康 秋の体験講座のご案内", "text": "秋の自然と健康をテーマにした体験講座を開きます。ふるってご参加ください。\nA　森の自然観察会\n　日時：10月11日（土）午前9時〜午前11時30分\n　場所：みなと市 北山森林公園\n　対象：小学生以上（小学生は保護者の同伴が必要です）\n　費用：500円\n　定員：25名\n　申込：9月30日（火）までに電話でお申し込みください。\n\nB　健康ウォーキング教室（全3回）\n　日時：10月5日・12日・19日（いずれも日曜）午前10時〜正午\n　場所：みなと市総合体育館 正面入口に集合\n　対象：18歳以上で、3回すべてに参加できる方\n　費用：2000円（3回分）\n　定員：20名\n　申込：9月25日（木）までに市のホームページからお申し込みください。\n\nC　海辺の生き物さがし\n　日時：10月18日（土）午後1時〜午後3時\n　場所：みなと市 南浜海岸\n　対象：どなたでも\n　費用：無料\n　定員：なし\n　申込：必要ありません。当日、直接会場にお越しください。\n\nD　星空観察と健康ヨガ\n　日時：10月25日（土）午後6時30分〜午後8時30分\n　場所：みなと市 高台公園 芝生広場\n　対象：中学生以上\n　費用：1500円\n　定員：15名\n　申込：10月15日（水）までに市役所3階の窓口でお申し込みください。\n\n注意　費用は当日、会場でお支払いください。雨天の場合、A・C・Dは中止し、Bは体育館の中で行います。\n問い合わせ　みなと市 環境健康課　電話 012-987-6543"}}};

<script>
/* おぼえるドリル 共通コード（学生アプリ・先生アプリ共通） */
var K = { GROW: 0.45, LOSS: 0.5, DECAY: 3, WEAK: 40, GOOD: 75 };
var DAY = 86400000;
var SECTIONS = {
  gengo: { name: '言語知識（文字・語彙・文法）', subj: ['kanji', 'goi', 'bunpo'] },
  dokkai: { name: '読解', subj: ['dokkai'] },
  choukai: { name: '聴解', subj: ['choukai'] }
};
var SUBJ_NAME = { kanji: '漢字', goi: '語彙', bunpo: '文法', dokkai: '読解', choukai: '聴解' };
var QTYPE_NAME = {
  'kanji-read': '漢字の読み', 'kanji-write': '漢字の表記', 'goi-form': '語形成', 'goi-context': '文脈規定',
  'goi-synonym': '言い換え類義', 'goi-usage': '用法', 'bunpo-form': '文法形式の判断',
  'bunpo-compose': '文の組み立て', 'bunpo-text': '文章の文法', 'dokkai-short': '短文読解', 'dokkai-mid': '中文読解', 'choukai': '聴解'
};
function sectionOf(subject) {
  for (var k in SECTIONS) if (SECTIONS[k].subj.indexOf(subject) >= 0) return k;
  return 'gengo';
}
/* 今の記憶度（0〜100）。it = {s, streak, last(ms)} */
function curMem(it, now) {
  if (!it) return 0;
  var d = Math.max(0, (now - it.last) / DAY);
  return it.s * Math.exp(-d / (K.DECAY * (1 + it.streak)));
}
function updItem(it, correct, now) {
  var m = curMem(it, now);
  var streak = it ? it.streak : 0;
  if (correct) return { s: m + (100 - m) * K.GROW, streak: streak + 1, last: now };
  return { s: m * K.LOSS, streak: 0, last: now };
}
function memLabel(m, seen) {
  if (!seen) return '未学習';
  return m < K.WEAK ? 'よわい' : (m < K.GOOD ? 'もうすこし' : 'おぼえた');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
/* {漢字|よみ} → ruby、[[語]] → 下線 */
function rb(s) {
  s = esc(s);
  s = s.replace(/\{([^|{}]+)\|([^{}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
  s = s.replace(/\[\[(.+?)\]\]/g, '<u>$1</u>');
  return s;
}
function plain(s) { return String(s).replace(/\{([^|{}]+)\|[^{}]+\}/g, '$1').replace(/\[\[|\]\]/g, ''); }
function fnv(s) {
  var h = 0x811c9dc5;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return ('00000000' + h.toString(16)).slice(-8);
}
/* 記録コード：OBO1|class|s4|sessionId|login(秒)|end(秒)|ev;ev;…|chk
   ev = ts(秒),itemId,正誤(1/0),ミリ秒,モード(p/m) */
function encodeRecord(r) {
  var ev = r.events.map(function (e) {
    return [Math.round(e.ts / 1000), e.id, e.c ? 1 : 0, e.ms, e.mode === 'mock' ? 'm' : 'p'].join(',');
  }).join(';');
  var body = ['OBO1', r.cls, r.s4, r.sid, Math.round(r.login / 1000), Math.round(r.end / 1000), ev].join('|');
  return body + '|' + fnv(body);
}
function decodeRecord(code) {
  code = String(code || '').trim();
  var i = code.lastIndexOf('|');
  if (i < 0) return null;
  var body = code.slice(0, i), chk = code.slice(i + 1);
  if (fnv(body) !== chk) return { bad: true };
  var p = body.split('|');
  if (p[0] !== 'OBO1' || p.length < 7) return { bad: true };
  var events = p[6] ? p[6].split(';').map(function (x) {
    var q = x.split(',');
    return { ts: +q[0] * 1000, id: q[1], c: q[2] === '1', ms: +q[3], mode: q[4] === 'm' ? 'mock' : 'practice' };
  }) : [];
  return { cls: p[1], s4: p[2], sid: p[3], login: +p[4] * 1000, end: +p[5] * 1000, events: events };
}
function fmtTime(ms) {
  var d = new Date(ms), z = function (n) { return ('0' + n).slice(-2); };
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function daysLeft(dateStr, now) {
  var t = new Date(dateStr + 'T09:00:00+09:00').getTime();
  return Math.ceil((t - now) / DAY);
}

</script>
<script>
var $app = document.getElementById('app');
var ITEM = {}; DATA.forEach(function (d) { ITEM[d.id] = d; });
var U = null;      // {cls,s4}
var ST = null;     // 保存される状態
var SESS = null;   // 今のセッション
var Q = null;      // 練習中の状態

function R(s) { return rb(s); }   // 問題データ用（ふりがな残す）
function T(s) { return rb(plain(s)); }   // 画面の案内文用（N2と同じく、ふりがなは付けない）
function key() { return 'obo_v1_' + U.cls + '_' + U.s4; }
function load() {
  try { ST = JSON.parse(localStorage.getItem(key())); } catch (e) { ST = null; }
  if (!ST) ST = { items: {}, sessions: [], events: [], sentUpTo: 0, mocks: [] };
}
function save() { try { localStorage.setItem(key(), JSON.stringify(ST)); } catch (e) {} }
function now() { return Date.now(); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---------- ログイン ---------- */
function viewLogin(err, keepC, keepS) {
  var last = ''; try { last = localStorage.getItem('obo_last') || ''; } catch (e) {}
  var lc = keepC || last.split('_')[0] || '', ls = keepS != null ? keepS : (last.split('_')[1] || '');
  $app.innerHTML = '<h1>おぼえるドリル</h1><div class="sub">' + T('{JLPT|ジェイエルピーティー} N2 {合格|ごうかく}を めざす {自習|じしゅう}アプリ') + '</div>' +
    '<div class="card"><label>' + T('{クラス|くらす}') + '</label><select id="cls">' +
    CFG.classes.map(function (c) { return '<option' + (c === lc ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
    '<label>' + T('学籍番号（' + CFG.idDigits + 'けた）') + '</label><input id="s4" inputmode="numeric" maxlength="' + CFG.idDigits + '" value="' + ls + '" placeholder="' + '0'.repeat(CFG.idDigits) + '">' +
    (err ? '<div class="err">' + T(err) + '</div>' : '') +
    '<button class="btn pri" id="go">' + T('はじめる') + '</button>' +
    '<div class="sub">' + T('{名前|なまえ}は {入力|にゅうりょく}しません。') + '</div></div>';
  document.getElementById('go').onclick = function () {
    var c = document.getElementById('cls').value, s = document.getElementById('s4').value.trim();
    if (!new RegExp('^\\d{' + CFG.idDigits + '}$').test(s)) return viewLogin('数字' + CFG.idDigits + 'けたを 入力してください。', c, s);
    U = { cls: c, s4: s }; try { localStorage.setItem('obo_last', c + '_' + s); } catch (e) {}
    load();
    SESS = { sid: c + '-' + s + '-' + new Date().toISOString().replace(/\D/g, '').slice(0, 14), login: now(), end: now(), n: 0, ok: 0, sent: false };
    ST.sessions.push(SESS); save(); viewHome();
  };
}

/* ---------- 集計 ---------- */
function memOf(id) { return curMem(ST.items[id], now()); }
function avgMem(list) {
  if (!list.length) return null;
  var s = 0; list.forEach(function (d) { s += memOf(d.id); }); return s / list.length;
}
function label(m, n) { var l = memLabel(m, n); var c = l === '未学習' ? 't0' : (l === 'よわい' ? 't1' : (l === 'おぼえた' ? 't3' : 't2')); return '<span class="tag ' + c + '">' + T(({ '未学習': '{未学習|みがくしゅう}', 'よわい': 'よわい', 'もうすこし': 'もうすこし', 'おぼえた': 'おぼえた' })[l]) + '</span>'; }
function sectionItems(k) { return DATA.filter(function (d) { return sectionOf(d.subject) === k; }); }
function dayKey(t) { var d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function todayCount() { var k = dayKey(now()); return ST.events.filter(function (e) { return dayKey(e.ts) === k; }).length; }
function streakDays() {
  var days = {}; ST.events.forEach(function (e) { days[dayKey(e.ts)] = 1; });
  var t = now(), n = 0;
  if (!days[dayKey(t)]) t -= 86400000;   // 今日まだなら、きのうまでの連続を数える
  while (days[dayKey(t)]) { n++; t -= 86400000; }
  return n;
}
/* 最後に答えたとき まちがえていた問題（新しい順） */
function wrongItems() {
  var last = {}; ST.events.forEach(function (e, i) { last[e.id] = { c: e.c, i: i }; });
  return Object.keys(last).filter(function (id) { return !last[id].c && ITEM[id]; })
    .sort(function (a, b) { return last[b].i - last[a].i; }).map(function (id) { return ITEM[id]; });
}
function minutes(s) { return Math.max(1, Math.round((s.end - s.login) / 60000)); }

/* ---------- ホーム ---------- */
function viewHome() {
  var dl = daysLeft(CFG.exam.date, now());
  var h = '<div class="row"><h1>おぼえるドリル</h1><span class="sub">' + U.cls + '-' + U.s4 + '</span></div>';
  h += '<div class="card"><div class="row"><div>' + T('{試験|しけん}まで') + '</div><div style="font-size:30px;font-weight:800;color:var(--red)">' + (dl > 0 ? 'あと ' + dl + ' ' + T('{日|にち}') : T('{試験日|しけんび}です')) + '</div></div>' +
    '<div class="sub">JLPT N2（' + CFG.exam.label + '）</div></div>';

function pick(mode, arg, n) {
  if (mode === 'wrong') return shuffle(wrongItems().slice(0, n * 2)).slice(0, n);   // まちがえた問題だけ（新しい順の20問から10問）
  var pool = DATA.slice();
  if (mode === 'type') pool = pool.filter(function (d) { return d.qtype === arg; });
  if (mode === 'subject') pool = pool.filter(function (d) { return d.subject === arg; });
  if (mode === 'weak') pool = pool.filter(function (d) { return ST.items[d.id] && memOf(d.id) < K.GOOD; });
  var secLow = {};
  for (var k in SECTIONS) { var it = sectionItems(k); secLow[k] = it.length && avgMem(it) < CFG.exam.riskMemPct; }
  var seen = [], unseen = [];
  pool.forEach(function (d) {
    var p = (100 - memOf(d.id)) + (d.freq || 0) * 5 + Math.random() * 12 + (secLow[sectionOf(d.subject)] ? 10 : 0);
    (ST.items[d.id] ? seen : unseen).push({ d: d, p: p });
  });
  var byP = function (a, b) { return b.p - a.p; };
  seen.sort(byP); unseen.sort(byP);
  var nu = Math.min(unseen.length, mode === 'rec' ? 3 : (mode === 'type' || mode === 'subject' ? 5 : 0));
  var out = unseen.slice(0, nu).concat(seen.slice(0, n - nu));
  if (out.length < n) out = out.concat(unseen.slice(nu, nu + n - out.length));
  return shuffle(out.map(function (x) { return x.d; })).slice(0, n);
}
function startPractice(mode, arg) {
  var longText = (mode === 'subject' && arg === 'dokkai') || (mode === 'type' && /^dokkai/.test(arg));   // 読解は文章が長いので1回5問
  var qs = pick(mode, arg, longText ? 5 : CFG.practiceSize);
  if (!qs.length) { alert('まだ この はんいの もんだいが ありません。'); return viewHome(); }
  Q = { mode: 'practice', qs: qs, i: 0, ok: 0, res: [], t0: 0, pm: mode, pa: arg };
  showQ();
}
function startMock() {
  var by = {}; DATA.forEach(function (d) { (by[d.qtype] = by[d.qtype] || []).push(d); });
  var types = shuffle(Object.keys(by)), qs = [], ptr = {};
  Object.keys(by).forEach(function (t) { by[t] = shuffle(by[t]); ptr[t] = 0; });
  while (qs.length < CFG.mock.size) {
    var added = false;
    types.forEach(function (t) { if (qs.length < CFG.mock.size && ptr[t] < by[t].length) { qs.push(by[t][ptr[t]++]); added = true; } });
    if (!added) break;
  }
  qs = shuffle(qs);
  Q = { mode: 'mock', qs: qs, i: 0, ok: 0, res: [], t0: 0, end: now() + CFG.mock.minutes * 60000 };
  showQ();
}

  Q.cur = { d: d, opts: opts, done: false };
  Q.t0 = now();
  var h = '<div class="row"><span class="sub">' + (Q.mode === 'mock' ? T('{模試|もし}') : T('{練習|れんしゅう}')) + ' ' + (Q.i + 1) + ' / ' + Q.qs.length + '</span>' +
    '<span class="sub">' + (QTYPE_NAME[d.qtype] || '') + '</span></div><div class="prog"><i style="width:' + (100 * Q.i / Q.qs.length) + '%"></i></div>' +
    (Q.mode === 'mock' ? '<div class="sub" id="tl"></div>' : '') +
    (d.p ? '<div class="card" style="white-space:pre-wrap;line-height:1.9">' + rb(d.p) + '</div>' : '') +
    '<div class="card"><div class="q">' + R(d.q) + '</div>' +
    opts.map(function (o, i) { return '<button class="ch" data-i="' + i + '">' + R(o) + '</button>'; }).join('') +
    '<div id="fb"></div></div>' +
    (Q.mode === 'practice' ? '<button class="btn sm" id="quit">' + T('やめる') + '</button>' : '');
  $app.innerHTML = h;
  Array.prototype.forEach.call($app.querySelectorAll('.ch'), function (e) { e.onclick = function () { answer(+e.getAttribute('data-i')); }; });
  var qb = document.getElementById('quit'); if (qb) qb.onclick = function () {
    if (Q.res.length) return finish(); // 結果画面に「記録を送る」を出す
    if (ST.events.length - ST.sentUpTo > 0 && CFG.backend !== 'none' && confirm('まだ せんせいに きろくを おくっていません。いま おくりますか？')) { Q = null; return sendRecords(true); }
    Q = null; viewHome();
  };
  tick();
}
var _tm = null;
function tick() {
  clearTimeout(_tm);
  var tl = document.getElementById('tl');
  if (tl && Q && (Q.mode === 'mock' || Q.mode === 'exam')) {
    var left = Math.max(0, Math.round((Q.end - now()) / 1000));
    tl.textContent = '残り ' + Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
    if (left <= 0) { return Q.mode === 'exam' ? finishExam() : finish(); }
    _tm = setTimeout(tick, 500);
  }
}
function answer(i) {
  var c = Q.cur; if (c.done) return; c.done = true;
  var d = c.d, ok = c.opts[i] === d.a, ms = now() - Q.t0, t = now();
  ST.items[d.id] = updItem(ST.items[d.id], ok, t);
  ST.events.push({ ts: t, id: d.id, c: ok, ms: ms, mode: Q.mode });
  SESS.n++; if (ok) SESS.ok++; SESS.end = t; save();
  Q.res.push({ d: d, ok: ok, chosen: c.opts[i] }); if (ok) Q.ok++;
  if (Q.mode === 'mock') { Q.i++; return showQ(); }
  Array.prototype.forEach.call($app.querySelectorAll('.ch'), function (e, k) {
    e.onclick = null;
    if (c.opts[k] === d.a) e.classList.add('ok'); else if (k === i) e.classList.add('ng');
  });
  var fb = document.getElementById('fb');
  fb.innerHTML = '<div class="fb" style="color:' + (ok ? 'var(--ok)' : 'var(--ng)') + '">' + (ok ? '○ ' + T('{正解|せいかい}！') : '× ' + T('{正解|せいかい}は') + ' ' + R(d.a)) + '</div>' +
    (d.x ? '<div id="ex"></div>' : '') +
    '<button class="btn pri" id="nx">' + T(Q.i + 1 >= Q.qs.length ? '{結果|けっか}を {見|み}る' : '{次|つぎ}へ') + '</button>';
  if (d.x) showExpl(d);
  document.getElementById('nx').onclick = function () { Q.i++; showQ(); };
}
/* 解説：日本語のほか、英語・ネパール語・ベトナム語・中国語に切りかえられる（選んだ言語は覚えておく） */
var LANGS = [['ja', '日本語'], ['en', 'English'], ['ne', 'नेपाली'], ['vi', 'Ti\u1EBFng Vi\u1EC7t'], ['zh', '中文']];
function getLang() { try { return localStorage.getItem('obo_lang') || 'ja'; } catch (e) { return 'ja'; } }
function showExpl(d) {
  var lg = getLang(), box = document.getElementById('ex'); if (!box) return;
  var txt = d.x[lg] || d.x.ja;
  box.innerHTML = '<div class="card" style="margin:8px 0"><div class="sub" style="margin-bottom:4px">' + T('{解説|かいせつ}') + '</div>' +
    '<div lang="' + lg + '" style="line-height:1.8">' + (lg === 'ja' ? R(txt) : esc(txt)) + '</div>' +
    '<div style="margin-top:8px">' + LANGS.map(function (l) {
      return '<button class="btn sm' + (l[0] === lg ? ' pri' : '') + '" lang="' + l[0] + '" data-lg="' + l[0] + '">' + l[1] + '</button>';
    }).join('') + '</div></div>';
  Array.prototype.forEach.call(box.querySelectorAll('[data-lg]'), function (e) {
    e.onclick = function () { try { localStorage.setItem('obo_lang', e.getAttribute('data-lg')); } catch (x) {} showExpl(d); };
  });
}
function finish() {
  clearTimeout(_tm);
  var n = Q.res.length, h;
  if (Q.mode === 'mock') {
    var per = {}; Q.qs.forEach(function (d) { var k = sectionOf(d.subject); per[k] = per[k] || [0, 0]; per[k][1]++; });
    Q.res.forEach(function (r) { if (r.ok) per[sectionOf(r.d.subject)][0]++; });
    var thr = CFG.exam.sectionMinPct, rows = '', risk = [], sum = [];
    for (var k in per) {
      var pct = Math.round(100 * per[k][0] / per[k][1]), pt = Math.round(pct * 0.6);
      var low = pct < thr; if (low) risk.push(SECTIONS[k].name);
      sum.push(SECTIONS[k].name.slice(0, 4) + ' ' + per[k][0] + '/' + per[k][1]);
      rows += '<tr><td>' + SECTIONS[k].name + '</td><td>' + per[k][0] + '/' + per[k][1] + '</td><td>' + pt + '/60</td><td>' + (low ? '<span class="err">' + T('たりない') + '</span>' : '○') + '</td></tr>';
    }
    ST.mocks.push({ ts: now(), summary: sum.join('　') + '（' + n + T('{問|もん}') + '）' }); save();
    h = '<h1>' + T('{模試|もし}の {結果|けっか}') + '</h1><div class="card"><div style="font-size:30px;font-weight:800">' + Q.ok + ' / ' + Q.qs.length + '</div>' +
      '<table><tr><th>' + T('{区分|くぶん}') + '</th><th>' + T('{正解|せいかい}') + '</th><th>' + T('{目安|めやす}') + '</th><th>' + T('{基準|きじゅん}') + '</th></tr>' + rows + '</table>' +
      '<div class="sub">' + T('{目安|めやす}は 60{点|てん}まんてんに なおした {点|てん}です。{足|た}りない{区分|くぶん}は、{合格|ごうかく}のために {先|さき}に れんしゅうしましょう。') + '</div></div>';
  } else {
    h = '<h1>' + T('{結果|けっか}') + '</h1><div class="card"><div style="font-size:30px;font-weight:800">' + Q.ok + ' / ' + n + '</div></div>';
  }
  h += '<div class="card"><h2>' + T('まちがえた {問題|もんだい}') + '</h2>' + (Q.res.filter(function (r) { return !r.ok; }).map(function (r) {
    return '<div style="margin:8px 0;font-size:16px">' + R(r.d.q) + '<br><b style="color:var(--ok)">○ ' + R(r.d.a) + '</b>　<span class="sub">× ' + R(r.chosen) + '</span></div>';
  }).join('') || '<div class="sub">' + T('ありません。すばらしい！') + '</div>') + '</div>';
  var unsent = ST.events.length - ST.sentUpTo, canSend = unsent > 0 && CFG.backend !== 'none';
  if (canSend) {
    h += '<div class="card warn"><b>' + T('{先生|せんせい}に {記録|きろく}を {送|おく}りましょう') + '</b>（' + unsent + T('{問|もん}') + '）' +
      '<div class="sub">' + T('{送|おく}らないと、{先生|せんせい}に {勉強|べんきょう}した {記録|きろく}が {届|とど}きません。') + '</div>' +
      '<button class="btn red" id="sendnow">' + T('{記録|きろく}を {送|おく}る') + '</button></div>';
  }
  var again = Q.mode === 'practice' && Q.pm;
  var miss = wrongItems().length;
  if (miss) h += '<button class="btn red" id="redo">' + T('まちがえた {問題|もんだい}を やりなおす（') + miss + T('{問|もん}）') + '</button>';
  if (again && Q.pm !== 'wrong') h +='<button class="btn pri" id="again">' + T('もういちど {練習|れんしゅう}する（{次|つぎ}の') + Q.qs.length + T('{問|もん}）') + '</button>';
  h += '<button class="btn" id="home">' + T('ホームへ') + '</button>';
  $app.innerHTML = h;
  var rd = document.getElementById('redo'); if (rd) rd.onclick = function () { startPractice('wrong'); };
  var ag = document.getElementById('again'); if (ag) { var pm = Q.pm, pa = Q.pa; ag.onclick = function () { startPractice(pm, pa); }; }
  var sn = document.getElementById('sendnow');
  if (sn) sn.onclick = function () { Q = null; sendRecords(true); };
  document.getElementById('home').onclick = function () { Q = null; viewHome(); };
}

/* ---------- 記録の送信 ---------- */
function buildRecord() {
  var evs = ST.events.slice(ST.sentUpTo, ST.sentUpTo + 40); // Formsのアドレスが長くなりすぎないよう、1回に40問まで
  if (!evs.length) return null;
  return { code: encodeRecord({ cls: U.cls, s4: U.s4, sid: SESS.sid, login: SESS.login, end: Math.max(SESS.end, evs[evs.length - 1].ts), events: evs }), n: evs.length };
}
function sendRecords(manual, cb) {
  var rec = buildRecord(); if (!rec) { if (cb) cb(); return; }
  var be = CFG.backend, done = function () { ST.sentUpTo += rec.n; save(); if (cb) cb(); else viewHome(); };
  if (be === 'forms') {
    if (!CFG.formsUrl) { alert('Formsの アドレスが まだ せっていされていません。'); return; }
    var u = CFG.formsUrl.replace('{class}', encodeURIComponent(U.cls)).replace('{s4}', encodeURIComponent(U.s4))
      .replace('{session}', encodeURIComponent(SESS.sid)).replace('{code}', encodeURIComponent(rec.code));
    window.open(u, '_blank');
    $app.innerHTML = '<h1>' + T('{記録|きろく}を {送|おく}る') + '</h1><div class="card"><p>' + T('Formsが ひらきます。<b>「{送信|そうしん}」ボタン</b>を おしてください。{入力|にゅうりょく}は いりません。').replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>') + '</p>' +
      '<button class="btn pri" id="ok">' + T('{送信|そうしん}した（もどる）') + '</button><button class="btn" id="re">' + T('もういちど Formsを ひらく') + '</button></div>';
    document.getElementById('ok').onclick = done;
    document.getElementById('re').onclick = function () { window.open(u, '_blank'); };
  } else { done(); }
}
window.addEventListener('pagehide', function () { try { if (U && SESS) { SESS.end = Math.max(SESS.end, SESS.end); save(); } } catch (e) {} });

viewLogin();
</script>
