<style>

<script>
/* おぼえるドリル 共通コード（学生アプリ・先生アプリ共通） */
var K = { GROW: 0.45, LOSS: 0.5, DECAY: 3, WEAK: 40, GOOD: 75 };
var DAY = 86400000;
var SECTIONS = {
  gengo: { name: '言語知識（文字・語彙・文法）', subj: ['kanji', 'goi', 'bunpo'] },
  dokkai: { name: '読解', subj: ['dokkai'] },
  choukai: { name: '聴解', subj: ['choukai'] }
};
var SUBJ_NAME = { kanji: '漢字', goi: '語彙', bunpo: '文法', dokkai: '読解', choukai: '聴解' };
var QTYPE_NAME = {
  'kanji-read': '漢字の読み', 'kanji-write': '漢字の表記', 'goi-form': '語形成', 'goi-context': '文脈規定',
  'goi-synonym': '言い換え類義', 'goi-usage': '用法', 'bunpo-form': '文法形式の判断',
  'bunpo-compose': '文の組み立て', 'bunpo-text': '文章の文法', 'dokkai-short': '短文読解', 'dokkai-mid': '中文読解', 'dokkai-compare': '統合理解（AとB）', 'dokkai-long': '長文読解', 'dokkai-info': '情報検索（チラシ）', 'choukai': '聴解'
};
function sectionOf(subject) {
  for (var k in SECTIONS) if (SECTIONS[k].subj.indexOf(subject) >= 0) return k;
  return 'gengo';
}
/* 今の記憶度（0〜100）。it = {s, streak, last(ms)} */
function curMem(it, now) {
  if (!it) return 0;
  var d = Math.max(0, (now - it.last) / DAY);
  return it.s * Math.exp(-d / (K.DECAY * (1 + it.streak)));
}
function updItem(it, correct, now) {
  var m = curMem(it, now);
  var streak = it ? it.streak : 0;
  if (correct) return { s: m + (100 - m) * K.GROW, streak: streak + 1, last: now };
  return { s: m * K.LOSS, streak: 0, last: now };
}
function memLabel(m, seen) {
  if (!seen) return '未学習';
  return m < K.WEAK ? 'よわい' : (m < K.GOOD ? 'もうすこし' : 'おぼえた');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
/* {漢字|よみ} → ruby、[[語]] → 下線 */
function rb(s) {
  s = esc(s);
  s = s.replace(/\{([^|{}]+)\|([^{}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
  s = s.replace(/\[\[(.+?)\]\]/g, '<u>$1</u>');

/* 記録コード：OBO1|class|s4|sessionId|login(秒)|end(秒)|ev;ev;…|chk

function encodeRecord(r) {
  var ev = r.events.map(function (e) {
    return [Math.round(e.ts / 1000), e.id, e.c ? 1 : 0, e.ms, e.mode === 'mock' ? 'm' : (e.mode === 'lesson' ? 'l' : (e.mode === 'report' ? 'r' : 'p'))].join(',');
  }).join(';');
  var body = ['OBO1', r.cls, r.s4, r.sid, Math.round(r.login / 1000), Math.round(r.end / 1000), ev].join('|');
  return body + '|' + fnv(body);
}
function decodeRecord(code) {
  code = String(code || '').trim();
  var i = code.lastIndexOf('|');
  if (i < 0) return null;
  var body = code.slice(0, i), chk = code.slice(i + 1);
  if (fnv(body) !== chk) return { bad: true };

  var events = p[6] ? p[6].split(';').map(function (x) {
    var q = x.split(',');
    return { ts: +q[0] * 1000, id: q[1], c: q[2] === '1', ms: +q[3], mode: q[4] === 'm' ? 'mock' : (q[4] === 'l' ? 'lesson' : (q[4] === 'r' ? 'report' : 'practice')) };
  }) : [];
  return { cls: p[1], s4: p[2], sid: p[3], login: +p[4] * 1000, end: +p[5] * 1000, events: events };
}
function fmtTime(ms) {
  var d = new Date(ms), z = function (n) { return ('0' + n).slice(-2); };
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function daysLeft(dateStr, now) {
  var t = new Date(dateStr + 'T09:00:00+09:00').getTime();
  return Math.ceil((t - now) / DAY);
}

/* ポイント：1問答えるごとに増える（正解10・不正解3）。科目ごとにレベルが上がる。設定は config.json の points */
function ptCfg() { return (typeof CFG !== 'undefined' && CFG.points) || {}; }
function ptOf(ok) { var p = ptCfg(); return ok ? (p.correct != null ? p.correct : 10) : (p.wrong != null ? p.wrong : 3); }
function ptLevels() { return ptCfg().levels || [0, 100, 250, 500, 900, 1500, 2300, 3300, 4600, 6200, 8200]; }
function levelOf(pts) {
  var L = ptLevels(), lv = 0;
  for (var i = 0; i < L.length; i++) if (pts >= L[i]) lv = i;
  return { lv: lv + 1, base: L[lv], next: lv + 1 < L.length ? L[lv + 1] : null };
}

/* ---------- 推移グラフ（学生アプリの「自分の学習状況」と、先生アプリの学生画面で共通） ---------- */
var SUBJ_COLOR = { all: 'var(--navy)', kanji: '#d98a00', goi: '#2a7de1', bunpo: '#2e9e5b', dokkai: '#a855c7' };
function bucketStart(ts, g) {
  var d = new Date(ts); d.setHours(0, 0, 0, 0);

  return 10 * p;

/* evs: [{ts,id,c}]  ses: [{login,end}]  subjOf(id) → 科目名（無ければ null）  count: いくつ分さかのぼるか */
function trendPack(evs, ses, g, count, subjOf, nowTs) {
  var B = [], t = bucketStart(nowTs, g), i;
  for (i = 0; i < count; i++) { B.unshift({ t0: t, t1: bucketStep(t, g, 1), label: bucketLabel(t, g), n: 0, ok: 0, min: 0, subj: {} }); t = bucketStep(t, g, -1); }
  var at = function (ts) { for (var k = B.length - 1; k >= 0; k--) if (ts >= B[k].t0 && ts < B[k].t1) return B[k]; return null; };
  evs.forEach(function (e) {
    var b = at(e.ts); if (!b) return; b.n++; if (e.c) b.ok++;
    var s = subjOf(e.id); if (s) { var a = b.subj[s] = b.subj[s] || [0, 0]; a[1]++; if (e.c) a[0]++; }
  });
  ses.forEach(function (x) { var b = at(x.login); if (b) b.min += Math.max(1, (x.end - x.login) / 60000); });

  var ids = {}; DATA.forEach(function (d) { (ids[d.subject] = ids[d.subject] || []).push(d.id); });
  var sorted = evs.slice().sort(function (a, b) { return a.ts - b.ts; }), items = {}, p = 0, mem = {};
  B.forEach(function (b) {

    while (p < sorted.length && sorted[p].ts <= endT) { items[sorted[p].id] = updItem(items[sorted[p].id], sorted[p].c, sorted[p].ts); p++; }
    for (var sj in ids) {
      var seen = ids[sj].some(function (id) { return items[id]; });
      (mem[sj] = mem[sj] || []).push(seen ? ids[sj].reduce(function (a, id) { return a + curMem(items[id], endT); }, 0) / ids[sj].length : null);
    }

}
function lineChart(o) {
  var W = 320, H = o.h || 150, L = 32, R = 8, T0 = 10, Bm = 22, n = o.labels.length, any = false, max = o.max;

  if (!any) return '<div class="sub" style="padding:14px 0">まだ データが ありません</div>';
  if (max == null) { var m = 0; o.series.forEach(function (s) { s.vals.forEach(function (v) { if (v != null && v > m) m = v; }); }); max = niceMax(m); }
  var X = function (i) { return n > 1 ? L + (W - L - R) * i / (n - 1) : (L + W - R) / 2; };

    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (L - 4) + '" y="' + (gy + 3) + '" text-anchor="end" font-size="9" fill="var(--sub)">' + (Math.round(gv * 10) / 10) + '</text>';
  }
  var step = Math.max(1, Math.ceil(n / 7));

  o.series.forEach(function (se) {
    var seg = [];
    var flush = function () { if (seg.length > 1) s += '<polyline fill="none" stroke="' + se.color + '" stroke-width="2" stroke-linejoin="round" points="' + seg.join(' ') + '"/>'; seg = []; };
    se.vals.forEach(function (v, j) { if (v == null) flush(); else seg.push(X(j).toFixed(1) + ',' + Y(v).toFixed(1)); });
    flush();
    se.vals.forEach(function (v, j) {
      if (v != null) s += '<circle cx="' + X(j).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="2.6" fill="' + se.color + '"><title>' + se.name + ' ' + o.labels[j] + '：' + (Math.round(v * 10) / 10) + (o.unit || '') + '</title></circle>';

/* ---------- 暗号版：パスワードを入れるまで、問題・カード・模試を読みこまない ----------

   パスワードから作った鍵で、ひらく（鍵は、このスマホに覚えておく。パスワードが変わったら、また入力する）。 */
var ENC = !!(CFG && CFG.enc), CRAW = null, CONTENT_OK = !ENC, CK_STORE = 'obo_ck';
function hex2u8(h) { var u = new Uint8Array(h.length / 2); for (var i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i * 2, 2), 16); return u; }

function forgetKey() { try { localStorage.removeItem(CK_STORE); } catch (e) {} }
function derive(pw) {
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: hex2u8(CFG.enc.salt), iterations: CFG.enc.it, hash: 'SHA-256' }, k, 256);

  return new Promise(function (res) {
    getJson('content.enc', function (buf, why) {
      if (!buf) return bust ? res('net:' + why) : res(loadContent(true));
      decryptBlob(buf).then(function (c) { setContent(c); res('ok'); }, function () { res(bust ? 'bad' : loadContent(true)); });

function unlock(pw) {   // → 'ok'（ひらけた）／'pw'（パスワードがちがう）／'net'（読みこめない）／'nocrypto'

    });
  }, function () { return 'pw'; });
}

/* ---------- ログイン ---------- */

/* ---------- 引き継ぎコード（べつのスマホ・パソコンで つづける）。記録を、圧縮したコードにして持ち運ぶ ---------- */
function b64e(u8) { var s = ''; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function makeBackup() {
  var body = JSON.stringify({ v: 1, cls: U.cls, s4: U.s4, at: now(), st: ST }), u8 = new TextEncoder().encode(body), h = fnv(body);
  if (typeof CompressionStream === 'undefined') return Promise.resolve('OBOB0:' + h + ':' + b64e(u8));
  return new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer().then(function (buf) { return 'OBOB1:' + h + ':' + b64e(new Uint8Array(buf)); });
}
function readBackup(code) {
  var m = /^OBOB([01]):([0-9a-f]{8}):(.+)$/.exec(String(code || '').replace(/\s+/g, ''));
  if (!m) return Promise.reject('コードの かたちが ちがいます。');
  var u8; try { u8 = b64d(m[3]); } catch (e) { return Promise.reject('コードが こわれています。'); }
  var p = m[1] === '1' ? new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(function (b) { return new Uint8Array(b); }) : Promise.resolve(u8);
  return p.then(function (u) {
    var body = new TextDecoder().decode(u);
    if (fnv(body) !== m[2]) throw 'コードが こわれています。';
    var o = JSON.parse(body); if (o.v !== 1 || !o.st) throw 'コードの かたちが ちがいます。';
    return o;
  }, function () { throw 'コードが こわれています。'; });
}
function restoreBackup(o) {
  if (o.cls !== U.cls || o.s4 !== U.s4) return 'べつの 学籍番号の コードです。（' + o.cls + '-' + o.s4 + '）';
  try { localStorage.setItem(key(), JSON.stringify(o.st)); } catch (e) { return 'ほぞんできませんでした。'; }
  load(); ST.sessions.push(SESS); save();
  return '';
}

    (hasProgress() ? '② ' + T('「ホーム{画面|がめん}に {追加|ついか}」を する（iPhone は Safari）') + '<br>③ ' + T('アイコンから {開|ひら}き、おなじ {学籍番号|がくせきばんごう}で ログインして、コードを はりつける') :

function bindHs() {
  var b = function (id, f) { var e = document.getElementById(id); if (e) e.onclick = f; };

  b('hs-no', function () { ST.hsHide = 1; save(); viewHome(); });

    makeBackup().then(function (code) {
      var done = function () { alert('コピーしました。つぎに「ホーム画面に追加」をして、アイコンから ひらき、同じ 学籍番号で ログインして、コードを はりつけてください。'); };
      try { navigator.clipboard.writeText(code).then(done, function () { alert('コピーできませんでした。☰ の「べつの スマホで つづける」から コードを つくってください。'); }); }
      catch (e) { alert('コピーできませんでした。☰ の「べつの スマホで つづける」から コードを つくってください。'); }
    });

  b('hs-go', function () {
    var t = document.getElementById('hs-text').value;
    readBackup(t).then(function (o) {
      if (o.cls !== U.cls || o.s4 !== U.s4) return alert('べつの 学籍番号の コードです。（' + o.cls + '-' + o.s4 + '）');

/* ---------- 音声の読み上げ（ブラウザーの機能。無料。聴解の練習ではなく、発音を聞くためのもの） ---------- */
function canSpeak() { return !!window.speechSynthesis && !!window.SpeechSynthesisUtterance; }
function speak(text) {
  try {
    if (!canSpeak() || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 0.9;
    var vs = window.speechSynthesis.getVoices().filter(function (v) { return /^ja/i.test(v.lang); });
    if (vs.length) u.voice = vs[0];
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function sentenceOf(d) {   // 答えを入れた、文全体（読み上げ用）。組み立て・漢字の書きは対象外
  if (d.qtype === 'bunpo-compose' || d.qtype === 'kanji-write') return '';
  var q = plain(d.q).replace(/\s+/g, ' '), a = plain(d.a);
  if (/（\s*）/.test(q)) return q.replace(/（\s*）/, a);
  return q;
}

/* ---------- 学習プラン（その学生ごとに計算する） ---------- */
function planInfo() {
  var dl = daysLeft(CFG.exam.date, now()), pl = CFG.plan || {}, buf = pl.bufferDays != null ? pl.bufferDays : 14, tg = pl.target != null ? pl.target : 0.5, mpl = pl.minPerLesson || 10;
  var subs = LESSON_SUBJ.map(function (sj) {
    var ls = lessonList(sj[0]), cl = ls.filter(function (x) { return lessonState(x.id).cleared; }), need = Math.ceil(ls.length * tg);
    return { key: sj[0], name: sj[1], ls: ls, done: cl.length, need: need, left: Math.max(0, need - cl.length), rest: ls.filter(function (x) { return !lessonState(x.id).cleared; }) };
  }).filter(function (x) { return x.ls.length; });
  var need = 0, done = 0, left = 0, total = 0;
  subs.forEach(function (x) { need += x.need; done += Math.min(x.done, x.need); left += x.left; total += x.ls.length; });
  var days = Math.max(1, dl - buf), per = left / days;
  var k = dayKey(now());
  var doneToday = Object.keys(ST.lessons).filter(function (l) { var L = ST.lessons[l]; return L.cleared && dayKey(L.clearedAt || L.ts || 0) === k; }).length;
  var todayN = left ? Math.max(1, Math.ceil(per)) : 0;
  // 今日のぶん：のこりの数に合わせて、科目に ふりわける（どの科目も、のこっていれば1つ以上）
  var want = Math.max(0, todayN - doneToday), picks = [], quota = {}, i;
  subs.forEach(function (x) { quota[x.key] = 0; });
  var avail = function (x) { return x.left - quota[x.key] > 0 && x.rest.length > quota[x.key]; };
  // 1まわり目：のこりのある科目に、1つずつ（文法・漢字・語彙の順）
  ['bunpo', 'kanji', 'goi'].forEach(function (key) {
    var x = subs.filter(function (y) { return y.key === key; })[0];
    if (x && picks.length < want && avail(x)) { picks.push(x.rest[quota[x.key]]); quota[x.key]++; }
  });
  // 2まわり目から：のこりの多い科目へ
  while (picks.length < want) {
    var c2 = subs.filter(avail).sort(function (p, q) { return (q.left - quota[q.key]) - (p.left - quota[p.key]); });
    if (!c2.length) break;
    picks.push(c2[0].rest[quota[c2[0].key]]); quota[c2[0].key]++;
  }
  var recent = Object.keys(ST.lessons).filter(function (l) { var L = ST.lessons[l]; return L.cleared && (L.clearedAt || L.ts || 0) > now() - 7 * 86400000; }).length;
  var status = !left ? 'done' : ((done === 0 && recent === 0) ? 'start' : (recent / 7 >= per * 0.8 ? 'ok' : 'slow'));
  return { dl: dl, buf: buf, tg: tg, mpl: mpl, need: need, done: done, left: left, days: days, per: per, todayN: todayN, doneToday: doneToday, picks: picks, status: status, total: total };
}

  var h = '<div class="card"><div class="row"><h2>' + T('{学習|がくしゅう}プラン') + '</h2><span class="sub">' + T('{試験|しけん}まで あと ') + p.dl + T('{日|にち}') + '</span></div>' +

function pick(mode, arg, n) {
  if (mode === 'wrong') return shuffle(wrongItems().slice(0, n * 2)).slice(0, n);   // まちがえた問題だけ（新しい順の20問から10問）
  if (mode === 'review') return shuffle(dueItems().slice(0, n));                    // 今日の復習：記憶度が下がった問題を、よわい順に
  var pool = DATA.slice();
  if (mode === 'type') pool = pool.filter(function (d) { return d.qtype === arg; });
  if (mode === 'subject') pool = pool.filter(function (d) { return d.subject === arg; });
  if (mode === 'weak') pool = pool.filter(function (d) { return ST.items[d.id] && memOf(d.id) < K.GOOD; });
  var secLow = {};
  for (var k in SECTIONS) { var it = sectionItems(k); secLow[k] = it.length && avgMem(it) < CFG.exam.riskMemPct; }
  var seen = [], unseen = [];
  pool.forEach(function (d) {
    var p = (100 - memOf(d.id)) + (d.freq || 0) * 5 + Math.random() * 12 + (secLow[sectionOf(d.subject)] ? 10 : 0);
    (ST.items[d.id] ? seen : unseen).push({ d: d, p: p });
  });
  var byP = function (a, b) { return b.p - a.p; };
  seen.sort(byP); unseen.sort(byP);
  var nu = Math.min(unseen.length, mode === 'rec' ? 3 : (mode === 'type' || mode === 'subject' ? 5 : 0));
  var out = unseen.slice(0, nu).concat(seen.slice(0, n - nu));
  if (out.length < n) out = out.concat(unseen.slice(nu, nu + n - out.length));
  return shuffle(out.map(function (x) { return x.d; })).slice(0, n);
}

}
function startMockNow() {

      rows += '<tr><td>' + SECTIONS[k].name + '</td><td>' + per[k][0] + '/' + per[k][1] + '</td><td>' + pt + '/60</td><td>' + (low ? '<span class="err">' + T('たりない') + '</span>' : '○') + '</td></tr>';
    }
    ST.lastMockAt = now();   // 次の模試の前に、また練習が必要
    ST.mocks.push({ ts: now(), pct: pctOf(Q.ok, n), summary: sum.join('　') + '（' + n + T('{問|もん}') + '）' }); save();
    h = '<h1>' + T('{模試|もし}の {結果|けっか}') + '</h1><div class="card"><div style="font-size:30px;font-weight:800">' + Q.ok + ' / ' + Q.qs.length + '</div>' +
      '<table><tr><th>' + T('{区分|くぶん}') + '</th><th>' + T('{正解|せいかい}') + '</th><th>' + T('{目安|めやす}') + '</th><th>' + T('{基準|きじゅん}') + '</th></tr>' + rows + '</table>' +
      '<div class="sub">' + T('{目安|めやす}は 60{点|てん}まんてんに なおした {点|てん}です。{足|た}りない{区分|くぶん}は、{合格|ごうかく}のために {先|さき}に れんしゅうしましょう。') + '</div></div>';
  } else {
    h = '<h1>' + T('{結果|けっか}') + '</h1><div class="card"><div style="font-size:30px;font-weight:800">' + Q.ok + ' / ' + n + '</div></div>';
  }
  if (Q.mode === 'practice' && Q.res.length >= Q.qs.length && Q.qs.length >= 5) { ST.sets.push({ ts: now(), subj: Q.pa || Q.pm, n: Q.qs.length }); save(); }   // 1セット（全問）終わった
  if (Q.pm === 'lesson') h += lessonResult();
  h += ptsLine(Q.pts) + (Q.mode === 'practice' ? gateLine() : '') + badgeNews();
  h += '<div class="card"><h2>' + T('まちがえた {問題|もんだい}') + '</h2>' + (Q.res.filter(function (r) { return !r.ok; }).map(function (r) {
    return '<div style="margin:8px 0;font-size:16px">' + R(r.d.q) + '<br><b style="color:var(--ok)">○ ' + R(r.d.a) + '</b>　<span class="sub">× ' + R(r.chosen) + '</span></div>';
  }).join('') || '<div class="sub">' + T('ありません。すばらしい！') + '</div>') + '</div>';
  var unsent = ST.events.length - ST.sentUpTo, canSend = unsent > 0 && CFG.backend !== 'none';
  if (canSend) {
    h += '<div class="card warn"><b>' + T('{先生|せんせい}に {記録|きろく}を {送|おく}りましょう') + '</b>（' + unsent + T('{問|もん}') + '）' +
      '<div class="sub">' + T('{送|おく}らないと、{先生|せんせい}に {勉強|べんきょう}した {記録|きろく}が {届|とど}きません。') + '</div>' +
      '<button class="btn red" id="sendnow">' + T('{記録|きろく}を {送|おく}る') + '</button></div>';
  }
  var again = Q.mode === 'practice' && Q.pm;
  var miss = wrongItems().length;
  if (miss) h += '<button class="btn red" id="redo">' + T('まちがえた {問題|もんだい}を やりなおす（') + miss + T('{問|もん}）') + '</button>';
  if (again && Q.pm !== 'wrong' && Q.pm !== 'lesson') h +='<button class="btn pri" id="again">' + T('もういちど {練習|れんしゅう}する（{次|つぎ}の') + Q.qs.length + T('{問|もん}）') + '</button>';
  h += '<button class="btn" id="home">' + T('ホームへ') + '</button>';
  $app.innerHTML = h;
  if (Q.pm === 'lesson') {
    var lid = Q.pa;
    $app.insertAdjacentHTML('beforeend', '<button class="btn red" id="lt">' + T('もういちど テスト') + '</button><button class="btn" id="lc">' + T('カードを {見|み}なおす') + '</button><button class="btn" id="ll">' + T('レッスンの {一覧|いちらん}へ') + '</button>');
    document.getElementById('lt').onclick = function () { startLessonTest(lid); };
    document.getElementById('lc').onclick = function () { showCard(lid, 0, false); };
    document.getElementById('ll').onclick = viewLessons;
  }
  var rd = document.getElementById('redo'); if (rd) rd.onclick = function () { startPractice('wrong'); };
  var ag = document.getElementById('again'); if (ag) { var pm = Q.pm, pa = Q.pa; ag.onclick = function () { startPractice(pm, pa); }; }
  var sn = document.getElementById('sendnow');
  if (sn) sn.onclick = function () { Q = null; sendRecords(true); };
  document.getElementById('home').onclick = function () { Q = null; viewHome(); };
}

/* ---------- 記録の送信 ---------- */
function buildRecord() {
  var evs = ST.events.slice(ST.sentUpTo, ST.sentUpTo + 40); // Formsのアドレスが長くなりすぎないよう、1回に40問まで
  if (!evs.length) return null;
  return { code: encodeRecord({ cls: U.cls, s4: U.s4, sid: SESS.sid, login: SESS.login, end: Math.max(SESS.end, evs[evs.length - 1].ts), events: evs }), n: evs.length };
}
function sendRecords(manual, cb) {
  var rec = buildRecord(); if (!rec) { if (cb) cb(); return; }
  var be = CFG.backend, done = function () { ST.sentUpTo += rec.n; save(); if (cb) cb(); else viewHome(); };
  if (be === 'forms') {
    if (!CFG.formsUrl) { alert('Formsの アドレスが まだ せっていされていません。'); return; }
    var u = CFG.formsUrl.replace('{class}', encodeURIComponent(U.cls)).replace('{s4}', encodeURIComponent(U.s4))
      .replace('{session}', encodeURIComponent(SESS.sid)).replace('{code}', encodeURIComponent(rec.code));
    window.open(u, '_blank');
    $app.innerHTML = '<h1>' + T('{記録|きろく}を {送|おく}る') + '</h1><div class="card"><p>' + T('Formsが ひらきます。<b>「{送信|そうしん}」ボタン</b>を おしてください。{入力|にゅうりょく}は いりません。').replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>') + '</p>' +
      '<button class="btn pri" id="ok">' + T('{送信|そうしん}した（もどる）') + '</button><button class="btn" id="re">' + T('もういちど Formsを ひらく') + '</button></div>';
    document.getElementById('ok').onclick = done;
    document.getElementById('re').onclick = function () { window.open(u, '_blank'); };
  } else { done(); }
}
window.addEventListener('pagehide', function () { try { if (U && SESS) { SESS.end = Math.max(SESS.end, SESS.end); save(); } } catch (e) {} });

if (!TEST && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }   // 2回目から、すぐ開く・電波が弱くても使える
viewLogin();
if (ENC && storedRaw()) unlock(null).then(function (r) { if (r === 'pw') viewLogin('あたらしい パスワードを 入力してください。'); });
</script>
</body>
